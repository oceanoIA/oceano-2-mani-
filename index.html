<style>
:root{
  --green:#00ffcc;
  --pink:#ff00aa;
  --yellow:#ffe66d;
  --red:#ff5577;
  --cyan:#00d9ff;
  --bg:#020509;
  --panel:rgba(2,12,18,.82);
  --line:rgba(0,255,204,.25);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020509;
  color:#dffff8;
  font-family:Orbitron,monospace;
}

body{
  position:relative;
}

#canvas-container{
  position:fixed;
  inset:0;
  z-index:1;
}

canvas{
  display:block;
}

.hud{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
}

.header{
  position:absolute;
  top:14px;
  left:16px;
  right:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:18px;
  font-weight:800;
  letter-spacing:4px;
  color:var(--green);
  text-shadow:
    0 0 8px rgba(0,255,204,.8),
    0 0 25px rgba(0,255,204,.35);
}

.subtitle{
  font-size:8px;
  letter-spacing:2px;
  opacity:.65;
  margin-top:3px;
}

.status{
  display:flex;
  gap:8px;
  align-items:center;
}

.badge{
  border:1px solid var(--line);
  background:rgba(0,20,25,.7);
  padding:7px 10px;
  font-size:8px;
  letter-spacing:1px;
  box-shadow:0 0 12px rgba(0,255,204,.08);
}

#connection{
  color:var(--yellow);
}

#fps{
  color:var(--green);
}

.panel{
  position:absolute;
  left:16px;
  bottom:16px;
  width:min(390px,calc(100vw - 32px));
  max-height:58vh;
  overflow:auto;
  pointer-events:auto;
  border:1px solid rgba(0,255,204,.2);
  background:
    linear-gradient(
      135deg,

      rgba(0,0,0,.8)

  padding:12px;

}

.panel::-webkit-scrollbar{

}

.panel::-webkit-scrollbar-thumb{
  background:var(--green);
}

.panel-title{
  font-size:10px;
  letter-spacing:2px;
  color:var(--green);

}

.tabs{
  display:flex;
  gap:5px;

.tab{

#ring{

.corner{

.corner.tl{

.corner.tr{

.corner.bl{

@media(max-width:700px){

<script>

/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG={
  particles:4000,
  handFPS:24,

  cameraWidth:320,
  cameraHeight:240,

  handSmooth:.70,

  pinchOn:.055,
  pinchOff:.075,

  particleSmooth:.42,

  maxBlocks:28,

  builderGravity:.06,

  throwPower:0,

  axisSensitivity:.50,

  renderScale:2,

  colors:{
    white:'#ffffff',
    green:'#00ffcc',
    pink:'#ff00aa',
    yellow:'#ffe66d'
  }
};


/* =========================================================
   GLOBALS
   ========================================================= */

let scene;
let camera;
let renderer;

let builderGroup;
let particleGroup;

let particleGeometry;
let particleMaterial;
let particlePoints;

let targetPositions;
let basePositions;

let currentMode='PARTICLES';

let targetScale=1;
let currentScale=1;

let targetRotX=0;
let targetRotY=0;
let targetRotZ=0;

let shapePulse=0;

let currentShape='jupiter';

let blocks=[];
let selectedBlock=null;

let lastFrame=performance.now();

let fpsFrames=0;
let fpsTime=performance.now();

let sounds;

let particleCPUGroup=null;


/* =========================================================
   DOM
   ========================================================= */

const dom={
  canvas:document.getElementById('canvas-container'),

  video:document.getElementById('video-input'),
  preview:document.getElementById('preview'),

  connection:document.getElementById('connection'),
  fps:document.getElementById('fps'),

  hands:document.getElementById('hands'),
  gesture:document.getElementById('gesture'),

  zoomValue:document.getElementById('zoomValue'),
  rotValue:document.getElementById('rotValue'),

  mode:document.getElementById('mode'),

  panelTitle:document.getElementById('panelTitle'),

  tabBuilder:document.getElementById('tabBuilder'),
  tabParticles:document.getElementById('tabParticles'),

  builder:document.getElementById('builder'),
  particles:document.getElementById('particles'),

  clear:document.getElementById('clear'),
  shapeSelect:document.getElementById('shapeSelect'),

  colorPicker:document.getElementById('colorPicker'),
  audio:document.getElementById('audio'),

  ring:document.getElementById('ring')
};


/* =========================================================
   CONTROLLERS
   ========================================================= */

const controllers=[
  createController(),
  createController()
];

function createController(){

  return{

    active:false,

    pos:new THREE.Vector3(),
    smoothPos:new THREE.Vector3(),

    lastPos:new THREE.Vector3(),

    isPinching:false,
    wasPinching:false,

    grabbedBlock:null,

    grabOffset:new THREE.Vector3(),
    grabStartHand:new THREE.Vector3(),
    grabStartBlock:new THREE.Vector3(),

    rayLine:null,
    trail:null

  };
}


/* =========================================================
   AUDIO
   ========================================================= */

class SciFiSoundSystem{

  constructor(){
    this.enabled=true;
    this.ctx=null;
    this.last=0;
  }

  init(){

    if(this.ctx)return;

    try{
      this.ctx=new(
        window.AudioContext||
        window.webkitAudioContext
      )();
    }catch(e){}
  }

  pulse(freq=220,duration=.045){

    if(!this.enabled)return;

    this.init();

    if(!this.ctx)return;

    const now=this.ctx.currentTime;

    if(now-this.last<.035)return;

    this.last=now;

    const osc=this.ctx.createOscillator();
    const gain=this.ctx.createGain();

    osc.type='sine';
    osc.frequency.setValueAtTime(freq,now);

    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(.035,now+.005);
    gain.gain.exponentialRampToValueAtTime(.0001,now+duration);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    osc.stop(now+duration+.01);
  }
}

sounds=new SciFiSoundSystem();


/* =========================================================
   THREE INIT
   ========================================================= */

function initThree(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color('#020509');

  camera=new THREE.PerspectiveCamera(
    48,
    innerWidth/innerHeight,
    .1,
    1000
  );

  camera.position.set(
    0,
    1,
    24
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    alpha:false
  });

  renderer.setPixelRatio(CONFIG.renderScale);

  renderer.setSize(
    innerWidth,
    innerHeight,
    false
  );

  renderer.outputEncoding=
    THREE.sRGBEncoding;

  dom.canvas.appendChild(
    renderer.domElement
  );

  builderGroup=new THREE.Group();
  particleGroup=new THREE.Group();

  scene.add(builderGroup);
  scene.add(particleGroup);

  initBuilder();
  initControllers();
  initParticles();

  onResize();
}


/* =========================================================
   BUILDER
   ========================================================= */

function initBuilder(){

  const floor=new THREE.GridHelper(
    40,
    40,
    0x00ffcc,
    0x073b39
  );

  floor.position.y=-6;

  floor.material.transparent=true;
  floor.material.opacity=.18;

  builderGroup.add(floor);

  const initial=spawnShape(
    'cube',
    new THREE.Vector3(
      0,
      0,
      0
    )
  );

  if(initial){
    selectedBlock=initial;
  }
}


/* =========================================================
   CONTROLLERS VISUAL
   ========================================================= */

function initControllers(){

  controllers.forEach(
    c=>{

      const rayGeometry=
        new THREE.BufferGeometry()
          .setFromPoints([
            new THREE.Vector3(),
            new THREE.Vector3(
              0,
              0,
              -3
            )
          ]);

      const rayMaterial=
        new THREE.LineBasicMaterial({
          color:0x00ffcc,
          transparent:true,
          opacity:.4
        });

      c.rayLine=
        new THREE.Line(
          rayGeometry,
          rayMaterial
        );

      builderGroup.add(
        c.rayLine
      );

      const trailGeometry=
        new THREE.BufferGeometry();

      const trailMaterial=
        new THREE.LineBasicMaterial({
          color:0xff00aa,
          transparent:true,
          opacity:.35
        });

      c.trail=
        new THREE.Line(
          trailGeometry,
          trailMaterial
        );

      particleGroup.add(
        c.trail
      );
    }
  );
}


/* =========================================================
   GLOW TEXTURE
   ========================================================= */

function makeGlowTexture(){

  const c=document.createElement('canvas');

  c.width=64;
  c.height=64;

  const ctx=c.getContext('2d');

  const g=ctx.createRadialGradient(
    32,32,0,
    32,32,32
  );

  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.15,'rgba(255,255,255,.9)');
  g.addColorStop(.35,'rgba(0,255,204,.5)');
  g.addColorStop(1,'rgba(0,255,204,0)');

  ctx.fillStyle=g;
  ctx.fillRect(0,0,64,64);

  return new THREE.CanvasTexture(c);
}


/* =========================================================
   PARTICLES INIT
   ========================================================= */

function initParticles(){

  particleGeometry=
    new THREE.BufferGeometry();

  const positions=
    new Float32Array(
      CONFIG.particles*3
    );

  targetPositions=
    new Float32Array(
      CONFIG.particles*3
    );

  basePositions=
    new Float32Array(
      CONFIG.particles*3
    );

  for(
    let i=0;
    i<CONFIG.particles*3;
    i++
  ){

    positions[i]=
      (Math.random()-.5)*12;

    targetPositions[i]=
      positions[i];

    basePositions[i]=
      positions[i];
  }

  particleGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(
      positions,
      3
    )
  );

  particleMaterial=
    new THREE.PointsMaterial({
      color:0x00ffcc,
      size:.085,
      map:makeGlowTexture(),
      transparent:true,
      opacity:.9,
      depthWrite:false,
      blending:THREE.AdditiveBlending
    });

  particlePoints=
    new THREE.Points(
      particleGeometry,
      particleMaterial
    );

  particleGroup.add(
    particlePoints
  );

  generateShape(
    currentShape
  );
}


/* =========================================================
   RANDOM HELPERS
   ========================================================= */

function randomSphere(radius=1){

  const u=Math.random();
  const v=Math.random();

  const theta=
    2*Math.PI*u;

  const phi=
    Math.acos(
      2*v-1
    );

  const r=
    radius*
    Math.cbrt(
      Math.random()
    );

  return{
    x:r*Math.sin(phi)*Math.cos(theta),
    y:r*Math.sin(phi)*Math.sin(theta),
    z:r*Math.cos(phi)
  };
}


function setParticle(
  i,
  x,
  y,
  z
){

  const j=i*3;

  targetPositions[j]=x;
  targetPositions[j+1]=y;
  targetPositions[j+2]=z;
}


/* =========================================================
   CPU / MOTHERBOARD
   REAL 3D HOLOGRAM
   ========================================================= */

function generateCPU(i){

  /*
    La motherboard non è più una semplice superficie.
    Ogni punto viene distribuito su:
    - piastra superiore
    - bordi laterali
    - profondità interna
    - CPU
    - socket
    - RAM
    - dissipatori
    - condensatori
    - piste
    - energia
  */

  const total=CONFIG.particles;

  /* PCB principale */

  if(i<650){

    const cols=26;
    const rows=20;

    const ix=i%cols;
    const iz=Math.floor(i/cols)%rows;

    const x=
      (ix/(cols-1)-.5)*12;

    const z=
      (iz/(rows-1)-.5)*8;

    const y=
      (Math.random()-.5)*.42;

    setParticle(
      i,
      x,
      y,
      z
    );

    return;
  }


  /* bordi 3D della scheda */

  if(i<900){

    const edge=i%4;
    const t=Math.random();

    let x=0;
    let z=0;

    if(edge===0){
      x=-6;
      z=(t-.5)*8;
    }else if(edge===1){
      x=6;
      z=(t-.5)*8;
    }else if(edge===2){
      x=(t-.5)*12;
      z=-4;
    }else{
      x=(t-.5)*12;
      z=4;
    }

    const y=
      (Math.random()-.5)*.8;

    setParticle(
      i,
      x,
      y,
      z
    );

    return;
  }


  /* piste luminose */

  if(i<1450){

    const route=i%10;

    let x;
    let z;

    if(route<5){

      x=
        -5.5+
        Math.random()*11;

      z=
        (route-2)*1.15+
        (Math.random()-.5)*.07;

    }else{

      z=
        -3.5+
        Math.random()*7;

      x=
        (route-7)*1.45+
        (Math.random()-.5)*.07;
    }

    const y=
      .24+
      Math.sin(x*2+z)*.025;

    setParticle(
      i,
      x,
      y,
      z
    );

    return;
  }


  /* CPU centrale */

  if(i<2050){

    const local=i-1450;

    const sizeX=2.25;
    const sizeZ=1.75;
    const thickness=.62;

    const face=local%6;

    let x;
    let y;
    let z;

    if(face<2){

      x=
        (Math.random()-.5)*
        sizeX;

      z=
        (Math.random()-.5)*
        sizeZ;

      y=
        face===0
        ?1.15
        :.55;

    }else if(face<4){

      x=
        face===2
        ?-sizeX/2
        :sizeX/2;

      y=
        .55+
        Math.random()*
        thickness;

      z=
        (Math.random()-.5)*
        sizeZ;

    }else{

      x=
        (Math.random()-.5)*
        sizeX;

      y=
        .55+
        Math.random()*
        thickness;

      z=
        face===4
        ?-sizeZ/2
        :sizeZ/2;
    }

    setParticle(
      i,
      x,
      y,
      z
    );

    return;
  }


  /* socket */

  if(i<2350){

    const a=
      Math.random()*
      Math.PI*2;

    const r=
      2.0+
      Math.random()*.12;

    const y=
      .45+
      Math.random()*.9;

    setParticle(
      i,
      Math.cos(a)*r,
      y,
      Math.sin(a)*1.48
    );

    return;
  }


  /* RAM banks */

  if(i<2850){

    const bank=
      i%4;

    const x=
      -4.7+
      bank*1.35;

    const z=
      -2.5+
      Math.random()*.7;

    const y=
      .45+
      Math.random()*2.0;

    setParticle(
      i,
      x+
        (Math.random()-.5)*.45,
      y,
      z
    );

    return;
  }


  /* dissipatori */

  if(i<3250){

    const side=
      i%2;

    const x=
      side===0
      ?3.7
      :-3.7;

    const z=
      -1.0+
      Math.random()*2;

    const y=
      .5+
      Math.random()*2.5;

    setParticle(
      i,
      x+
        (Math.random()-.5)*1.1,
      y,
      z
    );

    return;
  }


  /* condensatori */

  if(i<3550){

    const a=
      Math.random()*
      Math.PI*2;

    const r=
      2.8+
      Math.random()*2;

    const x=
      Math.cos(a)*r;

    const z=
      Math.sin(a)*r*.55;

    const y=
      .5+
      Math.random()*1.8;

    setParticle(
      i,
      x,
      y,
      z
    );

    return;
  }


  /* chips secondari */

  if(i<3750){

    const x=
      (Math.random()<.5?-1:1)*
      (3+Math.random()*2);

    const z=
      (Math.random()-.5)*3;

    const y=
      .4+
      Math.random()*1.4;

    setParticle(
      i,
      x,
      y,
      z
    );

    return;
  }


  /* energia */

  const p=
    randomSphere(
      7+
      Math.random()*2
    );

  setParticle(
    i,
    p.x,
    p.y,
    p.z
  );
}


/* =========================================================
   GENERATE SHAPE
   ========================================================= */

function generateShape(type){

  currentShape=type;

  if(type==='cpu'){

    for(
      let i=0;
      i<CONFIG.particles;
      i++
    ){
      generateCPU(i);
    }

    shapePulse=1;

    return;
  }


  for(
    let i=0;
    i<CONFIG.particles;
    i++
  ){

    let x=0;
    let y=0;
    let z=0;

    const p=i/
      CONFIG.particles;

    const a=
      Math.random()*
      Math.PI*2;

    const r=
      Math.random();

    if(type==='jupiter'){

      const rr=5.1+
        (Math.random()-.5)*.25;

      const u=Math.random()*2-1;
      const s=Math.sqrt(1-u*u);

      x=rr*s*Math.cos(a);
      y=rr*u;
      z=rr*s*Math.sin(a);

      if(Math.random()<.22){
        y*=.55;
      }

    }else if(type==='galaxy'){

      const arms=5;
      const arm=
        i%arms;

      const rad=
        Math.pow(
          Math.random(),
          .55
        )*7;

      const ang=
        rad*1.15+
        arm*
        Math.PI*2/arms+
        (Math.random()-.5)*.6;

      x=
        Math.cos(ang)*rad;

      z=
        Math.sin(ang)*rad;

      y=
        (Math.random()-.5)*
        (.35+rad*.12);

    }else if(type==='hypercube'){

      const s=4.3;

      x=
        (Math.random()<.5?-s:s);

      y=
        (Math.random()<.5?-s:s);

      z=
        (Math.random()<.5?-s:s);

      const edge=Math.floor(
        Math.random()*3
      );

      if(edge===0)
        x=(Math.random()*2-1)*s;
      if(edge===1)
        y=(Math.random()*2-1)*s;
      if(edge===2)
        z=(Math.random()*2-1)*s;

    }else if(type==='heart'){

      const t=
        Math.random()*
        Math.PI*2;

      const rr=
        Math.sqrt(
          Math.random()
        );

      x=
        5.8*
        Math.pow(
          Math.sin(t),
          3
        )*
        rr;

      y=
        4.7*
        (
          13*Math.cos(t)-
          5*Math.cos(2*t)-
          2*Math.cos(3*t)-
          Math.cos(4*t)
        )/
        16*
        rr;

      z=
        (Math.random()-.5)*
        .8;

    }else if(type==='flower'){

      const petals=7;

      const rr=
        3+
        2*
        Math.sin(
          petals*a
        );

      x=
        Math.cos(a)*rr;

      z=
        Math.sin(a)*rr;

      y=
        (Math.random()-.5)*
        2;

    }else if(type==='fireworks'){

      const dir=
        randomSphere(1);

      const rr=
        Math.pow(
          Math.random(),
          .25
        )*8;

      x=dir.x*rr;
      y=dir.y*rr;
      z=dir.z*rr;

    }else if(type==='saturn'){

      if(Math.random()<.55){

        const rr=2+
          Math.random()*1.2;

        const q=randomSphere(1);

        x=q.x*rr;
        y=q.y*rr;
        z=q.z*rr;

      }else{

        const rr=
          4.3+
          Math.random()*2.3;

        x=
          Math.cos(a)*rr;

        z=
          Math.sin(a)*rr;

        y=
          (Math.random()-.5)*
          .25;
      }

    }else if(
      type==='DNA'||
      type==='dna2'
    ){

      const t=
        p*Math.PI*12;

      const rr=2.3;

      x=
        Math.cos(t)*rr;

      z=
        Math.sin(t)*rr;

      y=
        (p-.5)*12;

      if(i%8<4){

        const q=
          Math.random();

        x=
          Math.cos(t+Math.PI*q)*
          rr;

        z=
          Math.sin(t+Math.PI*q)*
          rr;

      }

    }else if(type==='atom'||type==='atom2'){

      const ring=
        i%3;

      const rr=5;

      let aa=
        a+
        Math.random()*
        Math.PI*2;

      if(ring===0){

        x=Math.cos(aa)*rr;
        y=Math.sin(aa)*rr;
        z=(Math.random()-.5)*.15;

      }else if(ring===1){

        x=Math.cos(aa)*rr;
        z=Math.sin(aa)*rr;
        y=(Math.random()-.5)*.15;

      }else{

        x=(Math.random()-.5)*1.5;
        y=(Math.random()-.5)*1.5;
        z=(Math.random()-.5)*1.5;
      }

    }else if(type==='blackhole'){

      const rr=
        1.2+
        Math.random()*6;

      x=
        Math.cos(a)*rr;

      z=
        Math.sin(a)*rr;

      y=
        (Math.random()-.5)*
        .45*
        (rr/6);

    }else if(type==='nebula'){

      const q=randomSphere(1);
      const rr=
        Math.pow(
          Math.random(),
          .35
        )*7;

      x=q.x*rr;
      y=q.y*rr*.65;
      z=q.z*rr;

    }else if(type==='vortex'){

      const yy=
        (Math.random()-.5)*10;

      const rr=
        .5+
        Math.abs(yy)*.65;

      const aa=
        yy*1.2+
        a;

      x=Math.cos(aa)*rr;
      y=yy;
      z=Math.sin(aa)*rr;

    }else if(type==='tornado'){

      y=
        (Math.random()-.5)*10;

      const rr=
        .4+
        ((y+5)/10)*4.5;

      x=Math.cos(a+y)*rr;
      z=Math.sin(a+y)*rr;

    }else if(type==='wave'){

      x=
        (Math.random()-.5)*13;

      z=
        (Math.random()-.5)*7;

      y=
        Math.sin(x*1.3)*
        Math.cos(z*1.1)*2;

    }else if(type==='spiral'){

      const t=
        p*Math.PI*14;

      const rr=
        .5+
        p*5;

      x=Math.cos(t)*rr;
      y=(p-.5)*8;
      z=Math.sin(t)*rr;

    }else if(type==='star'){

      const rr=
        Math.random()<.5
        ?5.5
        :2.7;

      x=Math.cos(a)*rr;
      z=Math.sin(a)*rr;
      y=(Math.random()-.5)*2;

    }else if(type==='sun'){

      const q=randomSphere(1);
      const rr=4.7+
        (Math.random()-.5)*.25;

      x=q.x*rr;
      y=q.y*rr;
      z=q.z*rr;

    }else if(
      type==='moon'||
      type==='earth'||
      type==='mars'
    ){

      const q=randomSphere(1);
      const rr=4;

      x=q.x*rr;
      y=q.y*rr;
      z=q.z*rr;

    }else if(type==='diamond'){

      const yy=
        (Math.random()-.5)*7;

      const rr=
        (1-
        Math.abs(yy)/3.5)*
        4;

      x=
        Math.cos(a)*rr;

      z=
        Math.sin(a)*rr;

      y=yy;

    }else if(type==='crystal'){

      const yy=
        (Math.random()-.5)*8;

      const rr=
        1.8+
        Math.random()*2;

      x=Math.cos(a)*rr;
      z=Math.sin(a)*rr;
      y=yy;

    }else if(type==='gear'){

      const teeth=12;

      const rr=
        3.2+
        (
          Math.sin(
            a*teeth
          )>.5
          ?1.1
          :0
        );

      x=Math.cos(a)*rr;
      z=Math.sin(a)*rr;
      y=(Math.random()-.5)*1.2;

    }else if(type==='ringstack'){

      const yy=
        (Math.random()-.5)*8;

      const rr=
        3+
        Math.sin(yy)*1;

      x=Math.cos(a)*rr;
      y=yy;
      z=Math.sin(a)*rr;

    }else if(type==='capsule'){

      x=
        (Math.random()-.5)*8;

      const rr=
        2.4;

      const q=
        randomSphere(1);

      y=q.y*rr;
      z=q.z*rr;

    }else if(type==='cone'){

      y=
        (Math.random()-.5)*8;

      const rr=
        (1-(y+4)/8)*4;

      x=Math.cos(a)*rr;
      z=Math.sin(a)*rr;

    }else if(
      type==='cubeSphere'
    ){

      const q=randomSphere(1);

      x=
        Math.sign(q.x)*
        Math.pow(
          Math.abs(q.x),
          .55
        )*4.5;

      y=
        Math.sign(q.y)*
        Math.pow(
          Math.abs(q.y),
          .55
        )*4.5;

      z=
        Math.sign(q.z)*
        Math.pow(
          Math.abs(q.z),
          .55
        )*4.5;

    }else if(
      type==='octahedron'
    ){

      const q=randomSphere(1);
      const s=5;

      x=q.x*s;
      y=q.y*s;
      z=q.z*s;

      const scale=
        1/
        (
          Math.abs(q.x)+
          Math.abs(q.y)+
          Math.abs(q.z)
        );

      x*=scale;
      y*=scale;
      z*=scale;

    }else if(
      type==='tetrahedron'
    ){

      const verts=[
        [0,4,0],
        [-4,-3,3],
        [4,-3,3],
        [0,-3,-4]
      ];

      const A=
        verts[
          Math.floor(
            Math.random()*4
          )
        ];

      const B=
        verts[
          Math.floor(
            Math.random()*4
          )
        ];

      const t=Math.random();

      x=A[0]*(1-t)+B[0]*t;
      y=A[1]*(1-t)+B[1]*t;
      z=A[2]*(1-t)+B[2]*t;

    }else if(
      type==='torusKnot'
    ){

      const t=
        Math.random()*
        Math.PI*2*
        3;

      const q=
        (
          2+
          Math.cos(3*t)
        );

      x=
        q*Math.cos(2*t);

      y=
        Math.sin(3*t)*2;

      z=
        q*Math.sin(2*t);

    }else if(type==='mobius'){

      const u=
        Math.random()*
        Math.PI*2;

      const v=
        (Math.random()-.5)*
        1.5;

      const rr=
        4+
        v*Math.cos(u/2);

      x=
        rr*Math.cos(u);

      y=
        v*Math.sin(u/2);

      z=
        rr*Math.sin(u);

    }else if(
      type==='trefoil'
    ){

      const t=
        Math.random()*
        Math.PI*2;

      x=
        (
          Math.sin(t)+
          2*Math.sin(2*t)
        )*2;

      y=
        (
          Math.cos(t)-
          2*Math.cos(2*t)
        )*2;

      z=
        -Math.sin(3*t)*2;

    }else if(
      type==='butterfly'
    ){

      const t=
        Math.random()*
        Math.PI*12;

      const rr=
        Math.exp(
          Math.cos(t)
        )-
        2*Math.cos(4*t)-
        Math.pow(
          Math.sin(t/12),
          5
        );

      x=Math.sin(t)*rr;
      y=Math.cos(t)*rr;
      z=(Math.random()-.5)*1.5;

    }else if(type==='eye'){

      x=
        Math.cos(a)*
        5;

      y=
        Math.sin(a)*
        2.5;

      z=
        Math.random()*
        1.8-
        .9;

    }else if(type==='brain'){

      const q=randomSphere(1);

      x=q.x*4.2;
      y=q.y*3.3;
      z=q.z*4.2;

      x+=
        Math.sin(y*3)*.4;

    }else if(type==='tree'){

      if(Math.random()<.35){

        const h=
          Math.random()*7;

        x=(Math.random()-.5)*1.3;
        y=h-3;
        z=(Math.random()-.5)*1.3;

      }else{

        const q=randomSphere(1);
        const rr=
          2+
          Math.random()*3;

        x=q.x*rr;
        y=q.y*rr+3;
        z=q.z*rr;

      }

    }else if(type==='mountain'){

      x=
        (Math.random()-.5)*12;

      z=
        (Math.random()-.5)*8;

      y=
        Math.max(
          0,
          5-
          Math.abs(x)*.5-
          Math.abs(z)*.35
        );

    }else if(type==='satellite'){

      x=
        (Math.random()-.5)*8;

      y=
        (Math.random()-.5)*2;

      z=
        (Math.random()-.5)*3;

    }else if(
      type==='rocket'
    ){

      const yy=
        (Math.random()-.5)*9;

      const rr=
        2.3;

      x=Math.cos(a)*rr;
      y=yy;
      z=Math.sin(a)*rr;

    }else if(
      type==='spaceship'
    ){

      x=
        (Math.random()-.5)*9;

      y=
        Math.sin(x)*.7;

      z=
        (Math.random()-.5)*4;

    }else if(type==='robot'){

      x=
        (Math.random()-.5)*6;

      y=
        (Math.random()-.5)*7;

      z=
        (Math.random()-.5)*3;

    }else if(type==='shield'){

      const yy=
        (Math.random()-.5)*8;

      const rr=
        4-
        Math.abs(yy)*.35;

      x=Math.cos(a)*rr;
      y=yy;
      z=Math.sin(a)*.7;

    }else if(
      type==='helmet'
    ){

      const q=randomSphere(1);

      x=q.x*4;
      y=Math.abs(q.y)*4-1;
      z=q.z*4;

    }else if(type==='crown'){

      const teeth=7;
      const rr=
        3+
        Math.sin(a*teeth)*1.4;

      x=Math.cos(a)*rr;
      z=Math.sin(a)*rr;
      y=2+Math.random()*3;

    }else if(
      type==='infinity'
    ){

      const t=
        Math.random()*
        Math.PI*2;

      const s=
        4/
        (
          1+
          Math.sin(t)*
          Math.sin(t)
        );

      x=s*Math.cos(t);
      y=s*Math.sin(t);
      z=(Math.random()-.5)*1;

    }else if(
      type==='hourglass'
    ){

      y=
        (Math.random()-.5)*9;

      const rr=
        Math.abs(y)*.55+
        .5;

      x=Math.cos(a)*rr;
      z=Math.sin(a)*rr;

    }else if(
      type==='tesseract'
    ){

      const s=3.5;

      x=
        Math.random()<.5
        ?-s:s;

      y=
        Math.random()<.5
        ?-s:s;

      z=
        Math.random()<.5
        ?-s:s;

      if(i%3===0)
        x=(Math.random()*2-1)*s;

      if(i%3===1)
        y=(Math.random()*2-1)*s;

      if(i%3===2)
        z=(Math.random()*2-1)*s;

    }else if(
      type==='portal'
    ){

      const rr=
        3+
        Math.random()*1.5;

      x=Math.cos(a)*rr;
      y=Math.sin(a)*rr;
      z=(Math.random()-.5)*1;

    }else if(
      type==='matrix'
    ){

      x=
        (Math.random()-.5)*10;

      y=
        (Math.random()-.5)*10;

      z=
        (Math.random()-.5)*5;

    }else if(
      type==='reactor'
    ){

      const ring=i%5;

      const rr=
        1.2+
        ring*1;

      x=Math.cos(a)*rr;
      z=Math.sin(a)*rr;
      y=(Math.random()-.5)*5;

    }else if(
      type==='mechanism'
    ){

      const ring=i%6;

      const rr=
        1+
        ring*.8;

      x=Math.cos(a)*rr;
      y=
        (Math.random()-.5)*5;

      z=Math.sin(a)*rr;

    }else{

      const q=randomSphere(5);

      x=q.x;
      y=q.y;
      z=q.z;
    }

    setParticle(
      i,
      x,
      y,
      z
    );
  }

  shapePulse=1;
}


/* =========================================================
   BUILDER SPAWN
   ========================================================= */

function spawnShape(
  type,
  position
){

  if(
    blocks.length>=
    CONFIG.maxBlocks
  ){
    return null;
  }

  let geometry;

  if(type==='sphere'){

    geometry=
      new THREE.SphereGeometry(
        1.25,
        24,
        16
      );

  }else if(type==='pyramid'){

    geometry=
      new THREE.ConeGeometry(
        1.35,
        2.5,
        4
      );

  }else if(type==='torus'){

    geometry=
      new THREE.TorusGeometry(
        1.1,
        .35,
        12,
        32
      );

  }else if(type==='cylinder'){

    geometry=
      new THREE.CylinderGeometry(
        1.15,
        1.15,
        2.4,
        24
      );

  }else if(
    type==='icosahedron'
  ){

    geometry=
      new THREE.IcosahedronGeometry(
        1.35,
        1
      );

  }else{

    geometry=
      new THREE.BoxGeometry(
        2.3,
        2.3,
        2.3
      );
  }

  const material=
    new THREE.MeshBasicMaterial({
      color:0x00ffcc,
      wireframe:true,
      transparent:true,
      opacity:.8
    });

  const mesh=
    new THREE.Mesh(
      geometry,
      material
    );

  if(position){

    mesh.position.copy(
      position
    );

  }else{

    mesh.position.set(
      (Math.random()-.5)*5,
      4+Math.random()*3,
      (Math.random()-.5)*4
    );
  }

  mesh.userData.size=2.3;

  mesh.userData.velocity=
    new THREE.Vector3();

  mesh.userData.isGrabbed=false;

  mesh.userData.shape=type;

  builderGroup.add(
    mesh
  );

  blocks.push(
    mesh
  );

  selectedBlock=mesh;

  updateSelectionUI();

  sounds.pulse(280);

  return mesh;
}


/* =========================================================
   CLEAR
   ========================================================= */

function clearBlocks(){

  for(
    const block of blocks
  ){

    builderGroup.remove(
      block
    );

    block.geometry.dispose();

    block.material.dispose();
  }

  blocks.length=0;

  selectedBlock=null;

  updateSelectionUI();
}


/* =========================================================
   HIGHLIGHT
   ========================================================= */

function highlightBlock(
  block,
  active
){

  if(!block)return;

  block.material.color.set(
    active
    ?0xff00aa
    :0x00ffcc
  );

  block.material.opacity=
    active?.98:.8;
}


/* =========================================================
   SELECTION UI
   ========================================================= */

function updateSelectionUI(){

  if(selectedBlock){

    highlightBlock(
      selectedBlock,
      true
    );

  }
}


/* =========================================================
   SNAP
   ========================================================= */

function snapBlock(block){

  if(!block)return;

  const step=1.15;

  block.position.x=
    Math.round(
      block.position.x/step
    )*step;

  block.position.y=
    Math.round(
      block.position.y/step
    )*step;

  block.position.z=
    Math.round(
      block.position.z/step
    )*step;
}


/* =========================================================
   PREVIEW
   ========================================================= */

function drawPreview(results){

  const ctx=
    dom.preview.getContext('2d');

  ctx.clearRect(
    0,
    0,
    dom.preview.width,
    dom.preview.height
  );

  ctx.save();

  ctx.translate(
    dom.preview.width,
    0
  );

  ctx.scale(
    -1,
    1
  );

  ctx.drawImage(
    dom.video,
    0,
    0,
    dom.preview.width,
    dom.preview.height
  );

  ctx.restore();

  if(
    !results||
    !results.multiHandLandmarks
  ){
    return;
  }

  ctx.save();

  ctx.scale(
    -1,
    1
  );

  ctx.translate(
    -dom.preview.width,
    0
  );

  for(
    const landmarks of
    results.multiHandLandmarks
  ){

    if(
      typeof drawConnectors===
      'function'
    ){

      drawConnectors(
        ctx,
        landmarks,
        HAND_CONNECTIONS,
        {
          color:'#00ffcc',
          lineWidth:1
        }
      );
    }

    for(
      const p of landmarks
    ){

      ctx.beginPath();

      ctx.arc(
        p.x*dom.preview.width,
        p.y*dom.preview.height,
        2,
        0,
        Math.PI*2
      );

      ctx.fillStyle='#ff00aa';

      ctx.fill();
    }
  }

  ctx.restore();
}


/* =========================================================
   HAND HELPERS
   ========================================================= */

function landmarkDistance(
  a,
  b
){

  const dx=a.x-b.x;
  const dy=a.y-b.y;
  const dz=(a.z||0)-(b.z||0);

  return Math.sqrt(
    dx*dx+
    dy*dy+
    dz*dz
  );
}


function getPalmCenter(
  lm
){

  const ids=[
    0,
    5,
    9,
    13,
    17
  ];

  let x=0;
  let y=0;
  let z=0;

  for(
    const id of ids
  ){

    x+=lm[id].x;
    y+=lm[id].y;
    z+=lm[id].z||0;
  }

  const n=ids.length;

  return{
    x:x/n,
    y:y/n,
    z:z/n
  };
}


function handToWorld(
  p
){

  const x=
    (p.x-.5)*14;

  const y=
    -(p.y-.5)*10;

  const z=
    THREE.MathUtils.clamp(
      -(p.z||0)*10,
      -5,
      5
    );

  return new THREE.Vector3(
    x,
    y,
    z
  );
}


/* =========================================================
   TWO HAND ROTATION STATE
   ========================================================= */

let twoHandState={
  active:false,

  centerX:.5,
  centerY:.5,

  lastCenterX:.5,
  lastCenterY:.5,

  distance:.25,
  baseDistance:.25,

  rotationX:0,
  rotationY:0,

  initialized:false
};


/* =========================================================
   PARTICLE HAND UPDATE
   ========================================================= */

function updateParticleHands(){

  const active=
    controllers.filter(
      c=>c.active
    );

  dom.hands.textContent=
    active.length;

  if(active.length>=2){

    const a=controllers[0].pos;
    const b=controllers[1].pos;

    /*
      CENTRO DELLE DUE MANI

      Questo valore è completamente
      indipendente dalla distanza.
    */

    const centerX=
      (a.x+b.x)*.5;

    const centerY=
      (a.y+b.y)*.5;

    /*
      DISTANZA

      Viene usata SOLO per lo zoom.
      NON viene mai utilizzata per
      modificare rotation.x / rotation.y.
    */

    const dx=a.x-b.x;
    const dy=a.y-b.y;

    const distance=
      Math.sqrt(
        dx*dx+
        dy*dy
      );

    if(!twoHandState.initialized){

      twoHandState.centerX=centerX;
      twoHandState.centerY=centerY;

      twoHandState.lastCenterX=centerX;
      twoHandState.lastCenterY=centerY;

      twoHandState.baseDistance=
        distance;

      twoHandState.distance=
        distance;

      twoHandState.initialized=true;
    }

    /*
      Movimento del CENTRO.

      Se le due mani si allontanano
      mantenendo il centro fermo:
        centerDelta = 0
        rotazione = 0

      Quindi lo zoom non può
      generare rotazione.
    */

    const centerDX=
      centerX-
      twoHandState.lastCenterX;

    const centerDY=
      centerY-
      twoHandState.lastCenterY;

    /*
      Dead-zone piccolissima per eliminare
      micro-jitter della MediaPipe.
    */

    const dead=.0015;

    const cleanDX=
      Math.abs(centerDX)<dead
      ?0
      :centerDX;

    const cleanDY=
      Math.abs(centerDY)<dead
      ?0
      :centerDY;

    /*
      Rotazione proporzionale allo
      spostamento reale del centro.
    */

    twoHandState.rotationY+=
      cleanDX*
      5.8;

    twoHandState.rotationX+=
      cleanDY*
      4.2;

    /*
      Limite verticale.
    */

    twoHandState.rotationX=
      THREE.MathUtils.clamp(
        twoHandState.rotationX,
        -1.5,
        1.5
      );

    /*
      Aggiorniamo SOLO ora il centro.
    */

    twoHandState.lastCenterX=
      centerX;

    twoHandState.lastCenterY=
      centerY;

    twoHandState.centerX=
      centerX;

    twoHandState.centerY=
      centerY;

    /*
      ZOOM:

      baseline relativa alla distanza
      iniziale, quindi non provoca
      alcuna rotazione.
    */

    const normalizedDistance=
      distance/
      Math.max(
        .001,
        twoHandState.baseDistance
      );

    targetScale=
      THREE.MathUtils.clamp(
        1+
        (
          normalizedDistance-1
        )*
        1.65,
        .48,
        2.4
      );

    targetRotX=
      twoHandState.rotationX;

    targetRotY=
      twoHandState.rotationY;

    dom.gesture.textContent=
      '2 HAND // ZOOM + CENTER ROT';

    dom.zoomValue.textContent=
      targetScale.toFixed(2);

    dom.rotValue.textContent=
      (
        targetRotY*
        57.2958
      ).toFixed(0)+
      ' / '+
      (
        targetRotX*
        57.2958
      ).toFixed(0);

  }else if(active.length===1){

    /*
      Quando rimane una sola mano,
      resettiamo lo stato a due mani
      senza introdurre un salto.
    */

    twoHandState.initialized=false;

    const c=active[0];

    const dx=
      c.pos.x-
      c.lastPos.x;

    const dy=
      c.pos.y-
      c.lastPos.y;

    targetRotY+=
      dx*
      .55;

    targetRotX+=
      dy*
      .40;

    targetRotX=
      THREE.MathUtils.clamp(
        targetRotX,
        -1.5,
        1.5
      );

    targetScale=
      THREE.MathUtils.clamp(
        targetScale,
        .48,
        2.4
      );

    dom.gesture.textContent=
      '1 HAND // ROTATE';

    dom.zoomValue.textContent=
      targetScale.toFixed(2);

  }else{

    /*
      Nessuna mano:
      manteniamo l'ultimo orientamento.
    */

    twoHandState.initialized=false;

    dom.gesture.textContent=
      'IDLE';
  }
}


/* =========================================================
   HAND TRACKING RESULT
   ========================================================= */

function onHandsResults(results){

  drawPreview(
    results
  );

  const landmarks=
    results.multiHandLandmarks||
    [];

  controllers.forEach(
    (ctrl,index)=>{

      ctrl.wasPinching=
        ctrl.isPinching;

      ctrl.active=false;
      ctrl.isPinching=false;

      const lm=
        landmarks[index];

      if(!lm){

        if(
          currentMode==='BUILDER'
        ){

          updateBuilderHand(
            ctrl
          );
        }

        return;
      }

      ctrl.active=true;

      const palm=
        getPalmCenter(lm);

      const world=
        handToWorld(palm);

      ctrl.lastPos.copy(
        ctrl.pos
      );

      ctrl.pos.lerp(
        world,
        CONFIG.handSmooth
      );

      const pinchDistance=
        landmarkDistance(
          lm[4],
          lm[8]
        );

      if(ctrl.wasPinching){

        ctrl.isPinching=
          pinchDistance<
          CONFIG.pinchOff;

      }else{

        ctrl.isPinching=
          pinchDistance<
          CONFIG.pinchOn;
      }

      if(
        currentMode==='BUILDER'
      ){

        updateBuilderHand(
          ctrl
        );

      }else{

        if(ctrl.isPinching){

          shapePulse=
            Math.min(
              1,
              shapePulse+.04
            );

          sounds.pulse(
            430+
            index*90
          );
        }
      }

      ctrl.rayLine.visible=
        currentMode==='BUILDER';

      ctrl.trail.visible=
        currentMode==='PARTICLES';

      if(ctrl.rayLine){

        const arr=
          ctrl.rayLine.geometry
            .attributes
            .position
            .array;

        arr[0]=ctrl.pos.x;
        arr[1]=ctrl.pos.y;
        arr[2]=ctrl.pos.z;

        arr[3]=ctrl.pos.x;
        arr[4]=ctrl.pos.y;
        arr[5]=ctrl.pos.z-3;

        ctrl.rayLine.geometry
          .attributes
          .position
          .needsUpdate=true;
      }
    }
  );

  if(
    currentMode==='PARTICLES'
  ){

    updateParticleHands();
  }
}


/* =========================================================
   MEDIAPIPE INIT
   ========================================================= */

async function initHandTracking(){

  if(
    typeof Hands===
    'undefined'
  ){

    throw new Error(
      'MediaPipe Hands unavailable'
    );
  }

  const hands=
    new Hands({
      locateFile:file=>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

  hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:.55,

    minTrackingConfidence:.55
  });

  hands.onResults(
    onHandsResults
  );

  const stream=
    await navigator.mediaDevices
      .getUserMedia({

        video:{
          width:CONFIG.cameraWidth,
          height:CONFIG.cameraHeight,
          facingMode:'user'
        },

        audio:false
      });

  dom.video.srcObject=
    stream;

  await dom.video.play();

  const cam=
    new Camera(
      dom.video,
      {
        onFrame:async()=>{
          await hands.send({
            image:dom.video
          });
        },

        width:CONFIG.cameraWidth,

        height:CONFIG.cameraHeight
      }
    );

  cam.start();

  setConnection(
    'CAM: ONLINE',
    'green'
  );
}


/* =========================================================
   BUILDER HAND CONTROL
   ========================================================= */

function updateBuilderHand(ctrl){

  if(
    currentMode!=='BUILDER'
  )return;

  if(ctrl.isPinching){

    if(!ctrl.grabbedBlock){

      selectNearestBlock(
        ctrl
      );
    }

    if(ctrl.grabbedBlock){

      const block=
        ctrl.grabbedBlock;

      const builderGain=
        1+
        CONFIG.axisSensitivity;

      const dx=
        (
          ctrl.pos.x-
          ctrl.grabStartHand.x
        )*
        builderGain;

      const dy=
        (
          ctrl.pos.y-
          ctrl.grabStartHand.y
        )*
        builderGain;

      const dz=
        (
          ctrl.pos.z-
          ctrl.grabStartHand.z
        )*
        builderGain;

      block.position.set(

        ctrl.grabStartBlock.x+
        dx,

        ctrl.grabStartBlock.y+
        dy,

        ctrl.grabStartBlock.z+
        dz
      );

      block.userData.velocity.set(
        0,
        0,
        0
      );

      selectedBlock=
        block;

      highlightBlock(
        block,
        true
      );

      updateSelectionUI();
    }

  }else if(
    ctrl.wasPinching
  ){

    releaseBlock(
      ctrl
    );
  }
}


/* =========================================================
   SELECT NEAREST
   ========================================================= */

function selectNearestBlock(ctrl){

  let nearest=null;

  let best=4;

  for(
    const block of blocks
  ){

    const d=
      ctrl.pos.distanceTo(
        block.position
      );

    if(d<best){

      best=d;
      nearest=block;
    }
  }

  if(!nearest)return;

  ctrl.grabbedBlock=
    nearest;

  ctrl.grabOffset.copy(
    ctrl.pos
  ).sub(
    nearest.position
  );

  ctrl.grabStartHand.copy(
    ctrl.pos
  );

  ctrl.grabStartBlock.copy(
    nearest.position
  );

  nearest.userData.isGrabbed=
    true;

  nearest.userData.velocity.set(
    0,
    0,
    0
  );

  selectedBlock=
    nearest;

  highlightBlock(
    nearest,
    true
  );

  updateSelectionUI();
}


/* =========================================================
   RELEASE
   ========================================================= */

function releaseBlock(ctrl){

  const block=
    ctrl.grabbedBlock;

  if(!block)return;

  block.userData.isGrabbed=
    false;

  block.userData.velocity.set(
    0,
    0,
    0
  );

  snapBlock(
    block
  );

  highlightBlock(
    block,
    false
  );

  ctrl.grabbedBlock=
    null;

  selectedBlock=
    null;

  updateSelectionUI();
}


/* =========================================================
   PARTICLE ANIMATION
   ========================================================= */

function updateParticles(delta){

  if(
    currentMode!=='PARTICLES'
  )return;

  const lerp=
    Math.min(
      CONFIG.particleSmooth*
      delta,
      .45
    );

  /*
    ROTAZIONE

    La rotazione viene applicata
    esclusivamente ai targetRot.

    targetScale non entra MAI
    nei calcoli della rotazione.
  */

  particleGroup.rotation.x+=
    (
      targetRotX-
      particleGroup.rotation.x
    )*
    lerp;

  particleGroup.rotation.y+=
    (
      targetRotY-
      particleGroup.rotation.y
    )*
    lerp;

  particleGroup.rotation.z+=
    (
      targetRotZ-
      particleGroup.rotation.z
    )*
    lerp;

  currentScale+=
    (
      targetScale-
      currentScale
    )*
    lerp;

  particleGroup.scale.setScalar(
    currentScale
  );

  shapePulse=
    Math.max(
      0,
      shapePulse-
      .025*
      delta
    );

  const positions=
    particleGeometry
      .attributes
      .position
      .array;

  const pinch=
    controllers[0].isPinching||
    controllers[1].isPinching;

  /*
    La CPU reagisce leggermente
    al movimento delle mani senza
    cambiare l'orientamento globale
    in modo automatico.
  */

  const isCPU=
    currentShape==='cpu';

  const handEnergy=
    Math.min(
      1,
      controllers
        .filter(c=>c.active)
        .reduce(
          (sum,c)=>
            sum+
            c.pos.length()*.025,
          0
        )
    );

  for(
    let i=0,j=0;
    i<CONFIG.particles;
    i++,j+=3
  ){

    let tx=
      targetPositions[j];

    let ty=
      targetPositions[j+1];

    let tz=
      targetPositions[j+2];

    /*
      Reazione olografica locale.
      Non modifica rotation.x/y.
    */

    if(isCPU){

      const rr=
        Math.sqrt(
          tx*tx+
          tz*tz
        );

      const wave=
        Math.sin(
          rr*2.4+
          performance.now()*.002
        )*
        .035*
        (
          .5+
          handEnergy
        );

      ty+=wave;

      if(
        pinch&&
        (i&1)===0
      ){

        tx*=.985;
        ty*=.985;
        tz*=.985;
      }

    }else{

      if(
        pinch&&
        (i&1)===0
      ){

        tx*=.012;
        ty*=.012;
        tz*=.012;
      }
    }

    const speed=
      pinch&&
      (i&1)===0

      ?.55

      :.18+
      shapePulse*.08;

    positions[j]+=
      (
        tx-
        positions[j]
      )*
      speed;

    positions[j+1]+=
      (
        ty-
        positions[j+1]
      )*
      speed;

    positions[j+2]+=
      (
        tz-
        positions[j+2]
      )*
      speed;
  }

  particleGeometry
    .attributes
    .position
    .needsUpdate=true;
}


/* =========================================================
   BUILDER PHYSICS
   ========================================================= */

function updateBuilder(delta){

  if(
    currentMode!=='BUILDER'
  )return;

  const gravity=
    CONFIG.builderGravity*
    delta;

  for(
    const block of blocks
  ){

    if(
      block.userData.isGrabbed
    )continue;

    const velocity=
      block.userData.velocity;

    velocity.y-=gravity;

    velocity.x=0;
    velocity.z=0;

    block.position.addScaledVector(
      velocity,
      delta
    );

    const floorY=
      -6+
      block.userData.size*.5;

    if(
      block.position.y<
      floorY
    ){

      block.position.y=
        floorY;

      velocity.y=0;
      velocity.x=0;
      velocity.z=0;
    }
  }

  resolveCollisions();

  updateSelectionRing();
}


/* =========================================================
   COLLISIONI
   ========================================================= */

function resolveCollisions(){

  const cell=3.5;

  const grid=
    new Map();

  for(
    const block of blocks
  ){

    if(
      block.userData.isGrabbed
    )continue;

    const x=
      Math.floor(
        block.position.x/cell
      );

    const z=
      Math.floor(
        block.position.z/cell
      );

    const key=
      x+','+z;

    let list=
      grid.get(key);

    if(!list){

      list=[];

      grid.set(
        key,
        list
      );
    }

    list.push(
      block
    );
  }

  for(
    const [key,list]
    of grid
  ){

    const parts=
      key.split(',');

    const cx=+parts[0];
    const cz=+parts[1];

    for(
      let ox=-1;
      ox<=1;
      ox++
    ){

      for(
        let oz=-1;
        oz<=1;
        oz++
      ){

        const otherList=
          grid.get(
            (cx+ox)+','+
            (cz+oz)
          );

        if(!otherList)
          continue;

        for(
          const a of list
        ){

          for(
            const b of otherList
          ){

            if(a===b)
              continue;

            const dx=
              a.position.x-
              b.position.x;

            const dz=
              a.position.z-
              b.position.z;

            if(
              dx*dx+
              dz*dz>8.5
            )continue;

            const top=
              b.position.y+
              b.userData.size*.5+
              a.userData.size*.5;

            if(
              a.position.y<=top&&
              a.position.y>b.position.y
            ){

              a.position.y=
                top;

              a.userData.velocity.set(
                0,
                0,
                0
              );

              b.userData.velocity.set(
                0,
                0,
                0
              );
            }
          }
        }
      }
    }
  }
}


/* =========================================================
   SELECTION RING
   ========================================================= */

function updateSelectionRing(){

  if(
    !selectedBlock||
    currentMode!=='BUILDER'
  ){

    dom.ring.style.display=
      'none';

    return;
  }

  const v=
    selectedBlock
      .position
      .clone();

  v.project(
    camera
  );

  const x=
    (
      v.x*.5+
      .5
    )*
    innerWidth;

  const y=
    (
      -v.y*.5+
      .5
    )*
    innerHeight;

  dom.ring.style.display=
    'block';

  dom.ring.style.left=
    (x-22)+'px';

  dom.ring.style.top=
    (y-22)+'px';
}


/* =========================================================
   MODE
   ========================================================= */

function switchMode(mode){

  if(
    currentMode===mode
  )return;

  currentMode=mode;

  const builder=
    mode==='BUILDER';

  dom.tabBuilder.classList.toggle(
    'active',
    builder
  );

  dom.tabParticles.classList.toggle(
    'active',
    !builder
  );

  dom.builder.classList.toggle(
    'hidden',
    !builder
  );

  dom.particles.classList.toggle(
    'hidden',
    builder
  );

  dom.panelTitle.textContent=
    builder
    ?'3D BUILDER MATRIX'
    :'PARTICLE MATRIX';

  dom.mode.textContent=
    mode;

  builderGroup.visible=
    builder;

  particleGroup.visible=
    !builder;

  controllers.forEach(
    c=>{

      c.rayLine.visible=
        builder&&
        c.active;

      c.trail.visible=
        !builder&&
        c.active;
    }
  );

  if(!builder){

    selectedBlock=null;

    controllers.forEach(
      c=>{
        releaseBlock(c);
      }
    );

    updateSelectionUI();
  }
}


/* =========================================================
   UI EVENTS
   ========================================================= */

function bindEvents(){

  dom.tabBuilder.addEventListener(
    'click',
    ()=>switchMode(
      'BUILDER'
    )
  );

  dom.tabParticles.addEventListener(
    'click',
    ()=>switchMode(
      'PARTICLES'
    )
  );

  document
    .querySelectorAll(
      '.spawn-btn'
    )
    .forEach(
      btn=>{

        btn.addEventListener(
          'click',
          ()=>{

            spawnShape(
              btn.dataset.shape
            );
          }
        );
      }
    );

  dom.clear.addEventListener(
    'click',
    clearBlocks
  );

  dom.shapeSelect.addEventListener(
    'change',
    e=>{

      generateShape(
        e.target.value
      );
    }
  );

  dom.colorPicker.addEventListener(
    'input',
    e=>{

      if(
        particleMaterial
      ){

        particleMaterial.color.set(
          e.target.value
        );
      }
    }
  );

  dom.audio.addEventListener(
    'click',
    ()=>{

      sounds.enabled=
        !sounds.enabled;

      dom.audio.textContent=
        sounds.enabled
        ?'🔊 AUDIO: ATTIVO'
        :'🔇 AUDIO: DISATTIVATO';

      if(
        sounds.enabled
      ){

        sounds.init();
      }
    }
  );

  window.addEventListener(
    'resize',
    onResize,
    {passive:true}
  );
}


/* =========================================================
   CONNECTION HUD
   ========================================================= */

function setConnection(
  text,
  type
){

  dom.connection.textContent=
    text;

  if(type==='green'){

    dom.connection.style.color=
      '#00ffcc';

  }else if(type==='red'){

    dom.connection.style.color=
      '#ff5577';

  }else{

    dom.connection.style.color=
      '#ffe66d';
  }
}


/* =========================================================
   FPS
   ========================================================= */

function updateFPS(now){

  fpsFrames++;

  if(
    now-fpsTime>=500
  ){

    const fps=
      Math.round(
        fpsFrames*
        1000/
        (
          now-fpsTime
        )
      );

    dom.fps.textContent=
      fps;

    fpsFrames=0;

    fpsTime=now;
  }
}


/* =========================================================
   MAIN LOOP
   ========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  const now=
    performance.now();

  const delta=
    Math.min(
      (
        now-
        lastFrame
      )/
      16.67,
      2
    );

  lastFrame=now;

  updateFPS(
    now
  );

  if(
    currentMode==='BUILDER'
  ){

    updateBuilder(
      delta
    );

  }else{

    updateParticles(
      delta
    );
  }

  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   RESIZE
   ========================================================= */

function onResize(){

  if(
    !camera||
    !renderer
  )return;

  camera.aspect=
    innerWidth/
    innerHeight;

  camera.updateProjectionMatrix();

  renderer.setPixelRatio(
    CONFIG.renderScale
  );

  renderer.setSize(
    innerWidth,
    innerHeight,
    false
  );
}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
  'load',
  async()=>{

    initThree();

    bindEvents();

    currentMode='BUILDER';

    switchMode(
      'PARTICLES'
    );

    setConnection(
      'CAM: INIT',
      'yellow'
    );

    try{

      await initHandTracking();

    }catch(e){

      console.error(
        'MediaPipe init error:',
        e
      );

      setConnection(
        'CAM: FAILED',
        'red'
      );
    }

    animate();
  }
);

</script>

</body>
