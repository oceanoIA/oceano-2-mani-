<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEURAL // HAND SYSTEM</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020204;color:#fff;font-family:Inter,Arial,sans-serif}
body{user-select:none}
canvas{display:block}

#app{position:fixed;inset:0;background:#020204}
#scene{position:absolute;inset:0}

.glass{
  background:rgba(18,18,22,.48);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 15px 50px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.07);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

#top{
  position:absolute;z-index:10;top:16px;left:16px;right:16px;height:58px;
  border-radius:20px;display:flex;align-items:center;padding:0 18px;gap:16px
}
.logo{font-weight:800;letter-spacing:4px;font-size:13px}
.sub{opacity:.4;font-size:10px;letter-spacing:2px}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:1px;opacity:.65}
.dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff}

#left{
  position:absolute;z-index:10;left:16px;top:90px;width:235px;
  border-radius:22px;padding:15px
}
.section{margin-bottom:16px}
.label{font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:.38;margin-bottom:8px}
select,input{
  width:100%;border:1px solid rgba(255,255,255,.1);outline:0;
  background:rgba(255,255,255,.055);color:#fff;border-radius:12px;
  padding:10px;font-size:11px
}
select option{background:#111;color:#fff}
.row{display:flex;gap:7px}
button{
  border:1px solid rgba(255,255,255,.1);color:#fff;
  background:rgba(255,255,255,.06);border-radius:11px;
  padding:9px 11px;cursor:pointer;font-size:10px;transition:.2s
}
button:hover{background:rgba(255,255,255,.13)}
button.active{background:#fff;color:#050505}
.full{width:100%}

#dock{
  position:absolute;z-index:10;bottom:16px;left:50%;transform:translateX(-50%);
  border-radius:20px;padding:7px;display:flex;gap:5px
}
.mode{min-width:115px;height:40px}
.mode small{display:block;font-size:8px;opacity:.5;margin-top:2px}
.mode.active small{opacity:.6}

#cameraBox{
  position:absolute;z-index:11;right:16px;top:90px;width:190px;height:142px;
  border-radius:18px;overflow:hidden;background:#08080a;
  border:1px solid rgba(255,255,255,.12)
}
#video{display:none}
#camCanvas{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.72}
.camLabel{position:absolute;left:9px;top:8px;font-size:8px;letter-spacing:2px;opacity:.6}

#hud{
  position:absolute;z-index:10;right:16px;bottom:78px;
  border-radius:15px;padding:10px 13px;font-size:9px;line-height:1.8;
  letter-spacing:1px;opacity:.65
}
#hud b{color:#fff;opacity:1}

#console{
  position:absolute;z-index:10;left:50%;bottom:16px;transform:translate(-50%,-70px);
  width:min(420px,calc(100% - 32px));display:none
}
#console form{display:flex;gap:6px}
#console input{height:40px}
#console button{width:65px}

#toast{
  position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:13px 20px;border-radius:15px;font-size:11px;opacity:0;
  pointer-events:none;transition:.25s
}
#toast.show{opacity:1}

#start{
  position:absolute;z-index:50;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,rgba(30,30,35,.5),#020204 65%)
}
.startCard{width:min(390px,calc(100% - 35px));padding:28px;border-radius:26px;text-align:center}
.startCard h1{font-size:27px;letter-spacing:6px;margin:0 0 8px}
.startCard p{font-size:11px;line-height:1.7;opacity:.45;margin:0 0 22px}
#startBtn{width:100%;height:45px;background:#fff;color:#000;font-weight:700}

@media(max-width:700px){
  #left{width:190px;top:82px;left:10px}
  #cameraBox{width:145px;height:110px;right:10px;top:82px}
  #top{top:10px;left:10px;right:10px}
  #dock{bottom:10px}
  .mode{min-width:90px}
}
</style>
</head>

<body>
<div id="app">
  <div id="scene"></div>

  <header id="top" class="glass">
    <div class="logo">NEURAL</div>
    <div class="sub">HAND INTERFACE // 01</div>
    <div class="status"><span class="dot"></span><span id="systemStatus">SYSTEM READY</span></div>
  </header>

  <aside id="left" class="glass">
    <div class="section">
      <div class="label">Mode</div>
      <div class="row">
        <button id="builderMode" class="mode active" onclick="setMode('builder')">
          BUILDER<small>3D OBJECTS</small>
        </button>
        <button id="particleMode" class="mode" onclick="setMode('particles')">
          HOLOGRAM<small>PARTICLES</small>
        </button>
      </div>
    </div>

    <div class="section" id="builderControls">
      <div class="label">3D Form</div>
      <select id="builderSelect"></select>
      <button class="full" style="margin-top:7px" onclick="spawnBuilder()">＋ CREATE OBJECT</button>
      <button class="full" style="margin-top:6px" onclick="clearBuilder()">CLEAR SCENE</button>
    </div>

    <div class="section" id="particleControls" style="display:none">
      <div class="label">Hologram Form</div>
      <select id="holoSelect"></select>
      <button class="full" style="margin-top:7px" onclick="changeHolo()">LOAD FORM</button>
      <div style="height:8px"></div>
      <div class="label">Particles</div>
      <input id="particleRange" type="range" min="1500" max="7500" value="5200">
    </div>

    <div class="section">
      <div class="label">Hand sensitivity</div>
      <input id="sensitivity" type="range" min=".7" max="2.5" step=".1" value="1.6">
    </div>

    <div class="section">
      <div class="label">Clock</div>
      <div id="clock" style="font-size:20px;font-weight:700;letter-spacing:4px">00:00:00</div>
      <div id="date" style="font-size:8px;opacity:.35;margin-top:3px">SYSTEM TIME</div>
    </div>

    <button class="full" onclick="toggleConsole()">COMMAND / SEND</button>
  </aside>

  <div id="cameraBox">
    <video id="video" autoplay playsinline></video>
    <canvas id="camCanvas"></canvas>
    <div class="camLabel">HAND SENSOR</div>
  </div>

  <div id="hud" class="glass">
    FPS <b id="fps">0</b><br>
    HANDS <b id="hands">0</b><br>
    OBJECTS <b id="objects">0</b><br>
    PARTICLES <b id="pcount">5200</b>
  </div>

  <div id="console">
    <form id="commandForm">
      <input id="commandInput" autocomplete="off" placeholder="Scrivi un comando...">
      <button type="submit">INVIA</button>
    </form>
  </div>

  <div id="toast" class="glass"></div>

  <div id="start">
    <div class="startCard glass">
      <h1>NEURAL</h1>
      <p>
        Interfaccia 3D controllata dalla mano.<br>
        Builder, forme olografiche, neuroni e tracking in tempo reale.
      </p>
      <button id="startBtn">INITIALIZE SYSTEM</button>
    </div>
  </div>
</div>

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
/* =========================================================
   NEURAL // CORE
   ========================================================= */

const $ = id => document.getElementById(id);

let mode = 'builder';
let sensitivity = 1.6;
let handCount = 0;
let lastFrame = performance.now();
let frameCounter = 0;
let fpsValue = 0;
let clockStart = Date.now();

/* =========================================================
   THREE
   ========================================================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020204);

const camera3D = new THREE.PerspectiveCamera(
  55, innerWidth / innerHeight, .1, 1000
);
camera3D.position.set(0,7,25);

const renderer = new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:'high-performance'
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.outputEncoding = THREE.sRGBEncoding;
$('scene').appendChild(renderer.domElement);

const world = new THREE.Group();
scene.add(world);

const ambient = new THREE.AmbientLight(0xffffff,.65);
scene.add(ambient);

const light = new THREE.DirectionalLight(0xffffff,1.2);
light.position.set(8,15,10);
scene.add(light);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshStandardMaterial({
    color:0x08080a,
    roughness:.85,
    metalness:.1
  })
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-4;
world.add(floor);

const grid = new THREE.GridHelper(80,40,0x202025,0x101014);
grid.position.y=-3.98;
world.add(grid);

/* =========================================================
   BUILDER
   ========================================================= */

const BUILDERS = [
 ['CUBE','box',[3,3,3]],
 ['SMALL CUBE','box',[2,2,2]],
 ['RECTANGLE','box',[5,2.5,2.5]],
 ['PLATFORM','box',[7,1,4]],
 ['SPHERE','sphere',[2.4]],
 ['BIG SPHERE','sphere',[3.5]],
 ['ICO SPHERE','ico',[2.8]],
 ['CYLINDER','cylinder',[2.3,4]],
 ['TALL CYLINDER','cylinder',[1.6,6]],
 ['CONE','cone',[2.8,5]],
 ['TOWER','cone',[3.2,7]],
 ['TORUS','torus',[2.5,.65]],
 ['RING','torus',[3.5,.35]],
 ['PYRAMID','cone4',[3,5]],
 ['DIAMOND','diamond',[3.2,5]],
 ['CRYSTAL','crystal',[2.5,5]],
 ['CAPSULE','capsule',[1.6,5]],
 ['ARCH','arch',[5,4,1]],
 ['WALL','box',[6,5,1]],
 ['PILLAR','box',[2,7,2]],
 ['CROSS','cross',[5,1.5,1.5]],
 ['PLUS','plus',[4,2,2]],
 ['STAR','star3d',[3,1]],
 ['GEAR','gear',[3,1]],
 ['ROCKET','rocket',[]],
 ['SATELLITE','satellite',[]],
 ['ROBOT','robot',[]],
 ['HOUSE','house',[]],
 ['TREE','tree',[]],
 ['LAMP','lamp',[]],
 ['CHAIR','chair',[]],
 ['TABLE','table',[]],
 ['MUSHROOM','mushroom',[]],
 ['BELL','bell',[]],
 ['TROPHY','trophy',[]],
 ['MICROPHONE','microphone',[]],
 ['PLANET','planet',[]],
 ['SPACE STATION','station',[]],
 ['WIND TURBINE','turbine',[]],
 ['DNA','dna3d',[]],
 ['ATOM','atom3d',[]],
 ['NEURAL NODE','neural3d',[]],
 ['SPIRAL','spiral3d',[]],
 ['WAVE','wave3d',[]],
 ['MOBIUS','mobius3d',[]],
 ['HEART','heart3d',[]],
 ['FLOWER','flower3d',[]],
 ['BUTTERFLY','butterfly3d',[]],
 ['OWL','owl',[]]
];

const builderSelect=$('builderSelect');
BUILDERS.forEach((x,i)=>{
  const o=document.createElement('option');
  o.value=i;o.textContent=x[0];
  builderSelect.appendChild(o);
});

const objects=[];

function mat(){
  return new THREE.MeshStandardMaterial({
    color:0xd9d9df,
    metalness:.72,
    roughness:.25
  });
}

function mesh(g,x=0,y=0,z=0,s=1){
  const m=new THREE.Mesh(g,mat());
  m.position.set(x,y,z);
  m.scale.setScalar(s);
  return m;
}

function primitive(type,p){
  const M=new THREE.Group();

  if(type==='box'){
    M.add(mesh(new THREE.BoxGeometry(p[0],p[1],p[2])));
  }
  else if(type==='sphere'){
    M.add(mesh(new THREE.SphereGeometry(p[0],18,12)));
  }
  else if(type==='ico'){
    M.add(mesh(new THREE.IcosahedronGeometry(p[0],2)));
  }
  else if(type==='cylinder'){
    M.add(mesh(new THREE.CylinderGeometry(p[0],p[0],p[1],20)));
  }
  else if(type==='cone'){
    M.add(mesh(new THREE.ConeGeometry(p[0],p[1],20)));
  }
  else if(type==='cone4'){
    M.add(mesh(new THREE.ConeGeometry(p[0],p[1],4)));
  }
  else if(type==='torus'){
    M.add(mesh(new THREE.TorusGeometry(p[0],p[1],12,28)));
  }
  else if(type==='diamond'){
    const a=mesh(new THREE.OctahedronGeometry(p[0]));
    a.scale.y=p[1]/(p[0]*2);
    M.add(a);
  }
  else if(type==='crystal'){
    const a=mesh(new THREE.CylinderGeometry(p[0],p[0]*.55,p[1],6));
    M.add(a);
  }
  else if(type==='capsule'){
    const a=mesh(new THREE.CapsuleGeometry(p[0],p[1]-p[0]*2,8,16));
    M.add(a);
  }
  else if(type==='arch'){
    M.add(mesh(new THREE.BoxGeometry(p[0],1,p[2]),0,p[1]/2,0));
    M.add(mesh(new THREE.BoxGeometry(1,p[1],p[2]),-p[0]/2,0,0));
    M.add(mesh(new THREE.BoxGeometry(1,p[1],p[2]),p[0]/2,0,0));
  }
  else if(type==='cross'){
    M.add(mesh(new THREE.BoxGeometry(p[0],p[1],p[2])));
    M.add(mesh(new THREE.BoxGeometry(p[1],p[0],p[2])));
  }
  else if(type==='plus'){
    M.add(mesh(new THREE.BoxGeometry(p[0],p[1],p[1])));
    M.add(mesh(new THREE.BoxGeometry(p[1],p[0],p[1])));
    M.add(mesh(new THREE.BoxGeometry(p[1],p[1],p[0])));
  }
  else if(type==='star3d'){
    const s=new THREE.Shape();
    for(let i=0;i<10;i++){
      const r=i%2?1.25:2.8,a=i*Math.PI/5-Math.PI/2;
      const x=Math.cos(a)*r,y=Math.sin(a)*r;
      i?s.lineTo(x,y):s.moveTo(x,y);
    }
    s.closePath();
    M.add(mesh(new THREE.ExtrudeGeometry(s,{depth:1,bevelEnabled:true,bevelSize:.15,bevelThickness:.15})));
  }
  else if(type==='gear'){
    M.add(mesh(new THREE.TorusGeometry(p[0],.55,10,20)));
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      M.add(mesh(new THREE.BoxGeometry(1,.7,.8),
        Math.cos(a)*p[0],Math.sin(a)*p[0],0));
    }
  }
  else if(type==='rocket'){
    M.add(mesh(new THREE.CylinderGeometry(1.25,1.25,5,16),0,0,0));
    M.add(mesh(new THREE.ConeGeometry(1.25,2.8,16),0,3.9,0));
    M.add(mesh(new THREE.CylinderGeometry(.55,.8,1.5,12),0,-3.2,0));
    M.add(mesh(new THREE.BoxGeometry(2.7,1.8,.35),0,-1.3,0));
  }
  else if(type==='satellite'){
    M.add(mesh(new THREE.CylinderGeometry(.8,.8,3,12),0,0,0));
    M.add(mesh(new THREE.BoxGeometry(6,2.2,.25),0,.5,0));
    M.add(mesh(new THREE.CylinderGeometry(.7,.7,1.5,12),0,1.8,0));
  }
  else if(type==='robot'){
    M.add(mesh(new THREE.BoxGeometry(3,3,2.4),0,1.5,0));
    M.add(mesh(new THREE.BoxGeometry(2.5,2.5,2),0,-1.5,0));
    M.add(mesh(new THREE.CylinderGeometry(.25,.25,1.5,10),-1.5,2.8,0));
    M.add(mesh(new THREE.CylinderGeometry(.25,.25,1.5,10),1.5,2.8,0));
  }
  else if(type==='house'){
    M.add(mesh(new THREE.BoxGeometry(5,4,5),0,-.7,0));
    const roof=mesh(new THREE.ConeGeometry(4.2,3,4),0,2.8,0);
    roof.rotation.y=Math.PI/4;M.add(roof);
  }
  else if(type==='tree'){
    M.add(mesh(new THREE.CylinderGeometry(.8,.9,5,10),0,-.5,0));
    M.add(mesh(new THREE.ConeGeometry(3,4,12),0,2.5,0));
    M.add(mesh(new THREE.ConeGeometry(2.3,3.5,12),0,5,0));
  }
  else if(type==='lamp'){
    M.add(mesh(new THREE.CylinderGeometry(.25,.3,6,10),0,0,0));
    M.add(mesh(new THREE.SphereGeometry(1.1,14,10),0,3,0));
  }
  else if(type==='chair'){
    M.add(mesh(new THREE.BoxGeometry(3,.5,3),0,1.8,0));
    M.add(mesh(new THREE.BoxGeometry(3,3,.5),0,3.2,-1.25));
    [-1.1,1.1].forEach(x=>[-1.1,1.1].forEach(z=>
      M.add(mesh(new THREE.BoxGeometry(.45,3,.45),x,0,z))
    ));
  }
  else if(type==='table'){
    M.add(mesh(new THREE.BoxGeometry(6,.5,4),0,2,0));
    [-2.3,2.3].forEach(x=>[-1.3,1.3].forEach(z=>
      M.add(mesh(new THREE.BoxGeometry(.5,2,.5),x,.8,z))
    ));
  }
  else if(type==='mushroom'){
    M.add(mesh(new THREE.CylinderGeometry(.7,.9,3,12),0,-.3,0));
    M.add(mesh(new THREE.SphereGeometry(2.5,18,10),0,1.7,0,.9));
  }
  else if(type==='bell'){
    M.add(mesh(new THREE.ConeGeometry(2.2,3,20),0,0,0));
    M.add(mesh(new THREE.SphereGeometry(.5,12,8),0,-1.8,0));
  }
  else if(type==='trophy'){
    M.add(mesh(new THREE.CylinderGeometry(.5,.7,3,12),0,-1,0));
    M.add(mesh(new THREE.SphereGeometry(1.7,18,12),0,1,0));
    M.add(mesh(new THREE.BoxGeometry(3,.5,1),0,-2.5,0));
  }
  else if(type==='microphone'){
    M.add(mesh(new THREE.SphereGeometry(1.4,16,12),0,2,0));
    M.add(mesh(new THREE.CylinderGeometry(.7,.7,4,16),0,-.2,0));
    M.add(mesh(new THREE.CylinderGeometry(.35,.35,2,10),0,-3,0));
  }
  else if(type==='planet'){
    M.add(mesh(new THREE.SphereGeometry(2.8,20,14)));
    const r=mesh(new THREE.TorusGeometry(4,.22,8,40));
    r.rotation.x=.45;M.add(r);
  }
  else if(type==='station'){
    M.add(mesh(new THREE.CylinderGeometry(1.2,1.2,6,16)));
    const r=mesh(new THREE.TorusGeometry(3,.45,10,28));
    r.rotation.x=Math.PI/2;M.add(r);
    M.add(mesh(new THREE.BoxGeometry(8,.4,1),0,0,0));
  }
  else if(type==='turbine'){
    M.add(mesh(new THREE.CylinderGeometry(.4,.5,5,12)));
    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5;
      const b=mesh(new THREE.BoxGeometry(4,.3,.6));
      b.position.set(Math.cos(a)*1.5,2.1,Math.sin(a)*1.5);
      b.rotation.y=-a;M.add(b);
    }
  }
  else if(type==='dna3d'){
    for(let i=0;i<25;i++){
      const t=i/24*Math.PI*4;
      const y=t*1.3-2.6;
      M.add(mesh(new THREE.SphereGeometry(.22,8,6),
        Math.cos(t)*1.6,y,Math.sin(t)*1.6));
      M.add(mesh(new THREE.SphereGeometry(.22,8,6),
        -Math.cos(t)*1.6,y,-Math.sin(t)*1.6));
    }
  }
  else if(type==='atom3d'){
    M.add(mesh(new THREE.SphereGeometry(1.1,16,10)));
    for(let i=0;i<3;i++){
      const r=mesh(new THREE.TorusGeometry(3,.12,8,32));
      r.rotation.set(i*.8,i*.7,i*.5);M.add(r);
    }
  }
  else if(type==='neural3d'){
    for(let i=0;i<14;i++){
      const a=i/14*Math.PI*2;
      M.add(mesh(new THREE.SphereGeometry(.45,10,8),
        Math.cos(a)*3,Math.sin(a*2)*1.5,Math.sin(a)*3));
    }
    M.add(mesh(new THREE.IcosahedronGeometry(1.4,1)));
  }
  else if(type==='spiral3d'){
    for(let i=0;i<45;i++){
      const t=i/44*Math.PI*5;
      const r=.3+i/44*3;
      M.add(mesh(new THREE.SphereGeometry(.18,7,5),
        Math.cos(t)*r,t/2.2-3,Math.sin(t)*r));
    }
  }
  else if(type==='wave3d'){
    for(let x=-4;x<=4;x+=.5)
      for(let z=-2;z<=2;z+=.5)
        M.add(mesh(new THREE.SphereGeometry(.12,6,5),x,Math.sin(x*1.2+z)*1.5,z));
  }
  else if(type==='mobius3d'){
    for(let i=0;i<70;i++){
      const t=i/70*Math.PI*2,u=(i%7)/7-.5;
      const r=3+u;
      M.add(mesh(new THREE.SphereGeometry(.16,7,5),
        Math.cos(t)*r,
        Math.sin(t)*r,
        u*2*Math.sin(t/2)));
    }
  }
  else if(type==='heart3d'){
    for(let i=0;i<90;i++){
      const t=i/90*Math.PI*2;
      const x=3.5*Math.sin(t)**3;
      const y=2.8*Math.cos(t)-1.1*Math.cos(2*t)-.5*Math.cos(3*t)-.2*Math.cos(4*t);
      M.add(mesh(new THREE.SphereGeometry(.15,7,5),x/1.5,y/1.5,0));
    }
  }
  else if(type==='flower3d'){
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      M.add(mesh(new THREE.SphereGeometry(1.3,12,8),
        Math.cos(a)*2.3,Math.sin(a)*2.3,0));
    }
    M.add(mesh(new THREE.SphereGeometry(1.4,16,10)));
  }
  else if(type==='butterfly3d'){
    for(let i=0;i<2;i++){
      const x=i?2.2:-2.2;
      const wing=mesh(new THREE.SphereGeometry(2.5,14,10));
      wing.scale.set(1,.15,.7);wing.position.x=x;M.add(wing);
    }
    M.add(mesh(new THREE.CylinderGeometry(.35,.35,5,10),0,0,0));
  }
  else if(type==='owl'){
    M.add(mesh(new THREE.SphereGeometry(2.7,18,12),0,0,0));
    [-1,1].forEach(x=>{
      M.add(mesh(new THREE.SphereGeometry(.9,12,8),x*.95,.65,2.2));
    });
  }

  return M;
}

function spawnBuilder(){
  const d=BUILDERS[+builderSelect.value];
  const o=primitive(d[1],d[2]);
  o.position.set((Math.random()-.5)*10,6,(Math.random()-.5)*5);
  o.rotation.y=Math.random()*Math.PI*2;
  o.userData={
    vx:0,vy:0,vz:0,
    size:new THREE.Vector3()
  };

  const box=new THREE.Box3().setFromObject(o);
  box.getSize(o.userData.size);

  world.add(o);
  objects.push(o);
  $('objects').textContent=objects.length;
}

function clearBuilder(){
  objects.forEach(o=>world.remove(o));
  objects.length=0;
  $('objects').textContent='0';
}

function physics(){
  for(let i=0;i<objects.length;i++){
    const a=objects[i];
    if(a.userData.grabbed)continue;

    a.userData.vy-=.012;
    a.position.y+=a.userData.vy;

    const s=a.userData.size;
    const bottom=a.position.y-s.y/2;

    if(bottom<-3.98){
      a.position.y=-3.98+s.y/2;
      a.userData.vy=0;
    }

    for(let j=0;j<objects.length;j++){
      if(i===j)continue;
      const b=objects[j];
      if(b.userData.grabbed)continue;

      const sa=a.userData.size,sb=b.userData.size;
      const ax1=a.position.x-sa.x/2,ax2=a.position.x+sa.x/2;
      const az1=a.position.z-sa.z/2,az2=a.position.z+sa.z/2;
      const bx1=b.position.x-sb.x/2,bx2=b.position.x+sb.x/2;
      const bz1=b.position.z-sb.z/2,bz2=b.position.z+sb.z/2;

      if(ax2>bx1&&ax1<bx2&&az2>bz1&&az1<bz2){
        const top=b.position.y+sb.y/2;
        if(bottom<top && bottom>top-1.2){
          a.position.y=top+sa.y/2;
          a.userData.vy=0;
        }
      }
    }
  }
}

function rnd(a,b){return a+Math.random()*(b-a)}

function setP(i,x,y,z,s=1){
  targets[i*3]=x;
  targets[i*3+1]=y;
  targets[i*3+2]=z;
  sizes[i]=s;
}

function sphere(i,n,r){
  const u=Math.random()*2-1;
  const a=Math.random()*Math.PI*2;
  const q=Math.sqrt(1-u*u);
  setP(i,q*Math.cos(a)*r,q*Math.sin(a)*r,u*r,rnd(.5,1.2));
}

function ring(i,n,r,w=.2){
  const a=Math.random()*Math.PI*2;
  const rr=r+rnd(-w,w);
  setP(i,Math.cos(a)*rr,rnd(-w,w)*2,Math.sin(a)*rr,rnd(.5,1.2));
}

function line(i,x1,y1,z1,x2,y2,z2){
  const t=Math.random();
  setP(i,
    x1+(x2-x1)*t+rnd(-.08,.08),
    y1+(y2-y1)*t+rnd(-.08,.08),
    z1+(z2-z1)*t+rnd(-.08,.08),
    rnd(.5,1.1)
  );
}

function makeHolo(type){
  const n=activeParticles;

  for(let i=0;i<n;i++){
    let x=0,y=0,z=0,s=1;

    if(type==='planet'||type==='earth'||type==='mars'||type==='moon'){
      sphere(i,n,5.5);
      continue;
    }

    if(type==='saturn'){
      if(i<n*.65)sphere(i,n,4.3);
      else ring(i,n,7.2,.7);
      continue;
    }

    if(type==='star'||type==='star5'){
      const points=type==='star'?16:5;
      const a=Math.random()*Math.PI*2;
      const r=(type==='star'?rnd(2.5,6):rnd(2.5,6))*
        (Math.random()<.35?1:rnd(.6,1));
      setP(i,Math.cos(a)*r,Math.sin(a)*r*.75,rnd(-1,1));
      continue;
    }

    if(type==='blackhole'){
      ring(i,n,rnd(3,7),.45);
      if(i<n*.18)sphere(i,n,rnd(.5,1.5));
      continue;
    }

    if(type==='galaxy'){
      const arm=i%4;
      const r=Math.pow(Math.random(),.55)*8;
      const a=r*1.4+arm*Math.PI/2+rnd(-.35,.35);
      setP(i,Math.cos(a)*r,rnd(-1,1)*(1-r/9),Math.sin(a)*r,rnd(.5,1.2));
      continue;
    }

    if(type==='nebula'){
      const a=Math.random()*Math.PI*2;
      const r=Math.sqrt(Math.random())*8;
      setP(i,Math.cos(a)*r,rnd(-2.5,2.5),Math.sin(a)*r,rnd(.4,1.3));
      continue;
    }

    if(type==='dna'||type==='dna2'){
      const t=Math.random()*Math.PI*16;
      const y=t/2.2-7;
      const r=3;
      if(Math.random()<.5)
        setP(i,Math.cos(t)*r,y,Math.sin(t)*r);
      else
        setP(i,-Math.cos(t)*r,y,-Math.sin(t)*r);
      continue;
    }

    if(type==='atom'){
      if(i<n*.2)sphere(i,n,1.2);
      else{
        const a=Math.random()*Math.PI*2;
        const plane=Math.floor(Math.random()*3);
        const r=6;
        if(plane===0)setP(i,Math.cos(a)*r,Math.sin(a)*r,0);
        if(plane===1)setP(i,Math.cos(a)*r,0,Math.sin(a)*r);
        if(plane===2)setP(i,0,Math.cos(a)*r,Math.sin(a)*r);
      }
      continue;
    }

    if(type==='heart'){
      const t=Math.random()*Math.PI*2;
      const scale=Math.sqrt(Math.random())*.9;
      x=16*Math.sin(t)**3;
      y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      z=rnd(-2,2);
      setP(i,x*.35*scale,y*.35*scale,z,s);
      continue;
    }

    if(type==='brain'){
      const a=Math.random()*Math.PI*2;
      const r=5*Math.sqrt(Math.random());
      x=Math.cos(a)*r;
      z=Math.sin(a)*r*.65;
      y=rnd(-3,3)+Math.sin(a*6)*.5;
      if(Math.random()<.55)y+=Math.sin(x*1.7)*.6;
      setP(i,x,y,z);
      continue;
    }

    if(type==='eye'){
      const a=Math.random()*Math.PI*2;
      const r=6*Math.sqrt(Math.random());
      x=Math.cos(a)*r;
      y=Math.sin(a)*r*.5;
      z=3.2-Math.sqrt(Math.max(0,36-x*x-y*y))*.35;
      setP(i,x,y,z);
      continue;
    }

    if(type==='flower'||type==='flower5'){
      const petals=type==='flower'?8:5;
      const a=Math.random()*Math.PI*2;
      const r=Math.abs(Math.sin(a*petals/2))*6;
      setP(i,Math.cos(a)*r,rnd(-.7,.7),Math.sin(a)*r);
      continue;
    }

    if(type==='butterfly'){
      const t=Math.random()*Math.PI*2;
      const wing=Math.random()<.5?-1:1;
      x=wing*(Math.sin(t)*4);
      y=Math.cos(t)*3;
      z=rnd(-.7,.7);
      setP(i,x,y,z);
      continue;
    }

    if(type==='animal'||type==='animal2'){
      /* silhouette stilizzata: testa + corpo + orecchie/ali */
      if(i<n*.35){
        sphere(i,n,2.8);
        targets[i*3]*=1.35;
        targets[i*3+1]*=.75;
      }else if(i<n*.75){
        x=rnd(-4,4);y=rnd(-1.8,1.8);z=rnd(-1.3,1.3);
        setP(i,x,y,z);
      }else{
        const side=Math.random()<.5?-1:1;
        setP(i,side*rnd(2.5,5),rnd(1.5,4),rnd(-1,1));
      }
      continue;
    }

    if(type==='whale'){
      x=rnd(-6,6);
      const w=Math.sqrt(Math.max(0,1-(x*x/36)));
      y=rnd(-1,1)*w*2;
      z=rnd(-1,1)*w*2;
      if(Math.random()<.15)x=6+rnd(0,2);
      setP(i,x,y,z);
      continue;
    }

    if(type==='fish'){
      const a=Math.random()*Math.PI*2;
      x=Math.cos(a)*5;
      y=Math.sin(a)*2.2;
      z=rnd(-1,1);
      setP(i,x,y,z);
      continue;
    }

    if(type==='robot'){
      if(i<n*.45){
        x=rnd(-2.5,2.5);y=rnd(-3,1);z=rnd(-1.5,1.5);
      }else if(i<n*.75){
        x=rnd(-2,2);y=rnd(1,4);z=rnd(-1.5,1.5);
      }else{
        x=rnd(-4,4);y=rnd(-4,4);z=rnd(-.5,.5);
      }
      setP(i,x,y,z);
      continue;
    }

    if(type==='rocket'){
      const r=rnd(.2,2);
      const a=Math.random()*Math.PI*2;
      y=rnd(-3,4);
      x=Math.cos(a)*r*(y<2?1:.7);
      z=Math.sin(a)*r*(y<2?1:.7);
      if(y>3) {x*=1-y/8;z*=1-y/8}
      setP(i,x,y,z);
      continue;
    }

    if(type==='station'){
      if(i<n*.5)ring(i,n,6,.35);
      else{
        x=rnd(-7,7);y=rnd(-.5,.5);z=rnd(-.4,.4);
        setP(i,x,y,z);
      }
      continue;
    }

    if(type==='cube4'){
      const a=Math.random()<.5?-1:1;
      x=a*rnd(4,6);y=a*rnd(4,6);z=a*rnd(4,6);
      if(Math.random()<.55){
        const edge=Math.floor(Math.random()*12);
        x=edge<4?(edge%2?6:-6):rnd(-6,6);
        y=edge<4?rnd(-6,6):(edge<8?(edge%2?6:-6):rnd(-6,6));
        z=edge<8?rnd(-6,6):(edge%2?6:-6);
      }
      setP(i,x,y,z);
      continue;
    }

    if(type==='crystal'||type==='diamond'){
      const a=Math.random()*Math.PI*2;
      const r=rnd(.3,5)*(1-Math.abs(Math.random()-.5)*.3);
      setP(i,Math.cos(a)*r,rnd(-6,6),Math.sin(a)*r);
      continue;
    }

    if(type==='pyramid'){
      const y=rnd(-4,4);
      const r=(4-y*.45);
      const a=Math.random()*Math.PI*2;
      setP(i,Math.cos(a)*Math.max(.2,r),y,Math.sin(a)*Math.max(.2,r));
      continue;
    }

    if(type==='torus'||type==='ring'){
      const a=Math.random()*Math.PI*2;
      const b=Math.random()*Math.PI*2;
      const R=5,r=1;
      setP(i,(R+r*Math.cos(b))*Math.cos(a),
        r*Math.sin(b),
        (R+r*Math.cos(b))*Math.sin(a));
      continue;
    }

    if(type==='mobius'){
      const a=Math.random()*Math.PI*2;
      const u=rnd(-1,1);
      const r=5+u;
      setP(i,r*Math.cos(a),u*Math.sin(a/2)*1.8,r*Math.sin(a));
      continue;
    }

    if(type==='wave'){
      x=rnd(-8,8);z=rnd(-4,4);
      y=Math.sin(x*1.2+z)*2;
      setP(i,x,y,z);
      continue;
    }

    if(type==='lightning'){
      x=0;y=7;
      for(let k=0;k<Math.floor(Math.random()*7);k++){
        x+=rnd(-1.8,1.8);y-=2;
      }
      setP(i,x+rnd(-.2,.2),y,z=rnd(-.4,.4));
      continue;
    }

    if(type==='burst'||type==='burst2'){
      const a=Math.random()*Math.PI*2;
      const b=Math.acos(rnd(-1,1));
      const r=Math.pow(Math.random(),.45)*8;
      setP(i,
        Math.sin(b)*Math.cos(a)*r,
        Math.cos(b)*r,
        Math.sin(b)*Math.sin(a)*r
      );
      continue;
    }

    if(type==='neurons'){
      if(Math.random()<.2){
        sphere(i,n,rnd(1,2));
      }else{
        const a=Math.random()*Math.PI*2;
        const r=rnd(2,8);
        setP(i,Math.cos(a)*r,rnd(-4,4),Math.sin(a)*r);
      }
      continue;
    }

    if(type==='vortex'||type==='tornado'){
      const y=rnd(-7,7);
      const r=(type==='tornado'?Math.abs(y)+.5:8-Math.abs(y))*.45;
      const a=y*2.3+rnd(-.4,.4);
      setP(i,Math.cos(a)*r,y,Math.sin(a)*r);
      continue;
    }

    if(type==='shell'||type==='shell2'){
      const t=Math.random()*Math.PI*8;
      const r=.25+t*.12;
      setP(i,Math.cos(t)*r,
        Math.sin(t)*r,
        t*.18-7);
      continue;
    }

    if(type==='spheregrid'){
      const lat=Math.floor(Math.random()*20);
      const lon=Math.floor(Math.random()*30);
      const a=lon/30*Math.PI*2;
      const b=lat/19*Math.PI-Math.PI/2;
      setP(i,Math.cos(b)*Math.cos(a)*6,
        Math.sin(b)*6,
        Math.cos(b)*Math.sin(a)*6);
      continue;
    }

    if(type==='clockshape'){
      const a=Math.random()*Math.PI*2;
      const r=Math.random()<.7?6:3;
      setP(i,Math.cos(a)*r,Math.sin(a)*r,0);
      continue;
    }

    if(type==='quasar'){
      ring(i,n,rnd(2,8),.25);
      if(i<n*.15)sphere(i,n,1);
      continue;
    }

    if(type==='orbit'){
      const a=Math.random()*Math.PI*2;
      const r=7;
      setP(i,Math.cos(a)*r,rnd(-2,2),Math.sin(a)*r);
      continue;
    }

    if(type==='dimension'){
      const t=Math.random()*Math.PI*2;
      const r=3+Math.sin(t*4)*2;
      setP(i,Math.cos(t)*r,Math.sin(t*2)*3,Math.sin(t)*r);
      continue;
    }

    sphere(i,n,5);
  }

  for(let i=0;i<MAX;i++){
    if(i>=n){
      positions[i*3]=positions[i*3+1]=positions[i*3+2]=999;
      continue;
    }

    if(!Number.isFinite(targets[i*3]))targets[i*3]=0;
    if(!Number.isFinite(targets[i*3+1]))targets[i*3+1]=0;
    if(!Number.isFinite(targets[i*3+2]))targets[i*3+2]=0;

    const shade=.65+Math.random()*.35;
    colors[i*3]=shade;
    colors[i*3+1]=shade;
    colors[i*3+2]=shade;
    sizes[i]=sizes[i]||1;
  }

  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
}

function updateParticles(){
  if(!particles.visible)return;

  const p=pGeo.attributes.position.array;

  for(let i=0;i<activeParticles;i++){
    const k=i*3;
    p[k]+=(targets[k]-p[k])*.075;
    p[k+1]+=(targets[k+1]-p[k+1])*.075;
    p[k+2]+=(targets[k+2]-p[k+2])*.075;
  }

  pGeo.attributes.position.needsUpdate=true;

  particles.rotation.y+=.0018;
  particles.rotation.x=Math.sin(holoTime*.3)*.04;
}

const video=$('video');
const camCanvas=$('camCanvas');
const camCtx=camCanvas.getContext('2d',{alpha:false});

let hands;
let mpCamera;
let lastHand={x:.5,y:.5};
let grabTarget=null;
let pinch=false;

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function processHands(results){
  const lm=results.multiHandLandmarks||[];
  handCount=lm.length;
  $('hands').textContent=handCount;

  if(!lm.length)return;

  const h=lm[0];
  const thumb=h[4];
  const index=h[8];

  const d=distance(thumb,index);
  const isPinch=d<.065;

  const x=(1-index.x)*2-1;
  const y=-(index.y*2-1);

  lastHand.x += (x-lastHand.x)*.35*sensitivity*.55;
  lastHand.y += (y-lastHand.y)*.35*sensitivity*.55;

  if(mode==='builder'){
    if(isPinch && !pinch){
      grabTarget=findNearestObject();
      if(grabTarget)grabTarget.userData.grabbed=true;
    }

    if(!isPinch && pinch && grabTarget){
      grabTarget.userData.grabbed=false;
      grabTarget.userData.vy=.04;
      grabTarget=null;
    }

    if(grabTarget){
      grabTarget.position.x=lastHand.x*7;
      grabTarget.position.y=lastHand.y*5+3;
      grabTarget.position.z=0;
      grabTarget.userData.vy=0;
    }
  }

  pinch=isPinch;
}

function findNearestObject(){
  let best=null;
  let dist=Infinity;

  objects.forEach(o=>{
    const d=Math.hypot(
      o.position.x-lastHand.x*7,
      o.position.y-(lastHand.y*5+3),
      o.position.z
    );
    if(d<dist){dist=d;best=o}
  });

  return dist<6?best:null;
}

function drawCamera(results){
  if(!video.videoWidth)return;

  camCanvas.width=video.videoWidth;
  camCanvas.height=video.videoHeight;

  camCtx.drawImage(video,0,0,camCanvas.width,camCanvas.height);

  if(results.multiHandLandmarks){
    results.multiHandLandmarks.forEach(hand=>{
      camCtx.fillStyle='#fff';
      hand.forEach(p=>{
        camCtx.beginPath();
        camCtx.arc(p.x*camCanvas.width,p.y*camCanvas.height,2.5,0,Math.PI*2);
        camCtx.fill();
      });
    });
  }
}

  hands=new Hands({
    locateFile:file=>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands:2,
    modelComplexity:0,
    minDetectionConfidence:.45,
    minTrackingConfidence:.45
  });

  hands.onResults(results=>{
    processHands(results);
    drawCamera(results);
  });

  mpCamera=new Camera(video,{
    onFrame:async()=>{
      await hands.send({image:video});
    },
    width:640,
    height:480
  });

  mpCamera.start();
}

/* =========================================================
   CLOCK
   ========================================================= */

function updateClock(){
  const d=new Date();

  const hh=String(d.getHours()).padStart(2,'0');
  const mm=String(d.getMinutes()).padStart(2,'0');
  const ss=String(d.getSeconds()).padStart(2,'0');

  $('clock').textContent=`${hh}:${mm}:${ss}`;

  $('date').textContent=d.toLocaleDateString('it-IT',{
    weekday:'short',
    day:'2-digit',
    month:'short',
    year:'numeric'
  }).toUpperCase();
}

setInterval(updateClock,250);
updateClock();

/* =========================================================
   COMMAND / SEND
   ========================================================= */

function toggleConsole(){
  const c=$('console');
  c.style.display=c.style.display==='block'?'none':'block';
  if(c.style.display==='block')$('commandInput').focus();
}

$('commandForm').addEventListener('submit',e=>{
  e.preventDefault();

  const input=$('commandInput');
  const cmd=input.value.trim().toLowerCase();

  if(!cmd)return;

  if(cmd==='builder'){
    setMode('builder');
    toast('MODE // BUILDER');
  }
  else if(cmd==='hologram'||cmd==='particles'){
    setMode('particles');
    toast('MODE // HOLOGRAM');
  }
  else if(cmd==='clear'){
    clearBuilder();
    toast('SCENE CLEARED');
  }
  else if(cmd==='send'||cmd==='test'){
    toast('COMMAND RECEIVED');
  }
  else if(cmd==='neuroni'||cmd==='neurons'){
    setMode('particles');
    const i=HOLOS.findIndex(x=>x[1]==='neurons');
    holoSelect.value=i;
    changeHolo();
  }
  else if(cmd==='clock'||cmd==='orologio'){
    toast($('clock').textContent);
  }
  else{
    toast('COMMAND: '+cmd.toUpperCase());
  }

  input.value='';
});

/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function toast(text){
  const t=$('toast');
  t.textContent=text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1400);
}

/* =========================================================
   START
   ========================================================= */

$('startBtn').onclick=async()=>{
  $('start').style.display='none';
  $('systemStatus').textContent='INITIALIZING...';

  try{
    await initHands();
    $('systemStatus').textContent='ONLINE';
    toast('HAND SENSOR ONLINE');
  }catch(err){
    console.error(err);
    $('systemStatus').textContent='3D ONLINE / CAMERA OFF';
    toast('CAMERA NON DISPONIBILE');
  }

  makeHolo('neurons');
};

/* =========================================================
   RESIZE
   ========================================================= */

addEventListener('resize',()=>{
  camera3D.aspect=innerWidth/innerHeight;
  camera3D.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* =========================================================
   RENDER LOOP
   ========================================================= */

function animate(now){
  requestAnimationFrame(animate);

  const dt=now-lastFrame;
  lastFrame=now;
  frameCounter++;

  if(now-clockStart>1000){
    fpsValue=frameCounter;
    frameCounter=0;
    clockStart=now;
    $('fps').textContent=fpsValue;
  }

  holoTime+=.016;

  physics();
  updateParticles();

  if(mode==='builder'){
    world.rotation.y+=(lastHand.x*.08-world.rotation.y)*.025;
    world.position.y+=(lastHand.y*.25-world.position.y)*.025;
  }else{
    particles.rotation.y+=.002;
  }

  renderer.render(scene,camera3D);
}

animate(performance.now());

/* =========================================================
   INITIAL STATE
   ========================================================= */

makeHolo('neurons');
$('pcount').textContent=activeParticles;
$('objects').textContent='0';
</script>
</body>
</html>
