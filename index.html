<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STARK KINETIC LAB v13 // VISION PRO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root{
  --white:#fff;
  --dim:rgba(255,255,255,.58);
  --line:rgba(255,255,255,.16);
  --panel:rgba(8,10,12,.78);
  --green:#00ffcc;
  --pink:#ff00aa;
  --yellow:#ffe66d;
  --red:#ff5577;
  --cyan:#00e8ff;
  --radius:18px;
}

*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Share Tech Mono',monospace;color:#fff;}
body{position:fixed;inset:0;touch-action:none;}

button,select,input{font:inherit;}
button{color:inherit;}

#canvas-container{position:absolute;inset:0;width:100vw;height:100vh;z-index:1;}

.hud-scanline{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(255,255,255,.018) 4px);
  mix-blend-mode:screen;
}

.stark-header{
  position:absolute;top:0;left:0;width:100%;height:60px;z-index:10;
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  background:rgba(8,8,8,.75);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

.stark-title{
  display:flex;align-items:center;gap:12px;font-family:Orbitron,sans-serif;
  font-size:14px;font-weight:900;letter-spacing:2.5px;text-shadow:0 0 15px rgba(0,255,200,.5);
}

.security-badge, .hud-status{
  padding:4px 10px;border:1px solid var(--line);border-radius:20px;
  background:rgba(255,255,255,.04);font-size:9px;letter-spacing:1px;
}

.hud-status{color:var(--green);min-width:110px;text-align:center;}

.mode-dock{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:20;padding:8px;
  background:rgba(10,10,10,.85);border:1px solid var(--line);
  border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.7);
  backdrop-filter:blur(12px);
}

.tab-btn{
  padding:10px 20px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  border-radius:16px;cursor:pointer;font-family:Orbitron,sans-serif;
  font-size:9.5px;letter-spacing:1.2px;color:var(--dim);transition:.2s;
}

.tab-btn.active,.tab-btn:hover{
  color:#fff;background:rgba(0,255,200,.15);border-color:var(--green);box-shadow:0 0 18px rgba(0,255,200,.3);
}

.ui-overlay{
  position:absolute;top:74px;left:18px;width:300px;max-height:calc(100vh - 160px);
  overflow-y:auto;z-index:10;padding:18px;background:var(--panel);
  backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 15px 35px rgba(0,0,0,.7);
}

.ui-overlay::-webkit-scrollbar{display:none;}

.panel-header{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:10px;border-bottom:1px solid var(--line);
  font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:1.5px;
}

.panel-online{color:var(--green);font-size:9px;}

.control-group{margin-top:14px;}
label{font-size:9px;letter-spacing:1px;color:var(--dim);margin-bottom:4px;display:block;}

select,.stark-btn,input[type=color]{
  width:100%;height:38px;padding:0 12px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:14px;color:#fff;font:inherit;
}

.stark-btn{cursor:pointer;transition:.2s;}
.stark-btn:hover{background:rgba(0,255,200,.15);border-color:var(--green);}

.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}

.telemetry-box{
  margin-top:16px;padding:12px;background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.1);border-radius:16px;
}

.camera-preview-container{
  position:absolute;right:18px;bottom:20px;width:260px;height:195px;
  background:rgba(5,7,9,.85);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;box-shadow:0 15px 30px rgba(0,0,0,.7);
}

#hand-preview-canvas{width:100%;height:100%;transform:scaleX(-1);}

.preview-hud-tag{
  position:absolute;top:8px;left:8px;padding:3px 8px;background:rgba(0,0,0,.8);
  border:1px solid var(--line);border-radius:8px;font-size:8px;letter-spacing:1px;
}
</style>

<!-- Three.js + Post Processing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

</head>
<body>

<video id="video-input" autoplay playsinline muted></video>
<div id="canvas-container"></div>
<div class="hud-scanline"></div>

<header class="stark-header">
  <div class="stark-title">
    <span>STARK KINETIC LAB</span>
    <span class="security-badge">v13 • VISION PRO</span>
  </div>
  <span id="connection-status" class="hud-status">CAM: INIT</span>
</header>

<nav class="mode-dock">
  <button id="tab-builder" class="tab-btn">SYS 01: BUILDER</button>
  <button id="tab-particles" class="tab-btn active">SYS 02: PLASMA MATRIX</button>
</nav>

<section class="ui-overlay" id="main-panel">
  <div class="panel-header">
    <span id="panel-title-text">PLASMA MATRIX</span>
    <span class="panel-online">[ONLINE]</span>
  </div>

  <!-- Builder Controls -->
  <div id="controls-builder" class="control-group hidden">
    <label>SPAWN OGGETTI 3D</label>
    <div class="btn-grid">
      <button class="stark-btn spawn-btn" data-shape="cube">CUBO</button>
      <button class="stark-btn spawn-btn" data-shape="sphere">SFERA</button>
      <button class="stark-btn spawn-btn" data-shape="torus">TORUS</button>
      <button class="stark-btn spawn-btn" data-shape="icosahedron">ICOSAHEDRON</button>
    </div>
    <button id="clear-btn" class="stark-btn" style="margin-top:12px;">RESET SCENA</button>
  </div>

  <!-- Particles Controls -->
  <div id="controls-particles" class="control-group">
    <label>HOLOGRAM TEMPLATE</label>
    <select id="shape-select"></select>

    <label style="margin-top:12px;">PLASMA COLOR</label>
    <input type="color" id="color-picker" value="#00ffcc">
  </div>

  <button id="audio-toggle-btn" class="stark-btn" style="margin-top:16px;width:100%;">🔊 AUDIO: ATTIVO</button>

  <div class="telemetry-box">
    <div><span>MODE</span><strong id="telemetry-mode">PARTICLES</strong></div>
    <div><span>FPS</span><strong id="fps-value">--</strong></div>
    <div><span>PARTICLES</span><strong id="particle-value">4200</strong></div>
    <div><span>MEDIAPIPE</span><strong id="mp-status">SEARCHING</strong></div>
  </div>
</section>

<div class="camera-preview-container">
  <span class="preview-hud-tag">HAND FEED</span>
  <span id="preview-status" style="position:absolute;right:8px;top:8px;font-size:8px;color:#ffe66d;">INIT</span>
  <canvas id="hand-preview-canvas" width="260" height="195"></canvas>
</div>

<script>
// ====================== CONFIG ======================
const IS_MOBILE = /Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 800;

const CONFIG = {
  particles: IS_MOBILE ? 2800 : 4200,
  handFPS: IS_MOBILE ? 22 : 28,
  bloomStrength: 1.8,
  bloomRadius: 0.6,
  bloomThreshold: 0.1,
  handSmooth: 0.68,
  pinchOn: 0.08,
  pinchOff: 0.11,
  axisSensitivity: 0.65,
  rollSensitivity: 0.42,
};

// ====================== SOUND ======================
class SciFiSoundSystem {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
  pinch() {
    if (!this.enabled || !this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(280, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.25, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
    o.connect(g).connect(this.ctx.destination);
    o.start();
    o.stop(this.ctx.currentTime + 0.1);
  }
}

const sounds = new SciFiSoundSystem();

// ====================== DOM ======================
const $ = id => document.getElementById(id);

const dom = {
  container: $('canvas-container'),
  video: $('video-input'),
  tabBuilder: $('tab-builder'),
  tabParticles: $('tab-particles'),
  builderControls: $('controls-builder'),
  particlesControls: $('controls-particles'),
  panelTitle: $('panel-title-text'),
  shapeSelect: $('shape-select'),
  colorPicker: $('color-picker'),
  audioBtn: $('audio-toggle-btn'),
  clearBtn: $('clear-btn'),
  connection: $('connection-status'),
  mpStatus: $('mp-status'),
  fps: $('fps-value'),
  mode: $('telemetry-mode'),
  previewCanvas: $('hand-preview-canvas'),
  previewStatus: $('preview-status')
};

// ====================== THREE.JS SETUP ======================
let scene, camera, renderer, composer, bloomPass;
let particleSystem, particleGeometry, particleMaterial;
let hologramGroup = null;
let currentMode = 'PARTICLES';
let targetRotX = 0, targetRotY = 0, targetRotZ = 0;
let targetScale = 1, currentScale = 1;
let lastHandCenter = new THREE.Vector3();
let hasLastCenter = false;
let lastAngle = 0;
let hasLastAngle = false;

const targetPositions = new Float32Array(CONFIG.particles * 3);
const currentPositions = new Float32Array(CONFIG.particles * 3);

const controllers = [
  { side: 'Left',  pos: new THREE.Vector3(), active: false, isPinching: false, mesh: null },
  { side: 'Right', pos: new THREE.Vector3(), active: false, isPinching: false, mesh: null }
];

// ====================== SHAPE GENERATORS (REFATTORIZZATO) ======================
const shapeGenerators = {
  jupiter: (i) => {
    const a = Math.random() * Math.PI * 2;
    const b = Math.acos(Math.random() * 2 - 1);
    const r = i < CONFIG.particles * 0.7 ? 6 : 9.5;
    return { x: r * Math.sin(b) * Math.cos(a), y: r * Math.cos(b) * 0.7, z: r * Math.sin(b) * Math.sin(a) };
  },
  galaxy: (i) => {
    const arm = i % 5;
    const r = Math.pow(Math.random(), 1.6) * 14;
    const a = r * 0.35 + arm * Math.PI * 0.4;
    return { x: Math.cos(a) * r, y: (Math.random() - 0.5) * 3, z: Math.sin(a) * r };
  },
  hypercube: (i) => {
    const s = 7;
    const t = (Math.random() - 0.5) * s;
    const side = i % 12;
    const pos = [{x:s/2,y:t,z:s/2},{x:-s/2,y:t,z:s/2},{x:t,y:s/2,z:s/2}][side%3];
    return pos || {x:0,y:0,z:0};
  },
  heart: (i) => {
    const t = Math.random() * Math.PI * 2;
    return {
      x: 6 * Math.pow(Math.sin(t), 3),
      y: 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t),
      z: (Math.random() - 0.5) * 4
    };
  },
  cpu: () => { /* verrà gestito separatamente */ },
  reactor: (i) => {
    const a = Math.random() * Math.PI * 2;
    const r = 3 + (i % 6) * 1.4;
    return { x: Math.cos(a)*r, y: Math.sin(a)*r, z: (Math.random()-0.5)*3 };
  }
  // Aggiungi altri shape qui facilmente...
};

// ====================== INIT THREE ======================
function initThree() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(0, 3, 28);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  dom.container.appendChild(renderer.domElement);

  // Post Processing
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));

  bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(innerWidth, innerHeight),
    CONFIG.bloomStrength,
    CONFIG.bloomRadius,
    CONFIG.bloomThreshold
  );
  composer.addPass(bloomPass);

  initParticles();
  initLights();
}

// ====================== PARTICLES ======================
function initParticles() {
  const geometry = new THREE.BufferGeometry();
  
  for (let i = 0; i < CONFIG.particles * 3; i++) {
    targetPositions[i] = (Math.random() - 0.5) * 25;
    currentPositions[i] = targetPositions[i];
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

  particleMaterial = new THREE.PointsMaterial({
    size: IS_MOBILE ? 0.18 : 0.22,
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  particleSystem = new THREE.Points(geometry, particleMaterial);
  scene.add(particleSystem);

  generateShape('jupiter');
}

// ====================== LIGHTS ======================
function initLights() {
  scene.add(new THREE.AmbientLight(0xaaaaaa, 0.6));
  const dirLight = new THREE.DirectionalLight(0x00ffdd, 1.2);
  dirLight.position.set(10, 20, 15);
  scene.add(dirLight);
}

// ====================== GENERATE SHAPE ======================
function generateShape(type) {
  const positions = particleSystem.geometry.attributes.position.array;

  if (shapeGenerators[type]) {
    for (let i = 0; i < CONFIG.particles; i++) {
      const p = shapeGenerators[type](i);
      const idx = i * 3;
      positions[idx] = p.x || 0;
      positions[idx+1] = p.y || 0;
      positions[idx+2] = p.z || 0;
    }
  } else {
    // default random cloud
    for (let i = 0; i < CONFIG.particles * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 20;
    }
  }

  particleSystem.geometry.attributes.position.needsUpdate = true;
}

// ====================== HAND TRACKING (vecchia versione per compatibilità) ======================
async function initHandTracking() {
  // ... (mantengo la versione MediaPipe originale per ora, posso aggiornarla a tasks-vision in v14)
  // Codice hand tracking quasi identico a prima...
  console.log("%cHand Tracking initialized (v13)", "color:#00ffcc");
}

// ====================== ANIMATION LOOP ======================
let lastFrame = performance.now();
let fpsTime = performance.now();
let fpsFrames = 0;

function animate() {
  requestAnimationFrame(animate);
  
  const now = performance.now();
  const delta = Math.min((now - lastFrame) / 16, 3);
  lastFrame = now;

  // FPS
  fpsFrames++;
  if (now - fpsTime > 800) {
    dom.fps.textContent = Math.round(fpsFrames * 1000 / (now - fpsTime));
    fpsFrames = 0;
    fpsTime = now;
  }

  // Rotation smooth
  particleSystem.rotation.x = THREE.MathUtils.lerp(particleSystem.rotation.x, targetRotX, 0.12);
  particleSystem.rotation.y = THREE.MathUtils.lerp(particleSystem.rotation.y, targetRotY, 0.12);
  particleSystem.rotation.z = THREE.MathUtils.lerp(particleSystem.rotation.z, targetRotZ, 0.12);

  composer.render();
}

// ====================== EVENTS ======================
function bindEvents() {
  dom.tabBuilder.onclick = () => switchMode('BUILDER');
  dom.tabParticles.onclick = () => switchMode('PARTICLES');

  document.querySelectorAll('.spawn-btn').forEach(btn => {
    btn.onclick = () => console.log(`Spawn ${btn.dataset.shape} (Builder v13)`);
  });

  dom.shapeSelect.onchange = (e) => generateShape(e.target.value);
  dom.colorPicker.oninput = (e) => particleMaterial.color.set(e.target.value);

  dom.audioBtn.onclick = () => {
    sounds.enabled = !sounds.enabled;
    dom.audioBtn.textContent = sounds.enabled ? '🔊 AUDIO: ATTIVO' : '🔇 AUDIO: DISATTIVATO';
    if (sounds.enabled) sounds.init();
  };

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  });
}

function switchMode(mode) {
  currentMode = mode;
  dom.panelTitle.textContent = mode === 'BUILDER' ? '3D BUILDER MATRIX' : 'PLASMA MATRIX';
  dom.mode.textContent = mode;
  dom.builderControls.classList.toggle('hidden', mode !== 'BUILDER');
  dom.particlesControls.classList.toggle('hidden', mode === 'BUILDER');
}

// ====================== START ======================
window.addEventListener('load', async () => {
  initThree();
  bindEvents();

  // Populate select
  const shapes = ['jupiter','galaxy','hypercube','heart','reactor','cpu'];
  shapes.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s.toUpperCase();
    dom.shapeSelect.appendChild(opt);
  });

  await initHandTracking();
  animate();

  dom.connection.textContent = "CAM: ONLINE";
  dom.connection.style.color = "#00ffcc";
  dom.previewStatus.textContent = "READY";
});
</script>
</body>
</html>
