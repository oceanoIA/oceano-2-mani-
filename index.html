<style>
:root{
  --bg:#0a0a0f;
  --bg-secondary:#12121a;
  --fg:#e8e8f0;
  --muted:#6a6a8a;
  --accent:#00ffcc;
  --accent2:#ff00aa;
  --accent3:#ffe66d;
  --accent4:#00e8ff;
  --card:#0f0f1a;
  --border:rgba(255,255,255,.08);
  --radius:12px;
  --blur:10px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:'Space Grotesk',sans-serif;
  color:#fff;
}

/* --[ MAIN LAYOUT ]-- */

body{
  position:fixed;
  inset:0;
  touch-action:none;
}

#root{
  width:100%;
  height:100%;
}

/* --[ CANVAS CONTAINER ]-- */

#canvas-container{
  position:absolute;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

#canvas-container canvas{
  display:block;
  width:100%;
  height:100%;
}

/* --[ HUD SCANLINES ]-- */

.hud-scanline{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 2px,
    rgba(255,255,255,.012) 3px
  );
  mix-blend-mode:screen;
}

/* --[ HEADER ]-- */

.stark-header{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:68px;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  background:linear-gradient(180deg, rgba(10,10,15,.85) 0%, rgba(5,5,10,.92) 100%);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  border-bottom:1px solid var(--border);
  contain:layout paint;
}

.stark-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:Orbitron,sans-serif;
  font-size:14px;
  font-weight:950;
  letter-spacing:3px;
  text-transform:uppercase;
}

.stark-title .glow{
  color:var(--accent);
  text-shadow:0 0 20px rgba(0,255,204,.45), 0 0 40px rgba(0,255,204,.25);
}

.security-badge,
.hud-status{
  padding:4px 10px;
  border:1px solid var(--border);
  border-radius:24px;
  background:rgba(255,255,255,.03);
  font-size:7.5px;
  letter-spacing:1.2px;
  font-family:Orbitron,sans-serif;
}

.hud-status{
  color:var(--accent);
  min-width:100px;
  text-align:center;
}

.status-dot{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  margin-right:6px;
  vertical-align:middle;
}

.status-dot.online{
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
}

.status-dot.offline{
  background:#444;
}

/* --[ MODE DOCK ]-- */

.mode-dock{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:4px;
  z-index:20;
  padding:6px 10px;
  background:rgba(15,15,25,.78);
  border:1px solid var(--border);
  border-radius:28px;
  box-shadow:0 12px 30px rgba(0,0,0,.7);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.tab-btn{
  position:relative;
  flex:1;
  border:1px solid var(--border);
  background:rgba(255,255,255,.025);
  border-radius:16px;
  cursor:pointer;
  transition:.2s ease;
  touch-action:manipulation;
  font-family:Orbitron,sans-serif;
  font-size:8.5px;
  letter-spacing:1px;
  color:var(--muted);
}

.tab-btn:hover{
  color:#fff;
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.4);
}

.tab-btn.active{
  color:#fff;
  background:rgba(0,255,204,.18);
  border-color:var(--accent);
  box-shadow:0 0 20px rgba(0,255,204,.18);
}

.tab-btn::before{
  content:"";
  position:absolute;
  left:8px;
  top:50%;
  transform:translateY(-50%);
  width:3px;
  height:3px;
  border-left:1px solid #fff;
  border-top:1px solid #fff;
  opacity:.2;
}

/* --[ PANEL OVERLAY ]-- */

.ui-overlay{

  top:82px;
  left:22px;

  flex-direction:column;
  gap:16px;
  contain:layout paint;
  transition:transform .2s ease,opacity .2s;
}

.ui-overlay::-webkit-scrollbar{display:none;}

.ui-overlay.closed{

  pointer-events:none;
}

.panel-header{

.panel-title{

.btn-grid{

<script>
'use strict';

/* =========================================================
   QUANTUM CONFIG
========================================================= */

const IS_MOBILE =
  /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  innerWidth <= 700;

const QUANTUM_CONFIG = {

  particles: IS_MOBILE ? 4000 : 6000,

  handFPS: IS_MOBILE ? 22 : 24,

  cameraWidth: IS_MOBILE ? 320 : 400,
  cameraHeight: IS_MOBILE ? 240 : 300,

  handSmooth: 0.75,

  pinchOn: 0.065,
  pinchOff: 0.1,

  particleSmooth: 0.18,
  particleReaction: 0.12,

  maxBlocks: 32,

  bloomStrength: 1.2,
  bloomThreshold: 0,
  bloomRadius: 0.8,

  bloomKernel: 64,

  glitchAmount: 0,

  renderScale:
    IS_MOBILE
      ? 1
      : Math.min(window.devicePixelRatio || 1, 1.8),

  colors:{
    cyan:0x00ffff,
    magenta:0xff00ff,
    green:0x00ffcc,
    pink:0xff69b4,
    yellow:0xfff569,
    blue:0x00aaff,
    orange:0xffa500,
    white:0xffffff
  }

};

const PARTICLE_COUNT = QUANTUM_CONFIG.particles;

/* =========================================================
   AUDIO SYSTEM - QUANTUM RESONANCE
========================================================= */

class QuantumAudioSystem{

  constructor(){
    this.ctx=null;
    this.oscillators={};
  this.gains={};
    this.reverb=null;
    this.enabled=true;
    this.initialized=false;
  }

  init(){

    if(this.initialized)return;

    try{

      const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioCtx)return;

      this.ctx=new AudioCtx();

      // Main hum
      this.oscillators.hum=this.ctx.createOscillator();
      this.gains.hum=this.ctx.createGain();

      this.oscillators.hum.type='sine';
      this.oscillators.hum.frequency.value=440;

      this.gains.hum.gain.value=0.005;

      this.oscillators.hum.connect(this.gains.hum);
      this.gains.hum.connect(this.ctx.destination);

      this.oscillators.hum.start();

      // Reverb
      this.reverb=this.ctx.createBiquadFilter();
      this.reverb.type='allpass';

      this.initialized=true;

    }catch(e){
      console.warn('Audio non disponibile',e);
    }

  }

  pinch(){

    if(!this.enabled)return;

    this.init();

    if(!this.initialized)return;

    const o=this.ctx.createOscillator();
    const g=this.ctx.createGain();

    const t=this.ctx.currentTime;

    o.type='sine';
    o.frequency.setValueAtTime(110,t);
    o.frequency.exponentialRampToValueAtTime(550,t+0.05);

    g.gain.setValueAtTime(0.15,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.05);

    o.connect(g);
    g.connect(this.ctx.destination);

    o.start(t);
    o.stop(t+0.05);

  }

  release(){

    if(!this.enabled)return;

    const o=this.ctx.createOscillator();
    const g=this.ctx.createGain();

    const t=this.ctx.currentTime;

    o.type='triangle';
    o.frequency.value=220;

    g.gain.value=0.02;
    g.gain.setTargetAtTime(0.001,t,0.1);

    o.connect(g);
    g.connect(this.ctx.destination);

    o.start(t);

  }

}

function initThree(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x000000);

  camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    0.1,
    1000
  );

  camera.position.set(0,2.5,35);

  camera.lookAt(0,0,0);

  renderer=new THREE.WebGLRenderer({
    antialias:!IS_MOBILE,
    powerPreference:'high-performance',
    alpha:true
  });

  renderer.setPixelRatio(CONFIG.renderScale);

  renderer.setSize(
    innerWidth,
    innerHeight,
    false
  );

  dom.container.appendChild(renderer.domElement);

  // Init Post-Processing Composer
  composer=new THREE.EffectComposer(renderer);

  const renderPass=new THREE.RenderPass(
    scene,
    camera
  );

  composer.addPass(
    renderPass
  );

  // Bloom Pass for that glowing effect
  const bloomPass=new THREE.UnrealBloomPass(
    new THREE.Vector2(
      innerWidth,
      innerHeight
    ),
    QUANTUM_CONFIG.bloomStrength,
    QUANTUM_CONFIG.bloomThreshold,
    QUANTUM_CONFIG.bloomRadius
  );

  composer.addPass(
    bloomPass
  );

  // Glitch Pass for dramatic effects
  const glitchPass=new THREE.GlitchPass();
  glitchPass.enabled=false;
  composer.addPass(
    glitchPass
  );

  initBuilder();

  initControllers();

  initParticles();

  initPreview();

  window.addEventListener(
    'resize',
    onResize,
    {passive:true}
  );

}

function generateShape(type){

  /*
    Hardware objects.
  */

  if(
    type==='cpu' ||
    type==='gpu' ||
    type==='ram' ||
    type==='ssd'
  ){

    isCpuHologram=
      type==='cpu';

    hardwareType=type;

    particleSystem.visible=false;

    Object.values(
      hardwareGroups
    ).forEach(
      g=>g.visible=false
    );

    const selected=
      hardwareGroups[type];

    if(selected){

      selected.visible=true;

      hologramGroup=
        selected;

    }

    shapePulse=1;

    return;

  }

  /*
    Return to particle hologram.
  */

  isCpuHologram=false;

  hardwareType=null;

  Object.values(
    hardwareGroups
  ).forEach(
    g=>g.visible=false
  );

  particleSystem.visible=true;

  const p=
    targetPositions;

  for(
    let i=0;
    i<PARTICLE_COUNT;
    i++
  ){

    const j=i*3;

    let x=0;
    let y=0;
    let z=0;

    if(
      type==='quantum' ||
      type==='quantumField'
    ){

      // Quantum field - chaotic but organized
      const t=
        Math.random()*
        Math.PI*2;

      const r=
        Math.pow(
          Math.random(),
          0.7
        )*18;

      const noise=
        (Math.random()-.5)*.5;

      x=
        Math.cos(t)*r+
        noise;

      y=
        (Math.random()-.5)*12;

      z=
        Math.sin(t)*r+
        noise;

    }else if(type==='neuron'){

      // Neural network pattern
      const t=
        i/PARTICLE_COUNT*
        Math.PI*18;

      const strand=
        i%2===0
          ? 1
          : -1;

      const radius=
        5+
        Math.sin(t*.5)*.5;

      x=
        Math.cos(t)*radius*strand;

      y=
        i/PARTICLE_COUNT*14-7;

      z=
        Math.sin(t)*radius*strand;

    }else if(type==='vortex'){

      // Vortex field
      const t=
        Math.random()*
        Math.PI*12;

      const r=
        2+
        Math.random()*8;

      const spiral=
        i%12;

      x=
        Math.cos(t+r*i*.3)*r;

      y=
        t*.2-4;

      z=
        Math.sin(t+r*i*.3)*r;

    }else if(type==='tesseract'){

      // 4D hypercube projection
      const s=8;

      const q=i%24;

      const signs=[

        q&1?1:-1,
        q&2?1:-1,
        q&4?1:-1

      ];

      const t=
        Math.random()*2-1;

      x=
        signs[0]*s+
        t*3;

      y=
        signs[1]*s+
        t*3;

      z=
        signs[2]*s+
        t*3;

      // Add w-component effect
      y+=Math.sin(t*6)*.5;

    }else if(type==='metatron'){

      // Metatron's Cube
      const a=
        Math.random()*
        Math.PI*2;

      const segments=12;

      for(
        let s=0;
        s<segments;
        s++
      ){

        const angle=
          a+s*Math.PI/6;

        const r=
          3+
          Math.random()*2;

        const x=
          Math.cos(angle)*r;

        const z=
          Math.sin(angle)*r;

        const y=
          (s-5.5)*.8;

        p[j]=x;
        p[j+1]=y;
        p[j+2]=z;

        j+=3;

        // Second ring
        p[j]=x*0.8;
        p[j+1]=y;
        p[j+2]=z*0.8;

        j+=3;

      }

    }else if(type==='flower'){

      // Energy flower
      const u=
        Math.random()*
        Math.PI*2;

      const v=
        Math.random()*
        Math.PI;

      const r=
        8*
        Math.sin(5*u)*
        Math.sin(v);

      x=
        r*
        Math.sin(v)*
        Math.cos(u);

      y=
        r*
        Math.sin(v)*
        Math.sin(u);

      z=
        r*
        Math.cos(v);

    }else if(type==='dna'){

      // DNA double helix
      const t=
        i/PARTICLE_COUNT*
        Math.PI*12;

      const strand=
        i%2===0
          ? 1
          : -1;

      const radius=
        4;

      x=
        Math.sin(t)*radius*strand;

      y=
        i/PARTICLE_COUNT*16-8;

      z=
        Math.cos(t)*radius*strand;

        Math.floor(

          )
        );

      const levels=5;

      let r=
        1+

      for(
        let l=0;

      ){

        const innerRadius=

        x=
          Math.cos(t)*r;

          Math.sin(t)*r;

        p[j]=x;
        p[j+1]=y;

/* =========================================================
   HAND TRACKING
========================================================= */

async function initHandTracking(){

  setConnection(
    'CAM: CONNECTING',
    'yellow'
  );

  dom.mp.textContent=
    'SEARCHING';

  const hands=
    new Hands({

      locateFile:
        file =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

    });

  hands.setOptions({

    maxNumHands:2,

    modelComplexity:0,

    minDetectionConfidence:.55,

    minTrackingConfidence:.55

  });

  let processing=false;

  let lastProcess=0;

  const interval=
    1000/
    QUANTUM_CONFIG.handFPS;

  hands.onResults(
    results=>{

      processing=false;

      const landmarks=
        results.multiHandLandmarks ||
        [];

      const handed=
        results.multiHandedness ||
        [];

      drawPreview(
        landmarks
      );

      dom.mp.textContent=
        landmarks.length
          ? 'TRACKING'
          : 'SEARCHING';

      const mapped={
        Left:null,
        Right:null
      };

      handed.forEach(
        (item,i)=>{

          if(
            item?.label &&
            landmarks[i]
          ){

            mapped[
              item.label
            ]=
              landmarks[i];

          }

        }
      );

      controllers.forEach(
        ctrl=>{

          const lm=
            mapped[ctrl.side];

          if(lm){

            updateController(
              ctrl,
              lm
            );

          }else{

            loseController(
              ctrl
            );

          }

        }
      );

      updateParticleTargets();

      updateGestures();

    }
  );

  const cameraUtils=
    new Camera(
      dom.video,
      {

        onFrame:
          async()=>{

            if(
              !pageVisible
            )return;

            if(processing)
              return;

            const now=
              performance.now();

            if(
              now-lastProcess<
              interval
            )return;

            if(
              dom.video.readyState<2
            )return;

            lastProcess=now;

            processing=true;

            try{

              await hands.send({
                image:dom.video
              });

            }catch(e){

              processing=false;

              setConnection(
                'CAM: ERROR',
                'red'
              );

              dom.mp.textContent=
                'ERROR';

            }

          },

        width:
          QUANTUM_CONFIG.cameraWidth,

        height:
          QUANTUM_CONFIG.cameraHeight

      }
    );

  try{

    cameraUtils.start();

    setConnection(
      'CAM: STARTING',
      'yellow'
    );

  }catch(e){

    setConnection(
      'CAM: FAILED',
      'red'
    );

    console.warn(
      'Camera error',
      e
    );

  }

  dom.video.addEventListener(
    'loadeddata',
    ()=>{

      setConnection(
        'CAM: ONLINE',
        'green'
      );

      dom.previewStatus.textContent=
        'ONLINE';

    }
  );

  dom.video.addEventListener(
    'error',
    ()=>{

      setConnection(
        'CAM: ERROR',
        'red'
      );

      dom.previewStatus.textContent=
        'ERROR';

    }
  );

}

/* =========================================================
   UPDATE CONTROLLER
========================================================= */

function updateController(
  ctrl,
  landmarks
){

  const now=
    performance.now();

  ctrl.active=true;

  ctrl.lastSeen=now;

  const thumb=
    landmarks[4];

  const index=
    landmarks[8];

  const middle=
    landmarks[12];

  const centerX=
    (thumb.x+index.x)*.5;

  const centerY=
    (thumb.y+index.y)*.5;

  // Mirror compensation
  const ndcX=
    (1-centerX)*2-1;

  const ndcY=
    -(centerY*2-1);

  const v=
    new THREE.Vector3(
      ndcX,
      ndcY,
      .5
    );

  v.unproject(
    camera
  );

  const dir=
    v.sub(
      camera.position
    ).normalize();

  const targetZ=
    -centerZ*25;

  if(
    Math.abs(dir.z)>.0001
  ){

    const dist=
      (targetZ-camera.position.z)/
      dir.z;

    ctrl.target.copy(
      camera.position
    ).add(
      dir.multiplyScalar(dist)
    );

    ctrl.lastPos.copy(
      ctrl.pos
    );

    ctrl.pos.lerp(
      ctrl.target,
      QUANTUM_CONFIG.handSmooth
    );

    ctrl.velocity.copy(
      ctrl.pos
    ).sub(
      ctrl.lastPos
    ).divideScalar(
      Math.max(deltaTime*.01,0.01)
    );

    ctrl.mesh.position.copy(
      ctrl.pos
    );

    ctrl.pointLight.position.copy(
      ctrl.pos
    );

    ctrl.mesh.visible=true;

    ctrl.pointLight.visible=true;

    updateRay(
      ctrl,
      landmarks[0],
      targetZ
    );

    updateTrail(
      ctrl
    );

  }

  updatePinch(
    ctrl,
    thumb,
    index
  );

  updateHandHUD(
    ctrl
  );

  updateBuilderHand(
    ctrl
  );

}

/* =========================================================
   PINCH DETECTION
========================================================= */

function updatePinch(
  ctrl,
  thumb,
  index
){

  const distance=
    Math.hypot(
      thumb.x-index.x,
      thumb.y-index.y
    );

  ctrl.wasPinching=
    ctrl.isPinching;

  if(
    ctrl.isPinching
  ){

    if(
      distance>
      QUANTUM_CONFIG.pinchOff
    ){

      ctrl.isPinching=false;

      // Release any grabbed block
      releaseBlock(
        ctrl
      );

    }

  }else{

    if(
      distance<
      QUANTUM_CONFIG.pinchOn
    ){

      ctrl.isPinching=true;

      // Play sound
      sounds.pinch();

    }

  }

  if(
    !ctrl.wasPinching &&
    ctrl.isPinching
  ){

    // Trigger quantum event
    triggerQuantumEvent();

  }

}

/* =========================================================
   QUANTUM EVENT
========================================================= */

function triggerQuantumEvent(){

  // Random color shift
  const schemes={
    cyan:{main:0x00ffff,glow:0x00ccff},
    green:{main:0x00ffcc,glow:0x00cc99},
    yellow:{main:0xfff569,glow:0xffd839},
    purple:{main:0xa020f0,glow:0x9010e0},
    neon:{main:0xff00ff,glow:0xff00cc}
  };

  const scheme=
    Object.keys(
      schemes
    )[Math.floor(
      Math.random()*5
    )];

  const s=
    schemes[scheme];

  // Update particle material
  if(particleMaterial){

    particleMaterial.color.setHex(
      s.main
    );

  }

  // Update bloom
  const bloomPass=
    composer.passes.find(
      p=>p.isBloomPass
    );

  if(bloomPass){

    bloomPass.defaultColor.setHex(
      s.glow
    );

  }

  // Update controller lights
  for(
    const ctrl of controllers
  ){

    if(
      ctrl.pointLight
    ){

      ctrl.pointLight.color.setHex(
        s.glow
      );

    }

  }

}

/* =========================================================
   LOSE HAND
========================================================= */

function loseController(
  ctrl
){

  const elapsed=
    performance.now()-
    ctrl.lastSeen;

  ctrl.active=false;

  ctrl.mesh.visible=false;

  ctrl.pointLight.visible=false;

  ctrl.rayLine.visible=false;

  if(
    elapsed>400
  ){

    ctrl.isPinching=false;

    releaseBlock(
      ctrl
    );

    setHandState(
      ctrl,
      'LOST'
    );

  }else{

    setHandState(
      ctrl,
      'LOST'
    );

  }

  ctrl.trail.visible=false;

}

/* =========================================================
   RAY
========================================================= */

function updateRay(
  ctrl,
  wrist,
  targetZ
){

  const x=
    (1-wrist.x)*2-1;

  const y=
    -(wrist.y*2-1);

  const v=
    new THREE.Vector3(
      x,
      y,
      .5
    );

  v.unproject(
    camera
  );

  const dir=
    v.sub(
      camera.position
    ).normalize();

  if(
    Math.abs(dir.z)<.0001
  )return;

  const dist=
    (targetZ-camera.position.z)/
    dir.z;

  const p=
    camera.position.clone()
      .add(
        dir.multiplyScalar(dist)
      );

  const attr=
    ctrl.rayLine
      .geometry
      .attributes
      .position;

  attr.setXYZ(
    0,
    p.x,
    p.y,
    p.z
  );

  attr.setXYZ(
    1,
    ctrl.pos.x,
    ctrl.pos.y,
    ctrl.pos.z
  );

  attr.needsUpdate=true;

  ctrl.rayLine.visible=
    currentMode==='BUILDER';

}

/* =========================================================
   TRAIL
========================================================= */

function updateTrail(
  ctrl
){

  if(
    currentMode!=='PARTICLES'
  ){

    ctrl.trail.visible=false;

    return;

  }

  ctrl.trailPoints.unshift(
    ctrl.pos.clone()
  );

  ctrl.trailPoints.length=20;

  const attr=
    ctrl.trailGeometry
      .attributes
      .position;

  for(
    let i=0;
    i<20;
    i++
  ){

    const p=
      ctrl.trailPoints[i]||
      ctrl.pos;

    attr.setXYZ(
      i,
      p.x,
      p.y,
      p.z
    );

  }

  attr.needsUpdate=true;

  ctrl.trail.visible=true;

}

/* =========================================================
   TWO HAND CONTROL
========================================================= */

function updateParticleTargets(){

  if(
    currentMode!=='PARTICLES'
  )return;

  const left=
    controllers[0];

  const right=
    controllers[1];

  const ROT_GAIN=.9;

  if(
    left.active &&
    right.active
  ){

    const a=left.pos;
    const b=right.pos;

    // Midpoint = rotation controller
    const center=
      new THREE.Vector3()
        .addVectors(a,b)
        .multiplyScalar(.5);

    // ONLY frame-to-frame movement
    if(
      hasLastHandCenter
    ){

      const dx=
        center.x-
        lastHandCenterX;

      const dy=
        center.y-
        lastHandCenterY;

      targetRotY+=
        dx*
        QUANTUM_CONFIG.axisSensitivity*
        ROT_GAIN;

      targetRotX+=
        -dy*
        QUANTUM_CONFIG.axisSensitivity*
        ROT_GAIN;

    }

    lastHandCenterX=
      center.x;

    lastHandCenterY=
      center.y;

    hasLastHandCenter=true;

    // Distance = ONLY zoom
    const distance=
      a.distanceTo(b);

    targetScale=
      THREE.MathUtils.clamp(
        .5+
        distance*.08,
        .5,
        3.0
      );

    // Relative angle = roll
    const angle=
      Math.atan2(
        b.y-a.y,
        b.x-a.x
      );

    if(
      hasLastHandAngle
    ){

      let deltaAngle=
        angle-
        lastHandAngle;

      while(
        deltaAngle>Math.PI
      ){
        deltaAngle-=
          Math.PI*2;
      }

      while(
        deltaAngle<-Math.PI
      ){
        deltaAngle+=
          Math.PI*2;
      }

      targetRotZ+=
        deltaAngle*
        QUANTUM_CONFIG.rollSensitivity;

    }

    lastHandAngle=
      angle;

    hasLastHandAngle=true;

    return;

  }

  // ONE HAND mode
  const activeHand=
    left.active
      ? left
      : right.active
        ? right
        : null;

  if(!activeHand){

    hasLastHandCenter=false;
    hasLastHandAngle=false;

    return;

  }

  const p=
    activeHand.pos;

  if(
    hasLastHandCenter
  ){

    const dx=
      p.x-
      lastHandCenterX;

    const dy=
      p.y-
      lastHandCenterY;

    targetRotY+=
      dx*
      QUANTUM_CONFIG.axisSensitivity*
      ROT_GAIN;

    targetRotX+=
      -dy*
      QUANTUM_CONFIG.axisSensitivity*
      ROT_GAIN;

  }

  lastHandCenterX=
    p.x;

  lastHandCenterY=
    p.y;

  hasLastHandCenter=true;

  targetScale=1;

  hasLastHandAngle=false;

}

/* =========================================================
   BUILDER HAND
========================================================= */

function updateBuilderHand(
  ctrl
){

  if(
    currentMode!=='BUILDER'
  )return;

  if(
    ctrl.isPinching
  ){

    if(
      !ctrl.grabbedBlock
    ){

      selectNearestBlock(
        ctrl
      );

    }

    if(
      ctrl.grabbedBlock
    ){

      const block=
        ctrl.grabbedBlock;

      const builderGain=
        1+
        QUANTUM_CONFIG.axisSensitivity;

      const dx=
        (
          ctrl.pos.x-
          ctrl.grabStartHand.x
        )*
        builderGain;

      const dy=
        (
          ctrl.pos.y-
          ctrl.grabStartHand.y
        )*
        builderGain;

      const dz=
        (
          ctrl.pos.z-
          ctrl.grabStartHand.z
        )*
        builderGain;

      block.position.set(

        ctrl.grabStartBlock.x+
          dx,

        ctrl.grabStartBlock.y+
          dy,

        ctrl.grabStartBlock.z+
          dz

      );

      block.userData.velocity.set(
        0,
        0,
        0
      );

      selectedBlock=
        block;

      highlightBlock(
        block,
        true
      );

      updateSelectionUI();

    }

  }else if(
    ctrl.wasPinching
  ){

    releaseBlock(
      ctrl
    );

  }

}

   SELECT BLOCK
========================================================= */

function selectNearestBlock(
  ctrl
){

  let nearest=null;

  let best=5;

  for(
    const block of blocks
  ){

    const d=
      ctrl.pos.distanceTo(
        block.position
      );

    if(
      d<best
    ){

      best=d;

      nearest=block;

    }

  }

  if(!nearest)return;

  ctrl.grabbedBlock=
    nearest;

  ctrl.grabOffset
    .copy(ctrl.pos)
    .sub(
      nearest.position
    );

  ctrl.grabStartHand
    .copy(
      ctrl.pos
    );

  ctrl.grabStartBlock
    .copy(
      nearest.position
    );

  nearest.userData.isGrabbed=
    true;

  nearest.userData.velocity.set(
    0,
    0,
    0
  );

  selectedBlock=
    nearest;

  highlightBlock(
    nearest,
    true
  );

  updateSelectionUI();

}

/* =========================================================
   RELEASE BLOCK
========================================================= */

function releaseBlock(
  ctrl
){

  const block=
    ctrl.grabbedBlock;

  if(!block)return;

  block.userData.isGrabbed=
    false;

  block.userData.velocity.set(
    0,
    0,
    0
  );

  snapBlock(
    block
  );

  highlightBlock(
    block,
    false
  );

  ctrl.grabbedBlock=
    null;

  selectedBlock=null;

  updateSelectionUI();

}

/* =========================================================
   SNAP
========================================================= */

function snapBlock(block){

  if(!block)return;

  const s=
    QUANTUM_CONFIG.snapSize;

  block.position.x=
    Math.round(
      block.position.x/s
    )*s;

  block.position.y=
    Math.round(
      block.position.y/s
    )*s;

  block.position.z=
    Math.round(
      block.position.z/s
    )*s;

}

/* =========================================================
   UPDATE SELECTION UI
========================================================= */

function updateSelectionUI(){

  if(selectedBlock){

    dom.selection.textContent=
      'TARGET: '+
      selectedBlock
        .userData
        .type
        .toUpperCase();

    dom.ring.style.display=
      'block';

  }else{

    dom.selection.textContent=
      'TARGET: NESSUN OGGETTO';

    dom.ring.style.display=
      'none';

  }

}

/* =========================================================
   UPDATE FPS
========================================================= */

function updateFPS(now){

  fpsFrames++;

  if(
    now-fpsTime>=500
  ){

    const fps=
      Math.round(
        fpsFrames*
        1000/
        (now-fpsTime)
      );

    dom.fps.textContent=
      fps;

    fpsFrames=0;

    fpsTime=now;

  }

}

/* =========================================================
   MODE SWITCH
========================================================= */

function switchMode(
  mode
){

  if(
    currentMode===mode
  )return;

  currentMode=mode;

  const builder=
    mode==='BUILDER';

  dom.tabBuilder.classList.toggle(
    'active',
    builder
  );

  dom.tabParticles.classList.toggle(
    'active',
    !builder
  );

  dom.builder.classList.toggle(
    'hidden',
    !builder
  );

  dom.particles.classList.toggle(
    'hidden',
    builder
  );

  dom.mode.textContent=
    mode;

  builderGroup.visible=
    builder;

  particleGroup.visible=
    !builder;

  controllers.forEach(
    c=>{

      c.rayLine.visible=
        builder&&
        c.active;

      c.trail.visible=
        !builder&&
        c.active;

    }
  );

  if(!builder){

    selectedBlock=null;

    controllers.forEach(
      c=>releaseBlock(c)
    );

    updateSelectionUI();

  }

}

/* =========================================================
   EVENTS
========================================================= */

function bindEvents(){

  dom.tabBuilder.addEventListener(
    'click',
    ()=>{
      switchMode(
        'BUILDER'
      );
    }
  );

  dom.tabParticles.addEventListener(
    'click',
    ()=>{
      switchMode(
        'PARTICLES'
      );
    }
  );

  document
    .querySelectorAll(
      '.spawn-btn'
    )
    .forEach(
      btn=>{

        btn.addEventListener(
          'click',
          ()=>{
            spawnShape(
              btn.dataset.shape
            );
          }
        );

      }
    );

  dom.clear.addEventListener(
    'click',
    clearBlocks
  );

  dom.shapeSelect.addEventListener(
    'change',
    e=>{
      generateShape(
        e.target.value
      );
    }
  );

  dom.intensitySlider.addEventListener(
    'input',
    e=>{

      const val=
        parseFloat(e.target.value);

      QUANTUM_CONFIG.bloomStrength=
        val;

      if(
        composer.passes.find(
          p=>p.isBloomPass
        )
      ){

        composer.passes.find(
          p=>p.isBloomPass
        ).strength=
          val;

      }

      dom.intensityValue.textContent=
        `${val.toFixed(1)}x`;

    }
  );

  dom.colorSchemeSelect.addEventListener(
    'change',
    updateColorScheme
  );

  dom.audio.addEventListener(
    'click',
    ()=>{

      sounds.enabled=
        !sounds.enabled;

      dom.audio.textContent=
        sounds.enabled
          ? '🔊 AUDIO: QUANTUM RESONANCE'
          : '🔇 AUDIO: DISATTIVATO';

      if(
        sounds.enabled
      ){

        sounds.init();

      }

    }
  );

  window.addEventListener(
    'resize',
    onResize,
    {passive:true}
  );

  document.addEventListener(
    'visibilitychange',
    ()=>{

      pageVisible=
        !document.hidden;

      if(
        pageVisible
      ){

        lastFrame=
          performance.now();

      }

    }
  );

}

/* =========================================================
   CONNECTION STATUS
========================================================= */

function setConnection(
  text,
  type
){

  dom.connection.textContent=
    text;

  if(
    type==='green'
  ){

    dom.connection.style.color=
      '#00ffcc';

  }else if(
    type==='red'
  ){

    dom.connection.style.color=
      '#ff5577';

  }else{

    dom.connection.style.color=
      '#ffe66d';

  }

}

/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  if(
    !pageVisible
  )return;

  const now=
    performance.now();

  const delta=
    Math.min(
      (now-lastFrame)/
      16.67,
      2
    );

  lastFrame=now;

  updateFPS(
    now
  );

  // Update bloom time
  if(
    composer.passes.find(
      p=>p.isBloomPass
    )
  ){

    composer.passes.find(
      p=>p.isBloomPass
    ).uniforms.time.value=
      now*0.001;

  }

  if(
    currentMode==='BUILDER'
  ){

    updateBuilder(
      delta
    );

  }else{

    updateParticles(
      delta
    );

  }

  // Render with post-processing
  composer.render(
    delta
  );

  // occasional glitch effect
  if(
    Math.random()>.98 &&
    currentMode==='PARTICLES'
  ){

    glitchTimestamp=
      performance.now();

    const glitchPass=
      composer.passes.find(
        p=>p.isGlitchPass
      );

    if(glitchPass){

      glitchPass.enabled=true;

      setTimeout(()=>{

        glitchPass.enabled=false;

      },150);

    }

  }

}

/* =========================================================
   RESIZE
========================================================= */

function onResize(){

  if(
    !camera ||
    !renderer
  )return;

  camera.aspect=
    innerWidth/
    innerHeight;

  camera.updateProjectionMatrix();

  renderer.setPixelRatio(
    IS_MOBILE
      ? 1
      : Math.min(
          window.devicePixelRatio||1,
          1.8
        )
  );

  renderer.setSize(
    innerWidth,
    innerHeight,
    false
  );

  // Update composer targets
  composer.setSize(
    innerWidth,
    innerHeight
  );

}

/* =========================================================
   START
========================================================= */

window.addEventListener(
  'load',
  async()=>{

    initThree();

    bindEvents();

    // Start in PARTICLES mode
    currentMode=
      'PARTICLES';

    switchMode(
      'PARTICLES'
    );

    setConnection(
      'CAM: INIT',
      'yellow'
    );

    try{

      await initHandTracking();

    }catch(e){

      console.error(
        'MediaPipe init error:',
        e
      );

      setConnection(
        'CAM: FAILED',
        'red'
      );

    }

    animate();

  }
);

</script>
