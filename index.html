<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEBULA // 3D Particle System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background-color: #000000; font-family: 'Share Tech Mono', monospace; color: #ffffff; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    #video-input { display: none; }

    /* Header Superiore Minimal */
    .nebula-header {
      position: absolute; top: 0; left: 0; width: 100%; height: 50px;
      background: rgba(10, 10, 10, 0.3); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 10;
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .nebula-title {
      font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px;
      letter-spacing: 3px; color: #ffffff; text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
      display: flex; align-items: center; gap: 12px;
    }
    .nebula-subtitle {
      font-size: 9px; color: rgba(255, 255, 255, 0.4); letter-spacing: 1px;
    }

    /* Dock Centrale in Basso (Identico al video) */
    .mode-dock {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 20; background: rgba(20, 20, 20, 0.45);
      padding: 8px 16px; border-radius: 35px; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .dock-btn {
      background: transparent; border: none; color: rgba(255, 255, 255, 0.5);
      font-family: 'Orbitron', sans-serif; font-size: 9px; font-weight: 700;
      padding: 8px 14px; cursor: pointer; transition: all 0.3s ease;
      border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .dock-btn:hover, .dock-btn.active {
      background: rgba(255, 255, 255, 0.2); color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.25); transform: translateY(-2px);
    }
    .dock-btn span.icon { font-size: 14px; }

    /* Box Anteprima Webcam in Basso a Destra */
    .camera-preview-container {
      position: absolute; bottom: 25px; right: 25px; z-index: 10;
      width: 180px; height: 135px; background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); overflow: hidden; display: flex; flex-direction: column;
    }
    #hand-preview-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.85; }
    .preview-tag {
      position: absolute; top: 6px; left: 8px; font-size: 7px; font-weight: bold;
      letter-spacing: 1px; color: rgba(255, 255, 255, 0.7); background: rgba(0, 0, 0, 0.6);
      padding: 2px 5px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Telemetria minimal in alto a sinistra */
    .telemetry-hud {
      position: absolute; top: 65px; left: 24px; z-index: 10;
      font-size: 9px; color: rgba(255, 255, 255, 0.4); display: flex; flex-direction: column; gap: 4px;
      background: rgba(0, 0, 0, 0.4); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .telemetry-val { color: #ffffff; font-weight: bold; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <video id="video-input" autoplay playsinline muted></video>
  <div id="canvas-container"></div>

  <div class="nebula-header">
    <div class="nebula-title">
      <span>NEBULA</span>
      <span class="nebula-subtitle">Particle Interactive System</span>
    </div>
  </div>

  <div class="telemetry-hud">
    <div>WEBCAM TRACKING: <span id="hand-status" class="telemetry-val">CERCA...</span></div>
    <div>GESTURE: <span id="gesture-status" class="telemetry-val">LIBERA</span></div>
  </div>

  <div class="mode-dock">
    <button class="dock-btn active" onclick="changeShape('sphere', this)">
      <span class="icon">⚪</span><span>Sphere</span>
    </button>
    <button class="dock-btn" onclick="changeShape('heart', this)">
      <span class="icon">🤍</span><span>Heart</span>
    </button>
    <button class="dock-btn" onclick="changeShape('flower', this)">
      <span class="icon">🌸</span><span>Flower</span>
    </button>
    <button class="dock-btn" onclick="changeShape('saturn', this)">
      <span class="icon">🪐</span><span>Saturn</span>
    </button>
    <button class="dock-btn" onclick="changeShape('fireworks', this)">
      <span class="icon">✨</span><span>Burst</span>
    </button>
  </div>

  <div class="camera-preview-container">
    <span class="preview-tag">FEED OPTICAL</span>
    <canvas id="hand-preview-canvas" width="180" height="135"></canvas>
  </div>

  <script>
    const PARTICLE_COUNT = 6000;
    let scene, camera, renderer;
    let particleGeometry, particleMaterial, particleSystem;
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    
    let handScale = 1.0, targetScale = 1.0;
    let targetRotX = 0, targetRotY = 0, targetRotZ = 0;
    let previewCanvas, previewCtx;
    let isPinching = false;

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 26);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      particleGeometry = new THREE.BufferGeometry();
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        currentPositions[i] = (Math.random() - 0.5) * 30;
        targetPositions[i] = currentPositions[i];
      }
      particleGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

      // Colori sfumati multicolore in stile nebulosa (come nel video)
      const particleColors = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        const col = new THREE.Color();
        const hue = Math.random() * 0.4 + 0.5; // Toni ciano/viola/magenta
        col.setHSL(hue, 0.85, 0.65);
        particleColors[idx] = col.r;
        particleColors[idx + 1] = col.g;
        particleColors[idx + 2] = col.b;
      }
      particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 32; pCanvas.height = 32;
      const pCtx = pCanvas.getContext('2d');
      const grad = pCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      pCtx.fillStyle = grad; pCtx.fillRect(0, 0, 32, 32);

      particleMaterial = new THREE.PointsMaterial({
        size: 0.28, vertexColors: true, map: new THREE.CanvasTexture(pCanvas),
        transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending, depthWrite: false
      });

      particleSystem = new THREE.Points(particleGeometry, particleMaterial);
      scene.add(particleSystem);

      generateShape('saturn'); // Partiamo con Saturno, iconico nel video
      previewCanvas = document.getElementById('hand-preview-canvas');
      previewCtx = previewCanvas.getContext('2d');

      window.addEventListener('resize', onWindowResize);
    }

    function changeShape(type, btn) {
      document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      generateShape(type);
    }

    function generateShape(type) {
      const p = targetPositions;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        let x = 0, y = 0, z = 0;

        if (type === 'sphere') {
          const u = Math.random(), v = Math.random();
          const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
          const r = 6.0;
          x = r * Math.sin(phi) * Math.cos(theta);
          y = r * Math.sin(phi) * Math.sin(theta);
          z = r * Math.cos(phi);
        } else if (type === 'saturn') {
          if (i < PARTICLE_COUNT * 0.5) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 4.2;
            x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.sin(phi) * Math.sin(theta); z = r * Math.cos(phi);
          } else {
            const angle = Math.random() * Math.PI * 2, dist = 6.0 + Math.random() * 6.5;
            x = Math.cos(angle) * dist; z = Math.sin(angle) * dist; y = (Math.random() - 0.5) * 0.15;
          }
        } else if (type === 'heart') {
          const t = Math.random() * Math.PI * 2, u = (Math.random() - 0.5) * 3;
          x = 16 * Math.pow(Math.sin(t), 3);
          y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          z = u; x *= 0.45; y *= 0.45; z *= 0.45;
        } else if (type === 'flower') {
          const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI;
          const r = 7 * Math.sin(5 * u) * Math.sin(v);
          x = r * Math.sin(v) * Math.cos(u); y = r * Math.sin(v) * Math.sin(u); z = r * Math.cos(v);
        } else if (type === 'fireworks') {
          const theta = Math.random() * Math.PI * 2, phi = Math.acos((Math.random() * 2) - 1);
          const speed = 3 + Math.random() * 10;
          x = speed * Math.sin(phi) * Math.cos(theta); y = speed * Math.sin(phi) * Math.sin(theta); z = speed * Math.cos(phi);
        }

        p[idx] = x; p[idx + 1] = y; p[idx + 2] = z;
      }
    }

    function initHandTracking() {
      const videoElement = document.getElementById('video-input');
      const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        if (!previewCtx) return;
        previewCtx.save();
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        if (results.image) {
          previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);
        }

        const numHands = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;
        const handStatusEl = document.getElementById('hand-status');
        const gestureStatusEl = document.getElementById('gesture-status');

        if (numHands > 0) {
          handStatusEl.innerText = "ATTIVA (" + numHands + ")";
          handStatusEl.style.color = "#00ffcc";

          const landmarks1 = results.multiHandLandmarks[0];
          const h1Center = landmarks1[9];
          
          // Movimento rotazionale guidato dalla mano
          targetRotX = (h1Center.y - 0.5) * 3.5;
          targetRotY = (h1Center.x - 0.5) * 4.5;

          // Rilevamento del pizzico (pollice e indice)
          const thumbTip = landmarks1[4], indexTip = landmarks1[8];
          const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
          isPinching = (pinchDist < 0.075);

          if (isPinching) {
            gestureStatusEl.innerText = "PINCH (COLLAPSE)";
            gestureStatusEl.style.color = "#ff00aa";
          } else {
            gestureStatusEl.innerText = "APERTA";
            gestureStatusEl.style.color = "#ffffff";
          }

          // Zoom con due mani
          if (numHands === 2) {
            const landmarks2 = results.multiHandLandmarks[1];
            const distHands = Math.hypot(landmarks1[9].x - landmarks2[9].x, landmarks1[9].y - landmarks2[9].y);
            targetScale = THREE.MathUtils.clamp(distHands * 3.5, 0.4, 2.5);
          } else {
            targetScale = 1.0;
          }
        } else {
          handStatusEl.innerText = "CERCA...";
          handStatusEl.style.color = "#888888";
          gestureStatusEl.innerText = "LIBERA";
          isPinching = false;
        }
        previewCtx.restore();
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          if (videoElement.readyState >= 2) {
            await hands.send({ image: videoElement });
          }
        },
        width: 320, height: 240
      });
      cameraUtils.start().catch(err => console.log("Camera error:", err));
    }

    function animate() {
      requestAnimationFrame(animate);

      particleSystem.rotation.x += (targetRotX - particleSystem.rotation.x) * 0.1;
      particleSystem.rotation.y += (targetRotY + 0.002 - particleSystem.rotation.y) * 0.1;
      handScale += (targetScale - handScale) * 0.1;

      const positions = particleGeometry.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
        let tx = targetPositions[i] * handScale;
        let ty = targetPositions[i+1] * handScale;
        let tz = targetPositions[i+2] * handScale;
        let lerpSpeed = 0.08;

        if (isPinching && (i / 3) % 2 === 0) {
          tx *= 0.04; ty *= 0.04; tz *= 0.04;
          lerpSpeed = 0.15;
        }

        positions[i] += (tx - positions[i]) * lerpSpeed;
        positions[i+1] += (ty - positions[i+1]) * lerpSpeed;
        positions[i+2] += (tz - positions[i+2]) * lerpSpeed;
      }
      particleGeometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('load', () => {
      initThree();
      initHandTracking();
      animate();
    });
  </script>
</body>
</html>
