<html lang="it">
<head>
<meta charset="UTF-8">

<title>STARK KINETIC LAB v12 // VISION PRO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root{
  --white:#fff;
  --dim:rgba(255,255,255,.58);
  --line:rgba(255,255,255,.16);
  --panel:rgba(8,10,12,.76);
  --green:#00ffcc;
  --pink:#ff00aa;
  --yellow:#ffe66d;
  --red:#ff5577;
  --cyan:#00e8ff;
  --radius:18px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:'Share Tech Mono',monospace;
  color:#fff;
}

body{
  position:fixed;
  inset:0;
  touch-action:none;
}

button,select,input{
  font:inherit;
}

button{
  color:inherit;
}

#canvas-container{
  position:absolute;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

#canvas-container canvas{
  display:block;
  width:100%;
  height:100%;
}

#video-input{
  display:none;
}

/* ================= HUD ================= */

.hud-scanline{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 3px,
    rgba(255,255,255,.018) 4px
  );
  mix-blend-mode:screen;
}

.stark-header{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:60px;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  background:rgba(8,8,8,.72);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  contain:layout paint;
}

.stark-title{
  display:flex;
  align-items:center;
  gap:12px;
  font-family:Orbitron,sans-serif;
  font-size:13px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 12px rgba(255,255,255,.35);
}

.security-badge,
.hud-status{
  padding:3px 8px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(255,255,255,.04);
  font-size:8px;
  letter-spacing:1px;
}

.hud-status{
  color:var(--green);
  min-width:95px;
  text-align:center;
}

/* ================= BARRA DI RICERCA HUD ================= */
.search-hud-container {
  position: absolute;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(10, 15, 20, 0.75);
  border: 1px solid var(--cyan);
  padding: 6px 14px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 15px rgba(0, 232, 255, 0.2);
}

.search-hud-container input {
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 11px;
  width: 220px;
  letter-spacing: 1px;
}

.search-hud-container input::placeholder {
  color: var(--dim);
}

.search-hud-btn {
  background: rgba(0, 232, 255, 0.15);
  border: 1px solid var(--cyan);
  color: var(--cyan);
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 9px;
  cursor: pointer;
  transition: 0.2s ease;
}

.search-hud-btn:hover {
  background: var(--cyan);
  color: #000;
}

.mode-dock{
  position:absolute;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  z-index:20;
  padding:7px;
  background:rgba(10,10,10,.78);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:0 10px 25px rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.tab-btn,
.stark-btn{
  position:relative;
  border:1px solid var(--line);
  background:rgba(255,255,255,.035);
  border-radius:14px;
  cursor:pointer;
  transition:.18s ease;
  touch-action:manipulation;
}

.tab-btn{
  padding:9px 18px;
  font-family:Orbitron,sans-serif;
  font-size:9px;
  letter-spacing:1px;
  color:var(--dim);
}

.tab-btn:hover,
.tab-btn.active{
  color:#fff;
  background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.65);
  box-shadow:0 0 14px rgba(255,255,255,.12);
}

.stark-btn{
  height:36px;
  padding:0 10px;
  font-family:Orbitron,sans-serif;
  font-size:9px;
  letter-spacing:.7px;
  font-weight:700;
}

.stark-btn:hover{
  background:rgba(255,255,255,.13);
  border-color:rgba(255,255,255,.65);
}

.stark-btn:active,
.tab-btn:active{
  transform:scale(.97);
}

.stark-btn::before,
.tab-btn::before{
  content:"";
  position:absolute;
  left:6px;
  top:5px;
  width:4px;
  height:4px;
  border-left:1px solid #fff;
  border-top:1px solid #fff;
  opacity:.35;
}

/* ================= LEFT PANEL ================= */

.ui-overlay{
  position:absolute;
  top:74px;
  left:18px;
  width:292px;
  max-height:calc(100vh - 150px);
  overflow-y:auto;
  z-index:10;
  padding:16px;
  background:var(--panel);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 15px 30px rgba(0,0,0,.65);
  display:flex;
  flex-direction:column;
  gap:11px;
  contain:layout paint;
  transition:transform .22s ease,opacity .22s ease;
  scrollbar-width:none;
}

.ui-overlay::-webkit-scrollbar{
  display:none;
}

.ui-overlay.closed{
  transform:translateX(-105%);
  opacity:0;
  pointer-events:none;
}

.panel-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:8px;
  border-bottom:1px solid var(--line);
  font-family:Orbitron,sans-serif;
  font-size:10px;
  letter-spacing:1px;
}

.panel-online{
  font-size:8px;
  color:var(--green);
}

.control-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

label{
  font-size:8px;
  letter-spacing:1px;
  color:var(--dim);
}

select,
.stark-btn,
input[type=color]{
  width:100%;
  outline:none;
}

select{
  height:36px;
  padding:0 10px;
  color:#fff;
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  border-radius:14px;
  font-family:Orbitron,sans-serif;
  font-size:9px;
  font-weight:700;
}

select option{
  background:#111;
  color:#fff;
}

input[type=color]{
  height:34px;
  padding:3px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  border-radius:14px;
}

.btn-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.panel-section{
  overflow:hidden;
  max-height:700px;
  opacity:1;
  transition:max-height .25s ease,opacity .2s ease;
}

.panel-section.hidden{
  max-height:0;
  opacity:0;
  pointer-events:none;
}

.telemetry-box{
  padding:9px;
  background:rgba(0,0,0,.42);
  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.telemetry-top{
  display:flex;
  justify-content:space-between;
  color:var(--dim);
  font-size:8px;
}

.telemetry-top strong{
  color:#fff;
}

.hand-card{
  padding:6px 0 6px 8px;
  border-left:2px solid rgba(255,255,255,.25);
  font-size:8px;
}

.hand-card.left{
  border-color:var(--green);
}

.hand-card.right{
  border-color:var(--pink);
}

.telemetry-row{
  display:flex;
  justify-content:space-between;
  padding:2px 0;
  color:var(--dim);
}

.telemetry-val{
  color:#fff;
}

.state-tracking{
  color:var(--green)!important;
}

.state-lost{
  color:var(--red)!important;
}

.state-searching{
  color:var(--yellow)!important;
}

.hand-indicator{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  margin-right:4px;
  background:#444;
  box-shadow:0 0 0 transparent;
}

.hand-indicator.on{
  background:var(--green);
  box-shadow:0 0 9px var(--green);
}

.hand-indicator.right.on{
  background:var(--pink);
  box-shadow:0 0 9px var(--pink);
}

#builder-selection{
  min-height:16px;
  color:var(--yellow);
  font-size:8px;
  letter-spacing:.7px;
}

/* ================= CAMERA ================= */

.camera-preview-container{
  position:absolute;
  right:18px;
  bottom:20px;
  width:240px;
  height:180px;
  z-index:10;
  overflow:hidden;
  background:rgba(5,7,9,.82);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 12px 25px rgba(0,0,0,.65);
  contain:strict;
}

#hand-preview-canvas{
  width:100%;
  height:100%;
  display:block;
  transform:scaleX(-1);
  opacity:.9;
}

.preview-hud-tag{
  position:absolute;
  top:6px;
  left:7px;
  z-index:2;
  padding:2px 6px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(0,0,0,.72);
  font-size:7px;
  letter-spacing:1px;
  pointer-events:none;
}

.preview-status{
  position:absolute;
  right:7px;
  top:6px;
  padding:2px 5px;
  border-radius:8px;
  background:rgba(0,0,0,.72);
  font-size:7px;
  color:var(--yellow);
}

/* ================= BUILDER TARGET ================= */

#selection-ring{
  position:absolute;
  width:45px;
  height:45px;
  border:1px solid var(--yellow);
  border-radius:50%;
  z-index:8;
  pointer-events:none;
  display:none;
  box-shadow:0 0 12px rgba(255,230,109,.3);
}

#selection-ring::before,
#selection-ring::after{
  content:"";
  position:absolute;
  left:50%;
  top:-6px;
  width:1px;
  height:57px;
  background:rgba(255,230,109,.55);
}

#selection-ring::after{
  transform:rotate(90deg);
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .stark-header{
    height:50px;
    padding:0 10px;
  }

  .stark-title{
    font-size:9px;
    gap:6px;
  }

  .security-badge{
    display:none;
  }

  .hud-status{
    font-size:7px;
    min-width:75px;
  }

  .search-hud-container {
    top: 55px;
    padding: 4px 8px;
  }

  .search-hud-container input {
    width: 130px;
    font-size: 9px;
  }

  .ui-overlay{
    top:95px;
    left:8px;
    width:245px;
    max-height:calc(100vh - 160px);
    padding:12px;
    border-radius:18px;
  }

  .mode-dock{
    bottom:10px;
    width:calc(100% - 20px);
    justify-content:center;
  }

  .tab-btn{
    flex:1;
    padding:9px 5px;
    font-size:7px;
  }

  .camera-preview-container{
    width:150px;
    height:112px;
    right:8px;
    bottom:62px;
    border-radius:14px;
  }

  .preview-hud-tag{
    font-size:5px;
  }

  .preview-status{
    font-size:5px;
  }
}

@media(max-width:430px){

  .ui-overlay{
    width:220px;
  }

  .camera-preview-container{
    width:130px;
    height:98px;
  }

  .stark-btn{
    font-size:8px;
  }
}

@media(max-width:700px){

  .ui-overlay,
  .mode-dock,
  .stark-header,
  .search-hud-container{
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
  }
}
</style>

<script>
'use strict';

/* =========================================================
   CONFIG
========================================================= */

const IS_MOBILE =
  /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  innerWidth <= 700;

const CONFIG = {

  particles: IS_MOBILE ? 3000 : 4000,

  handFPS: IS_MOBILE ? 20 : 24,

  cameraWidth: IS_MOBILE ? 256 : 320,
  cameraHeight: IS_MOBILE ? 192 : 240,

  handSmooth: 0.72,

  pinchOn: 0.075,
  pinchOff: 0.105,

  particleSmooth: 0.22,
  particleReaction: 0.08,

  maxBlocks: 28,

  builderGravity: 0.06,

  throwPower: 0,

  snapSize: 1,

  axisSensitivity: 0.50,

  rollSensitivity: 0.34,

  renderScale:
    IS_MOBILE
      ? 1
      : Math.min(window.devicePixelRatio || 1, 1.5),

  colors:{
    white:0xffffff,
    green:0x00ffcc,
    pink:0xff00aa,
    yellow:0xffe66d,
    cyan:0x00e8ff
  }

};

const PARTICLE_COUNT = CONFIG.particles;

/* =========================================================
   SOUND
========================================================= */

class SciFiSoundSystem{

  constructor(){
    this.ctx=null;
    this.humOsc=null;
    this.humGain=null;
    this.enabled=true;
    this.initialized=false;
  }

  init(){

    if(this.initialized)return;

    try{

      const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioCtx)return;

      this.ctx=new AudioCtx();

      this.humOsc=this.ctx.createOscillator();
      this.humGain=this.ctx.createGain();

      this.humOsc.type='sine';
      this.humOsc.frequency.value=50;

      this.humGain.gain.value=0.008;

      this.humOsc.connect(this.humGain);
      this.humGain.connect(this.ctx.destination);

      this.humOsc.start();

      this.initialized=true;

    }catch(e){
      console.warn('Audio non disponibile',e);
    }

  }

  pinch(){

    if(!this.enabled)return;

    this.init();

    if(!this.initialized)return;

    const o=this.ctx.createOscillator();
    const g=this.ctx.createGain();

    const t=this.ctx.currentTime;

    o.type='sine';

    o.frequency.setValueAtTime(220,t);
    o.frequency.exponentialRampToValueAtTime(700,t+0.07);

    g.gain.setValueAtTime(0.1,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.07);

    o.connect(g);
    g.connect(this.ctx.destination);

    o.start(t);
    o.stop(t+0.07);

  }

}

/* =========================================================
   GLOW TEXTURE
========================================================= */

function createGlowTexture(){

  const c=
    document.createElement(
      'canvas'
    );

  c.width=64;
  c.height=64;

  const ctx=
    c.getContext('2d');

  const g=
    ctx.createRadialGradient(
      32,
      32,
      1,
      32,
      32,
      32
    );

  g.addColorStop(
    0,
    'rgba(255,255,255,1)'
  );

  g.addColorStop(
    0.18,
    'rgba(255,255,255,.98)'
  );

  g.addColorStop(
    0.42,
    'rgba(255,255,255,.65)'
  );

  g.addColorStop(
    0.7,
    'rgba(255,255,255,.18)'
  );

  g.addColorStop(
    1,
    'rgba(255,255,255,0)'
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    64,
    64
  );

  const texture=
    new THREE.CanvasTexture(c);

  texture.generateMipmaps=false;

  texture.minFilter=
    THREE.LinearFilter;

  texture.magFilter=
    THREE.LinearFilter;

  return texture;

}

/* =========================================================
   PREVIEW
========================================================= */

let previewCtx;

function initPreview(){

  previewCtx=
    dom.preview.getContext(
      '2d'
    );

  drawPreview([]);

}

function drawPreview(hands){

  const ctx=previewCtx;

  const w=dom.preview.width;
  const h=dom.preview.height;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  ctx.fillStyle=
    'rgba(5,10,14,.92)';

  ctx.fillRect(
    0,
    0,
    w,
    h
  );

  if(!hands?.length){

    ctx.fillStyle=
      'rgba(255,255,255,.35)';

    ctx.font=
      '9px "Share Tech Mono"';

    ctx.textAlign='center';

    ctx.fillText(
      'SEARCHING HANDS...',
      w/2,
      h/2
    );

    return;

  }

  hands.forEach(
    (landmarks,i)=>{

      ctx.strokeStyle=
        i===0
          ? '#00ffcc'
          : '#ff00aa';

      ctx.lineWidth=1.5;

      HAND_CONNECTIONS.forEach(
        pair=>{

          const a=
            landmarks[pair[0]];

          const b=
            landmarks[pair[1]];

          ctx.beginPath();

          ctx.moveTo(
            a.x*w,
            a.y*h
          );

          ctx.lineTo(
            b.x*w,
            b.y*h
          );

          ctx.stroke();

        }
      );

      landmarks.forEach(
        (p,index)=>{

          ctx.fillStyle=
            (
              index===4 ||
              index===8
            )
              ? '#ffe66d'
              : (
                  i===0
                    ? '#00ffcc'
                    : '#ff00aa'
                );

          ctx.beginPath();

          ctx.arc(
            p.x*w,
            p.y*h,
            (
              index===4 ||
              index===8
            )
              ? 3
              : 1.7,
            0,
            Math.PI*2
          );

          ctx.fill();

        }
      );

    }
  );

}

/* =========================================================
   SPAWN BUILDER OBJECT
========================================================= */

function spawnShape(
  type,
  x,
  y,
  z
){

  let geo;

  const size=3;

  switch(type){

    case 'sphere':
      geo=
        new THREE.SphereGeometry(
          1.65,
          12,
          12
        );
      break;

    case 'pyramid':
      geo=
        new THREE.ConeGeometry(
          2.1,
          3,
          4
        );
      break;

    case 'torus':
      geo=
        new THREE.TorusGeometry(
          1.5,
          .5,
          8,
          16
        );
      break;

    case 'cylinder':
      geo=
        new THREE.CylinderGeometry(
          1.5,
          1.5,
          3,
          12
        );
      break;

    case 'icosahedron':
      geo=
        new THREE.IcosahedronGeometry(
          1.9
        );
      break;

    default:
      geo=
        new THREE.BoxGeometry(
          size,
          size,
          size
        );

  }

  const color=
    Math.random()>.5
      ? 0xffffff
      : 0x888888;

  const mesh=
    new THREE.Mesh(

      geo,

      new THREE.MeshStandardMaterial({
        color,
        roughness:.35,
        metalness:.2
      })

    );

  mesh.position.set(

    x ??
      (Math.random()-.5)*8,

    y ?? 6,

    z ??
      (Math.random()-.5)*4

  );

  mesh.rotation.set(
    0,
    0,
    0
  );

  mesh.userData={

    originalColor:color,

    velocity:
      new THREE.Vector3(),

    isGrabbed:false,

    size,

    type

  };

  builderGroup.add(
    mesh
  );

  blocks.push(
    mesh
  );

  if(
    blocks.length>
    CONFIG.maxBlocks
  ){

    disposeBlock(
      blocks.shift()
    );

  }

}

/* =========================================================
   DISPOSE BLOCK
========================================================= */

function disposeBlock(block){

  if(!block)return;

  builderGroup.remove(
    block
  );

  block.geometry?.dispose();

  block.material?.dispose();

  if(
    selectedBlock===block
  ){

    selectedBlock=null;

  }

}

/* =========================================================
   CLEAR
========================================================= */

function clearBlocks(){

  blocks.forEach(
    disposeBlock
  );

  blocks=[];

  controllers.forEach(
    c=>{
      c.grabbedBlock=null;
      c.isPinching=false;
    }
  );

  selectedBlock=null;

  updateSelectionUI();

}

/* =========================================================
   HIGHLIGHT
========================================================= */

function highlightBlock(
  block,
  on
){

  if(!block)return;

  block.material.color.setHex(

    on
      ? CONFIG.colors.yellow
      : block.userData.originalColor

  );

}

/* =========================================================
   SNAP
========================================================= */

function snapBlock(block){

  if(!block)return;

  const s=
    CONFIG.snapSize;

  block.position.x=
    Math.round(
      block.position.x/s
    )*s;

  block.position.y=
    Math.round(
      block.position.y/s
    )*s;

  block.position.z=
    Math.round(
      block.position.z/s
    )*s;

}

/* =========================================================
   SELECTION UI
========================================================= */

function updateSelectionUI(){

  if(selectedBlock){

    dom.selection.textContent=
      'TARGET: '+
      selectedBlock
        .userData
        .type
        .toUpperCase();

    dom.ring.style.display=
      'block';

  }else{

    dom.selection.textContent=
      'TARGET: NESSUN OGGETTO';

    dom.ring.style.display=
      'none';

  }

}

/* =========================================================
   CPU PARTICLE FALLBACK
========================================================= */

function generateCPU(i){

  function iso(
    x,
    y,
    z
  ){

    const a=.38;
    const b=.55;

    const cosA=
      Math.cos(a);

    const sinA=
      Math.sin(a);

    const cosB=
      Math.cos(b);

    const sinB=
      Math.sin(b);

    let x1=
      x*cosB-z*sinB;

    let z1=
      x*sinB+z*cosB;

    let y1=
      y*cosA-z1*sinA;

    z1=
      y*sinA+z1*cosA;

    return{
      x:x1,
      y:y1,
      z:z1
    };

  }

  if(i<1100){

    const teeth=20;

    const a=
      Math.random()*
      Math.PI*2;

    const ring=i%5;

    let r=
      2.6+
      ring*.48;

    if(
      ring===4 &&
      Math.sin(a*teeth)>.5
    ){

      r+=
        .5+
        Math.random()*.3;

    }

    const y=
      (Math.random()-.5)*.5;

    return iso(
      Math.cos(a)*r,
      y+.9,
      Math.sin(a)*r
    );

  }

  if(i<1400){

    const a=
      Math.random()*
      Math.PI*2;

    const r=
      Math.random()*2.3;

    return iso(
      Math.cos(a)*r,
      (Math.random()-.5)*.35+.9,
      Math.sin(a)*r
    );

  }

  if(i<2000){

    const x=
      (Math.random()-.5)*14;

    const z=
      (Math.random()-.5)*9;

    const y=
      (Math.random()-.5)*.1;

    return iso(
      x,
      y,
      z
    );

  }

  if(i<2800){

    const line=i%12;

    const t=
      Math.random()*2-1;

    let x=0;
    let z=0;
    let y=.2;

    if(line<5){

      x=t*6.5;

      z=(line-2)*1.5;

      y+=
        Math.sin(t*5)*.05;

    }else if(line<10){

      z=t*4.5;

      x=(line-7)*2.2;

      y+=
        Math.sin(t*4)*.04;

    }else{

      const a=t*Math.PI;

      const r=
        3+
        Math.random()*3.5;

      x=
        Math.cos(a)*r;

      z=
        Math.sin(a)*r*.65;

    }

    return iso(
      x,
      y,
      z
    );

  }

  if(i<3200){

    const a=
      (i%20)*
      (Math.PI*2/20)+
      (Math.random()-.5)*.1;

    const r=
      3.5+
      Math.random()*5;

    return iso(
      Math.cos(a)*r,
      .18,
      Math.sin(a)*r
    );

  }

  if(i<3600){

    const chip=i%10;

    const cx=
      ((chip%5)-2)*2.8;

    const cz=
      (Math.floor(chip/5)-.5)*3.5;

    return iso(

      cx+
        (Math.random()-.5)*1.3,

      .3+
        Math.random()*.7,

      cz+
        (Math.random()-.5)*1

    );

  }

  if(i<3850){

    const side=i%4;

    let x,z;

    if(side===0){

      x=-7.2;

      z=
        (Math.random()-.5)*7;

    }else if(side===1){

      x=7.2;

      z=
        (Math.random()-.5)*7;

    }else if(side===2){

      z=-4.8;

      x=
        (Math.random()-.5)*11;

    }else{

      z=4.8;

      x=
        (Math.random()-.5)*11;

    }

    return iso(
      x,
      .15+
        Math.random()*.5,
      z
    );

  }

  const a=
    Math.random()*
    Math.PI*2;

  const r=
    6+
    Math.random()*2.5;

  return iso(

    Math.cos(a)*r,

    (Math.random()-.5)*.8,

    Math.sin(a)*r

  );

}

/* =========================================================
   GENERATE PARTICLE SHAPE
========================================================= */

function generateShape(type){

  if(
    type==='cpu' ||
    type==='gpu' ||
    type==='ram' ||
    type==='ssd'
  ){

    isCpuHologram=
      type==='cpu';

    hardwareType=type;

    particleSystem.visible=false;

    Object.values(
      hardwareGroups
    ).forEach(
      g=>g.visible=false
    );

    const selected=
      hardwareGroups[type];

    if(selected){

      selected.visible=true;

      hologramGroup=
        selected;

    }

    shapePulse=1;

    return;

  }

  isCpuHologram=false;

  hardwareType=null;

  Object.values(
    hardwareGroups
  ).forEach(
    g=>g.visible=false
  );

  particleSystem.visible=true;

  const p=
    targetPositions;

  for(
    let i=0;
    i<PARTICLE_COUNT;
    i++
  ){

    const j=i*3;

    let x=0;
    let y=0;
    let z=0;

    if(
      type==='jupiter' ||
      type==='saturn'
    ){

      const saturn=
        type==='saturn';

      const body=
        saturn?.5:.75;

      if(
        i<
        PARTICLE_COUNT*body
      ){

        const a=
          Math.random()*
          Math.PI*2;

        const b=
          Math.acos(
            Math.random()*2-1
          );

        const r=
          saturn?5:7;

        x=
          r*
          Math.sin(b)*
          Math.cos(a);

        y=
          r*
          Math.cos(b)*
          (saturn?1:.85);

        z=
          r*
          Math.sin(b)*
          Math.sin(a);

      }else{

        const a=
          Math.random()*
          Math.PI*2;

        const r=
          (saturn?7:9)+
          Math.random()*
          (saturn?6:4);

        x=
          Math.cos(a)*r;

        z=
          Math.sin(a)*r;

        y=
          (Math.random()-.5)*.2;

      }

    }else if(type==='galaxy'){

      const arm=i%4;

      const r=
        Math.pow(
          Math.random(),
          1.5
        )*15;

      const a=
        r*.4+
        arm*Math.PI/2;

      x=
        Math.cos(a)*r+
        (Math.random()-.5)*.7;

      z=
        Math.sin(a)*r+
        (Math.random()-.5)*.7;

      y=
        (Math.random()-.5)*
        Math.max(
          .2,
          1.8-r*.1
        );

    }else if(type==='DNA'){

      const t=
        i/PARTICLE_COUNT*
        Math.PI*12;

      const strand=
        i%2?-1:1;

      x=
        Math.sin(t)*4*strand;

      y=
        i/PARTICLE_COUNT*16-8;

      z=
        Math.cos(t)*4*strand;

    }else if(type==='hypercube'){

      const s=6;

      const t=
        Math.random()*s-s/2;

      const side=i%12;

      if(side===0){
        x=s/2;

        z=s/2;
      }else if(side===1){
        x=-s/2;
        y=t;
        z=s/2;
      }else if(side===2){
        x=t;
        y=s/2;
        z=s/2;
      }else if(side===3){
        x=t;
        y=-s/2;
        z=s/2;
      }else if(side===4){
        x=s/2;
        y=t;
        z=-s/2;
      }else if(side===5){
        x=-s/2;
        y=t;
        z=-s/2;
      }else if(side===6){
        x=t;
        y=s/2;
        z=-s/2;
      }else if(side===7){
        x=t;
        y=-s/2;
        z=-s/2;
      }else if(side===8){
        x=s/2;
        y=s/2;
        z=t;
      }else if(side===9){
        x=-s/2;
        y=s/2;
        z=t;
      }else if(side===10){
        x=s/2;
        y=-s/2;
        z=t;
      }else{
        x=-s/2;
        y=-s/2;
        z=t;
      }

    }else if(type==='heart'){

      const t=
        Math.random()*
        Math.PI*2;

      x=
        16*
        Math.pow(
          Math.sin(t),
          3
        )*.55;

      y=
        (
          13*Math.cos(t)-
          5*Math.cos(2*t)-
          2*Math.cos(3*t)-

        )*.55;

/* =========================================================
   HAND TRACKING
========================================================= */

async function initHandTracking(){

  setConnection(
    'CAM: CONNECTING',
    'yellow'
  );

  dom.mp.textContent=
    'SEARCHING';

  const hands=
    new Hands({

      locateFile:
        file =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

    });

  hands.setOptions({

    maxNumHands:2,

    modelComplexity:0,

    minDetectionConfidence:.45,

    minTrackingConfidence:.45

  });

  let processing=false;

  let lastProcess=0;

  const interval=
    1000/
    CONFIG.handFPS;

  hands.onResults(
    results=>{

      processing=false;

      const landmarks=
        results.multiHandLandmarks ||
        [];

      const handed=
        results.multiHandedness ||
        [];

      drawPreview(
        landmarks
      );

      dom.mp.textContent=
        landmarks.length
          ? 'TRACKING'
          : 'SEARCHING';

      const mapped={
        Left:null,
        Right:null
      };

      handed.forEach(
        (item,i)=>{

          if(
            item?.label &&
            landmarks[i]
          ){

            mapped[
              item.label
            ]=
              landmarks[i];

          }

        }
      );

      controllers.forEach(
        ctrl=>{

          const lm=
            mapped[ctrl.side];

          if(lm){

            updateController(
              ctrl,
              lm
            );

          }else{

            loseController(
              ctrl
            );

          }

        }
      );

      updateParticleTargets();

    }
  );

  const cameraUtils=
    new Camera(
      dom.video,
      {

        onFrame:
          async()=>{

            if(
              !pageVisible
            )return;

            if(processing)
              return;

            const now=
              performance.now();

            if(
              now-lastProcess<
              interval
            )return;

            if(
              dom.video.readyState<2
            )return;

            lastProcess=now;

            processing=true;

            try{

              await hands.send({
                image:dom.video
              });

            }catch(e){

              processing=false;

              setConnection(
                'CAM: ERROR',
                'red'
              );

              dom.mp.textContent=
                'ERROR';

            }

          },

        width:
          CONFIG.cameraWidth,

        height:
          CONFIG.cameraHeight

      }
    );

  try{

    cameraUtils.start();

    setConnection(
      'CAM: STARTING',
      'yellow'
    );

  }catch(e){

    setConnection(
      'CAM: FAILED',
      'red'
    );

    console.warn(
      'Camera error',
      e
    );

  }

  dom.video.addEventListener(
    'loadeddata',
    ()=>{

      setConnection(
        'CAM: ONLINE',
        'green'
      );

      dom.previewStatus.textContent=
        'ONLINE';

    }
  );

  dom.video.addEventListener(
    'error',
    ()=>{

      setConnection(
        'CAM: ERROR',
        'red'
      );

      dom.previewStatus.textContent=
        'ERROR';

    }
  );

}

/* =========================================================
   UPDATE HAND
========================================================= */

function updateController(
  ctrl,
  landmarks
){

  const now=
    performance.now();

  ctrl.active=true;

  ctrl.lastSeen=now;

  const thumb=
    landmarks[4];

  const index=
    landmarks[8];

  const centerX=
    (thumb.x+index.x)*.5;

  const centerY=
    (thumb.y+index.y)*.5;

  const centerZ=
    (thumb.z+index.z)*.5;

  // Calcolo pinch tra pollice e indice
  const dx = thumb.x - index.x;
  const dy = thumb.y - index.y;
  const dz = (thumb.z || 0) - (index.z || 0);
  const pinchDist = Math.sqrt(dx*dx + dy*dy + dz*dz);

  const isPinchingNow = pinchDist < CONFIG.pinchOn;

  if(isPinchingNow && !ctrl.isPinching){
    ctrl.isPinching = true;
    sounds.pinch();
  } else if(!isPinchingNow && pinchDist > CONFIG.pinchOff){
    ctrl.isPinching = false;
  }

  // Conversione coordinate 2D hand tracking a 3D World space
  const worldX = (0.5 - centerX) * 30;
  const worldY = (0.5 - centerY) * 20 + 2;
  const worldZ = centerZ * 20;

  ctrl.target.set(worldX, worldY, worldZ);
  ctrl.pos.lerp(ctrl.target, CONFIG.handSmooth);

  ctrl.mesh.position.copy(ctrl.pos);
  ctrl.mesh.visible = true;

  ctrl.statusEl.textContent = 'TRACKING';
  ctrl.statusEl.className = 'telemetry-val state-tracking';
  ctrl.grabEl.textContent = ctrl.isPinching ? 'PINCH' : 'OPEN';
  ctrl.dotEl.classList.add('on');

  // Gestione interazione Finestra 3D Trasparente
  if(glassWindowMesh){
    if(ctrl.isPinching){
      const distToGlass = ctrl.pos.distanceTo(glassWindowMesh.position);
      if(distToGlass < 6 && !isGlassWindowGrabbed){
        isGlassWindowGrabbed = true;
        glassWindowGrabOffset.subVectors(glassWindowMesh.position, ctrl.pos);
      }
      if(isGlassWindowGrabbed){
        glassWindowMesh.position.copy(ctrl.pos).add(glassWindowGrabOffset);
      }
    } else {
      isGlassWindowGrabbed = false;
    }
  }
}

function loseController(ctrl){
  ctrl.active = false;
  ctrl.mesh.visible = false;
  ctrl.statusEl.textContent = 'SEARCHING';
  ctrl.statusEl.className = 'telemetry-val state-searching';
  ctrl.grabEl.textContent = 'OPEN';
  ctrl.dotEl.classList.remove('on');
}

/* =========================================================
   LISTENERS & LOGIC
========================================================= */

function setupEventListeners(){

  dom.tabBuilder.addEventListener('click', ()=>{
    currentMode = 'BUILDER';
    dom.tabBuilder.classList.add('active');
    dom.tabParticles.classList.remove('active');
    dom.builder.classList.remove('hidden');
    dom.particles.classList.add('hidden');
    dom.panelTitle.textContent = '3D BUILDER';
    dom.mode.textContent = 'BUILDER';
    builderGroup.visible = true;
    particleGroup.visible = false;
  });

  dom.tabParticles.addEventListener('click', ()=>{
    currentMode = 'PARTICLES';
    dom.tabParticles.classList.add('active');
    dom.tabBuilder.classList.remove('active');
    dom.particles.classList.remove('hidden');
    dom.builder.classList.add('hidden');
    dom.panelTitle.textContent = 'PARTICLE MATRIX';
    dom.mode.textContent = 'PARTICLES';
    builderGroup.visible = false;
    particleGroup.visible = true;
  });

  dom.shapeSelect.addEventListener('change', (e)=>{
    generateShape(e.target.value);
  });

  dom.colorPicker.addEventListener('input', (e)=>{
    const colorHex = parseInt(e.target.value.replace('#',''), 16);
    if(particleMaterial) particleMaterial.color.setHex(colorHex);
  });

  dom.audio.addEventListener('click', ()=>{
    sounds.enabled = !sounds.enabled;
    dom.audio.textContent = sounds.enabled ? '🔊 AUDIO: ATTIVO' : '🔇 AUDIO: DISATTIVATO';
  });

  dom.clear.addEventListener('click', clearBlocks);

  document.querySelectorAll('.spawn-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const shape = btn.getAttribute('data-shape');
      spawnShape(shape);
    });
  });

  // Ricerca HUD
  function handleSearch(){
    const query = dom.hudSearchInput.value.toLowerCase().trim();
    if(!query) return;

    let found = false;
    Array.from(dom.shapeSelect.options).forEach(opt => {
      if(opt.value.toLowerCase().includes(query) || opt.text.toLowerCase().includes(query)){
        dom.shapeSelect.value = opt.value;
        generateShape(opt.value);
        found = true;
      }
    });

    if(!found){
      alert('Nessun template trovato per: ' + query);
    }
  }

  dom.hudSearchBtn.addEventListener('click', handleSearch);
  dom.hudSearchInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') handleSearch();
  });

}

/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate(now){

  requestAnimationFrame(animate);

  const delta = (now - lastFrame) / 1000;
  lastFrame = now;

  // Calcolo FPS
  fpsFrames++;
  if(now - fpsTime >= 1000){
    dom.fps.textContent = fpsFrames;
    fpsFrames = 0;
    fpsTime = now;
  }

  // Animazione Particelle o Ologrammi
  if(currentMode === 'PARTICLES'){
    if(!hardwareType){
      const pos = particleGeometry.attributes.position.array;
      for(let i = 0; i < PARTICLE_COUNT * 3; i++){
        pos[i] += (targetPositions[i] - pos[i]) * CONFIG.particleSmooth;
      }
      particleGeometry.attributes.position.needsUpdate = true;
      particleGroup.rotation.y += 0.003;
    } else if(hologramGroup){
      hologramGroup.rotation.y += 0.005;
    }
  } else if(currentMode === 'BUILDER'){
    blocks.forEach(b => {
      if(!b.userData.isGrabbed && b.position.y > -4.5){
        b.position.y -= CONFIG.builderGravity;
        if(b.position.y < -4.5) b.position.y = -4.5;
      }
    });
  }

  renderer.render(scene, camera);

}

/* =========================================================
   INIT
========================================================= */

window.addEventListener('DOMContentLoaded', ()=>{
  initThree();
  setupEventListeners();
  initHandTracking();
  requestAnimationFrame(animate);
});

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.addEventListener('visibilitychange', ()=>{
  pageVisible = !document.hidden;
});
