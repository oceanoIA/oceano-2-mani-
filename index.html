/* =========================================================

========================================================= */

class SciFiSoundSystem {

    constructor() {

        this.ctx = null;

        this.humOsc = null;

        this.humGain = null;

        this.enabled = true;

        this.initialized = false;

    }

    init() {

        if (this.initialized)
            return;

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext)
            return;

        this.ctx = new AudioContext();

        this.humOsc =
            this.ctx.createOscillator();

        this.humGain =
            this.ctx.createGain();

        this.humOsc.type = "sine";

        this.humOsc.frequency.setValueAtTime(
            48,
            this.ctx.currentTime
        );

        this.humGain.gain.setValueAtTime(
            0.006,
            this.ctx.currentTime
        );

        this.humOsc.connect(this.humGain);

        this.humGain.connect(
            this.ctx.destination
        );

        this.humOsc.start();

        this.initialized = true;

    }

    playPinch() {

        if (!this.enabled || !this.initialized)
            return;

        const osc =
            this.ctx.createOscillator();

        const gain =
            this.ctx.createGain();

        const now =
            this.ctx.currentTime;

        osc.type = "sine";

        osc.frequency.setValueAtTime(
            220,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            850,
            now + .07
        );

        gain.gain.setValueAtTime(
            .10,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .07
        );

        osc.connect(gain);

        gain.connect(
            this.ctx.destination
        );

        osc.start(now);

        osc.stop(now + .07);

    }

}

const sounds =

/* =========================================================
   THREE INITIALIZATION
========================================================= */

function initThree() {

    const container =
        document.getElementById(
            "canvas-container"
        );

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x000000);


    camera =
        new THREE.PerspectiveCamera(
            55,
            window.innerWidth /
            window.innerHeight,
            .1,
            1000
        );

    camera.position.set(
        0,
        3,
        28
    );

    camera.lookAt(
        0,
        0,
        0
    );


    renderer =
        new THREE.WebGLRenderer({

            antialias: false,

            powerPreference:
                "high-performance",

            stencil: false,

            depth: true

        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            CONFIG.maxPixelRatio
        )
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    container.appendChild(
        renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ===================================================== */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            .75
        );

    scene.add(ambient);


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            .9
        );

    directional.position.set(
        10,
        20,
        15
    );

    scene.add(directional);


    /* =====================================================
       BUILDER
    ===================================================== */

    builderGroup =
        new THREE.Group();

    builderGroup.visible =
        false;

    scene.add(
        builderGroup
    );


    createBuilderEnvironment();

    createControllers();


    /* =====================================================
       PARTICLES
    ===================================================== */

    particleGroup =
        new THREE.Group();

    scene.add(
        particleGroup
    );


    targetPositions =
        new Float32Array(
            CONFIG.particles * 3
        );

    currentPositions =
        new Float32Array(
            CONFIG.particles * 3
        );


    for (
        let i = 0;
        i < CONFIG.particles * 3;
        i++
    ) {

        currentPositions[i] =
            (Math.random() - .5) * 35;

        targetPositions[i] =
            currentPositions[i];

    }


    particleGeometry =
        new THREE.BufferGeometry();


    const positionAttribute =
        new THREE.BufferAttribute(
            currentPositions,
            3
        );

    positionAttribute.setUsage(
        THREE.DynamicDrawUsage
    );

    particleGeometry.setAttribute(
        "position",
        positionAttribute
    );


    /* =====================================================
       PARTICLE COLORS
    ===================================================== */

    const colors =
        new Float32Array(
            CONFIG.particles * 3
        );

    for (
        let i = 0;
        i < CONFIG.particles;
        i++
    ) {

        const n =
            Math.random();

        const c =
            n < .70
            ? .98
            : n < .90
            ? .65
            : .35;

        const idx =
            i * 3;

        colors[idx] = c;
        colors[idx + 1] = c;
        colors[idx + 2] = c;

    }

    particleGeometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            colors,
            3
        )
    );


    /* =====================================================
       PARTICLE TEXTURE
    ===================================================== */

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 32;
    canvas.height = 32;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "#ffffff";

    ctx.beginPath();

    ctx.arc(
        16,
        16,
        14,
        0,
        Math.PI * 2
    );

    ctx.fill();


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.needsUpdate =
        true;


    particleMaterial =
        new THREE.PointsMaterial({

            size: .23,

            vertexColors: true,

            map: texture,

            transparent: true,

            opacity: .95,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false

        });


    particleSystem =
        new THREE.Points(
            particleGeometry,
            particleMaterial
        );

    particleGroup.add(
        particleSystem
    );


    generateShape(
        "jupiter"
    );


    previewCanvas =
        document.getElementById(
            "hand-preview-canvas"
        );

    previewCtx =
        previewCanvas.getContext(
            "2d"
        );


    window.addEventListener(
        "resize",
        onWindowResize,
        { passive: true }
    );

}

========================================================= */

function spawnShape(
    type,
    x,
    y,
    z
) {

    sounds.init();

    let object;

    const specialTypes = [

        "robot",
        "astronaut",
        "head",
        "dog",
        "cat",
        "bird",
        "fish",
        "butterfly",
        "snake",
        "scorpion",
        "spider",
        "car",
        "airplane",
        "helicopter",
        "phone",
        "computer",
        "cup",
        "clock",
        "key",
        "house",
        "tree",
        "flower"

    ];


    if (
        specialTypes.includes(type)
    ) {

        object =
            makeSpecialBuilder(type);

    } else {

        const material =
            new THREE.MeshStandardMaterial({

                color:
                    Math.random() > .5
                    ? 0xffffff
                    : 0x888888,

                roughness: .3,

                metalness: .25

            });


        object =
            new THREE.Mesh(
                makeGeometry(type),
                material
            );

    }


    object.position.set(

        x !== undefined
        ? x
        : (Math.random() - .5) * 8,

        y !== undefined
        ? y
        : 5 + Math.random() * 3,

        z !== undefined
        ? z
        : (Math.random() - .5) * 5

    );


    /* =====================================================
       REAL PHYSICAL BOUNDS
    ===================================================== */

    object.updateMatrixWorld(
        true
    );

    const box =
        new THREE.Box3().setFromObject(
            object
        );

    const size =
        new THREE.Vector3();

    box.getSize(size);


    object.userData = {

        velocity:
            new THREE.Vector3(),

        isGrabbed: false,

        originalColor:
            object.children.length
            ? null
            : object.material.color.getHex(),

        halfWidth:
            Math.max(size.x / 2, .4),

        halfHeight:
            Math.max(size.y / 2, .4),

        halfDepth:
            Math.max(size.z / 2, .4),

        width: Math.max(size.x, .8),

        height: Math.max(size.y, .8),

        depth: Math.max(size.z, .8)

    };


    builderGroup.add(
        object
    );

    blocks.push(
        object
    );


    return object;

}


/* =========================================================
   REMOVE ALL
========================================================= */

function clearBlocks() {

    blocks.forEach(
        block => {

            builderGroup.remove(
                block
            );

            block.traverse(
                child => {

                    if (
                        child.geometry
                    ) {

                        child.geometry.dispose();

                    }

                    if (
                        child.material
                    ) {

                        child.material.dispose();

                    }

                }
            );

        }
    );


    blocks.length = 0;


    controllers.forEach(
        ctrl => {

            ctrl.grabbedBlock =
                null;

            ctrl.isPinching =
                false;

        }
    );

}


/* =========================================================
   BLOCK HIGHLIGHT
========================================================= */

function setBlockHighlight(
    block,
    grabbed
) {

    if (!block)
        return;


    block.traverse(
        child => {

            if (
                child.isMesh &&
                child.material &&
                child.material.color
            ) {

                if (grabbed) {

                    child.material.color.setHex(
                        0xffffff
                    );

                } else if (
                    block.userData.originalColor !== null
                ) {

                    child.material.color.setHex(
                        block.userData.originalColor
                    );

                }

            }

        }
    );

}


/* =========================================================
   REALISTIC COLLISION / STACKING
========================================================= */

function updatePhysics() {

    const gravity =
        CONFIG.gravity;


    for (
        let i = 0;
        i < blocks.length;
        i++
    ) {

        const block =
            blocks[i];

        if (
            block.userData.isGrabbed
        )
            continue;


        const data =
            block.userData;


        data.velocity.y +=
            gravity;


        block.position.y +=
            data.velocity.y;


        /*
         * FLOOR
         */

        const floorTop =
            CONFIG.floorY +
            data.halfHeight;


        if (
            block.position.y <
            floorTop
        ) {

            block.position.y =
                floorTop;

            data.velocity.y =
                0;

        }


        /*
         * BLOCK-TO-BLOCK COLLISION
         *
         * AABB:
         * X overlap
         * Z overlap
         * Y contact
         */

        for (
            let j = 0;
            j < blocks.length;
            j++
        ) {

            if (i === j)
                continue;


            const other =
                blocks[j];


            if (
                other.userData.isGrabbed
            )
                continue;


            const a =
                block.userData;

            const b =
                other.userData;


            const overlapX =
                Math.min(
                    block.position.x + a.halfWidth,
                    other.position.x + b.halfWidth
                )
                -
                Math.max(
                    block.position.x - a.halfWidth,
                    other.position.x - b.halfWidth
                );


            const overlapZ =
                Math.min(
                    block.position.z + a.halfDepth,
                    other.position.z + b.halfDepth
                )
                -
                Math.max(
                    block.position.z - a.halfDepth,
                    other.position.z - b.halfDepth
                );


            if (
                overlapX <= 0 ||
                overlapZ <= 0
            )
                continue;


            /*
             * Only resolve vertical collision
             * when the current object is above
             * the other object.
             */

            const otherTop =
                other.position.y +
                b.halfHeight;


            const currentBottom =
                block.position.y -
                a.halfHeight;


            const verticalDistance =
                currentBottom -
                otherTop;


            if (
                verticalDistance <= .08 &&
                currentBottom >=
                other.position.y
            ) {

                block.position.y =
                    otherTop +
                    a.halfHeight;

                data.velocity.y =
                    0;

            }

        }

    }

}

/* =========================================================
   PARTICLE GENERATION HELPERS
========================================================= */

function randomSphere(
    radius
) {

    const u =
        Math.random();

    const v =
        Math.random();

    const theta =
        u * Math.PI * 2;

    const phi =
        Math.acos(
            2 * v - 1
        );

    return {

        x:
            radius *
            Math.sin(phi) *
            Math.cos(theta),

        y:
            radius *
            Math.cos(phi),

        z:
            radius *
            Math.sin(phi) *
            Math.sin(theta)

    };

}


function setParticle(
    i,
    x,
    y,
    z
) {

    const index =
        i * 3;

    targetPositions[index] =
        x;

    targetPositions[index + 1] =
        y;

    targetPositions[index + 2] =
        z;

}


/* =========================================================
   50 HOLOGRAM GENERATORS
========================================================= */

function generateShape(
    type
) {

    const total =
        CONFIG.particles;


    for (
        let i = 0;
        i < total;
        i++
    ) {

        let x = 0;
        let y = 0;
        let z = 0;


        const t =
            i / total;


        switch (type) {

            /* =============================================
               SPACE
            ============================================= */

            case "jupiter": {

                const p =
                    randomSphere(7);

                x = p.x;
                y = p.y * .85;
                z = p.z;

                break;

            }


            case "saturn": {

                if (
                    i < total * .55
                ) {

                    const p =
                        randomSphere(5);

                    x = p.x;
                    y = p.y;
                    z = p.z;

                } else {

                    const a =
                        Math.random() *
                        Math.PI * 2;

                    const r =
                        7 +
                        Math.random() * 6;

                    x =
                        Math.cos(a) * r;

                    z =
                        Math.sin(a) * r;

                    y =
                        (Math.random() - .5) *
                        .25;

                }

                break;

            }


            case "galaxy": {

                const arms = 4;

                const arm =
                    i % arms;

                const r =
                    Math.pow(
                        Math.random(),
                        1.4
                    ) * 15;

                const a =
                    r * .38 +
                    arm *
                    Math.PI * 2 /
                    arms;

                x =
                    Math.cos(a) * r +
                    (Math.random() - .5);

                z =
                    Math.sin(a) * r +
                    (Math.random() - .5);

                y =
                    (Math.random() - .5) *
                    (1.5 - r * .07);

                break;

            }


            case "nebula": {

                const p =
                    randomSphere(
                        Math.random() * 12
                    );

                x = p.x;
                y = p.y;
                z = p.z;

                break;

            }


            case "blackhole": {

                const a =
                    Math.random() *
                    Math.PI * 2;

                const r =
                    2.5 +
                    Math.random() * 9;

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                y =
                    (Math.random() - .5) *
                    .25;

                break;

            }


            case "solar": {

                const planet =
                    i % 5;

                const a =
                    t *
                    Math.PI *
                    2 *
                    (planet + 1);

                const r =
                    2 +
                    planet * 2.2;

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                y =
                    Math.sin(a * 3) *
                    .15;

                break;

            }


            case "dna":
            case "helix": {

                const angle =
                    t *
                    Math.PI *
                    14;

                const strand =
                    i % 2 === 0
                    ? 1
                    : -1;

                x =
                    Math.sin(angle) *
                    4 *
                    strand;

                z =
                    Math.cos(angle) *
                    4 *
                    strand;

                y =
                    t * 16 - 8;

                break;

            }


            case "heart": {

                const a =
                    Math.random() *
                    Math.PI * 2;

                const depth =
                    (Math.random() - .5) *
                    2.4;

                x =
                    16 *
                    Math.pow(
                        Math.sin(a),
                        3
                    ) *
                    .5;

                y =
                    (
                        13 *
                        Math.cos(a)
                        -
                        5 *
                        Math.cos(2 * a)
                        -
                        2 *
                        Math.cos(3 * a)
                        -
                        Math.cos(4 * a)
                    ) *
                    .5;

                z =
                    depth;

                break;

            }


            case "flower": {

                const a =
                    Math.random() *
                    Math.PI * 2;

                const r =
                    8 *
                    Math.sin(
                        6 * a
                    );

                x =
                    r *
                    Math.cos(a);

                z =
                    r *
                    Math.sin(a);

                y =
                    Math.sin(
                        a * 3
                    ) * 2;

                break;

            }


            case "buddha": {

                const p =
                    randomSphere(5);

                x =
                    p.x;

                y =
                    p.y - 2;

                z =
                    p.z;

                break;

            }


            case "fireworks": {

                const p =
                    randomSphere(
                        2 +
                        Math.random() * 12
                    );

                x = p.x;
                y = p.y;
                z = p.z;

                break;

            }


            case "hypercube": {

                const s = 6;

                const side =
                    i % 12;

                const q =
                    Math.random() * s -
                    s / 2;

                if (side === 0) {
                    x = s/2;
                    y = q;
                    z = s/2;
                } else if (side === 1) {
                    x = -s/2;
                    y = q;
                    z = s/2;
                } else if (side === 2) {
                    x = q;
                    y = s/2;
                    z = s/2;
                } else if (side === 3) {
                    x = q;
                    y = -s/2;
                    z = s/2;
                } else if (side === 4) {
                    x = s/2;
                    y = q;
                    z = -s/2;
                } else if (side === 5) {
                    x = -s/2;
                    y = q;
                    z = -s/2;
                } else if (side === 6) {
                    x = q;
                    y = s/2;
                    z = -s/2;
                } else if (side === 7) {
                    x = q;
                    y = -s/2;
                    z = -s/2;
                } else if (side === 8) {
                    x = s/2;
                    y = s/2;
                    z = q;
                } else if (side === 9) {
                    x = -s/2;
                    y = s/2;
                    z = q;
                } else if (side === 10) {
                    x = s/2;
                    y = -s/2;
                    z = q;
                } else {
                    x = -s/2;
                    y = -s/2;
                    z = q;
                }

                break;

            }


            case "atom": {

                const ring =
                    i % 3;

                const a =
                    t *
                    Math.PI *
                    12;

                const r =
                    7;

                x =
                    Math.cos(a + ring) *
                    r;

                y =
                    Math.sin(a + ring) *
                    r;

                z =
                    Math.sin(a * 2) *
                    2;

                break;

            }


            case "electron":
            case "orbital": {

                const a =
                    Math.random() *
                    Math.PI * 2;

                const r =
                    3 +
                    Math.random() * 8;

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                y =
                    (Math.random() - .5) *
                    2;

                break;

            }


            case "supernova": {

                const p =
                    randomSphere(
                        Math.pow(
                            Math.random(),
                            .45
                        ) * 14
                    );

                x = p.x;
                y = p.y;
                z = p.z;

                break;

            }


            case "meteor": {

                const r =
                    Math.random() * 7;

                x =
                    r;

                y =
                    (Math.random() - .5) *
                    r;

                z =
                    (Math.random() - .5) *
                    r;

                break;

            }


            case "comet": {

                if (i < total * .25) {

                    const p =
                        randomSphere(3);

                    x = p.x;
                    y = p.y;
                    z = p.z;

                } else {

                    x =
                        -Math.random() * 16;

                    y =
                        (Math.random() - .5) *
                        2;

                    z =
                        (Math.random() - .5) *
                        2;

                }

                break;

            }


            case "moon":
            case "earth":
            case "mars":
            case "neptune":
            case "uranus":
            case "sun":
            case "plasma": {

                const p =
                    randomSphere(
                        type === "sun"
                        ? 6
                        : 5
                    );

                x = p.x;
                y = p.y;
                z = p.z;

                break;

            }


            case "crystal":
            case "diamond": {

                const y0 =
                    Math.random() * 12 -
                    6;

                const r =
                    Math.max(
                        .2,
                        5 -
                        Math.abs(y0)
                    );

                const a =
                    Math.random() *
                    Math.PI * 2;

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                y =
                    y0;

                break;

            }


            case "crown": {

                const a =
                    Math.random() *
                    Math.PI * 2;

                const r =
                    5;

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                y =
                    2 +
                    Math.sin(a * 5) * 3;

                break;

            }


            case "infinity": {

                const a =
                    t *
                    Math.PI *
                    2;

                const scale =
                    8;

                x =
                    scale *
                    Math.sin(a);

                y =
                    scale *
                    Math.sin(a) *
                    Math.cos(a);

                z =
                    Math.sin(a * 2) *
                    1.5;

                break;

            }


            case "wave": {

                x =
                    (Math.random() - .5) *
                    18;

                z =
                    (Math.random() - .5) *
                    10;

                y =
                    Math.sin(x * .7) *
                    2 +
                    Math.cos(z * .5);

                break;

            }


            case "tornado": {

                const yy =
                    Math.random() *
                    14 -
                    7;

                const r =
                    1 +
                    (yy + 7) * .35;

                const a =
                    Math.random() *
                    Math.PI * 2;

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                y =
                    yy;

                break;

            }


            case "dnaflower": {

                const a =
                    t *
                    Math.PI *
                    18;

                const r =
                    7 *
                    Math.sin(a * 3);

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                y =
                    t * 14 - 7;

                break;

            }


            case "butterfly": {

                const a =
                    Math.random() *
                    Math.PI * 12;

                const r =
                    Math.exp(
                        Math.cos(a)
                    ) -
                    2 *
                    Math.cos(4 * a);

                x =
                    Math.sin(a) *
                    r *
                    2;

                y =
                    Math.cos(a) *
                    r *
                    2;

                z =
                    (Math.random() - .5) *
                    2;

                break;

            }


            case "fish": {

                const a =
                    Math.random() *
                    Math.PI * 2;

                const r =
                    Math.random() * 4;

                x =
                    Math.cos(a) * r * 2;

                y =
                    Math.sin(a) * r;

                z =
                    (Math.random() - .5) *
                    3;

                break;

            }


            case "bird":
            case "eagle": {

                x =
                    (Math.random() - .5) *
                    15;

                y =
                    Math.sin(x * .4) * 3;

                z =
                    (Math.random() - .5) *
                    2;

                break;

            }


            case "wolf":
            case "cat":
            case "robot": {

                const p =
                    randomSphere(5);

                x = p.x;
                y = p.y;
                z = p.z;

                break;

            }


            case "snake": {

                x =
                    (t - .5) *
                    18;

                y =
                    Math.sin(
                        t * Math.PI * 10
                    ) * 3;

                z =
                    Math.cos(
                        t * Math.PI * 10
                    ) * 2;

                break;

            }


            case "scorpion": {

                const a =
                    t * Math.PI * 4;

                x =
                    Math.cos(a) * 7;

                y =
                    Math.sin(a) * 2;

                z =
                    Math.sin(a) * 4;

                break;

            }


            case "rocket": {

                const yy =
                    Math.random() *
                    16 - 8;

                const r =
                    Math.max(
                        .5,
                        3 -
                        Math.abs(yy) * .25
                    );

                const a =
                    Math.random() *
                    Math.PI * 2;

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                y =
                    yy;

                break;

            }


            case "spaceship": {

                const p =
                    randomSphere(6);

                x =
                    p.x;

                y =
                    p.y * .35;

                z =
                    p.z;

                break;

            }


            case "planetRing": {

                if (i < total * .45) {

                    const p =
                        randomSphere(4.5);

                    x = p.x;
                    y = p.y;
                    z = p.z;

                } else {

                    const a =
                        Math.random() *
                        Math.PI * 2;

                    const r =
                        6 +
                        Math.random() * 5;

                    x =
                        Math.cos(a) * r;

                    z =
                        Math.sin(a) * r;

                    y =
                        (Math.random() - .5) *
                        .12;

                }

                break;

            }


            case "hourglass": {

                y =
                    Math.random() *
                    14 - 7;

                const r =
                    Math.abs(y) * .4 +
                    .7;

                const a =
                    Math.random() *
                    Math.PI * 2;

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                break;

            }


            case "cubeTunnel": {

                const side =
                    i % 12;

                const r =
                    3 +
                    (i / total) * 10;

                const a =
                    side *
                    Math.PI / 6;

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                y =
                    (Math.random() - .5) *
                    8;

                break;

            }


            case "portal": {

                const a =
                    Math.random() *
                    Math.PI * 2;

                const r =
                    6 +
                    Math.sin(a * 8) * .8;

                x =
                    Math.cos(a) * r;

                y =
                    Math.sin(a) * r;

                z =
                    (Math.random() - .5) *
                    .7;

                break;

            }


            case "energyCore": {

                const p =
                    randomSphere(
                        2 +
                        Math.random() * 6
                    );

                x = p.x;
                y = p.y;
                z = p.z;

                break;

            }


            case "quantum": {

                const p =
                    randomSphere(
                        Math.random() * 11
                    );

                x = p.x;
                y = p.y;
                z = p.z;

                break;

            }


            default: {

                const p =
                    randomSphere(6);

                x = p.x;
                y = p.y;
                z = p.z;

            }

        }


        setParticle(
            i,
            x,
            y,
            z
        );

    }

}


/* =========================================================
   HAND SKELETON
========================================================= */

const HAND_CONNECTIONS = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [5,9],
    [9,10],
    [10,11],
    [11,12],

    [9,13],
    [13,14],
    [14,15],
    [15,16],

    [13,17],
    [17,18],
    [18,19],
    [19,20],

    [0,17]

];


function drawHandSkeletonPreview(
    ctx,
    hands,
    w,
    h
) {

    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    ctx.fillStyle =
        "rgba(8,10,12,.92)";

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    if (
        !hands ||
        hands.length === 0
    ) {

        ctx.fillStyle =
            "rgba(255,255,255,.35)";

        ctx.font =
            '9px "Share Tech Mono"';

        ctx.textAlign =
            "center";

        ctx.fillText(
            "CERCA MANO...",
            w / 2,
            h / 2
        );

        return;

    }


    hands.forEach(
        landmarks => {

            ctx.lineWidth = 2;

            ctx.strokeStyle =
                "#00ffcc";


            HAND_CONNECTIONS.forEach(
                ([a,b]) => {

                    const p1 =
                        landmarks[a];

                    const p2 =
                        landmarks[b];


                    ctx.beginPath();

                    ctx.moveTo(
                        p1.x * w,
                        p1.y * h
                    );

                    ctx.lineTo(
                        p2.x * w,
                        p2.y * h
                    );

                    ctx.stroke();

                }
            );


            landmarks.forEach(
                (pt,index) => {

                    const special =
                        index === 4 ||
                        index === 8;


                    ctx.fillStyle =
                        special
                        ? "#ff00aa"
                        : "#ffffff";


                    ctx.beginPath();

                    ctx.arc(
                        pt.x * w,
                        pt.y * h,
                        special ? 3.5 : 2,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();

                }
            );

        }
    );

}


/* =========================================================
   HAND → 3D POSITION
========================================================= */

const tempVector =
    new THREE.Vector3();

const tempDirection =
    new THREE.Vector3();

function handToWorld(
    x,
    y,
    z
) {

    const ndcX =
        ((1 - x) * 2 - 1) *
        CONFIG.handSensitivity;

    const ndcY =
        (-(y * 2 - 1)) *
        CONFIG.handSensitivity;


    tempVector.set(
        ndcX,
        ndcY,
        .5
    );


    tempVector.unproject(
        camera
    );


    tempDirection
        .copy(tempVector)
        .sub(camera.position)
        .normalize();


    const targetZ =
        -z * 20;


    const distance =
        (targetZ -
        camera.position.z) /
        tempDirection.z;


    return camera.position
        .clone()
        .add(
            tempDirection
                .multiplyScalar(distance)
        );

}


/* =========================================================
   HAND TRACKING
========================================================= */

function initHandTracking() {

    const video =
        document.getElementById(
            "video-input"
        );


    const hands =
        new Hands({

            locateFile:
                file =>
                    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

        });


    hands.setOptions({

        maxNumHands:
            CONFIG.maxHands,

        modelComplexity:
            1,

        minDetectionConfidence:
            CONFIG.handDetection,

        minTrackingConfidence:
            CONFIG.handTracking

    });


    let processing =
        false;


    hands.onResults(
        results => {

            processing =
                false;


            if (!previewCtx)
                return;


            drawHandSkeletonPreview(
                previewCtx,
                results.multiHandLandmarks,
                previewCanvas.width,
                previewCanvas.height
            );


            const landmarks =
                results.multiHandLandmarks || [];


            const handCount =
                landmarks.length;


            for (
                let i = 0;
                i < 2;
                i++
            ) {

                const ctrl =
                    controllers[i];


                if (
                    i >= handCount
                ) {

                    ctrl.active =
                        false;

                    ctrl.mesh.visible =
                        false;

                    ctrl.pointLight.visible =
                        false;

                    ctrl.rayLine.visible =
                        false;


                    if (
                        ctrl.grabbedBlock
                    ) {

                        setBlockHighlight(
                            ctrl.grabbedBlock,
                            false
                        );

                        ctrl.grabbedBlock
                            .userData
                            .isGrabbed =
                            false;

                        ctrl.grabbedBlock =
                            null;

                    }


                    ctrl.isPinching =
                        false;


                    ctrl.statusEl.innerText =
                        "CERCA...";

                    ctrl.grabEl.innerText =
                        "N/A";

                    continue;

                }


                ctrl.active =
                    true;


                const hand =
                    landmarks[i];


                const thumb =
                    hand[4];

                const index =
                    hand[8];

                const wrist =
                    hand[0];


                const centerX =
                    (thumb.x + index.x) *
                    .5;

                const centerY =
                    (thumb.y + index.y) *
                    .5;

                const centerZ =
                    (thumb.z + index.z) *
                    .5;


                const pinchDistance =
                    Math.hypot(
                        thumb.x - index.x,
                        thumb.y - index.y
                    );


                const target =
                    handToWorld(
                        centerX,
                        centerY,
                        centerZ
                    );


                /*
                 * Smooth position.
                 * Higher responsiveness than before.
                 */

                ctrl.lastPos.copy(
                    ctrl.pos
                );


                ctrl.pos.lerp(
                    target,
                    .62
                );


                ctrl.velocity
                    .copy(ctrl.pos)
                    .sub(ctrl.lastPos);


                ctrl.mesh.visible =
                    true;

                ctrl.pointLight.visible =
                    true;

                ctrl.mesh.position.copy(
                    ctrl.pos
                );

                ctrl.pointLight.position.copy(
                    ctrl.pos
                );


                /*
                 * Ray line
                 */

                const wristWorld =
                    handToWorld(
                        wrist.x,
                        wrist.y,
                        centerZ
                    );


                const attr =
                    ctrl.rayLine
                        .geometry
                        .attributes
                        .position;


                attr.setXYZ(
                    0,
                    wristWorld.x,
                    wristWorld.y,
                    wristWorld.z
                );


                attr.setXYZ(
                    1,
                    ctrl.pos.x,
                    ctrl.pos.y,
                    ctrl.pos.z
                );


                attr.needsUpdate =
                    true;


                ctrl.rayLine.visible =
                    true;


                /*
                 * PINCH
                 */

                const wasPinching =
                    ctrl.isPinching;


                ctrl.isPinching =
                    pinchDistance <
                    .075;


                if (
                    !wasPinching &&
                    ctrl.isPinching
                ) {

                    sounds.playPinch();

                }


                ctrl.statusEl.innerText =
                    "ATTIVA";


                if (
                    currentMode ===
                    "BUILDER"
                ) {

                    processBuilderHand(
                        ctrl
                    );

                }

            }


            /*
             * PARTICLE CONTROL
             */

            if (
                currentMode ===
                "PARTICLES" &&
                handCount > 0
            ) {

                const h =
                    landmarks[0];


                const palm =
                    h[9];

                const wrist =
                    h[0];


                targetRotZ =
                    -Math.atan2(
                        palm.y - wrist.y,
                        palm.x - wrist.x
                    )
                    -
                    Math.PI / 2;


                targetRotX =
                    (palm.y - .5) *
                    Math.PI *
                    3.8;


                targetRotY =
                    (palm.x - .5) *
                    Math.PI *
                    4.8;


                if (
                    handCount === 2
                ) {

                    const h2 =
                        landmarks[1];


                    const distance =
                        Math.hypot(
                            h[9].x - h2[9].x,
                            h[9].y - h2[9].y
                        );


                    targetScale =
                        THREE.MathUtils.clamp(

                            THREE.MathUtils.mapLinear(
                                distance,
                                .16,
                                .78,
                                .65,
                                2.8
                            ),

                            .55,
                            3.1

                        );

                } else {

                    const span =
                        Math.hypot(
                            wrist.x - h[12].x,
                            wrist.y - h[12].y
                        );


                    targetScale =
                        THREE.MathUtils.clamp(

                            THREE.MathUtils.mapLinear(
                                span,
                                .13,
                                .46,
                                .65,
                                2.4
                            ),

                            .55,
                            2.7

                        );

                }

            }

        }
    );


    const cameraUtils =
        new Camera(
            video,
            {

                onFrame:
                    async () => {

                        /*
                         * IMPORTANT:
                         * prevents MediaPipe from
                         * building a queue of frames.
                         */

                        if (
                            processing
                        )
                            return;


                        if (
                            video.readyState < 2
                        )
                            return;


                        processing =
                            true;


                        try {

                            await hands.send({
                                image: video
                            });

                        } catch (error) {

                            processing =
                                false;

                            console.warn(
                                "MediaPipe:",
                                error
                            );

                        }

                    },

                width: 480,

                height: 360

            }
        );


    cameraUtils
        .start()
        .catch(
            error => {

                console.warn(
                    "Camera startup retry:",
                    error
                );

                setTimeout(
                    () => {

                        cameraUtils
                            .start()
                            .catch(
                                console.warn
                            );

                    },
                    1200
                );

            }
        );

}


/* =========================================================
   BUILDER HAND CONTROL
========================================================= */

function processBuilderHand(
    ctrl
) {

    if (
        ctrl.isPinching
    ) {

        if (
            ctrl.grabbedBlock
        ) {

            const target =
                ctrl.pos.clone()
                .sub(
                    ctrl.grabOffset
                );


            ctrl.grabbedBlock
                .position.copy(
                    target
                );


            ctrl.grabbedBlock
                .userData
                .velocity
                .set(0,0,0);


            ctrl.grabEl.innerText =
                "AGGANCIATO";


        } else {

            let closest =
                null;

            let minDistance =
                3.2;


            for (
                let i = 0;
                i < blocks.length;
                i++
            ) {

                const block =
                    blocks[i];


                const distance =
                    ctrl.pos.distanceTo(
                        block.position
                    );


                if (
                    distance <
                    minDistance
                ) {

                    minDistance =
                        distance;

                    closest =
                        block;

                }

            }


            if (
                closest
            ) {

                ctrl.grabbedBlock =
                    closest;


                closest
                    .userData
                    .isGrabbed =
                    true;


                ctrl.grabOffset
                    .copy(ctrl.pos)
                    .sub(
                        closest.position
                    );


                setBlockHighlight(
                    closest,
                    true
                );

            }

        }

    } else {

        if (
            ctrl.grabbedBlock
        ) {

            /*
             * Give object a small
             * release velocity.
             */

            ctrl.grabbedBlock
                .userData
                .velocity
                .copy(
                    ctrl.velocity
                )
                .multiplyScalar(.65);


            setBlockHighlight(
                ctrl.grabbedBlock,
                false
            );


            ctrl.grabbedBlock
                .userData
                .isGrabbed =
                false;


            ctrl.grabbedBlock =
                null;

        }


        ctrl.grabEl.innerText =
            "LIBERA";

    }

}


/* =========================================================
   ANIMATION
========================================================= */

let lastFrameTime =
    performance.now();

let fpsFrames = 0;

let fpsTimer =
    performance.now();


function animate(
    now
) {

    requestAnimationFrame(
        animate
    );


    /*
     * FPS monitor
     */

    fpsFrames++;


    if (
        now - fpsTimer >= 500
    ) {

        const fps =
            Math.round(
                fpsFrames /
                (
                    (now - fpsTimer) /
                    1000
                )
            );


        document.getElementById(
            "fps-value"
        ).innerText =
            fps;


        fpsFrames = 0;

        fpsTimer =
            now;

    }


    /*
     * BUILDER
     */

    if (
        currentMode ===
        "BUILDER"
    ) {

        updatePhysics();

    }


    /*
     * PARTICLES
     */

    else {

        particleGroup.rotation.x +=
            (
                targetRotX -
                particleGroup.rotation.x
            ) *
            .25;


        particleGroup.rotation.y +=
            (
                targetRotY +
                .002 -
                particleGroup.rotation.y
            ) *
            .25;


        particleGroup.rotation.z +=
            (
                targetRotZ -
                particleGroup.rotation.z
            ) *
            .25;


        handExpansionScale +=
            (
                targetScale -
                handExpansionScale
            ) *
            .28;


        const positions =
            particleGeometry
                .attributes
                .position
                .array;


        const pinching =
            (
                controllers[0].active &&
                controllers[0].isPinching
            )
            ||
            (
                controllers[1].active &&
                controllers[1].isPinching
            );


        /*
         * Particle update.
         *
         * No Vector3 allocations.
         */

        for (
            let i = 0;
            i < CONFIG.particles * 3;
            i += 3
        ) {

            let tx =
                targetPositions[i] *
                handExpansionScale;

            let ty =
                targetPositions[i + 1] *
                handExpansionScale;

            let tz =
                targetPositions[i + 2] *
                handExpansionScale;


            let speed =
                .27;


            /*
             * Pinch collapses selected
             * particles toward the core.
             */

            if (
                pinching &&
                ((i / 3) & 1) === 0
            ) {

                tx *= .012;
                ty *= .012;
                tz *= .012;

                speed =
                    .55;

            }


            positions[i] +=
                (
                    tx -
                    positions[i]
                ) *
                speed;


            positions[i + 1] +=
                (
                    ty -
                    positions[i + 1]
                ) *
                speed;


            positions[i + 2] +=
                (
                    tz -
                    positions[i + 2]
                ) *
                speed;

        }


        particleGeometry
            .attributes
            .position
            .needsUpdate =
            true;

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
========================================================= */

function onWindowResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            CONFIG.maxPixelRatio
        )
    );

}


/* =========================================================
   UI EVENTS
========================================================= */

document
    .getElementById(
        "shape-select"
    )
    .addEventListener(
        "change",
        event => {

            generateShape(
                event.target.value
            );

        }
    );


document
    .getElementById(
        "color-picker"
    )
    .addEventListener(
        "input",
        event => {

            particleMaterial.color.set(
                event.target.value
            );

        }
    );


document
    .getElementById(
        "spawn-selected-btn"
    )
    .addEventListener(
        "click",
        () => {

            const type =
                document.getElementById(
                    "builder-shape-select"
                ).value;

            spawnShape(
                type
            );

        }
    );


/* =========================================================
   STARTUP
========================================================= */

window.addEventListener(
    "load",
    () => {

        populateSelects();

        initThree();

        initHandTracking();

        spawnShape(
            "cube",
            0,
            2,
            0
        );

        animate(
            performance.now()
        );

    }
);

</script>
