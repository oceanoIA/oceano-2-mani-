<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interfaccia Olografica 3D - Standalone</title>
  
  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <!-- Three.js per la grafica 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020208;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #00f3ff;
    }

    #stage {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #hud-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
    }

    .hud-panel {
      background: rgba(0, 15, 30, 0.65);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 15px 20px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
    }

    .hud-panel h2 {
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 8px;
      color: #88f7ff;
    }

    #status, #fps {
      font-size: 14px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <video id="webcam" playsinline style="display: none;"></video>
  <canvas id="stage"></canvas>
  
  <div id="hud-overlay">
    <div class="hud-panel">
      <h2>STATO SISTEMA</h2>
      <div id="status">Inizializzazione...</div>
      <div id="fps">FPS: --</div>
    </div>
  </div>

  <script>
    // --- MOTORE AUDIO ---
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.oscillator = null;
        this.gainNode = null;
        this.initialized = false;
      }

      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        
        this.oscillator = this.ctx.createOscillator();
        this.gainNode = this.ctx.createGain();
        
        this.oscillator.type = 'sine';
        this.oscillator.frequency.setValueAtTime(220, this.ctx.currentTime);
        this.gainNode.gain.setValueAtTime(0, this.ctx.currentTime);
        
        this.oscillator.connect(this.gainNode);
        this.gainNode.connect(this.ctx.destination);
        this.oscillator.start();
        
        this.initialized = true;
      }

      updateFrequency(handPosition) {
        if (!this.initialized || !this.ctx) return;
        const freq = 100 + (1 - handPosition.y) * 700;
        this.oscillator.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.05);
      }

      setVolume(volume) {
        if (!this.initialized || !this.ctx) return;
        this.gainNode.gain.setTargetAtTime(volume, this.ctx.currentTime, 0.05);
      }
    }

    // --- SISTEMA PARTICELLE 3D ---
    class ParticleSystem {
      constructor(scene, count = 25000) {
        this.scene = scene;
        this.count = count;
        this.geometry = new THREE.BufferGeometry();
        
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const baseColor = new THREE.Color('#00f3ff');
        
        for (let i = 0; i < count * 3; i += 3) {
          positions[i] = (Math.random() - 0.5) * 10;
          positions[i + 1] = (Math.random() - 0.5) * 10;
          positions[i + 2] = (Math.random() - 0.5) * 10;
          
          colors[i] = baseColor.r;
          colors[i + 1] = baseColor.g;
          colors[i + 2] = baseColor.b;
        }
        
        this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        this.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        this.material = new THREE.PointsMaterial({
          size: 0.03,
          vertexColors: true,
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending
        });
        
        this.mesh = new THREE.Points(this.geometry, this.material);
        this.scene.add(this.mesh);
      }

      update(interactionPoint) {
        const positions = this.geometry.attributes.position.array;
        
        if (interactionPoint) {
          for (let i = 0; i < this.count * 3; i += 3) {
            const dx = positions[i] - interactionPoint.x;
            const dy = positions[i + 1] - interactionPoint.y;
            const dz = positions[i + 2] - interactionPoint.z;
            const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
            
            if (dist < 2.0) {
              const force = (2.0 - dist) * 0.02;
              positions[i] += dx * force;
              positions[i + 1] += dy * force;
              positions[i + 2] += dz * force;
            }
          }
          this.geometry.attributes.position.needsUpdate = true;
        }
        
        this.mesh.rotation.y += 0.001;
      }
    }

    // --- CONTROLLER TRACCIAMENTO MANI ---
    class GestureController {
      constructor(videoElement, onResultsCallback) {
        this.videoElement = videoElement;
        this.onResultsCallback = onResultsCallback;
        
        this.hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        this.hands.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.7,
          minTrackingConfidence: 0.7
        });

        this.hands.onResults(this.onResultsCallback);
      }

      start() {
        const camera = new Camera(this.videoElement, {
          onFrame: async () => {
            await this.hands.send({ image: this.videoElement });
          },
          width: 1280,
          height: 720
        });
        camera.start();
      }
    }

    // --- APPLICAZIONE PRINCIPALE ---
    class App {
      constructor() {
        this.container = document.getElementById('stage');
        this.statusEl = document.getElementById('status');
        this.fpsEl = document.getElementById('fps');
        
        this.lastTime = performance.now();
        this.frameCount = 0;

        this.initGraphics();
        this.initAudio();
        this.initTracking();

        window.addEventListener('resize', () => this.onWindowResize());
        window.addEventListener('click', () => this.audio.init(), { once: true });
        
        this.animate();
      }

      initGraphics() {
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.camera.position.z = 5;

        this.renderer = new THREE.WebGLRenderer({ canvas: this.container, antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        this.particles = new ParticleSystem(this.scene, 25000);
      }

      initAudio() {
        this.audio = new AudioEngine();
      }

      initTracking() {
        const video = document.getElementById('webcam');
        
        this.gestureController = new GestureController(video, (results) => {
          if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            this.statusEl.innerText = "Mano Rilevata";
            
            const hand = results.multiHandLandmarks[0];
            const indexTip = hand[8];
            
            const worldPoint = new THREE.Vector3(
              (indexTip.x - 0.5) * -10,
              (0.5 - indexTip.y) * 10,
              (indexTip.z) * -5
            );

            this.particles.update(worldPoint);
            this.audio.updateFrequency(indexTip);
            this.audio.setVolume(0.1);
          } else {
            this.statusEl.innerText = "In attesa delle mani...";
            this.particles.update(null);
            this.audio.setVolume(0);
          }
        });

        this.gestureController.start();
      }

      onWindowResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      }

      animate() {
        requestAnimationFrame(() => this.animate());

        const now = performance.now();
        this.frameCount++;
        if (now - this.lastTime >= 1000) {
          this.fpsEl.innerText = `FPS: ${this.frameCount}`;
          this.frameCount = 0;
          this.lastTime = now;
        }

        this.renderer.render(this.scene, this.camera);
      }
    }

    // Avvia l'applicazione
    window.addEventListener('DOMContentLoaded', () => {
      new App();
    });
  </script>
</body>
</html>
