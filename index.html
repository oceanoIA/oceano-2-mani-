  <script>
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],

      [13,17],[17,18],[18,19],[19,20],[0,17]
    ];

    class SciFiSoundSystem {
      constructor() {
        this.ctx = null;
        this.humOsc = null;
        this.humGain = null;
        this.enabled = true;
        this.initialized = false;
      }
      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.humOsc = this.ctx.createOscillator();
        this.humGain = this.ctx.createGain();
        this.humOsc.type = 'sine';
        this.humOsc.frequency.setValueAtTime(50, this.ctx.currentTime);
        this.humGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
        this.humOsc.connect(this.humGain);
        this.humGain.connect(this.ctx.destination);
        this.humOsc.start();
        this.initialized = true;
      }
      playBeep(freq = 600) {
        if (!this.enabled || !this.initialized) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        const now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.15);
      }
    }

    const sounds = new SciFiSoundSystem();

    function toggleAudio() {
      sounds.enabled = !sounds.enabled;
      document.getElementById('audio-toggle-btn').innerText = sounds.enabled ? "🔊 AUDIO: ATTIVO" : "🔇 AUDIO: DISATTIVATO";
    }

    let currentMode = 'PARTICLES';
    const PARTICLE_COUNT = 12000;
    let scene, camera, renderer;
    let builderGroup;
    let blocks = [];

    const controllers = [
      { mesh: null, pointLight: null, pos: new THREE.Vector3(), statusEl: null, gestureEl: null, active: false },
      { mesh: null, pointLight: null, pos: new THREE.Vector3(), statusEl: null, gestureEl: null, active: false }
    ];

    let particleGroup, particleGeometry, particleMaterial;
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let handExpansionScale = 1.0, targetScale = 1.0;
    let targetCamZ = 32, targetRotX = 0, targetRotY = 0, targetRotZ = 0;
    let previewCanvas, previewCtx;

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 28);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      builderGroup = new THREE.Group();
      builderGroup.visible = false;
      scene.add(builderGroup);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 25, 15);
      scene.add(dirLight);

      const planeGeo = new THREE.PlaneGeometry(60, 60);
      const planeMat = new THREE.MeshStandardMaterial({ color: 0x0a0f18, roughness: 0.8, metalness: 0.2 });
      const floor = new THREE.Mesh(planeGeo, planeMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -6;
      builderGroup.add(floor);

      const gridHelper = new THREE.GridHelper(60, 30, 0x00f3ff, 0x112233);
      gridHelper.position.y = -5.98;
      builderGroup.add(gridHelper);

      controllers.forEach((ctrl, idx) => {
        const dotGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        ctrl.mesh = new THREE.Mesh(dotGeo, dotMat);
        ctrl.mesh.visible = false;
        builderGroup.add(ctrl.mesh);

        ctrl.pointLight = new THREE.PointLight(0xffffff, 0.8, 10);
        builderGroup.add(ctrl.pointLight);

        ctrl.statusEl = document.getElementById(`h${idx + 1}-status`);
        ctrl.gestureEl = document.getElementById(`h${idx + 1}-gesture`);
      });

      spawnShape('cube', 0, 2, 0);

      particleGroup = new THREE.Group();
      particleGroup.visible = true;
      scene.add(particleGroup);

      particleGeometry = new THREE.BufferGeometry();
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        currentPositions[i] = (Math.random() - 0.5) * 40;
        targetPositions[i] = currentPositions[i];
      }
      particleGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

      const particleColors = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        let randomColor = new THREE.Color('#ffffff');
        const rand = Math.random();
        if (rand < 0.6) randomColor = new THREE.Color('#ffffff');
        else if (rand < 0.8) randomColor = new THREE.Color('#2bf2b0');
        else if (rand < 0.9) randomColor = new THREE.Color('#ffdf73');
        else randomColor = new THREE.Color('#7a53ff');
        particleColors[idx] = randomColor.r;
        particleColors[idx + 1] = randomColor.g;
        particleColors[idx + 2] = randomColor.b;
      }
      particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 64; pCanvas.height = 64;
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = '#ffffff'; pCtx.beginPath(); pCtx.arc(32, 32, 28, 0, Math.PI * 2); pCtx.fill();

      particleMaterial = new THREE.PointsMaterial({
        size: 0.2, vertexColors: true, map: new THREE.CanvasTexture(pCanvas),
        transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false
      });

      const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
      particleGroup.add(particleSystem);
      generateShape('jupiter');

      previewCanvas = document.getElementById('hand-preview-canvas');
      previewCtx = previewCanvas.getContext('2d');

      window.addEventListener('resize', onWindowResize);
    }

    function spawnShape(type, x, y, z) {
      sounds.init();
      let geo;
      const size = 3.0;

      if (type === 'sphere') geo = new THREE.SphereGeometry(size / 1.8, 32, 32);
      else if (type === 'pyramid') geo = new THREE.ConeGeometry(size / 1.4, size, 4);
      else if (type === 'torus') geo = new THREE.TorusGeometry(size / 2, size / 6, 16, 32);
      else if (type === 'cylinder') geo = new THREE.CylinderGeometry(size / 2, size / 2, size, 32);
      else if (type === 'icosahedron') geo = new THREE.IcosahedronGeometry(size / 1.6);
      else if (type === 'star') geo = new THREE.OctahedronGeometry(size / 1.5, 1);
      else if (type === 'diamond') geo = new THREE.OctahedronGeometry(size / 1.5);
      else if (type === 'hourglass') geo = new THREE.ConeGeometry(size / 2, size, 16);
      else if (type === 'tripleTorus') geo = new THREE.TorusKnotGeometry(size / 2.5, size / 8, 64, 16);
      else if (type === 'merkaba') geo = new THREE.TetrahedronGeometry(size / 1.5);
      else if (type === 'hexPrism') geo = new THREE.CylinderGeometry(size / 2, size / 2, size, 6);
      else if (type === 'octahedron') geo = new THREE.OctahedronGeometry(size / 1.5);
      else if (type === 'dodecahedron') geo = new THREE.DodecahedronGeometry(size / 1.6);
      else if (type === 'starTorus') geo = new THREE.TorusKnotGeometry(size / 2, size / 10, 64, 32, 2, 3);
      else if (type === 'spring') geo = new THREE.TorusKnotGeometry(size / 2, size / 12, 64, 16, 1, 5);
      // Ulteriori 20 forme 3D Builder
      else if (type === 'cone') geo = new THREE.ConeGeometry(size / 2, size, 32);
      else if (type === 'ring') geo = new THREE.RingGeometry(size / 4, size / 2, 32);
      else if (type === 'capsule') geo = new THREE.CapsuleGeometry(size / 3, size / 2, 16, 16);
      else if (type === 'tube') geo = new THREE.TubeGeometry(new THREE.LineCurve3(new THREE.Vector3(0,-1,0), new THREE.Vector3(0,1,0)), 20, size/4, 8, false);
      else if (type === 'octahedron2') geo = new THREE.OctahedronGeometry(size / 1.4, 2);
      else if (type === 'tetrahedron') geo = new THREE.TetrahedronGeometry(size / 1.4);
      else if (type === 'octaStar') geo = new THREE.DodecahedronGeometry(size / 1.5, 1);
      else if (type === 'pyramidHex') geo = new THREE.ConeGeometry(size / 2, size, 6);
      else if (type === 'pill') geo = new THREE.CylinderGeometry(size / 3, size / 3, size * 0.8, 16);
      else if (type === 'gemstone') geo = new THREE.CylinderGeometry(size / 2, size / 4, size, 5);
      else if (type === 'disc') geo = new THREE.CylinderGeometry(size / 2, size / 2, size / 5, 32);
      else if (type === 'cubeFrame') geo = new THREE.BoxGeometry(size, size, size);
      else if (type === 'cross') geo = new THREE.BoxGeometry(size, size / 3, size / 3);
      else if (type === 'wedge') geo = new THREE.ConeGeometry(size / 2, size, 3);
      else if (type === 'ellipsoid') geo = new THREE.SphereGeometry(size / 2, 32, 16);
      else if (type === 'torusThick') geo = new THREE.TorusGeometry(size / 2, size / 3, 16, 32);
      else if (type === 'torusThin') geo = new THREE.TorusGeometry(size / 2, size / 10, 16, 32);
      else if (type === 'pyramidOct') geo = new THREE.ConeGeometry(size / 2, size, 8);
      else if (type === 'cubeRounded') geo = new THREE.BoxGeometry(size * 0.9, size * 0.9, size * 0.9);
      else if (type === 'helixNode') geo = new THREE.TorusKnotGeometry(size / 2, size / 8, 32, 16, 3, 4);
      else geo = new THREE.BoxGeometry(size, size, size);

      const randomColorHex = Math.floor(Math.random() * 16777215);
      const mat = new THREE.MeshStandardMaterial({
        color: randomColorHex, roughness: 0.3, metalness: 0.2
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.x = x !== undefined ? x : (Math.random() - 0.5) * 8;
      mesh.position.y = y !== undefined ? y : 6; 
      mesh.position.z = z !== undefined ? z : (Math.random() - 0.5) * 4;

      mesh.userData = { originalColor: randomColorHex, velocity: new THREE.Vector3(0, 0, 0), size: size };

      builderGroup.add(mesh);
      blocks.push(mesh);
    }

    function clearBlocks() {
      for (let b of blocks) builderGroup.remove(b);
      blocks = [];
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-builder').classList.toggle('active', mode === 'BUILDER');
      document.getElementById('tab-particles').classList.toggle('active', mode === 'PARTICLES');
      document.getElementById('controls-builder').style.display = mode === 'BUILDER' ? 'block' : 'none';
      document.getElementById('controls-particles').style.display = mode === 'PARTICLES' ? 'block' : 'none';
      document.getElementById('panel-title-text').innerText = mode === 'BUILDER' ? '3D BUILDER MATRIX' : 'PARTICLE MATRIX';

      builderGroup.visible = (mode === 'BUILDER');
      particleGroup.visible = (mode === 'PARTICLES');
    }

    function generateShape(type) {
      const p = targetPositions;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        let x = 0, y = 0, z = 0;

        if (type === 'jupiter') {
          if (i < PARTICLE_COUNT * 0.75) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 7.0;
            x = r * Math.sin(phi) * Math.cos(theta);
            y = (r * Math.cos(phi)) * 0.85;
            z = r * Math.sin(phi) * Math.sin(theta);
          } else {
            const angle = Math.random() * Math.PI * 2, dist = 9.0 + Math.random() * 4.0;
            x = Math.cos(angle) * dist; z = Math.sin(angle) * dist; y = (Math.random() - 0.5) * 0.2;
          }
        } else if (type === 'galaxy') {
          const arms = 4, arm = i % arms, r = Math.pow(Math.random(), 1.5) * 15;
          const theta = r * 0.4 + (arm * (Math.PI * 2 / arms));
          x = Math.cos(theta) * r + (Math.random() - 0.5) * 0.7;
          z = Math.sin(theta) * r + (Math.random() - 0.5) * 0.7;
          y = (Math.random() - 0.5) * (1.8 - r * 0.1);
        } else if (type === 'saturn') {
          if (i < PARTICLE_COUNT * 0.5) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 5.0;
            x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.cos(phi); z = r * Math.sin(phi) * Math.sin(theta);
          } else {
            const angle = Math.random() * Math.PI * 2, dist = 7.0 + Math.random() * 6.0;
            x = Math.cos(angle) * dist; z = Math.sin(angle) * dist; y = (Math.random() - 0.5) * 0.15;
          }
        } else if (type === 'DNA') {
          const t = (i / PARTICLE_COUNT) * Math.PI * 12;
          const strand = (i % 2 === 0) ? 1 : -1;
          x = Math.sin(t) * 4 * strand;
          y = ((i / PARTICLE_COUNT) * 16) - 8;
          z = Math.cos(t) * 4 * strand;
        } else if (type === 'hypercube') {
          const size = 6, side = i % 12, t = Math.random() * size - size/2;
          if (side === 0) { x = size/2; y = t; z = size/2; }
          else if (side === 1) { x = -size/2; y = t; z = size/2; }
          else if (side === 2) { x = t; y = size/2; z = size/2; }
          else if (side === 3) { x = t; y = -size/2; z = size/2; }
          else if (side === 4) { x = size/2; y = t; z = -size/2; }
          else if (side === 5) { x = -size/2; y = t; z = -size/2; }
          else if (side === 6) { x = t; y = size/2; z = -size/2; }
          else if (side === 7) { x = t; y = -size/2; z = -size/2; }
          else if (side === 8) { x = size/2; y = size/2; z = t; }
          else if (side === 9) { x = -size/2; y = size/2; z = t; }
          else if (side === 10) { x = size/2; y = -size/2; z = t; }
          else { x = -size/2; y = -size/2; z = t; }
        } else if (type === 'heart') {
          const t = Math.random() * Math.PI * 2, u = (Math.random() - 0.5) * 3;
          x = 16 * Math.pow(Math.sin(t), 3);
          y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          z = u; x *= 0.55; y *= 0.55; z *= 0.55;
        } else if (type === 'flower') {
          const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI;
          const r = 9 * Math.sin(6 * u) * Math.sin(v);
          x = r * Math.sin(v) * Math.cos(u); y = r * Math.sin(v) * Math.sin(u); z = r * Math.cos(v);
        } else if (type === 'buddha') {
          const rand = Math.random();
          if (rand < 0.35) {
            const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 8;
            x = Math.cos(a) * r; z = Math.sin(a) * r; y = -7 + (Math.random() - 0.5) * 1.2;
          } else {
            const h = Math.random() * 9, width = (1 - h / 9) * 6.5, a = Math.random() * Math.PI * 2;
            x = Math.cos(a) * width * Math.random(); z = Math.sin(a) * width * Math.random(); y = -6 + h;
          }
        } else if (type === 'fireworks') {
          const theta = Math.random() * Math.PI * 2, phi = Math.acos((Math.random() * 2) - 1);
          const speed = 2 + Math.random() * 12;
          x = speed * Math.sin(phi) * Math.cos(theta); y = speed * Math.sin(phi) * Math.sin(theta); z = speed * Math.cos(phi);
        } else if (type === 'nebula') {
          const a = Math.random() * Math.PI * 6, r = Math.random() * 12;
          x = Math.cos(a) * r; z = Math.sin(a) * r; y = (Math.random() - 0.5) * 8;
        } else if (type === 'tripleDNA') {
          const t = (i / PARTICLE_COUNT) * Math.PI * 14;
          const strand = (i % 3 === 0) ? 0 : (i % 3 === 1) ? 2.09 : 4.18;
          x = Math.sin(t + strand) * 5; y = ((i / PARTICLE_COUNT) * 18) - 9; z = Math.cos(t + strand) * 5;
        } else if (type === 'quantumVortex') {
          const h = (Math.random() - 0.5) * 16, r = Math.abs(h) * 0.5 + 1, a = h * 3 + Math.random();
          x = Math.cos(a) * r; z = Math.sin(a) * r; y = h;
        } else if (type === 'atomicMatrix') {
          const shell = (i % 3) * 3 + 3, a = Math.random() * Math.PI * 2, b = Math.random() * Math.PI;
          x = Math.sin(b) * Math.cos(a) * shell; y = Math.sin(b) * Math.sin(a) * shell; z = Math.cos(b) * shell;
        } else if (type === 'supernova') {
          const u = Math.random() * Math.PI * 2, v = Math.acos(Math.random() * 2 - 1), r = 4 + Math.random() * 10;
          x = r * Math.sin(v) * Math.cos(u); y = r * Math.sin(v) * Math.sin(u); z = r * Math.cos(v);
        } else if (type === 'solarCorona') {
          const a = Math.random() * Math.PI * 2, r = 3 + Math.random() * 9, flare = Math.sin(a * 8) * 2;
          x = Math.cos(a) * (r + flare); z = Math.sin(a) * (r + flare); y = (Math.random() - 0.5) * 4;
        } else if (type === 'energyHourglass') {
          const h = (Math.random() - 0.5) * 14, r = Math.abs(h) * 0.7 + 0.5, a = Math.random() * Math.PI * 2;
          x = Math.cos(a) * r; z = Math.sin(a) * r; y = h;
        } else if (type === 'gravitationalWaves') {
          const xPos = (Math.random() - 0.5) * 20, zPos = (Math.random() - 0.5) * 20;
          const dist = Math.hypot(xPos, zPos);
          x = xPos; z = zPos; y = Math.sin(dist * 1.5) * 3;
        } else if (type === 'spacePortal') {
          const a = Math.random() * Math.PI * 2, r = 3 + Math.random() * 8;
          x = Math.cos(a) * r; z = Math.sin(a) * r; y = (Math.random() - 0.5) * 0.5;
        } else if (type === 'crystalFractal') {
          const u = Math.random(), v = Math.random();
          x = (u - 0.5) * 12 * Math.sin(v * Math.PI);
          y = (v - 0.5) * 12;
          z = (u - 0.5) * 12 * Math.cos(v * Math.PI);
        }
        // Ulteriori 20 ologrammi Plasma
        else if (type === 'plasmaSphere') {
          const u = Math.random(), v = Math.random();
          const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0), r = 6.0;
          x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.cos(phi); z = r * Math.sin(phi) * Math.sin(theta);
        } else if (type === 'cyberspaceGrid') {
          x = (Math.random() - 0.5) * 18; z = (Math.random() - 0.5) * 18; y = -4 + Math.sin(x) * Math.cos(z) * 2;
        } else if (type === 'plasmaTorus') {
          const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI * 2, R = 6, r = 2;
          x = (R + r * Math.cos(v)) * Math.cos(u); z = (R + r * Math.cos(v)) * Math.sin(u); y = r * Math.sin(v);
        } else if (type === 'solarFlare') {
          const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 10;
          x = Math.cos(a) * r; y = Math.sin(r * 0.5) * 4; z = Math.sin(a) * r;
        } else if (type === 'matrixRain') {
          x = (Math.random() - 0.5) * 16; y = (Math.random() - 0.5) * 16; z = (Math.random() - 0.5) * 16;
        } else if (type === 'warpTunnel') {
          const a = Math.random() * Math.PI * 2, zPos = (Math.random() - 0.5) * 20, r = 5;
          x = Math.cos(a) * r; z = zPos; y = Math.sin(a) * r;
        } else if (type === 'ionStorm') {
          const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI, r = Math.random() * 10;
          x = r * Math.sin(v) * Math.cos(u); y = r * Math.cos(v); z = r * Math.sin(v) * Math.sin(u);
        } else if (type === 'pulsarStar') {
          const a = Math.random() * Math.PI * 2, r = Math.random() * 4, beam = (Math.random() - 0.5) * 14;
          if (Math.random() > 0.3) { x = Math.cos(a) * r; z = Math.sin(a) * r; y = (Math.random() - 0.5) * 2; }
          else { x = (Math.random() - 0.5) * 1; y = beam; z = (Math.random() - 0.5) * 1; }
        } else if (type === 'quantumCube') {
          x = (Math.random() - 0.5) * 8; y = (Math.random() - 0.5) * 8; z = (Math.random() - 0.5) * 8;
        } else if (type === 'neuralNet') {
          const a = Math.random() * Math.PI * 2, r = 3 + Math.random() * 7;
          x = Math.cos(a) * r; y = (Math.random() - 0.5) * 10; z = Math.sin(a) * r;
        } else if (type === 'plasmaFlame') {
          const h = Math.random() * 12, r = (12 - h) * 0.4 * Math.random(), a = Math.random() * Math.PI * 2;
          x = Math.cos(a) * r; y = h - 6; z = Math.sin(a) * r;
        } else if (type === 'blackHoleAccretion') {
          const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 10;
          x = Math.cos(a) * r; y = (Math.random() - 0.5) * 0.8; z = Math.sin(a) * r;
        } else if (type === 'hyperCone') {
          const h = (Math.random() - 0.5) * 10, r = (5 - h * 0.5), a = Math.random() * Math.PI * 2;
          x = Math.cos(a) * r; y = h; z = Math.sin(a) * r;
        } else if (type === 'plasmaRing') {
          const a = Math.random() * Math.PI * 2, r = 7 + (Math.random() - 0.5) * 1;
          x = Math.cos(a) * r; y = (Math.random() - 0.5) * 1; z = Math.sin(a) * r;
        } else if (type === 'energyShield') {
          const u = Math.random(), v = Math.random();
          const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0), r = 7.5;
          x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.cos(phi); z = r * Math.sin(phi) * Math.sin(theta);
        } else if (type === 'tachyonField') {
          x = (Math.random() - 0.5) * 14; y = (Math.random() - 0.5) * 14; z = (Math.random() - 0.5) * 14;
        } else if (type === 'singularityPoint') {
          const r = Math.random() * 2;
          x = (Math.random() - 0.5) * r; y = (Math.random() - 0.5) * r; z = (Math.random() - 0.5) * r;
        } else if (type === 'plasmaHelix') {
          const t = (i / PARTICLE_COUNT) * Math.PI * 10;
          x = Math.sin(t) * 5; y = ((i / PARTICLE_COUNT) * 14) - 7; z = Math.cos(t) * 5;
        } else if (type === 'cosmicWeb') {
          x = (Math.random() - 0.5) * 15; y = (Math.random() - 0.5) * 15; z = (Math.random() - 0.5) * 15;
        } else if (type === 'cyberLotus') {
          const u = Math.random() * Math.PI * 2, r = Math.random() * 8;
          x = Math.cos(u) * r; y = Math.sin(r) * 3; z = Math.sin(u) * r;
        }

        p[idx] = x; p[idx + 1] = y; p[idx + 2] = z;
      }
    }

    function initHandTracking() {
      const videoElement = document.getElementById('video-input');
      const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });

      hands.setOptions({
        maxNumHands: 2, modelComplexity: 1,
        minDetectionConfidence: 0.65, minTrackingConfidence: 0.65
      });

      hands.onResults((results) => {
        sounds.init();
        previewCtx.save();
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

        const numHands = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;

        for (let i = 0; i < 2; i++) {
          const ctrl = controllers[i];
          if (i < numHands) {
            ctrl.active = true;
            const landmarks = results.multiHandLandmarks[i];

            drawConnectors(previewCtx, landmarks, HAND_CONNECTIONS, { color: '#ffffff', lineWidth: 1 });
            drawLandmarks(previewCtx, landmarks, { color: '#00f3ff', lineWidth: 1, radius: 1.5 });

            const indexTip = landmarks[8];
            const pX = indexTip.x, pY = indexTip.y, pZ = indexTip.z;

            const ndcX = (1 - pX) * 2 - 1, ndcY = -(pY * 2 - 1);
            const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const targetZ = -pZ * 20;
            const distanceToPlane = (targetZ - camera.position.z) / dir.z;
            const targetPos = camera.position.clone().add(dir.multiplyScalar(distanceToPlane));

            ctrl.pos.copy(targetPos);
            ctrl.mesh.visible = true;
            ctrl.mesh.position.copy(ctrl.pos);
            ctrl.pointLight.position.copy(ctrl.pos);

            ctrl.statusEl.innerText = "ATTIVA";
            ctrl.statusEl.style.color = "#ffffff";
          } else {
            ctrl.active = false;
            ctrl.mesh.visible = false;
            ctrl.statusEl.innerText = "CERCA...";
            ctrl.statusEl.style.color = "#ff3366";
          }
        }

        if (currentMode === 'PARTICLES' && numHands > 0) {
          const landmarks1 = results.multiHandLandmarks[0];
          const h1Center = landmarks1[9], wrist1 = landmarks1[0];
          targetRotZ = -Math.atan2(h1Center.y - wrist1.y, h1Center.x - wrist1.x) - Math.PI / 2;
          targetRotX = (h1Center.y - 0.5) * Math.PI * 2.0;
          targetRotY = (h1Center.x - 0.5) * Math.PI * 3.0;

          if (numHands === 2) {
            const landmarks2 = results.multiHandLandmarks[1];
            const distBetweenHands = Math.hypot(landmarks1[9].x - landmarks2[9].x, landmarks1[9].y - landmarks2[9].y);
            targetScale = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(distBetweenHands, 0.1, 0.7, 0.5, 2.5), 0.4, 3.0);
          } else {
            const span = Math.hypot(wrist1.x - landmarks1[12].x, wrist1.y - landmarks1[12].y);
            targetScale = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(span, 0.2, 0.5, 0.5, 2.0), 0.4, 2.2);
          }
        }

        previewCtx.restore();
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640, height: 480
      });
      cameraUtils.start();
    }

    function animate() {
      requestAnimationFrame(animate);

      if (currentMode === 'BUILDER') {
        const gravity = -0.06;
        blocks.forEach(block => {
          block.userData.velocity.y += gravity;
          block.position.add(block.userData.velocity);

          const floorY = -6 + (block.userData.size / 2);
          if (block.position.y < floorY) {
            block.position.y = floorY;
            block.userData.velocity.set(0, 0, 0);
          }

          blocks.forEach(other => {
            if (block !== other) {
              const dx = block.position.x - other.position.x;
              const dz = block.position.z - other.position.z;
              const distXZ = Math.sqrt(dx * dx + dz * dz);
              const limitDist = block.userData.size * 0.8;

              if (distXZ < limitDist) {
                const topOfOther = other.position.y + (other.userData.size / 2) + (block.userData.size / 2);
                if (block.position.y <= topOfOther && block.position.y > other.position.y) {
                  block.position.y = topOfOther;
                  block.userData.velocity.set(0, 0, 0);
                }
              }
            }
          });
        });
      }

      if (currentMode === 'PARTICLES') {
        particleGroup.rotation.x += (targetRotX - particleGroup.rotation.x) * 0.15;
        particleGroup.rotation.y += (targetRotY + 0.003 - particleGroup.rotation.y) * 0.15;
        particleGroup.rotation.z += (targetRotZ - particleGroup.rotation.z) * 0.15;

        handExpansionScale += (targetScale - handExpansionScale) * 0.15;
        camera.position.z += (targetCamZ - camera.position.z) * 0.15;

        const positions = particleGeometry.attributes.position.array;
        for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
          let tx = targetPositions[i] * handExpansionScale;
          let ty = targetPositions[i+1] * handExpansionScale;
          let tz = targetPositions[i+2] * handExpansionScale;

          positions[i] += (tx - positions[i]) * 0.15;
          positions[i+1] += (ty - positions[i+1]) * 0.15;
          positions[i+2] += (tz - positions[i+2]) * 0.15;
        }
        particleGeometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    document.getElementById('shape-select').addEventListener('change', (e) => generateShape(e.target.value));
    document.getElementById('color-picker').addEventListener('input', (e) => {
      particleMaterial.color.set(e.target.value);
    });

    initThree();
    initHandTracking();
    animate();
  </script>
</body>
