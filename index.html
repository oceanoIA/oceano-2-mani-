<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARK KINETIC LAB v10.4 // STABLE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background-color: #000000; font-family: 'Share Tech Mono', monospace; color: #00f3ff; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

    .stark-header {
      position: absolute; top: 0; left: 0; width: 100%; height: 50px;
      background: rgba(0, 0, 0, 0.85); border-bottom: 1px solid rgba(0, 243, 255, 0.3); z-index: 10;
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .stark-title {
      font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px;
      letter-spacing: 2px; color: #ffffff; text-shadow: 0 0 15px rgba(0, 243, 255, 0.8);
      display: flex; align-items: center; gap: 12px;
    }
    .security-badge {
      font-size: 9px; background: rgba(0, 243, 255, 0.15); border: 1px solid rgba(0, 243, 255, 0.5);
      color: #00f3ff; padding: 2px 8px; border-radius: 2px; letter-spacing: 1px;
    }
    .mode-tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: #000000; border: 1px solid rgba(0, 243, 255, 0.3);
      color: rgba(0, 243, 255, 0.6); font-family: 'Orbitron', sans-serif; font-size: 10px;
      padding: 5px 14px; cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(0, 243, 255, 0.2); border-color: #00f3ff; color: #ffffff;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
    }

    .ui-overlay {
      position: absolute; top: 65px; left: 20px; z-index: 10; width: 310px; padding: 16px;
      background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.35); display: flex; flex-direction: column; gap: 12px;
    }
    .panel-header {
      font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 1px;
      color: #ffffff; border-bottom: 1px solid rgba(0, 243, 255, 0.3); padding-bottom: 5px;
      display: flex; justify-content: space-between;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 9px; color: rgba(0, 243, 255, 0.8); letter-spacing: 1px; }

    select, input[type="color"], .stark-btn {
      width: 100%; height: 32px; background: #000000;
      border: 1px solid rgba(0, 243, 255, 0.4); color: #00f3ff; padding: 0 8px;
      font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 10px; outline: none; cursor: pointer;
    }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-height: 180px; overflow-y: auto; }

    .telemetry-box {
      font-size: 10px; background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 243, 255, 0.2); padding: 8px; display: flex; flex-direction: column; gap: 6px;
    }
    .hand-card { border-left: 2px solid #ffffff; padding-left: 6px; display: flex; flex-direction: column; gap: 2px; }
    .telemetry-row { display: flex; justify-content: space-between; color: rgba(255, 255, 255, 0.6); }
    .telemetry-val { color: #00f3ff; font-weight: bold; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="stark-header">
    <div class="stark-title">
      <span>STARK LAB</span>
      <span class="security-badge">STABLE CORE</span>
    </div>
    <div class="mode-tabs">
      <button id="tab-builder" class="tab-btn" onclick="switchMode('BUILDER')">SYS 01: BUILDER</button>
      <button id="tab-particles" class="tab-btn active" onclick="switchMode('PARTICLES')">SYS 02: PARTICLES</button>
    </div>
  </div>

  <div class="ui-overlay">
    <div class="panel-header">
      <span id="panel-title-text">PARTICLE MATRIX</span>
      <span style="color: #00f3ff; font-weight: bold;">[ONLINE]</span>
    </div>
    
    <div id="controls-builder" style="display: none;">
      <div class="control-group">
        <label>SPAWN OGGETTI 3D</label>
        <div class="btn-grid">
          <button class="stark-btn" onclick="spawnShape('cube')">+ CUBO</button>
          <button class="stark-btn" onclick="spawnShape('sphere')">+ SFERA</button>
          <button class="stark-btn" onclick="spawnShape('pyramid')">+ PIRAMIDE</button>
          <button class="stark-btn" onclick="spawnShape('torus')">+ TORUS</button>
          <button class="stark-btn" onclick="spawnShape('cylinder')">+ CILINDRO</button>
          <button class="stark-btn" onclick="spawnShape('icosahedron')">+ ICOSAEDRO</button>
          <button class="stark-btn" onclick="spawnShape('star')">+ STELLA</button>
          <button class="stark-btn" onclick="spawnShape('diamond')">+ DIAMANTE</button>
        </div>
        <button class="stark-btn" style="margin-top: 6px; border-color: #ff3366; color: #ff3366;" onclick="clearBlocks()">RESET SCENA</button>
      </div>
    </div>

    <div id="controls-particles" style="display: block;">
      <div class="control-group">
        <label>HOLOGRAM TEMPLATE</label>
        <select id="shape-select">
          <option value="jupiter">JUPITER & RINGS</option>
          <option value="galaxy">GALAXY SPIRAL</option>
          <option value="heart">HEART MATRIX</option>
          <option value="saturn">SATURN RING SYSTEM</option>
          <option value="DNA">DNA DOUBLE HELIX</option>
        </select>
      </div>
      <div class="control-group" style="margin-top: 6px;">
        <label>PLASMA COLOR</label>
        <input type="color" id="color-picker" value="#00f3ff">
      </div>
    </div>

    <button id="audio-toggle-btn" class="stark-btn" onclick="toggleAudio()">🔊 AUDIO: ATTIVO</button>

    <div class="telemetry-box">
      <div class="hand-card">
        <div class="telemetry-row"><span>INTERAZIONE:</span><span id="h1-status" class="telemetry-val">ATTIVA (TOUCH/MOUSE)</span></div>
        <div class="telemetry-row"><span>ROTAZIONE:</span><span id="h1-gesture" class="telemetry-val">TRASCINAMENTO</span></div>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, composer;
    let builderGroup, particleGroup, particleGeometry, particleMaterial;
    let PARTICLE_COUNT = 8000;
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let blocks = [];
    let audioEnabled = true;

    // Variabili per il controllo della rotazione con mouse/touch
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    initThree();
    animate();

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audio-toggle-btn').innerText = audioEnabled ? "🔊 AUDIO: ATTIVO" : "🔇 AUDIO: DISATTIVATO";
    }

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 28);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const renderScene = new RenderPass(scene, camera);
      const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.4, 0.85);
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);

      builderGroup = new THREE.Group();
      builderGroup.visible = false;
      scene.add(builderGroup);

      scene.add(new THREE.AmbientLight(0xffffff, 0.9));

      particleGroup = new THREE.Group();
      scene.add(particleGroup);

      particleGeometry = new THREE.BufferGeometry();
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        currentPositions[i] = (Math.random() - 0.5) * 40;
        targetPositions[i] = currentPositions[i];
      }
      particleGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

      particleMaterial = new THREE.PointsMaterial({
        size: 0.22, color: 0x00f3ff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false
      });
      particleGroup.add(new THREE.Points(particleGeometry, particleMaterial));
      generateShape('jupiter');

      // Eventi di trascinamento mouse / touch per ruotare l'ologramma fluidamente
      window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;
        particleGroup.rotation.y += deltaX * 0.005;
        particleGroup.rotation.x += deltaY * 0.005;
        builderGroup.rotation.y += deltaX * 0.005;
        builderGroup.rotation.x += deltaY * 0.005;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('mouseup', () => { isDragging = false; });

      window.addEventListener('touchstart', (e) => {
        if(e.touches.length === 1) {
          isDragging = true;
          previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      });
      window.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        const deltaX = e.touches[0].clientX - previousMousePosition.x;
        const deltaY = e.touches[0].clientY - previousMousePosition.y;
        particleGroup.rotation.y += deltaX * 0.005;
        particleGroup.rotation.x += deltaY * 0.005;
        builderGroup.rotation.y += deltaX * 0.005;
        builderGroup.rotation.x += deltaY * 0.005;
        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      });
      window.addEventListener('touchend', () => { isDragging = false; });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function generateShape(type) {
      const p = targetPositions;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        let x = 0, y = 0, z = 0;
        if (type === 'jupiter') {
          const u = Math.random(), v = Math.random(), theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0), r = 7.0;
          x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.cos(phi) * 0.85; z = r * Math.sin(phi) * Math.sin(theta);
        } else if (type === 'galaxy') {
          const arms = 4, arm = i % arms, r = Math.pow(Math.random(), 1.5) * 15;
          const theta = r * 0.4 + (arm * (Math.PI * 2 / arms));
          x = Math.cos(theta) * r; z = Math.sin(theta) * r; y = (Math.random() - 0.5) * 1.5;
        } else if (type === 'heart') {
          const t = Math.random() * Math.PI * 2;
          x = 16 * Math.pow(Math.sin(t), 3) * 0.4;
          y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.4;
          z = (Math.random() - 0.5) * 4;
        } else if (type === 'saturn') {
          const isRing = Math.random() > 0.3;
          if (isRing) {
            const r = 8 + Math.random() * 6, theta = Math.random() * Math.PI * 2;
            x = Math.cos(theta) * r; y = (Math.random() - 0.5) * 0.3; z = Math.sin(theta) * r;
          } else {
            const u = Math.random(), v = Math.random(), theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0), r = 4.0;
            x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.cos(phi); z = r * Math.sin(phi) * Math.sin(theta);
          }
        } else { // DNA
          const t = (i / PARTICLE_COUNT) * Math.PI * 10;
          const strand = (i % 2 === 0) ? 1 : -1;
          x = Math.cos(t) * 5 * strand; y = (i / PARTICLE_COUNT) * 20 - 10; z = Math.sin(t) * 5 * strand;
        }
        p[idx] = x; p[idx + 1] = y; p[idx + 2] = z;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!isDragging) {
        particleGroup.rotation.y += 0.003;
      }
      const positions = particleGeometry.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
        positions[i] += (targetPositions[i] - positions[i]) * 0.3;
        positions[i+1] += (targetPositions[i+1] - positions[i+1]) * 0.3;
        positions[i+2] += (targetPositions[i+2] - positions[i+2]) * 0.3;
      }
      particleGeometry.attributes.position.needsUpdate = true;
      composer.render();
    }

    function switchMode(mode) {
      document.getElementById('tab-builder').classList.toggle('active', mode === 'BUILDER');
      document.getElementById('tab-particles').classList.toggle('active', mode === 'PARTICLES');
      document.getElementById('controls-builder').style.display = mode === 'BUILDER' ? 'block' : 'none';
      document.getElementById('controls-particles').style.display = mode === 'PARTICLES' ? 'block' : 'none';
      builderGroup.visible = (mode === 'BUILDER');
      particleGroup.visible = (mode === 'PARTICLES');
    }

    function spawnShape(type) {
      const geo = new THREE.BoxGeometry(2, 2, 2);
      const mat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, roughness: 0.2, metalness: 0.8 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((Math.random()-0.5)*8, (Math.random()-0.5)*6, (Math.random()-0.5)*4);
      builderGroup.add(mesh);
      blocks.push(mesh);
    }

    function clearBlocks() {
      blocks.forEach(b => builderGroup.remove(b));
      blocks = [];
    }

    document.getElementById('shape-select').addEventListener('change', (e) => generateShape(e.target.value));
    document.getElementById('color-picker').addEventListener('input', (e) => particleMaterial.color.set(e.target.value));
  </script>
</body>
</html>
