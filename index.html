<script>

/* =========================================================
   GLOBAL ENGINE
========================================================= */

"use strict";

let scene;
let camera;
let renderer;

let particleGroup;
let particleGeometry;
let particleMaterial;

let builderGroup;

let particleSystem;

let previewCanvas;
let previewCtx;

let currentMode = "PARTICLES";

const PARTICLE_COUNT = 6000;

const targetPositions =
    new Float32Array(PARTICLE_COUNT * 3);

const currentPositions =
    new Float32Array(PARTICLE_COUNT * 3);

let targetScale = 1;
let handScale = 1;

let targetRotX = 0;
let targetRotY = 0;
let targetRotZ = 0;

let blocks = [];


/* =========================================================
   AUDIO
========================================================= */

class SciFiSoundSystem {

    constructor() {

        this.ctx = null;
        this.enabled = true;
        this.initialized = false;

    }

    init() {

        if (this.initialized) {

            if (this.ctx &&
                this.ctx.state === "suspended") {

                this.ctx.resume().catch(() => {});

            }

            return;

        }

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) return;

            this.ctx = new AudioContext();

            this.initialized = true;

        } catch (error) {

            console.warn("Audio non disponibile:", error);

        }

    }

    playPinch() {

        if (!this.enabled ||
            !this.initialized ||
            !this.ctx) return;

        try {

            const osc =
                this.ctx.createOscillator();

            const gain =
                this.ctx.createGain();

            const now =
                this.ctx.currentTime;

            osc.type = "sine";

            osc.frequency.setValueAtTime(
                220,
                now
            );

            osc.frequency.exponentialRampToValueAtTime(
                900,
                now + 0.07
            );

            gain.gain.setValueAtTime(
                0.12,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.08
            );

            osc.connect(gain);

            gain.connect(this.ctx.destination);

            osc.start(now);

            osc.stop(now + 0.08);

        } catch (_) {}

    }

}

const sounds =
    new SciFiSoundSystem();


function toggleAudio() {

    sounds.enabled =
        !sounds.enabled;

    const btn =
        document.getElementById(
            "audio-toggle-btn"
        );

    btn.innerText =
        sounds.enabled
            ? "🔊 AUDIO: ATTIVO"
            : "🔇 AUDIO: DISATTIVATO";

}


/* =========================================================
   CONTROLLERS
========================================================= */

const controllers = [

    createController(),

    createController()

];


function createController() {

    return {

        mesh: null,

        pointLight: null,

        rayLine: null,

        grabbedBlock: null,

        grabOffset:
            new THREE.Vector3(),

        pos:
            new THREE.Vector3(),

        lastPos:
            new THREE.Vector3(),

        velocity:
            new THREE.Vector3(),

        isPinching: false,

        active: false,

        statusEl: null,

        grabEl: null

    };

}


/* =========================================================
   HAND CONNECTIONS
========================================================= */

const HAND_CONNECTIONS = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [5,9],
    [9,10],
    [10,11],
    [11,12],

    [9,13],
    [13,14],
    [14,15],
    [15,16],

    [13,17],
    [17,18],
    [18,19],
    [19,20],

    [0,17]

];


/* =========================================================
   THREE INITIALIZATION
========================================================= */

function initThree() {

    const container =
        document.getElementById(
            "canvas-container"
        );

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x000000);


    camera =
        new THREE.PerspectiveCamera(
            55,
            window.innerWidth /
            window.innerHeight,
            0.1,
            1000
        );

    camera.position.set(
        0,
        3,
        28
    );

    camera.lookAt(0,0,0);


    renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    container.appendChild(
        renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ===================================================== */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            0.75
        );

    scene.add(ambient);


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            0.8
        );

    directional.position.set(
        10,
        20,
        15
    );

    scene.add(directional);


    /* =====================================================
       BUILDER
    ===================================================== */

    builderGroup =
        new THREE.Group();

    builderGroup.visible =
        false;

    scene.add(
        builderGroup
    );


    createBuilderEnvironment();

    createControllers();


    /* =====================================================
       PARTICLES
    ===================================================== */

    createParticleSystem();


    /* =====================================================
       PREVIEW
    ===================================================== */

    previewCanvas =
        document.getElementById(
            "hand-preview-canvas"
        );

    previewCtx =
        previewCanvas.getContext(
            "2d"
        );


    window.addEventListener(
        "resize",
        onWindowResize
    );

}


/* =========================================================
   BUILDER ENVIRONMENT
========================================================= */

function createBuilderEnvironment() {

    const floorGeometry =
        new THREE.PlaneGeometry(
            60,
            60
        );

    const floorMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x111111,

            roughness: .85,

            metalness: .15

        });

    const floor =
        new THREE.Mesh(
            floorGeometry,
            floorMaterial
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.position.y =
        -6;

    builderGroup.add(
        floor
    );


    const grid =
        new THREE.GridHelper(
            60,
            30,
            0xffffff,
            0x333333
        );

    grid.position.y =
        -5.98;

    builderGroup.add(
        grid
    );

}


/* =========================================================
   HAND CONTROLLERS
========================================================= */

function createControllers() {

    controllers.forEach(
        (ctrl, index) => {

            const geo =
                new THREE.SphereGeometry(
                    .18,
                    10,
                    10
                );

            const mat =
                new THREE.MeshBasicMaterial({
                    color: 0xffffff
                });

            ctrl.mesh =
                new THREE.Mesh(
                    geo,
                    mat
                );

            ctrl.mesh.visible =
                false;

            builderGroup.add(
                ctrl.mesh
            );


            ctrl.pointLight =
                new THREE.PointLight(
                    0xffffff,
                    .7,
                    9
                );

            builderGroup.add(
                ctrl.pointLight
            );


            const lineGeometry =
                new THREE.BufferGeometry();

            lineGeometry.setFromPoints([

                new THREE.Vector3(),

                new THREE.Vector3()

            ]);


            const lineMaterial =
                new THREE.LineBasicMaterial({

                    color: 0xffffff,

                    transparent: true,

                    opacity: .35

                });


            ctrl.rayLine =
                new THREE.Line(
                    lineGeometry,
                    lineMaterial
                );

            ctrl.rayLine.visible =
                false;

            builderGroup.add(
                ctrl.rayLine
            );


            ctrl.statusEl =
                document.getElementById(
                    `h${index + 1}-status`
                );

            ctrl.grabEl =
                document.getElementById(
                    `h${index + 1}-grab`
                );

        }
    );

}


/* =========================================================
   PARTICLE SYSTEM
========================================================= */

function createParticleSystem() {

    particleGroup =
        new THREE.Group();

    scene.add(
        particleGroup
    );


    particleGeometry =
        new THREE.BufferGeometry();


    for (
        let i = 0;
        i < PARTICLE_COUNT * 3;
        i++
    ) {

        currentPositions[i] =
            (Math.random() - .5) * 35;

        targetPositions[i] =
            currentPositions[i];

    }


    particleGeometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            currentPositions,
            3
        )

    );


    const colors =
        new Float32Array(
            PARTICLE_COUNT * 3
        );


    for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
    ) {

        const n =
            Math.random();

        const value =
            n < .7
                ? 1
                : n < .9
                    ? .65
                    : .35;

        const idx =
            i * 3;

        colors[idx] =
            value;

        colors[idx + 1] =
            value;

        colors[idx + 2] =
            value;

    }


    particleGeometry.setAttribute(

        "color",

        new THREE.BufferAttribute(
            colors,
            3
        )

    );


    const textureCanvas =
        document.createElement(
            "canvas"
        );

    textureCanvas.width = 32;
    textureCanvas.height = 32;


    const ctx =
        textureCanvas.getContext(
            "2d"
        );

    ctx.beginPath();

    ctx.arc(
        16,
        16,
        14,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();


    const texture =
        new THREE.CanvasTexture(
            textureCanvas
        );


    particleMaterial =
        new THREE.PointsMaterial({

            size: .23,

            vertexColors: true,

            map: texture,

            transparent: true,

            opacity: .92,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false

        });


    particleSystem =
        new THREE.Points(
            particleGeometry,
            particleMaterial
        );


    particleGroup.add(
        particleSystem
    );


    generateShape(
        "jupiter"
    );

}


/* =========================================================
   SPAWN 3D OBJECT
========================================================= */

function spawnShape(
    type,
    x,
    y,
    z
) {

    let geometry;

    const size = 3;


    switch(type) {

        case "sphere":

            geometry =
                new THREE.SphereGeometry(
                    1.65,
                    16,
                    16
                );

            break;


        case "pyramid":

            geometry =
                new THREE.ConeGeometry(
                    2.1,
                    3,
                    4
                );

            break;


        case "cone":

            geometry =
                new THREE.ConeGeometry(
                    1.7,
                    3.2,
                    16
                );

            break;


        case "torus":

            geometry =
                new THREE.TorusGeometry(
                    1.5,
                    .45,
                    10,
                    24
                );

            break;


        case "cylinder":

            geometry =
                new THREE.CylinderGeometry(
                    1.5,
                    1.5,
                    3,
                    16
                );

            break;


        case "icosahedron":

            geometry =
                new THREE.IcosahedronGeometry(
                    1.8,
                    0
                );

            break;


        case "octahedron":

            geometry =
                new THREE.OctahedronGeometry(
                    1.9,
                    0
                );

            break;


        case "tetrahedron":

            geometry =
                new THREE.TetrahedronGeometry(
                    2,
                    0
                );

            break;


        case "ring":

            geometry =
                new THREE.TorusGeometry(
                    1.7,
                    .22,
                    8,
                    32
                );

            break;


        case "capsule":

            geometry =
                new THREE.CapsuleGeometry(
                    1,
                    1.5,
                    8,
                    16
                );

            break;


        case "diamond":

            geometry =
                new THREE.OctahedronGeometry(
                    2.1,
                    0
                );

            break;


        default:

            geometry =
                new THREE.BoxGeometry(
                    size,
                    size,
                    size
                );

    }


    const color =
        Math.random() > .5
            ? 0xffffff
            : 0x888888;


    const material =
        new THREE.MeshStandardMaterial({

            color,

            roughness: .3,

            metalness: .35

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.set(

        x !== undefined
            ? x
            : (Math.random() - .5) * 8,

        y !== undefined
            ? y
            : 5 + Math.random() * 3,

        z !== undefined
            ? z
            : (Math.random() - .5) * 5

    );


    mesh.userData = {

        originalColor:
            color,

        velocity:
            new THREE.Vector3(),

        isGrabbed:
            false,

        size:
            size

    };


    builderGroup.add(
        mesh
    );

    blocks.push(
        mesh
    );

}


/* =========================================================
   CLEAR BUILDER
========================================================= */

function clearBlocks() {

    blocks.forEach(
        block => {

            builderGroup.remove(
                block
            );

            if (block.geometry)
                block.geometry.dispose();

            if (block.material)
                block.material.dispose();

        }
    );

    blocks.length = 0;


    controllers.forEach(
        ctrl => {

            ctrl.grabbedBlock =
                null;

        }
    );

}


/* =========================================================
   HIGHLIGHT
========================================================= */

function setBlockHighlight(
    block,
    grabbed
) {

    if (!block) return;

    block.material.color.setHex(

        grabbed
            ? 0xffffff
            : block.userData.originalColor

    );

}

function switchMode(

) {

/* =========================================================
   PARTICLE SHAPES
========================================================= */

function generateShape(
    type
) {

    const p =
        targetPositions;


    for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
    ) {

        const idx =
            i * 3;

        let x = 0;
        let y = 0;
        let z = 0;


        /* JUPITER */

        if (type === "jupiter") {

            if (i < PARTICLE_COUNT * .76) {

                const u =
                    Math.random();

                const v =
                    Math.random();

                const theta =
                    u * Math.PI * 2;

                const phi =
                    Math.acos(
                        2 * v - 1
                    );

                const r =
                    7;

                x =
                    r *
                    Math.sin(phi) *
                    Math.cos(theta);

                y =
                    r *
                    Math.cos(phi) *
                    .85;

                z =
                    r *
                    Math.sin(phi) *
                    Math.sin(theta);

            } else {

                const a =
                    Math.random() *
                    Math.PI *
                    2;

                const r =
                    9 +
                    Math.random() * 4;

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                y =
                    (Math.random() - .5) * .2;

            }

        }


        /* SATURN */

        else if (type === "saturn") {

            if (i < PARTICLE_COUNT * .55) {

                const a =
                    Math.random() *
                    Math.PI * 2;

                const b =
                    Math.acos(
                        2 * Math.random() - 1
                    );

                const r = 5;

                x =
                    r *
                    Math.sin(b) *
                    Math.cos(a);

                y =
                    r *
                    Math.cos(b);

                z =
                    r *
                    Math.sin(b) *
                    Math.sin(a);

            } else {

                const a =
                    Math.random() *
                    Math.PI * 2;

                const r =
                    7 +
                    Math.random() * 6;

                x =
                    Math.cos(a) * r;

                z =
                    Math.sin(a) * r;

                y =
                    (Math.random() - .5) * .18;

            }

        }


        /* GALAXY */

        else if (type === "galaxy") {

            const arms = 4;

            const arm =
                i % arms;

            const r =
                Math.pow(
                    Math.random(),
                    1.5
                ) * 15;

            const theta =
                r * .42 +
                arm *
                (Math.PI * 2 / arms);

            x =
                Math.cos(theta) * r +
                (Math.random() - .5) * .7;

            z =
                Math.sin(theta) * r +
                (Math.random() - .5) * .7;

            y =
                (Math.random() - .5) *
                (2 - r * .1);

        }


        /* NEBULA */

        else if (type === "nebula") {

            const a =
                Math.random() *
                Math.PI * 2;

            const r =
                Math.pow(
                    Math.random(),
                    .55
                ) * 13;

            x =
                Math.cos(a) * r;

            z =
                Math.sin(a) * r;

            y =
                Math.sin(a * 3) * 2 +
                (Math.random() - .5) * 3;

        }


        /* HYPERCUBE */

        else if (type === "hypercube") {

            const s = 7;

            const edge =
                i % 12;

            const t =
                Math.random() * s -
                s / 2;

            if (edge === 0) {

                x = s/2;
                y = t;
                z = s/2;

            } else if (edge === 1) {

                x = -s/2;
                y = t;
                z = s/2;

            } else if (edge === 2) {

                x = t;
                y = s/2;
                z = s/2;

            } else if (edge === 3) {

                x = t;
                y = -s/2;
                z = s/2;

            } else if (edge === 4) {

                x = s/2;
                y = t;
                z = -s/2;

            } else if (edge === 5) {

                x = -s/2;
                y = t;
                z = -s/2;

            } else if (edge === 6) {

                x = t;
                y = s/2;
                z = -s/2;

            } else if (edge === 7) {

                x = t;
                y = -s/2;
                z = -s/2;

            } else if (edge === 8) {

                x = s/2;
                y = s/2;
                z = t;

            } else if (edge === 9) {

                x = -s/2;
                y = s/2;
                z = t;

            } else if (edge === 10) {

                x = s/2;
                y = -s/2;
                z = t;

            } else {

                x = -s/2;
                y = -s/2;
                z = t;

            }

        }


        /* HEART */

        else if (type === "heart") {

            const t =
                Math.random() *
                Math.PI * 2;

            const depth =
                (Math.random() - .5) * 3;

            x =
                16 *
                Math.pow(
                    Math.sin(t),
                    3
                );

            y =
                13 *
                Math.cos(t) -
                5 *
                Math.cos(2*t) -
                2 *
                Math.cos(3*t) -
                Math.cos(4*t);

            z =
                depth;

            x *= .5;
            y *= .5;
            z *= .5;

        }


        /* FLOWER */

        else if (type === "flower") {

            const u =
                Math.random() *
                Math.PI * 2;

            const v =
                Math.random() *
                Math.PI;

            const r =
                8 *
                Math.sin(6*u);

            x =
                r *
                Math.sin(v) *
                Math.cos(u);

            y =
                r *
                Math.sin(v) *
                Math.sin(u);

            z =
                r *
                Math.cos(v);

        }


        /* DNA */

        else if (type === "dna") {

            const t =
                (i / PARTICLE_COUNT) *
                Math.PI * 16;

            const strand =
                i % 2 === 0
                    ? 1
                    : -1;

            x =
                Math.sin(t) *
                4 *
                strand;

            y =
                (i / PARTICLE_COUNT) *
                17 - 8.5;

            z =
                Math.cos(t) *
                4 *
                strand;

        }


        /* TORUS */

        else if (type === "torus") {

            const a =
                Math.random() *
                Math.PI * 2;

            const b =
                Math.random() *
                Math.PI * 2;

            const R = 6;
            const r = 2;

            x =
                (R + r * Math.cos(b)) *
                Math.cos(a);

            y =
                r * Math.sin(b);

            z =
                (R + r * Math.cos(b)) *
                Math.sin(a);

        }


        /* SPHERE */

        else if (type === "sphere") {

            const a =
                Math.random() *
                Math.PI * 2;

            const b =
                Math.acos(
                    2 * Math.random() - 1
                );

            const r =
                Math.cbrt(
                    Math.random()
                ) * 8;

            x =
                r *
                Math.sin(b) *
                Math.cos(a);

            y =
                r *
                Math.cos(b);

            z =
                r *
                Math.sin(b) *
                Math.sin(a);

        }


        /* ATOM */

        else if (type === "atom") {

            if (i < PARTICLE_COUNT * .18) {

                const r =
                    Math.random() * 2;

                x =
                    (Math.random()-.5)*r;

                y =
                    (Math.random()-.5)*r;

                z =
                    (Math.random()-.5)*r;

            } else {

                const a =
                    Math.random() *
                    Math.PI * 2;

                const r =
                    7 +
                    Math.random() * 3;

                x =
                    Math.cos(a) * r;

                y =
                    Math.sin(a) * r;

                z =
                    Math.sin(a * 2) * 2;

            }

        }


        /* BLACK HOLE */

        else if (type === "blackhole") {

            const a =
                Math.random() *
                Math.PI * 2;

            const r =
                2.5 +
                Math.random() * 9;

            x =
                Math.cos(a) * r;

            z =
                Math.sin(a) * r;

            y =
                (Math.random()-.5) *
                (r * .18);

        }


        /* WAVE */

        else if (type === "wave") {

            const side =
                Math.sqrt(
                    PARTICLE_COUNT
                );

            const gx =
                (i % side) / side;

            const gz =
                Math.floor(i / side) /
                side;

            x =
                (gx-.5) * 22;

            z =
                (gz-.5) * 14;

            y =
                Math.sin(
                    x * .65 +
                    z * .45
                ) * 2.5;

        }


        /* FIREWORKS */

        else if (type === "fireworks") {

            const theta =
                Math.random() *
                Math.PI * 2;

            const phi =
                Math.acos(
                    Math.random()*2-1
                );

            const radius =
                2 +
                Math.random()*12;

            x =
                radius *
                Math.sin(phi) *
                Math.cos(theta);

            y =
                radius *
                Math.cos(phi);

            z =
                radius *
                Math.sin(phi) *
                Math.sin(theta);

        }


        /* BUDDHA */

        else if (type === "buddha") {

            const h =
                Math.random() * 10;

            const width =
                (1-h/10) * 6;

            const a =
                Math.random() *
                Math.PI * 2;

            x =
                Math.cos(a) *
                width *
                Math.random();

            z =
                Math.sin(a) *
                width *
                Math.random();

            y =
                -5 + h;

        }


        /* SATELLITE */

        else if (type === "satellite") {

            const layer =
                i % 6;

            const a =
                Math.random() *
                Math.PI * 2;

            const r =
                4 +
                layer * 1.5;

            x =
                Math.cos(a) * r;

            z =
                Math.sin(a) * r;

            y =
                (Math.random()-.5) * .25;

        }


        p[idx] =
            x;

        p[idx+1] =
            y;

        p[idx+2] =
            z;

    }

}


/* =========================================================
   HAND PREVIEW
========================================================= */

function drawHandSkeletonPreview(
    ctx,
    hands,
    width,
    height
) {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.fillStyle =
        "rgba(8,12,16,.9)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    if (!hands || !hands.length) {

        ctx.fillStyle =
            "rgba(255,255,255,.35)";

        ctx.font =
            '9px "Share Tech Mono"';

        ctx.textAlign =
            "center";

        ctx.fillText(
            "CERCA MANO...",
            width/2,
            height/2
        );

        return;

    }


    hands.forEach(
        landmarks => {

            ctx.lineWidth = 1.7;

            ctx.strokeStyle =
                "#ffffff";


            HAND_CONNECTIONS.forEach(
                ([a,b]) => {

                    const p1 =
                        landmarks[a];

                    const p2 =
                        landmarks[b];

                    ctx.beginPath();

                    ctx.moveTo(
                        p1.x * width,
                        p1.y * height
                    );

                    ctx.lineTo(
                        p2.x * width,
                        p2.y * height
                    );

                    ctx.stroke();

                }
            );


            landmarks.forEach(
                (pt,index) => {

                    ctx.fillStyle =
                        (
                            index === 4 ||
                            index === 8
                        )
                            ? "#ffffff"
                            : "#777777";

                    ctx.beginPath();

                    ctx.arc(
                        pt.x * width,
                        pt.y * height,
                        index === 4 ||
                        index === 8
                            ? 3
                            : 1.7,
                        0,
                        Math.PI*2
                    );

                    ctx.fill();

                }
            );

        }
    );

}


/* =========================================================
   HAND TRACKING
========================================================= */

let handProcessing = false;

function initHandTracking() {

    const video =
        document.getElementById(
            "video-input"
        );


    const hands =
        new Hands({

            locateFile:
                file =>
                    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

        });


    /*
     * MODEL COMPLEXITY 0:
     * molto più veloce.
     */

    hands.setOptions({

        maxNumHands: 2,

        modelComplexity: 0,

        minDetectionConfidence: .42,

        minTrackingConfidence: .42

    });


    hands.onResults(
        handleHandResults
    );


    const cameraUtils =
        new Camera(
            video,
            {

                onFrame:
                    async () => {

                        if (
                            handProcessing ||
                            video.readyState < 2
                        ) {
                            return;
                        }

                        handProcessing = true;

                        try {

                            await hands.send({
                                image: video
                            });

                        } catch(error) {

                            console.warn(
                                "MediaPipe:",
                                error
                            );

                        } finally {

                            handProcessing =
                                false;

                        }

                    },

                width: 480,

                height: 360

            }
        );


    cameraUtils.start();

}


/* =========================================================
   HAND RESULTS
========================================================= */

function handleHandResults(
    results
) {

    if (!previewCtx)
        return;


    drawHandSkeletonPreview(

        previewCtx,

        results.multiHandLandmarks,

        previewCanvas.width,

        previewCanvas.height

    );


    const detected =
        results.multiHandLandmarks
            || [];


    const numHands =
        detected.length;


    for (
        let i = 0;
        i < 2;
        i++
    ) {

        const ctrl =
            controllers[i];


        if (i >= numHands) {

            ctrl.active =
                false;

            ctrl.mesh.visible =
                false;

            ctrl.rayLine.visible =
                false;


            if (ctrl.grabbedBlock) {

                setBlockHighlight(
                    ctrl.grabbedBlock,
                    false
                );

                ctrl.grabbedBlock
                    .userData
                    .isGrabbed =
                        false;

                ctrl.grabbedBlock =
                    null;

            }


            ctrl.statusEl.innerText =
                "CERCA...";

            ctrl.grabEl.innerText =
                "N/A";

            continue;

        }


        ctrl.active =
            true;


        const landmarks =
            detected[i];


        const thumb =
            landmarks[4];

        const index =
            landmarks[8];

        const wrist =
            landmarks[0];


        const pinchDistance =
            Math.hypot(

                thumb.x-index.x,

                thumb.y-index.y

            );


        /*
         * SENSIBILITÀ AUMENTATA
         */

        const sensitivity =
            1.55;


        const centerX =
            (thumb.x + index.x) / 2;

        const centerY =
            (thumb.y + index.y) / 2;

        const centerZ =
            (thumb.z + index.z) / 2;


        const ndcX =
            ((1-centerX)*2-1) *
            sensitivity;

        const ndcY =
            (-(centerY*2-1)) *
            sensitivity;


        const vector =
            new THREE.Vector3(
                ndcX,
                ndcY,
                .5
            );


        vector.unproject(
            camera
        );


        const direction =
            vector
                .sub(camera.position)
                .normalize();


        const targetZ =
            -centerZ * 20;


        const distance =
            (
                targetZ -
                camera.position.z
            ) /
            direction.z;


        const targetPosition =
            camera.position
                .clone()
                .add(
                    direction.multiplyScalar(
                        distance
                    )
                );


        ctrl.lastPos.copy(
            ctrl.pos
        );

        ctrl.pos.copy(
            targetPosition
        );


        ctrl.velocity
            .copy(ctrl.pos)
            .sub(ctrl.lastPos);


        ctrl.mesh.visible =
            true;

        ctrl.mesh.position.copy(
            ctrl.pos
        );

        ctrl.pointLight.position.copy(
            ctrl.pos
        );


        /* RAY */

        const wristX =
            (1-wrist.x)*2-1;

        const wristY =
            -(wrist.y*2-1);


        const wristVector =
            new THREE.Vector3(
                wristX,
                wristY,
                .5
            );


        wristVector.unproject(
            camera
        );


        const wristDirection =
            wristVector
                .sub(camera.position)
                .normalize();


        const wristDistance =
            (
                targetZ -
                camera.position.z
            ) /
            wristDirection.z;


        const wristPosition =
            camera.position
                .clone()
                .add(
                    wristDirection
                        .multiplyScalar(
                            wristDistance
                        )
                );


        const line =
            ctrl.rayLine
                .geometry
                .attributes
                .position;


        line.setXYZ(
            0,
            wristPosition.x,
            wristPosition.y,
            wristPosition.z
        );


        line.setXYZ(
            1,
            ctrl.pos.x,
            ctrl.pos.y,
            ctrl.pos.z
        );


        line.needsUpdate =
            true;


        ctrl.rayLine.visible =
            true;


        /* PINCH */

        const previousPinch =
            ctrl.isPinching;


        /*
         * SOGLIA PIÙ SENSIBILE
         */

        ctrl.isPinching =
            pinchDistance < .095;


        if (
            !previousPinch &&
            ctrl.isPinching
        ) {

            sounds.playPinch();

        }


        ctrl.statusEl.innerText =
            "ATTIVA";


        if (
            currentMode ===
            "BUILDER"
        ) {

            updateBuilderHand(
                ctrl
            );

        }


    }


    /* =====================================================
       PARTICLE ROTATION
    ===================================================== */

    if (
        currentMode ===
        "PARTICLES" &&
        numHands > 0
    ) {

        const hand =
            detected[0];


        const center =
            hand[9];


        const wrist =
            hand[0];


        targetRotZ =
            -Math.atan2(

                center.y-wrist.y,

                center.x-wrist.x

            ) -
            Math.PI/2;


        /*
         * MOVIMENTO PIÙ REATTIVO
         */

        targetRotX =
            (center.y-.5) *
            Math.PI *
            4.2;


        targetRotY =
            (center.x-.5) *
            Math.PI *
            5.2;


        if (numHands === 2) {

            const hand2 =
                detected[1];


            const distance =
                Math.hypot(

                    center.x -
                    hand2[9].x,

                    center.y -
                    hand2[9].y

                );


            targetScale =
                THREE.MathUtils.clamp(

                    THREE.MathUtils.mapLinear(

                        distance,

                        .16,
                        .75,

                        .65,
                        2.8

                    ),

                    .55,
                    3

                );

        } else {

            const span =
                Math.hypot(

                    wrist.x -
                    hand[12].x,

                    wrist.y -
                    hand[12].y

                );


            targetScale =
                THREE.MathUtils.clamp(

                    THREE.MathUtils.mapLinear(

                        span,

                        .13,
                        .42,

                        .65,
                        2.4

                    ),

                    .55,
                    2.6

                );

        }

    }

}


/* =========================================================
   BUILDER HAND
========================================================= */

function updateBuilderHand(
    ctrl
) {

    if (ctrl.isPinching) {

        if (ctrl.grabbedBlock) {

            const target =
                ctrl.pos
                    .clone()
                    .sub(
                        ctrl.grabOffset
                    );


            ctrl.grabbedBlock
                .position
                .copy(
                    target
                );


            ctrl.grabbedBlock
                .userData
                .velocity
                .set(0,0,0);


            ctrl.grabEl.innerText =
                "AGGANCIATO";


            return;

        }


        let closest =
            null;

        let closestDistance =
            3.2;


        for (
            let i = 0;
            i < blocks.length;
            i++
        ) {

            const block =
                blocks[i];


            const distance =
                ctrl.pos.distanceTo(
                    block.position
                );


            if (
                distance <
                closestDistance
            ) {

                closestDistance =
                    distance;

                closest =
                    block;

            }

        }


        if (closest) {

            ctrl.grabbedBlock =
                closest;

            closest.userData.isGrabbed =
                true;


            ctrl.grabOffset
                .copy(ctrl.pos)
                .sub(
                    closest.position
                );


            setBlockHighlight(
                closest,
                true
            );

        }

    } else {

        if (ctrl.grabbedBlock) {

            setBlockHighlight(
                ctrl.grabbedBlock,
                false
            );

            ctrl.grabbedBlock
                .userData
                .isGrabbed =
                    false;

            ctrl.grabbedBlock =
                null;

        }

        ctrl.grabEl.innerText =
            "LIBERA";

    }

}


/* =========================================================
   BUILDER PHYSICS
========================================================= */

function updateBuilder() {

    const gravity =
        -.045;


    for (
        let i = 0;
        i < blocks.length;
        i++
    ) {

        const block =
            blocks[i];


        if (
            block.userData.isGrabbed
        ) {
            continue;
        }


        block.userData.velocity.y +=
            gravity;


        block.position.add(
            block.userData.velocity
        );


        const floor =
            -6 +
            block.userData.size / 2;


        if (
            block.position.y <
            floor
        ) {

            block.position.y =
                floor;

            block.userData.velocity.y =
                0;

        }

    }

}


/* =========================================================
   PARTICLE UPDATE
========================================================= */

function updateParticles() {

    particleGroup.rotation.x +=
        (
            targetRotX -
            particleGroup.rotation.x
        ) * .22;


    particleGroup.rotation.y +=
        (
            targetRotY +
            .003 -
            particleGroup.rotation.y
        ) * .22;


    particleGroup.rotation.z +=
        (
            targetRotZ -
            particleGroup.rotation.z
        ) * .22;


    handScale +=
        (
            targetScale -
            handScale
        ) * .20;


    const positions =
        particleGeometry
            .attributes
            .position
            .array;


    const pinching =
        (
            controllers[0].active &&
            controllers[0].isPinching
        ) ||
        (
            controllers[1].active &&
            controllers[1].isPinching
        );


    /*
     * Aggiornamento particelle ottimizzato.
     */

    for (
        let i = 0;
        i < PARTICLE_COUNT * 3;
        i += 3
    ) {

        let tx =
            targetPositions[i] *
            handScale;

        let ty =
            targetPositions[i+1] *
            handScale;

        let tz =
            targetPositions[i+2] *
            handScale;


        if (
            pinching &&
            ((i / 3) % 3 === 0)
        ) {

            tx *= .015;
            ty *= .015;
            tz *= .015;

        }


        positions[i] +=
            (
                tx -
                positions[i]
            ) * .20;


        positions[i+1] +=
            (
                ty -
                positions[i+1]
            ) * .20;


        positions[i+2] +=
            (
                tz -
                positions[i+2]
            ) * .20;

    }


    particleGeometry
        .attributes
        .position
        .needsUpdate =
            true;

}


/* =========================================================
   FPS COUNTER
========================================================= */

let fpsFrames = 0;
let fpsLastTime = performance.now();

function updateFPS() {

    fpsFrames++;

    const now =
        performance.now();


    if (
        now -
        fpsLastTime >=
        500
    ) {

        const fps =
            Math.round(

                fpsFrames *
                1000 /
                (now-fpsLastTime)

            );


        document
            .getElementById(
                "fps-counter"
            )
            .innerText =
                `FPS: ${fps}`;


        fpsFrames = 0;

        fpsLastTime =
            now;

    }

}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (
        currentMode ===
        "BUILDER"
    ) {

        updateBuilder();

    } else {

        updateParticles();

    }


    updateFPS();


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
========================================================= */

function onWindowResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )

    );

}


/* =========================================================
   UI EVENTS
========================================================= */

document
    .getElementById(
        "shape-select"
    )
    .addEventListener(
        "change",
        event => {

            generateShape(
                event.target.value
            );

        }
    );


document
    .getElementById(
        "color-picker"
    )
    .addEventListener(
        "input",
        event => {

            if (
                particleMaterial
            ) {

                particleMaterial.color
                    .set(
                        event.target.value
                    );

            }

        }
    );


/*
 * L'audio viene inizializzato SOLO
 * dopo un'interazione dell'utente.
 *
 * Questo evita che blocchi l'avvio
 * della scena.
 */

window.addEventListener(
    "pointerdown",
    () => {

        sounds.init();

    },
    {
        once: true
    }
);


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    () => {

        try {

            initThree();

            initHandTracking();

            animate();

        } catch(error) {

            console.error(
                "STARK ENGINE ERROR:",
                error
            );

            document
                .getElementById(
                    "panel-title-text"
                )
                .innerText =
                    "ENGINE ERROR";

        }

    }
);

</script>
