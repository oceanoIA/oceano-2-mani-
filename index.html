/* =========================================================
   SOUND
========================================================= */

class SciFiSoundSystem{

  constructor(){

    this.ctx=null;

    this.humOsc=null;

    this.humGain=null;

    this.enabled=true;

    this.initialized=false;

  }


  init(){

    if(this.initialized){

      if(this.ctx &&
         this.ctx.state === 'suspended'){

        this.ctx.resume();

      }

      return;

    }

    try{

      const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioCtx) return;

      this.ctx = new AudioCtx();

      this.humOsc =
        this.ctx.createOscillator();

      this.humGain =
        this.ctx.createGain();

      this.humOsc.type='sine';

      this.humOsc.frequency.value=48;

      this.humGain.gain.value=.008;

      this.humOsc.connect(this.humGain);

      this.humGain.connect(
        this.ctx.destination
      );

      this.humOsc.start();

      this.initialized=true;

    }catch(e){

      console.warn('Audio unavailable',e);

    }

  }


  playPinch(){

    if(
      !this.enabled ||
      !this.initialized ||
      !this.ctx
    ) return;

    const now=this.ctx.currentTime;

    const osc=
      this.ctx.createOscillator();

    const gain=
      this.ctx.createGain();

    osc.type='sine';

    osc.frequency.setValueAtTime(
      180,
      now
    );

    osc.frequency.exponentialRampToValueAtTime(
      720,
      now+.07
    );

    gain.gain.setValueAtTime(
      .10,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      now+.08
    );

    osc.connect(gain);

    gain.connect(
      this.ctx.destination
    );

    osc.start(now);

    osc.stop(now+.08);

  }

}

/* =========================================================

    }
  );

}

/* =========================================================
   PARTICLE SYSTEM
========================================================= */

function createParticleSystem(){

  particleCount =
    CONFIG.DEFAULT_PARTICLES;


  targetPositions =
    new Float32Array(
      particleCount*3
    );

  currentPositions =
    new Float32Array(
      particleCount*3
    );


  particleGeometry =
    new THREE.BufferGeometry();


  const positionAttribute =
    new THREE.BufferAttribute(
      currentPositions,
      3
    );

  positionAttribute.setUsage(
    THREE.DynamicDrawUsage
  );


  particleGeometry.setAttribute(
    'position',
    positionAttribute
  );


  /* particle colors */

  const colors =
    new Float32Array(
      particleCount*3
    );


  for(
    let i=0;
    i<particleCount;
    i++
  ){

    const p=i*3;

    const random=
      Math.random();

    let brightness;

    if(random<.70)
      brightness=1;
    else if(random<.9)
      brightness=.68;
    else
      brightness=.35;


    colors[p]=brightness;
    colors[p+1]=brightness;
    colors[p+2]=brightness;

  }


  particleGeometry.setAttribute(
    'color',
    new THREE.BufferAttribute(
      colors,
      3
    )
  );


  /* lightweight particle texture */

  const canvas =
    document.createElement(
      'canvas'
    );

  canvas.width=32;
  canvas.height=32;


  const ctx =
    canvas.getContext('2d');


  const gradient =
    ctx.createRadialGradient(
      16,
      16,
      1,
      16,
      16,
      16
    );

  gradient.addColorStop(
    0,
    '#ffffff'
  );

  gradient.addColorStop(
    .35,
    '#ffffff'
  );

  gradient.addColorStop(
    1,
    'rgba(255,255,255,0)'
  );


  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,
    0,
    32,
    32
  );


  const texture =
    new THREE.CanvasTexture(
      canvas
    );

  texture.needsUpdate=true;


  particleMaterial =
    new THREE.PointsMaterial({

      size:.22,

      map:texture,

      vertexColors:true,

      transparent:true,

      opacity:.92,

      depthWrite:false,

      blending:
        THREE.AdditiveBlending,

      sizeAttenuation:true

    });


  particleSystem =
    new THREE.Points(
      particleGeometry,
      particleMaterial
    );


  particleGroup.add(
    particleSystem
  );


  generateShape(
    'jupiter'
  );

}


/* =========================================================
   VECTOR HELPERS
========================================================= */

function setPoint(
  arr,
  index,
  x,
  y,
  z
){

  const p=index*3;

  arr[p]=x;
  arr[p+1]=y;
  arr[p+2]=z;

}


function rand(min,max){

  return min+
    Math.random()*
    (max-min);

}


function gaussian(){

  let u=0;
  let v=0;

  while(u===0)u=Math.random();
  while(v===0)v=Math.random();

  return Math.sqrt(
    -2*Math.log(u)
  )*
  Math.cos(
    2*Math.PI*v
  );

}


/* =========================================================
   PARTICLE GENERATION
========================================================= */

function generateShape(type){

  const p=
    targetPositions;


  for(
    let i=0;
    i<particleCount;
    i++
  ){

    const n=
      i/particleCount;

    let x=0;
    let y=0;
    let z=0;


    /* =====================================================
       PLANETS
    ===================================================== */

    if(
      type==='jupiter' ||
      type==='saturn' ||
      type==='earth' ||
      type==='mars' ||
      type==='venus'
    ){

      const radius =
        type==='jupiter'
          ? 6.8
          : 5.1;

      const a =
        Math.random()*
        Math.PI*2;

      const u =
        Math.random()*2-1;

      const s =
        Math.sqrt(
          1-u*u
        );

      const rr =
        radius*
        Math.cbrt(
          Math.random()
        );


      x=
        rr*s*Math.cos(a);

      y=
        rr*u;

      z=
        rr*s*Math.sin(a);


      if(
        type==='earth' &&
        Math.random()<.16
      ){

        x*=.88;

        y*=1.05;

      }

    }


    /* =====================================================
       RINGS
    ===================================================== */

    else if(
      type==='rings'
    ){

      const a=
        Math.random()*
        Math.PI*2;

      const r=
        6.2+
        Math.random()*5.5;

      x=
        Math.cos(a)*r;

      z=
        Math.sin(a)*r;

      y=
        gaussian()*.08;

    }


    /* =====================================================
       GALAXY
    ===================================================== */

    else if(
      type==='galaxy'
    ){

      const arms=5;

      const arm=
        i%arms;

      const r=
        Math.pow(
          Math.random(),
          1.45
        )*15;

      const theta=
        r*.43+
        arm*
        (Math.PI*2/arms);


      x=
        Math.cos(theta)*r+
        gaussian()*.42;

      z=
        Math.sin(theta)*r+
        gaussian()*.42;

      y=
        gaussian()*
        Math.max(
          .08,
          1.2-r*.055
        );

    }


    /* =====================================================
       BLACK HOLE
    ===================================================== */

    else if(
      type==='blackhole'
    ){

      const a=
        Math.random()*
        Math.PI*2;

      const r=
        2.2+
        Math.random()*8.5;

      x=
        Math.cos(a)*r;

      z=
        Math.sin(a)*r;

      y=
        gaussian()*.16;

    }


    /* =====================================================
       NEBULA
    ===================================================== */

    else if(
      type==='nebula'
    ){

      const a=
        Math.random()*
        Math.PI*2;

      const r=
        Math.pow(
          Math.random(),
          .65
        )*10;

      x=
        Math.cos(a)*r;

      z=
        Math.sin(a)*r;

      y=
        gaussian()*
        2.5;

    }


    /* =====================================================
       SUPERNOVA
    ===================================================== */

    else if(
      type==='supernova'
    ){

      const a=
        Math.random()*
        Math.PI*2;

      const u=
        Math.random()*2-1;

      const s=
        Math.sqrt(
          1-u*u
        );

      const r=
        1+
        Math.pow(
          Math.random(),
          .25
        )*14;


      x=
        Math.cos(a)*s*r;

      y=
        u*r;

      z=
        Math.sin(a)*s*r;

    }


    /* =====================================================
       DNA
    ===================================================== */

    else if(
      type==='dna'
    ){

      const t=
        n*
        Math.PI*
        14;

      const strand=
        i%2===0
          ? 1
          : -1;


      x=
        Math.sin(t)*
        3.8*
        strand;

      y=
        n*17-8.5;

      z=
        Math.cos(t)*
        3.8*
        strand;


      if(
        i%8===0
      ){

        const a=
          t;

        const mix=
          Math.random();

        x=
          Math.sin(a)*
          3.8*
          (1-2*mix);

        z=
          Math.cos(a)*
          3.8*
          (1-2*mix);

      }

    }


    /* =====================================================
       ATOM
    ===================================================== */

    else if(
      type==='atom'
    ){

      const orbit=
        i%3;

      const a=
        Math.random()*
        Math.PI*2;

      const r=
        7+
        Math.random()*.1;


      if(orbit===0){

        x=
          Math.cos(a)*r;

        y=
          Math.sin(a)*r;

        z=
          gaussian()*.08;

      }else if(orbit===1){

        x=
          Math.cos(a)*r;

        z=
          Math.sin(a)*r;

        y=
          gaussian()*.08;

      }else{

        y=
          Math.cos(a)*r;

        z=
          Math.sin(a)*r;

        x=
          gaussian()*.08;

      }

    }


    /* =====================================================
       HEART
    ===================================================== */

    else if(
      type==='heart'
    ){

      const t=
        Math.random()*
        Math.PI*2;

      const depth=
        gaussian()*.9;


      x=
        16*
        Math.pow(
          Math.sin(t),
          3
        )*.43;

      y=(
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t)
      )*.43;

      z=
        depth;

    }


    /* =====================================================
       BRAIN
    ===================================================== */

    else if(
      type==='brain'
    ){

      const a=
        Math.random()*
        Math.PI*2;

      const u=
        Math.random()*2-1;

      const s=
        Math.sqrt(
          1-u*u
        );

      const r=
        5.8+
        Math.sin(
          a*7
        )*.45;


      x=
        r*s*Math.cos(a);

      y=
        r*u;

      z=
        r*s*Math.sin(a);

      x*=1.12;

      y*=.88;

    }


    /* =====================================================
       EYE
    ===================================================== */

    else if(
      type==='eye'
    ){

      const t=
        Math.random()*
        Math.PI*2;

      const upper=
        Math.sin(t);

      x=
        Math.cos(t)*8;

      y=
        upper*
        3.8;

      z=
        gaussian()*
        .35;

    }


    /* =====================================================
       ROSE
    ===================================================== */

    else if(
      type==='rose'
    ){

      const t=
        Math.random()*
        Math.PI*2;

      const petal=
        Math.sin(
          7*t
        );

      const r=
        4+
        petal*2.7+
        Math.random()*1.4;


      x=
        Math.cos(t)*r;

      z=
        Math.sin(t)*r;

      y=
        gaussian()*
        1.1;

    }


    /* =====================================================
       LOTUS
    ===================================================== */

    else if(
      type==='lotus'
    ){

      const t=
        Math.random()*
        Math.PI*2;

      const r=
        2+
        Math.abs(
          Math.sin(5*t)
        )*6;


      x=
        Math.cos(t)*r;

      z=
        Math.sin(t)*r;

      y=
        Math.cos(
          t*5
        )*2;

    }


    /* =====================================================
       SUN
    ===================================================== */

    else if(
      type==='sun'
    ){

      const a=
        Math.random()*
        Math.PI*2;

      const r=
        5+
        Math.random()*3;


      x=
        Math.cos(a)*r;

      z=
        Math.sin(a)*r;

      y=
        gaussian()*
        .6;

    }


    /* =====================================================
       MOON
    ===================================================== */

    else if(
      type==='moon'
    ){

      const a=
        Math.random()*
        Math.PI*2;

      const r=
        5.8+
        gaussian()*.35;


      x=
        Math.cos(a)*r;

      y=
        gaussian()*.8;

      z=
        Math.sin(a)*r;

    }


    /* =====================================================
       STAR
    ===================================================== */

    else if(
      type==='star'
    ){

      const t=
        Math.random()*
        Math.PI*2;

      const r=
        3+
        4*
        Math.abs(
          Math.cos(5*t)
        );


      x=
        Math.cos(t)*r;

      y=
        Math.sin(t)*r;

      z=
        gaussian()*.5;

    }


    /* =====================================================
       STARFIELD
    ===================================================== */

    else if(
      type==='starfield'
    ){

      x=
        rand(-15,15);

      y=
        rand(-9,9);

      z=
        rand(-8,8);

    }


    /* =====================================================
       PORTAL
    ===================================================== */

    else if(
      type==='portal'
    ){

      const t=
        Math.random()*
        Math.PI*2;

      const r=
        6+
        Math.sin(t*4)*.8;


      x=
        Math.cos(t)*r;

      y=
        Math.sin(t)*r;

      z=
        gaussian()*.25;

    }


    /* =====================================================
       TORNADO
    ===================================================== */

    else if(
      type==='tornado'
    ){

      const y0=
        Math.random()*
        16-8;

      const width=
        1+
        (y0+8)/
        16*6;

      const a=
        Math.random()*
        Math.PI*2+
        y0*.8;

      const r=
        Math.random()*
        width;


      x=
        Math.cos(a)*r;

      z=
        Math.sin(a)*r;

      y=
        y0;

    }


    /* =====================================================
       VORTEX
    ===================================================== */

    else if(
      type==='vortex'
    ){

      const t=
        Math.random()*
        Math.PI*10;

      const r=
        .3+
        n*12;


      x=
        Math.cos(t)*r;

      y=
        Math.sin(t*.5)*4;

      z=
        Math.sin(t)*r;

    }


    /* =====================================================
       SPHERE GRID
    ===================================================== */

    else if(
      type==='spheregrid'
    ){

      const a=
        Math.random()*
        Math.PI*2;

      const phi=
        Math.random()*
        Math.PI;

      const r=6;


      x=
        r*Math.sin(phi)*Math.cos(a);

      y=
        r*Math.cos(phi);

      z=
        r*Math.sin(phi)*Math.sin(a);

    }


    /* =====================================================
       HYPERCUBE
    ===================================================== */

    else if(
      type==='hypercube' ||
      type==='tesseract'
    ){

      const s=6;

      const edge=
        Math.floor(
          Math.random()*12
        );

      const t=
        Math.random()*s-s/2;

      if(edge===0){
        x=s/2;y=t;z=s/2;
      }else if(edge===1){
        x=-s/2;y=t;z=s/2;
      }else if(edge===2){
        x=t;y=s/2;z=s/2;
      }else if(edge===3){
        x=t;y=-s/2;z=s/2;
      }else if(edge===4){
        x=s/2;y=t;z=-s/2;
      }else if(edge===5){
        x=-s/2;y=t;z=-s/2;
      }else if(edge===6){
        x=t;y=s/2;z=-s/2;
      }else if(edge===7){
        x=t;y=-s/2;z=-s/2;
      }else if(edge===8){
        x=s/2;y=s/2;z=t;
      }else if(edge===9){
        x=-s/2;y=s/2;z=t;
      }else if(edge===10){
        x=s/2;y=-s/2;z=t;
      }else{
        x=-s/2;y=-s/2;z=t;
      }

      if(type==='tesseract'){

        x*=1.35;
        y*=1.35;
        z*=1.35;

      }

    }


    /* =====================================================
       CRYSTAL
    ===================================================== */

    else if(
      type==='crystal'
    ){

      const t=
        Math.random()*
        Math.PI*2;

      const r=
        2+
        Math.abs(
          Math.sin(3*t)
        )*5;


      x=
        Math.cos(t)*r;

      z=
        Math.sin(t)*r;

      y=
        rand(-7,7);

    }


    /* =====================================================
       DIAMOND
    ===================================================== */

    else if(
      type==='diamond'
    ){

      const y0=
        rand(-6,6);

      const width=
        6*
        (1-
        Math.abs(y0)/6);


      x=
        rand(-width,width);

      z=
        rand(-width,width);

      y=
        y0;

    }


    /* =====================================================
       PYRAMID
    ===================================================== */

    else if(
      type==='pyramid'
    ){

      const y0=
        rand(-6,6);

      const width=
        (1-
        (y0+6)/12)*7;


      x=
        rand(-width,width);

      z=
        rand(-width,width);

      y=
        y0;

    }


    /* =====================================================
       TORUS
    ===================================================== */

    else if(
      type==='torus'
    ){

      const a=
        Math.random()*
        Math.PI*2;

      const b=
        Math.random()*
        Math.PI*2;

      const R=6;
      const r=.9;


      x=
        (R+r*Math.cos(b))*
        Math.cos(a);

      y=
        r*Math.sin(b);

      z=
        (R+r*Math.cos(b))*
        Math.sin(a);

    }


    /* =====================================================
       MOBIUS
    ===================================================== */

    else if(
      type==='mobius'
    ){

      const u=
        Math.random()*
        Math.PI*2;

      const v=
        rand(-1,1);

      const r=
        6+
        v*
        Math.cos(u/2);


      x=
        r*Math.cos(u);

      y=
        v*
        Math.sin(u/2);

      z=
        r*Math.sin(u);

    }


    /* =====================================================
       WAVE
    ===================================================== */

    else if(
      type==='wave'
    ){

      x=
        rand(-10,10);

      z=
        rand(-7,7);

      y=
        Math.sin(x*.75)*
        2+
        Math.cos(z*.55)*
        1.5;

    }


    /* =====================================================
       LIGHTNING
    ===================================================== */

    else if(
      type==='lightning'
    ){

      y=
        rand(-9,9);

      x=
        Math.sin(y*2.7)*
        2+
        gaussian()*.35;

      z=
        Math.cos(y*3.1)*
        2+
        gaussian()*.35;

    }


    /* =====================================================
       FIREWORKS / ENERGY
    ===================================================== */

    else if(
      type==='fireworks' ||
      type==='energy'
    ){

      const a=
        Math.random()*
        Math.PI*2;

      const u=
        Math.random()*2-1;

      const s=
        Math.sqrt(
          1-u*u
        );

      const r=
        Math.pow(
          Math.random(),
          .35
        )*13;


      x=
        Math.cos(a)*s*r;

      y=
        u*r;

      z=
        Math.sin(a)*s*r;

    }


    /* =====================================================
       NEURAL
    ===================================================== */

    else if(
      type==='neural'
    ){

      const branch=
        i%18;

      const t=
        Math.random()*10;

      const a=
        branch*
        (Math.PI*2/18);


      const r=
        t;

      x=
        Math.cos(a)*r+
        gaussian()*.3;

      y=
        Math.sin(t*1.5)*3+
        gaussian()*.25;

      z=
        Math.sin(a)*r+
        gaussian()*.3;

    }


    /* =====================================================
       FLOWER
    ===================================================== */

    else if(
      type==='flower'
    ){

      const a=
        Math.random()*
        Math.PI*2;

      const r=
        8*
        Math.abs(
          Math.sin(6*a)
        );


      x=
        Math.cos(a)*r;

      y=
        Math.sin(a*3)*2;

      z=
        Math.sin(a)*r;

    }


    /* =====================================================
       SHELL
    ===================================================== */

    else if(
      type==='shell' ||
      type==='spiralshell'
    ){

      const t=
        n*
        Math.PI*
        10;

      const r=
        .3+
        n*10;


      x=
        Math.cos(t)*r;

      y=
        (n-.5)*12;

      z=
        Math.sin(t)*r;

    }


    /* =====================================================
       ANIMALS / OBJECT SILHOUETTES
    ===================================================== */

    else if(
      type==='wolf' ||
      type==='eagle' ||
      type==='whale' ||
      type==='fish' ||
      type==='butterfly'
    ){

      /*
        Queste forme sono silhouette
        procedurali leggere.
        Nessuna immagine esterna.
      */

      if(type==='butterfly'){

        const t=
          Math.random()*
          Math.PI*2;

        const r=
          Math.exp(
            Math.cos(t)
          )-
          2*
          Math.cos(4*t)-
          Math.pow(
            Math.sin(t/12),
            5
          );


        x=
          Math.sin(t)*r*2;

        y=
          Math.cos(t)*r*2;

        z=
          gaussian()*.5;

      }else if(type==='fish'){

        const a=
          Math.random()*
          Math.PI*2;

        const r=
          5+
          Math.cos(a)*2;

        x=
          Math.cos(a)*r;

        y=
          Math.sin(a)*2;

        z=
          gaussian()*.7;

      }else{

        x=
          gaussian()*4.5;

        y=
          gaussian()*3;

        z=
          gaussian()*2.5;

        if(type==='eagle'){

          y*=.6;

          x*=1.7;

        }

        if(type==='whale'){

          x*=1.7;

          y*=.7;

        }

      }

    }


    /* =====================================================
       ROBOT
    ===================================================== */

    else if(
      type==='robot'
    ){

      const part=
        i%5;


      if(part===0){

        x=
          rand(-2.7,2.7);

        y=
          rand(2,6);

        z=
          rand(-2,2);

      }else if(part===1){

        x=
          rand(-4,4);

        y=
          rand(-2,2);

        z=
          rand(-2,2);

      }else if(part===2){

        x=
          rand(-4,4);

        y=
          rand(-7,-2);

        z=
          rand(-1.5,1.5);

      }else{

        x=
          rand(-6,6);

        y=
          rand(-8,7);

        z=
          rand(-1,1);

      }

    }


    /* =====================================================
       ROCKET
    ===================================================== */

    else if(
      type==='rocket'
    ){

      y=
        rand(-8,8);

      const width=
        Math.max(
          .4,
          3-
          Math.abs(y)*.28
        );


      x=
        gaussian()*
        width;

      z=
        gaussian()*
        width;

    }


    /* =====================================================
       SPACE STATION
    ===================================================== */

    else if(
      type==='station'
    ){

      const arm=
        i%6;

      const t=
        rand(-6,6);

      const a=
        arm*
        Math.PI/3;


      x=
        Math.cos(a)*t;

      y=
        gaussian()*.7;

      z=
        Math.sin(a)*t;

    }


    else if(
      type==='dnacloud'
    ){

      const t=
        Math.random()*
        Math.PI*16;

      const r=
        4+
        gaussian()*.15;


      x=
        Math.sin(t)*r;

      y=
        rand(-8,8);

      z=
        Math.cos(t)*r;

    }


    else{

      x=
        gaussian()*5;

      y=
        gaussian()*5;

      z=
        gaussian()*5;

    }


    setPoint(
      p,
      i,
      x,
      y,
      z
    );

  }

}

/* =========================================================
   CUSTOM BUILDER GEOMETRIES
========================================================= */

function mergeGeometriesSimple(geometries){

  const positions=[];

  geometries.forEach(
    g=>{

      const pos=
        g.attributes.position.array;

      for(
        let i=0;
        i<pos.length;
        i++
      ){

        positions.push(
          pos[i]
        );

      }

    }
  );


  const geometry=
    new THREE.BufferGeometry();

  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
      positions,
      3
    )
  );

  return geometry;

}


function createStarGeometry(){

  const shape=
    new THREE.Shape();

  const points=10;

  for(
    let i=0;
    i<points;
    i++
  ){

    const a=
      i/points*
      Math.PI*2-
      Math.PI/2;

    const r=
      i%2===0
        ? 3
        : 1.35;

    const x=
      Math.cos(a)*r;

    const y=
      Math.sin(a)*r;

    if(i===0)
      shape.moveTo(x,y);
    else
      shape.lineTo(x,y);

  }

  shape.closePath();

  return new THREE.ExtrudeGeometry(
    shape,
    {
      depth:1.2,
      bevelEnabled:true,
      bevelSegments:1,
      bevelSize:.15,
      bevelThickness:.15
    }
  );

}


function createCrossGeometry(){

  const a=
    new THREE.BoxGeometry(
      4,
      1.2,
      1.2
    );

  const b=
    new THREE.BoxGeometry(
      1.2,
      4,
      1.2
    );

  const c=
    new THREE.BoxGeometry(
      1.2,
      1.2,
      4
    );

  return mergeGeometriesSimple([
    a,b,c
  ]);

}


function createHeartGeometry(){

    -3,
    4.5,
    0,
    2.2
  );

  shape.bezierCurveTo(
    3,
    4.5,
    4,
    1,
    0,
    -1.8
  );

  return new THREE.ExtrudeGeometry(
    shape,
    {
      depth:1.5,
      bevelEnabled:true,
      bevelSegments:2,
      bevelSize:.2,
      bevelThickness:.2
    }

  const points=[];

  for(
    let i=0;
    i<40;
    i++
  ){

    const t=
      i/39*
      Math.PI*4;

    points.push(
      new THREE.Vector3(
        Math.cos(t)*1.6,
        i/39*5-2.5,
        Math.sin(t)*1.6
      )
    );

  }

  const curve=
    new THREE.CatmullRomCurve3(
      points
    );

  return new THREE.TubeGeometry(
    curve,
    48,
    .18,
    6,
    false
  );

/* =========================================================
   SPAWN BUILDER OBJECT
========================================================= */

function spawnShape(
  type,
  x,
  y,
  z
){

  if(
    blocks.length >=
    CONFIG.MAX_BUILDER_OBJECTS
  ){

    return;

  }


  sounds.init();


  const geo=
    createBuilderGeometry(
      type
    );


  geo.computeBoundingBox();


  const material=
    new THREE.MeshStandardMaterial({

      color:
        Math.random()>.5
          ? 0xffffff
          : 0x888888,

      roughness:.28,

      metalness:.3

    });


  const mesh=
    new THREE.Mesh(
      geo,
      material
    );


  mesh.position.set(

    x !== undefined
      ? x
      : rand(-7,7),

    y !== undefined
      ? y
      : 6+Math.random()*5,

    z !== undefined
      ? z
      : rand(-4,3)

  );


  const box=
    new THREE.Box3()
      .setFromObject(
        mesh
      );


  const size=
    new THREE.Vector3();

  box.getSize(size);


  mesh.userData={

    velocity:
      new THREE.Vector3(),

    isGrabbed:false,

    originalColor:
      material.color.getHex(),

    halfHeight:
      size.y/2,

    halfWidth:
      size.x/2,

    halfDepth:
      size.z/2,

    type:type

  };


  builderGroup.add(
    mesh
  );


  blocks.push(
    mesh
  );


  updateObjectCount();

}

/* =========================================================
   REMOVE BUILDER
========================================================= */

function clearBlocks(){

  blocks.forEach(
    block=>{

      builderGroup.remove(
        block
      );

      if(block.geometry)
        block.geometry.dispose();

      if(block.material)
        block.material.dispose();

    }
  );


  blocks=[];


  controllers.forEach(
    ctrl=>{

      ctrl.grabbedBlock=null;

    }
  );


  updateObjectCount();

}

/* =========================================================
   BUILDER COLLISION SYSTEM
========================================================= */

function updateBuilderPhysics(){

  const floorY=-6;


  for(
    let i=0;
    i<blocks.length;
    i++
  ){

    const block=
      blocks[i];


    if(
      block.userData.isGrabbed
    ){

      block.userData.velocity.set(
        0,
        0,
        0
      );

      continue;

    }


    const data=
      block.userData;


    data.velocity.y +=
      CONFIG.GRAVITY;


    block.position.y +=
      data.velocity.y;


    let supportY=
      floorY+
      data.halfHeight;


    /*
      Cerca l'oggetto più alto
      direttamente sotto al blocco.
    */

    for(
      let j=0;
      j<blocks.length;
      j++
    ){

      if(i===j) continue;


      const other=
        blocks[j];

      const od=
        other.userData;


      const overlapX=
        Math.abs(
          block.position.x-
          other.position.x
        )
        <
        (
          data.halfWidth+
          od.halfWidth
        )*.92;


      const overlapZ=
        Math.abs(
          block.position.z-
          other.position.z
        )
        <
        (
          data.halfDepth+
          od.halfDepth
        )*.92;


      if(
        !overlapX ||
        !overlapZ
      ) continue;


      const top=
        other.position.y+
        od.halfHeight+
        data.halfHeight;


      if(
        block.position.y <= top &&
        top > supportY
      ){

        supportY=top;

      }

    }


    if(
      block.position.y<
      supportY
    ){

      block.position.y=
        supportY;

      data.velocity.y=0;

    }

  }

}


/* =========================================================
   HAND TO WORLD
========================================================= */

function handToWorld(
  landmark
){

  const ndcX=
    (
      (1-landmark.x)*2-1
    )*
    CONFIG.HAND_SENSITIVITY;


  const ndcY=
    (
      -(landmark.y*2-1)
    )*
    CONFIG.HAND_SENSITIVITY;


  const vector=
    new THREE.Vector3(
      ndcX,
      ndcY,
      .5
    );


  vector.unproject(
    camera
  );


  const direction=
    vector
      .sub(camera.position)
      .normalize();


  /*
    profondità controllata
    dallo Z della mano.
  */

  const targetZ=
    -landmark.z*18;


  const distance=
    (
      targetZ-
      camera.position.z
    )/
    direction.z;


  return camera.position
    .clone()
    .add(
      direction.multiplyScalar(
        distance
      )
    );

}


/* =========================================================
   HAND UPDATE
========================================================= */

function processHands(
  multiHandLandmarks
){

  const numHands=
    multiHandLandmarks
      ? multiHandLandmarks.length
      : 0;


  for(
    let i=0;
    i<2;
    i++
  ){

    const ctrl=
      controllers[i];


    if(
      i>=numHands
    ){

      deactivateController(
        ctrl
      );

      continue;

    }


    ctrl.active=true;


    const landmarks=
      multiHandLandmarks[i];


    const thumb=
      landmarks[4];

    const index=
      landmarks[8];

    const wrist=
      landmarks[0];


    const center={

      x:
        (thumb.x+
        index.x)/2,

      y:
        (thumb.y+
        index.y)/2,

      z:
        (thumb.z+
        index.z)/2

    };


    const pinchDistance=
      Math.hypot(

        thumb.x-index.x,

        thumb.y-index.y

      );


    const wasPinching=
      ctrl.isPinching;


    ctrl.isPinching=
      pinchDistance<
      CONFIG.PINCH_THRESHOLD;


    if(
      !wasPinching &&
      ctrl.isPinching
    ){

      sounds.playPinch();

    }


    const target=
      handToWorld(
        center
      );


    /*
      smoothing molto leggero:
      mantiene la risposta rapida.
    */

    ctrl.lastPos.copy(
      ctrl.pos
    );


    ctrl.pos.lerp(
      target,
      .72
    );


    ctrl.velocity
      .copy(ctrl.pos)
      .sub(ctrl.lastPos);


    ctrl.mesh.visible=true;

    ctrl.pointLight.visible=true;

    ctrl.rayLine.visible=true;


    ctrl.mesh.position.copy(
      ctrl.pos
    );

    ctrl.pointLight.position.copy(
      ctrl.pos
    );


    updateRay(
      ctrl,
      wrist,
      center
    );


    ctrl.statusEl.textContent=
      'ATTIVA';

    ctrl.statusEl.style.color=
      '#ffffff';


    if(
      currentMode==='BUILDER'
    ){

      handleBuilderHand(
        ctrl
      );

    }


    if(
      currentMode==='PARTICLES'
    ){

      ctrl.grabEl.textContent=
        ctrl.isPinching
          ? 'PINCH'
          : 'LIBERA';

      ctrl.grabEl.style.color=
        ctrl.isPinching
          ? '#ffffff'
          : '#888888';

    }

  }


  updateParticleHandControls(
    multiHandLandmarks
  );

}


/* =========================================================
   RAY
========================================================= */

function updateRay(
  ctrl,
  wrist,
  center
){

  const wristWorld=
    handToWorld(
      wrist
    );


  const attr=
    ctrl.rayLine
      .geometry
      .attributes
      .position;


  attr.setXYZ(
    0,
    wristWorld.x,
    wristWorld.y,
    wristWorld.z
  );


  attr.setXYZ(
    1,
    ctrl.pos.x,
    ctrl.pos.y,
    ctrl.pos.z
  );


  attr.needsUpdate=true;

}


/* =========================================================
   DEACTIVATE HAND
========================================================= */

function deactivateController(
  ctrl
){

  ctrl.active=false;

  ctrl.mesh.visible=false;

  ctrl.pointLight.visible=false;

  ctrl.rayLine.visible=false;


  if(
    ctrl.grabbedBlock
  ){

    setBlockHighlight(
      ctrl.grabbedBlock,
      false
    );

    ctrl.grabbedBlock.userData.isGrabbed=false;

    ctrl.grabbedBlock=null;

  }


  ctrl.isPinching=false;


  ctrl.statusEl.textContent=
    'CERCA...';

  ctrl.statusEl.style.color=
    '#666';


  ctrl.grabEl.textContent=
    'N/A';

}


/* =========================================================
   BUILDER HAND
========================================================= */

function handleBuilderHand(
  ctrl
){

  if(
    ctrl.isPinching
  ){

    if(
      ctrl.grabbedBlock
    ){

      const target=
        ctrl.pos
          .clone()
          .sub(
            ctrl.grabOffset
          );


      ctrl.grabbedBlock.position.copy(
        target
      );


      ctrl.grabbedBlock.userData.velocity.set(
        0,
        0,
        0
      );


      ctrl.grabEl.textContent=
        'AGGANCIATO';

      ctrl.grabEl.style.color=
        '#ffffff';


    }else{

      let closest=null;

      let distance=3.7;


      for(
        let i=0;
        i<blocks.length;
        i++
      ){

        const block=
          blocks[i];


        const d=
          ctrl.pos.distanceTo(
            block.position
          );


        if(
          d<distance
        ){

          distance=d;

          closest=block;

        }

      }


      if(closest){

        ctrl.grabbedBlock=
          closest;

        closest.userData.isGrabbed=
          true;

        ctrl.grabOffset.copy(
          ctrl.pos
        )
        .sub(
          closest.position
        );


        setBlockHighlight(
          closest,
          true
        );

      }

    }

  }else{

    if(
      ctrl.grabbedBlock
    ){

      const block=
        ctrl.grabbedBlock;


      setBlockHighlight(
        block,
        false
      );


      block.userData.isGrabbed=
        false;


      /*
        Trasferisce un minimo
        di velocità al rilascio.
      */

      block.userData.velocity
        .copy(
          ctrl.velocity
        )
        .multiplyScalar(.8);


      ctrl.grabbedBlock=
        null;

    }


    ctrl.grabEl.textContent=
      'LIBERA';

    ctrl.grabEl.style.color=
      '#888';

  }

}


/* =========================================================
   PARTICLE HAND CONTROL
========================================================= */

function updateParticleHandControls(
  hands
){

  if(
    !hands ||
    hands.length===0
  ){

    targetScale=
      1;

    return;

  }


  const h1=
    hands[0];


  const center=
    h1[9];

  const wrist=
    h1[0];


  targetRotZ=
    -Math.atan2(
      center.y-wrist.y,
      center.x-wrist.x
    )
    -
    Math.PI/2;


  targetRotX=
    (
      center.y-.5
    )*
    Math.PI*
    2.9;


  targetRotY=
    (
      center.x-.5
    )*
    Math.PI*
    3.7;


  if(
    hands.length>=2
  ){

    const h2=
      hands[1];


    const distance=
      Math.hypot(

        h1[9].x-h2[9].x,

        h1[9].y-h2[9].y

      );


    targetScale=
      THREE.MathUtils.clamp(

        THREE.MathUtils.mapLinear(
          distance,
          .16,
          .75,
          .65,
          2.55
        ),

        .55,
        2.8

      );

  }else{

    const span=
      Math.hypot(

        wrist.x-h1[12].x,

        wrist.y-h1[12].y

      );


    targetScale=
      THREE.MathUtils.clamp(

        THREE.MathUtils.mapLinear(
          span,
          .13,
          .43,
          .7,
          2.25
        ),

        .55,
        2.6

      );

  }

}


/* =========================================================
   PREVIEW
========================================================= */

function drawHandSkeletonPreview(
  ctx,
  multiHandLandmarks,
  w,
  h
){

  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  ctx.fillStyle=
    '#080b0d';

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  if(
    !multiHandLandmarks ||
    !multiHandLandmarks.length
  ){

    ctx.fillStyle=
      'rgba(255,255,255,.35)';

    ctx.font=
      '9px Share Tech Mono';

    ctx.textAlign='center';

    ctx.fillText(
      'CERCA MANO...',
      w/2,
      h/2
    );

    return;

  }


  multiHandLandmarks.forEach(
    landmarks=>{

      ctx.lineWidth=1.6;

      ctx.strokeStyle=
        '#ffffff';


      HAND_CONNECTIONS.forEach(
        ([a,b])=>{

          const p1=
            landmarks[a];

          const p2=
            landmarks[b];


          ctx.beginPath();

          ctx.moveTo(
            p1.x*w,
            p1.y*h
          );

          ctx.lineTo(
            p2.x*w,
            p2.y*h
          );

          ctx.stroke();

        }
      );


      landmarks.forEach(
        (pt,index)=>{

          const important=
            index===4 ||
            index===8;


          ctx.fillStyle=
            important
              ? '#ffffff'
              : '#aaaaaa';


          ctx.beginPath();

          ctx.arc(
            pt.x*w,
            pt.y*h,
            important?3.2:1.7,
            0,
            Math.PI*2
          );

          ctx.fill();

        }
      );

    }
  );

}


/* =========================================================
   MEDIAPIPE
========================================================= */

function initHandTracking(){

  const video=
    document.getElementById(
      'video-input'
    );


  const hands=
    new Hands({

      locateFile:file=>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

    });


  hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:.45,

    minTrackingConfidence:.45

  });


  hands.onResults(
    results=>{

      const now=
        performance.now();


      /*
        Evita elaborazioni inutili
        troppo ravvicinate.
      */

      if(
        now-lastHandProcess<
        HAND_PROCESS_INTERVAL
      ){

        return;

      }


      lastHandProcess=
        now;


      handResultsCache=
        results.multiHandLandmarks ||
        [];


      drawHandSkeletonPreview(

        previewCtx,

        handResultsCache,

        previewCanvas.width,

        previewCanvas.height

      );


      processHands(
        handResultsCache
      );

    }
  );


  const cameraUtils=
    new Camera(
      video,
      {

        onFrame:async()=>{

          if(
            video.readyState>=2
          ){

            await hands.send({
              image:video
            });

          }

        },

        width:
          CONFIG.HAND_WIDTH,

        height:
          CONFIG.HAND_HEIGHT

      }
    );


  cameraUtils.start()
    .catch(
      error=>{

        console.warn(
          'Camera start retry',
          error
        );


        setTimeout(
          ()=>{
            cameraUtils
              .start()
              .catch(
                console.warn
              );
          },
          1200
        );

      }
    );

}


/* =========================================================
   PARTICLE ANIMATION
========================================================= */

function updateParticles(){

  /*
    Interpolazione veloce.
    Non facciamo calcoli costosi
    aggiuntivi per ogni particella.
  */

  handExpansionScale +=
    (
      targetScale-
      handExpansionScale
    )*.24;


  particleGroup.rotation.x +=
    (
      targetRotX-
      particleGroup.rotation.x
    )*.20;


  particleGroup.rotation.y +=
    (
      targetRotY+
      .002-
      particleGroup.rotation.y
    )*.20;


  particleGroup.rotation.z +=
    (
      targetRotZ-
      particleGroup.rotation.z
    )*.20;


  camera.position.z +=
    (
      targetCamZ-
      camera.position.z
    )*.16;


  const positions=
    particleGeometry
      .attributes
      .position
      .array;


  const anyPinching=
    controllers[0].active &&
    controllers[0].isPinching ||
    controllers[1].active &&
    controllers[1].isPinching;


  /*
    Quando fai pinch,
    una parte delle particelle
    viene attirata verso il centro.
  */

  for(
    let i=0;
    i<particleCount;
    i++
  ){

    const p=i*3;


    let tx=
      targetPositions[p]*
      handExpansionScale;


    let ty=
      targetPositions[p+1]*
      handExpansionScale;


    let tz=
      targetPositions[p+2]*
      handExpansionScale;


    if(
      anyPinching &&
      i%3===0
    ){

      tx*=.025;

      ty*=.025;

      tz*=.025;

    }


    const speed=
      anyPinching &&
      i%3===0
        ? .45
        : .23;


    positions[p]+=
      (
        tx-
        positions[p]
      )*
      speed;


    positions[p+1]+=
      (
        ty-
        positions[p+1]
      )*
      speed;


    positions[p+2]+=
      (
        tz-
        positions[p+2]
      )*
      speed;

  }


  particleGeometry
    .attributes
    .position
    .needsUpdate=true;

}


/* =========================================================
   FPS
========================================================= */

function updateFPS(){

  frameCounter++;


  const now=
    performance.now();


  if(
    now-lastFpsTime>=500
  ){

    fpsValue=
      Math.round(
        frameCounter/
        (
          (now-lastFpsTime)/
          1000
        )
      );


    document.getElementById(
      'fps-value'
    ).textContent=
      fpsValue;


    frameCounter=0;

    lastFpsTime=now;

  }

}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  if(
    currentMode==='BUILDER'
  ){

    updateBuilderPhysics();

  }


  if(
    currentMode==='PARTICLES'
  ){

    updateParticles();

  }


  renderer.render(
    scene,
    camera
  );


  updateFPS();

}


/* =========================================================
   RESIZE
========================================================= */

function onWindowResize(){

  camera.aspect=
    window.innerWidth/
    window.innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    window.innerWidth,
    window.innerHeight,
    false
  );


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      1.25
    )
  );

}


/* =========================================================
   PARTICLE DENSITY
========================================================= */

function rebuildParticles(
  newCount
){

  if(
    newCount===
    particleCount
  ) return;


  particleCount=
    newCount;


  particleGroup.remove(
    particleSystem
  );


  if(
    particleGeometry
  ){

    particleGeometry.dispose();

  }


  if(
    particleMaterial
  ){

    particleMaterial.dispose();

  }


  createParticleSystem();


  const selected=
    document.getElementById(
      'shape-select'
    ).value;


  generateShape(
    selected
  );

}


/* =========================================================
   OBJECT COUNT
========================================================= */

function updateObjectCount(){

  document.getElementById(
    'object-count'
  ).textContent=
    blocks.length;

}

/* =========================================================
   MODE BUTTONS
========================================================= */

function createModeDock(){

  const dock=
    document.querySelector(
      '.mode-dock'
    );


  if(dock) return;


  const newDock=
    document.createElement(
      'div'
    );

  newDock.className=
    'mode-dock';


  newDock.innerHTML=`

    <button
      id="tab-builder"
      class="tab-btn"
      onclick="switchMode('BUILDER')">

      SYS 01: 3D BUILDER

    </button>

    <button
      id="tab-particles"
      class="tab-btn active"
      onclick="switchMode('PARTICLES')">

      SYS 02: PLASMA MATRIX

    </button>

  `;


  document.body.appendChild(
    newDock
  );

}
