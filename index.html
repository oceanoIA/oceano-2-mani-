<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NEURAL — Hand Interface</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020204;
  color:#fff;
  font-family:Inter,Arial,sans-serif
}

body{
  user-select:none
}

button,
select,
input{
  font:inherit
}

button{
  cursor:pointer
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,#101014 0%,#030305 48%,#000 100%)
}

#three{
  position:absolute;
  inset:0
}

canvas{
  display:block
}

/* =====================================================
   GLASS
===================================================== */

.glass{
  background:rgba(18,18,22,.58);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
    0 20px 70px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px)
}

/* =====================================================
   HEADER
===================================================== */

#header{
  position:absolute;
  z-index:20;
  top:14px;
  left:14px;
  right:14px;
  height:58px;
  border-radius:20px;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:16px
}

.logo{
  font-size:13px;
  font-weight:900;
  letter-spacing:5px
}

.version{
  font-size:9px;
  letter-spacing:2px;
  opacity:.3
}

.system{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:9px;
  letter-spacing:1.5px;
  opacity:.7
}

.statusDot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 16px #fff
}

/* =====================================================
   CONTROL PANEL
===================================================== */

#panel{
  position:absolute;
  z-index:20;
  left:14px;
  top:86px;
  width:245px;
  padding:15px;
  border-radius:22px
}

.section{
  margin-bottom:16px
}

.label{
  margin-bottom:8px;
  font-size:8px;
  letter-spacing:2px;
  text-transform:uppercase;
  opacity:.38
}

select,
input[type=range]{
  width:100%
}

select{
  border:1px solid rgba(255,255,255,.1);
  outline:none;
  border-radius:12px;
  padding:10px;
  color:#fff;
  background:#111115;
  font-size:10px
}

select option{
  background:#111;
  color:#fff
}

button{
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  background:rgba(255,255,255,.055);
  border-radius:11px;
  padding:10px;
  transition:.18s
}

button:hover{
  background:rgba(255,255,255,.12)
}

button:active{
  transform:scale(.97)
}

button.active{
  color:#000;
  background:#fff
}

.full{
  width:100%
}

.modeRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px
}

.modeBtn{
  height:44px;
  font-size:9px;
  font-weight:700;
  letter-spacing:1px
}

.modeBtn span{
  display:block;
  margin-top:3px;
  font-size:7px;
  opacity:.45
}

.clock{
  font-size:23px;
  font-weight:800;
  letter-spacing:4px
}

.date{
  margin-top:3px;
  font-size:8px;
  letter-spacing:1px;
  opacity:.3
}

.rangeLine{
  display:flex;
  align-items:center;
  gap:8px
}

.rangeValue{
  min-width:35px;
  text-align:right;
  font-size:9px;
  opacity:.5
}

/* =====================================================
   CAMERA
===================================================== */

#cameraPanel{
  position:absolute;
  z-index:21;
  right:14px;
  top:86px;
  width:205px;
  height:154px;
  border-radius:20px;
  overflow:hidden
}

#video{
  display:none
}

#cameraCanvas{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transform:scaleX(-1)
}

.cameraTitle{
  position:absolute;
  left:10px;
  top:9px;
  font-size:8px;
  letter-spacing:2px;
  text-shadow:0 2px 8px #000
}

.cameraStatus{
  position:absolute;
  right:10px;
  top:9px;
  font-size:8px;
  opacity:.7
}

/* =====================================================
   HAND CURSOR
===================================================== */

#handCursor{
  position:absolute;
  z-index:18;
  width:26px;
  height:26px;
  border:1px solid rgba(255,255,255,.9);
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  display:none;
  box-shadow:
    0 0 15px rgba(255,255,255,.8),
    inset 0 0 8px rgba(255,255,255,.2)
}

#handCursor:after{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 14px #fff
}

#handCursor.pinch{
  width:40px;
  height:40px
}

/* =====================================================
   HUD
===================================================== */

#hud{
  position:absolute;
  z-index:20;
  right:14px;
  bottom:78px;
  min-width:145px;
  padding:10px 13px;
  border-radius:15px;
  font-size:8px;
  line-height:2;
  letter-spacing:1.5px;
  opacity:.7
}

#hud b{
  float:right;
  margin-left:18px;
  opacity:1
}

/* =====================================================
   BOTTOM DOCK
===================================================== */

#dock{
  position:absolute;
  z-index:25;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  padding:7px;
  border-radius:19px
}

.dockButton{
  min-width:115px;
  height:40px;
  font-size:9px;
  font-weight:700;
  letter-spacing:1px
}

/* =====================================================
   COMMAND
===================================================== */

#command{
  position:absolute;
  z-index:30;
  left:50%;
  bottom:72px;
  width:min(440px,calc(100% - 28px));
  transform:translateX(-50%);
  display:none
}

#command form{
  display:flex;
  gap:6px
}

#command input{
  min-width:0;
  flex:1;
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  border-radius:12px;
  padding:11px;
  color:#fff;
  background:rgba(15,15,18,.8)
}

#command button{
  width:70px
}

/* =====================================================
   TOAST
===================================================== */

#toast{
  position:absolute;
  z-index:100;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:12px 20px;
  border-radius:15px;
  font-size:10px;
  letter-spacing:1.5px;
  opacity:0;
  pointer-events:none;
  transition:.2s
}

#toast.show{
  opacity:1
}

/* =====================================================
   START
===================================================== */

#start{
  position:absolute;
  z-index:200;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(35,35,42,.5),#010103 68%)
}

.startCard{
  width:min(420px,calc(100% - 30px));
  padding:30px;
  border-radius:28px;
  text-align:center
}

.startCard h1{
  margin:0;
  font-size:30px;
  letter-spacing:7px
}

.startCard p{
  margin:12px 0 24px;
  font-size:10px;
  line-height:1.8;
  opacity:.42
}

#startButton{
  width:100%;
  height:46px;
  color:#000;
  background:#fff;
  font-weight:800
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  #header{
    left:8px;
    right:8px;
    top:8px
  }

  #panel{
    left:8px;
    top:75px;
    width:190px
  }

  #cameraPanel{
    right:8px;
    top:75px;
    width:145px;
    height:110px
  }

  #hud{
    right:8px;
    bottom:66px
  }

  #dock{
    bottom:8px
  }

  .dockButton{
    min-width:95px
  }

  .version{
    display:none
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="three"></div>

  <!-- HEADER -->
  <div id="header" class="glass">
    <div class="logo">NEURAL</div>
    <div class="version">HAND INTERFACE / 02</div>

    <div class="system">
      <span class="statusDot"></span>
      <span id="systemText">WAITING</span>
    </div>
  </div>

  <!-- CONTROL PANEL -->
  <div id="panel" class="glass">

    <div class="section">

      <div class="label">System mode</div>

      <div class="modeRow">

        <button
          id="builderButton"
          class="modeBtn active"
          onclick="setMode('builder')">
          BUILDER
          <span>3D WORLD</span>
        </button>

        <button
          id="holoButton"
          class="modeBtn"
          onclick="setMode('hologram')">
          HOLOGRAM
          <span>PARTICLE FIELD</span>
        </button>

      </div>

    </div>

    <!-- BUILDER CONTROLS -->

    <div id="builderControls">

      <div class="section">

        <div class="label">3D object</div>

        <select id="builderSelect"></select>

        <button
          class="full"
          style="margin-top:7px"
          onclick="createSelectedObject()">
          CREATE OBJECT
        </button>

        <button
          class="full"
          style="margin-top:6px"
          onclick="clearWorld()">
          CLEAR WORLD
        </button>

      </div>

    </div>

    <!-- HOLOGRAM CONTROLS -->

    <div id="hologramControls" style="display:none">

      <div class="section">

        <div class="label">Hologram</div>

        <select id="hologramSelect"></select>

        <button
          class="full"
          style="margin-top:7px"
          onclick="loadSelectedHologram()">
          LOAD HOLOGRAM
        </button>

      </div>

      <div class="section">

        <div class="label">Particle density</div>

        <div class="rangeLine">

          <input
            id="particleSlider"
            type="range"
            min="1800"
            max="7500"
            value="5200">

          <span
            id="particleValue"
            class="rangeValue">
            5200
          </span>

        </div>

      </div>

    </div>

    <!-- HAND -->

    <div class="section">

      <div class="label">Hand sensitivity</div>

      <div class="rangeLine">

        <input
          id="sensitivitySlider"
          type="range"
          min="0.7"
          max="2.5"
          step="0.1"
          value="1.6">

        <span
          id="sensitivityValue"
          class="rangeValue">
          1.6
        </span>

      </div>

    </div>

    <!-- CLOCK -->

    <div class="section">

      <div class="label">System time</div>

      <div
        id="clock"
        class="clock">
        00:00:00
      </div>

      <div
        id="date"
        class="date">
        SYSTEM
      </div>

    </div>

    <button
      class="full"
      onclick="toggleCommand()">
      COMMAND / SEND
    </button>

  </div>

  <!-- CAMERA -->

  <div id="cameraPanel" class="glass">

    <video
      id="video"
      autoplay
      playsinline>
    </video>

    <canvas id="cameraCanvas"></canvas>

    <div class="cameraTitle">
      HAND SENSOR
    </div>

    <div
      id="cameraStatus"
      class="cameraStatus">
      OFF
    </div>

  </div>

  <!-- HAND CURSOR -->

  <div id="handCursor"></div>

  <!-- HUD -->

  <div id="hud" class="glass">

    FPS
    <b id="fps">0</b>
    <br>

    HANDS
    <b id="hands">0</b>
    <br>

    PINCH
    <b id="pinch">NO</b>
    <br>

    OBJECTS
    <b id="objectCount">0</b>
    <br>

    PARTICLES
    <b id="particleCount">5200</b>

  </div>

  <!-- BOTTOM -->

  <div id="dock" class="glass">

    <button
      id="dockBuilder"
      class="dockButton active"
      onclick="setMode('builder')">
      BUILDER
    </button>

    <button
      id="dockHolo"
      class="dockButton"
      onclick="setMode('hologram')">
      HOLOGRAM
    </button>

    <button
      class="dockButton"
      onclick="toggleCommand()">
      COMMAND
    </button>

  </div>

  <!-- COMMAND -->

  <div id="command" class="glass">

    <form id="commandForm">

      <input
        id="commandInput"
        placeholder="Scrivi un comando..."
        autocomplete="off">

      <button type="submit">
        INVIA
      </button>

    </form>

  </div>

  <!-- TOAST -->

  <div
    id="toast"
    class="glass">
  </div>

  <!-- START -->

  <div id="start">

    <div class="startCard glass">

      <h1>NEURAL</h1>

      <p>
        HAND CONTROLLED 3D INTERFACE<br>
        BUILDER / HOLOGRAM / PARTICLE ENGINE
      </p>

      <button id="startButton">
        INITIALIZE SYSTEM
      </button>

    </div>

  </div>

</div>

<!-- =====================================================
     LIBRARIES
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

/* =====================================================
   SHORTCUT
===================================================== */

const $ = id => document.getElementById(id);


/* =====================================================
   STATE
===================================================== */

let mode = 'builder';

let sensitivity = 1.6;

let activeParticles = 5200;

let handVisible = false;

let isPinching = false;

let grabbedObject = null;

let handX = 0;

let handY = 0;

let smoothX = 0;

let smoothY = 0;

let lastPinch = false;

let handsInstance = null;

let mpCamera = null;

let cameraStarted = false;

let startTime = performance.now();

let frameCounter = 0;

let fps = 0;


/* =====================================================
   THREE
===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020204);


const camera = new THREE.PerspectiveCamera(
  55,
  innerWidth / innerHeight,
  .1,
  1000
);

camera.position.set(0,4,24);


const renderer = new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:'high-performance'
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1,1.25)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.outputEncoding = THREE.sRGBEncoding;

$('three').appendChild(renderer.domElement);


/* =====================================================
   WORLD
===================================================== */

const world = new THREE.Group();

scene.add(world);


const ambient = new THREE.AmbientLight(
  0xffffff,
  .65
);

scene.add(ambient);


const keyLight = new THREE.DirectionalLight(
  0xffffff,
  1.5
);

keyLight.position.set(
 8,
 15,
 12
);

scene.add(keyLight);


const rimLight = new THREE.PointLight(
  0xffffff,
  1.2,
  40
);

rimLight.position.set(
 -8,
 8,
 10
);

scene.add(rimLight);


/* =====================================================
   FLOOR
===================================================== */

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshStandardMaterial({
    color:0x070709,
    roughness:.9,
    metalness:.05
  })
);

floor.rotation.x = -Math.PI/2;

floor.position.y = -4;

world.add(floor);


const grid = new THREE.GridHelper(
  80,
  40,
  0x242429,
  0x111115
);

grid.position.y = -3.98;

world.add(grid);


/* =====================================================
   BUILDER DATA
===================================================== */

const BUILDER_FORMS = [

  ['CUBE','cube'],
  ['SMALL CUBE','smallCube'],
  ['RECTANGLE','rectangle'],
  ['PLATFORM','platform'],
  ['SPHERE','sphere'],
  ['ICO SPHERE','ico'],
  ['CYLINDER','cylinder'],
  ['TALL CYLINDER','tallCylinder'],
  ['CONE','cone'],
  ['PYRAMID','pyramid'],
  ['TORUS','torus'],
  ['RING','ring'],
  ['DIAMOND','diamond'],
  ['CRYSTAL','crystal'],
  ['ARCH','arch'],
  ['CROSS','cross'],
  ['STAR','star'],
  ['GEAR','gear'],
  ['ROCKET','rocket'],
  ['SATELLITE','satellite'],
  ['ROBOT','robot'],
  ['HOUSE','house'],
  ['TREE','tree'],
  ['LAMP','lamp'],
  ['CHAIR','chair'],
  ['TABLE','table'],
  ['MUSHROOM','mushroom'],
  ['BELL','bell'],
  ['TROPHY','trophy'],
  ['MICROPHONE','microphone'],
  ['PLANET','planet'],
  ['SPACE STATION','station'],
  ['TURBINE','turbine'],
  ['DNA','dna'],
  ['ATOM','atom'],
  ['NEURAL CORE','neural'],
  ['SPIRAL','spiral'],
  ['WAVE','wave'],
  ['MOBIUS','mobius'],
  ['HEART','heart'],
  ['FLOWER','flower'],
  ['BUTTERFLY','butterfly'],
  ['OWL','owl'],
  ['PORTAL','portal'],
  ['ENGINE','engine'],
  ['CORE','core'],
  ['UFO','ufo'],
  ['DRONE','drone'],
  ['SATELLITE DISH','dish'],
  ['BEACON','beacon']
];


BUILDER_FORMS.forEach((item,index)=>{

  const option =
    document.createElement('option');

  option.value = index;

  option.textContent = item[0];

  $('builderSelect')
    .appendChild(option);

});


/* =====================================================
   MATERIAL
===================================================== */

function material(){

  return new THREE.MeshStandardMaterial({
    color:0xd8d8de,
    metalness:.7,
    roughness:.25
  });

}


/* =====================================================
   ADD MESH
===================================================== */

function addMesh(
  group,
  geometry,
  x=0,
  y=0,
  z=0,
  sx=1,
  sy=1,
  sz=1
){

  const m =
    new THREE.Mesh(
      geometry,
      material()
    );

  m.position.set(x,y,z);

  m.scale.set(
    sx,
    sy,
    sz
  );

  group.add(m);

  return m;
}


/* =====================================================
   OBJECT FACTORY
===================================================== */

function makeObject(type){

  const g =
    new THREE.Group();


  if(type==='cube'){

    addMesh(
      g,
      new THREE.BoxGeometry(3,3,3)
    );

  }


  else if(type==='smallCube'){

    addMesh(
      g,
      new THREE.BoxGeometry(2,2,2)
    );

  }


  else if(type==='rectangle'){

    addMesh(
      g,
      new THREE.BoxGeometry(5,2.5,3)
    );

  }


  else if(type==='platform'){

    addMesh(
      g,
      new THREE.BoxGeometry(7,1,4)
    );

  }


  else if(type==='sphere'){

    addMesh(
      g,
      new THREE.SphereGeometry(
        2.5,
        20,
        14
      )
    );

  }


  else if(type==='ico'){

    addMesh(
      g,
      new THREE.IcosahedronGeometry(
        2.7,
        2
      )
    );

  }


  else if(type==='cylinder'){

    addMesh(
      g,
      new THREE.CylinderGeometry(
        2.2,
        2.2,
        4,
        24
      )
    );

  }


  else if(type==='tallCylinder'){

    addMesh(
      g,
      new THREE.CylinderGeometry(
        1.5,
        1.5,
        7,
        20
      )
    );

  }


  else if(type==='cone'){

    addMesh(
      g,
      new THREE.ConeGeometry(
        2.8,
        5,
        24
      )
    );

  }


  else if(type==='pyramid'){

    addMesh(
      g,
      new THREE.ConeGeometry(
        3,
        5,
        4
      )
    );

  }


  else if(type==='torus'){

    addMesh(
      g,
      new THREE.TorusGeometry(
        2.5,
        .65,
        12,
        32
      )
    );

  }


  else if(type==='ring'){

    addMesh(
      g,
      new THREE.TorusGeometry(
        3.5,
        .3,
        10,
        40
      )
    );

  }


  else if(type==='diamond'){

    addMesh(
      g,
      new THREE.OctahedronGeometry(3)
    );

  }


  else if(type==='crystal'){

    addMesh(
      g,
      new THREE.CylinderGeometry(
        2,
        1,
        6,
        6
      )
    );

  }


  else if(type==='arch'){

    addMesh(
      g,
      new THREE.BoxGeometry(6,1,2),
      0,
      2.5,
      0
    );

    addMesh(
      g,
      new THREE.BoxGeometry(1,5,2),
      -2.5,
      0,
      0
    );

    addMesh(
      g,
      new THREE.BoxGeometry(1,5,2),
      2.5,
      0,
      0
    );

  }


  else if(type==='cross'){

    addMesh(
      g,
      new THREE.BoxGeometry(
        5,1.5,1.5
      )
    );

    addMesh(
      g,
      new THREE.BoxGeometry(
        1.5,5,1.5
      )
    );

  }


  else if(type==='star'){

    const shape =
      new THREE.Shape();

    for(let i=0;i<10;i++){

      const a =
        -Math.PI/2 +
        i*Math.PI/5;

      const r =
        i%2===0 ? 3 : 1.4;

      const x =
        Math.cos(a)*r;

      const y =
        Math.sin(a)*r;

      if(i===0)
        shape.moveTo(x,y);
      else
        shape.lineTo(x,y);

    }

    shape.closePath();

    const geo =
      new THREE.ExtrudeGeometry(
        shape,
        {
          depth:1,
          bevelEnabled:true,
          bevelSize:.12,
          bevelThickness:.12
        }
      );

    addMesh(g,geo);

  }


  else if(type==='gear'){

    addMesh(
      g,
      new THREE.TorusGeometry(
        2.5,
        .55,
        10,
        24
      )
    );

    for(let i=0;i<8;i++){

      const a =
        i*Math.PI/4;

      addMesh(
        g,
        new THREE.BoxGeometry(
          1,
          .65,
          .8
        ),
        Math.cos(a)*3,
        Math.sin(a)*3,
        0
      );

   BUILDER OBJECTS
===================================================== */

const objects=[];


function createSelectedObject(){

  const item =
    BUILDER_FORMS[
      Number($('builderSelect').value)
    ];

  const object =
    makeObject(item[1]);


  object.position.set(
    (Math.random()-.5)*8,
    5+Math.random()*3,
    (Math.random()-.5)*5
  );


  object.rotation.y =
    Math.random()*Math.PI*2;


  object.userData.vy=0;

  object.userData.grabbed=false;

  object.userData.size =
    new THREE.Vector3();


  const box =
    new THREE.Box3()
      .setFromObject(object);

  box.getSize(
    object.userData.size
  );


  world.add(object);

  objects.push(object);

  $('objectCount').textContent=
    objects.length;

  toast(
    item[0]+' CREATED'
  );

}


function clearWorld(){

  objects.forEach(o=>{
    world.remove(o);
  });

  objects.length=0;

  $('objectCount').textContent='0';

}


/* =====================================================
   BUILDER PHYSICS
===================================================== */

function updatePhysics(){

  for(let i=0;i<objects.length;i++){

    const a=objects[i];

    if(a.userData.grabbed)
      continue;


    a.userData.vy -= .012;

    a.position.y +=
      a.userData.vy;


    const sa=
      a.userData.size;


    const bottom=
      a.position.y-sa.y/2;


    if(bottom < -3.98){

      a.position.y=
        -3.98+sa.y/2;

      a.userData.vy=0;

    }


    for(let j=0;j<objects.length;j++){

      if(i===j)
        continue;

      const b=objects[j];

      if(b.userData.grabbed)
        continue;


      const sb=
        b.userData.size;


      const overlapX =
        a.position.x-sa.x/2 <
        b.position.x+sb.x/2 &&
        a.position.x+sa.x/2 >
        b.position.x-sb.x/2;


      const overlapZ =
        a.position.z-sa.z/2 <
        b.position.z+sb.z/2 &&
        a.position.z+sa.z/2 >
        b.position.z-sb.z/2;


      if(!overlapX || !overlapZ)
        continue;


      const top =
        b.position.y+sb.y/2;


      const bottomA =
        a.position.y-sa.y/2;


      if(
        bottomA < top &&
        bottomA > top-1.5
      ){

        a.position.y=
          top+sa.y/2;

        a.userData.vy=0;

      }

    }

  }

}

/* =====================================================
   PARTICLE ENGINE
===================================================== */

const MAX_PARTICLES=7500;

const positions=
  new Float32Array(
    MAX_PARTICLES*3
  );

const targets=
  new Float32Array(
    MAX_PARTICLES*3
  );

const particleColors=
  new Float32Array(
    MAX_PARTICLES*3
  );


const particleGeometry=
  new THREE.BufferGeometry();


particleGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(
    positions,
    3
  )
);


particleGeometry.setAttribute(
  'color',
  new THREE.BufferAttribute(
    particleColors,
    3
  )
);


const particleMaterial=
  new THREE.PointsMaterial({

    size:.075,

    vertexColors:true,

    transparent:true,

    opacity:.9,

    depthWrite:false,

    blending:
      THREE.AdditiveBlending

  });


const particleSystem=
  new THREE.Points(
    particleGeometry,
    particleMaterial
  );


particleSystem.visible=false;

scene.add(
  particleSystem
);


/* =====================================================
   PARTICLE HELPERS
===================================================== */

function setTarget(
  i,
  x,
  y,
  z
){

  const k=i*3;

  targets[k]=x;
  targets[k+1]=y;
  targets[k+2]=z;

}


function particleSphere(i,r){

  const u=
    Math.random()*2-1;

  const a=
    Math.random()*Math.PI*2;

  const q=
    Math.sqrt(1-u*u);

  setTarget(
    i,
    q*Math.cos(a)*r,
    q*Math.sin(a)*r,
    u*r
  );

}


function particleRing(
  i,
  radius,
  width=.2
){

  const a=
    Math.random()*Math.PI*2;

  const r=
    radius+
    (Math.random()-.5)*width;

  setTarget(
    i,
    Math.cos(a)*r,
    (Math.random()-.5)*width,
    Math.sin(a)*r
  );

}


/* =====================================================
   HOLOGRAM GENERATOR
===================================================== */

function generateHologram(type){

  for(let i=0;i<activeParticles;i++){

    let x=0;
    let y=0;
    let z=0;


    /* SPHERES */

    if(
      type==='planet' ||
      type==='earth' ||
      type==='mars' ||
      type==='moon'
    ){

      particleSphere(i,5.4);

    }


    /* SATURN */

    else if(type==='saturn'){

      if(i<activeParticles*.62)
        particleSphere(i,4.2);
      else
        particleRing(i,7,.8);

    }


    /* SUN / STAR */

    else if(
      type==='sun' ||
      type==='star'
    ){

      const a=
        Math.random()*Math.PI*2;

      const r=
        Math.random()<.4
        ? Math.random()*2
        : 3+Math.random()*3;

      setTarget(
        i,
        Math.cos(a)*r,
        Math.sin(a)*r,
        (Math.random()-.5)*1.2
      );

    }


    /* BLACK HOLE */

    else if(type==='blackhole'){

      if(i<activeParticles*.15)
        particleSphere(i,1.1);
      else
        particleRing(
          i,
          3+Math.random()*4,
          .6
        );

    }


    /* GALAXY */

    else if(type==='galaxy'){

      const arms=5;

      const arm=
        i%arms;

      const r=
        Math.pow(Math.random(),.55)*8;

      const a=
        r*1.25+
        arm*Math.PI*2/arms+
        (Math.random()-.5)*.45;

      setTarget(
        i,
        Math.cos(a)*r,
        (Math.random()-.5)*
        (1-r/10)*2,
        Math.sin(a)*r
      );

    }


    /* NEBULA */

    else if(type==='nebula'){

      const a=
        Math.random()*Math.PI*2;

      const r=
        Math.sqrt(Math.random())*8;

      setTarget(
        i,
        Math.cos(a)*r,
        (Math.random()-.5)*4,
        Math.sin(a)*r
      );

    }


    /* DNA */

    else if(type==='dna'){

      const t=
        Math.random()*
        Math.PI*16;

      const yy=
        t/2.1-7;

      const rr=3;

      if(Math.random()<.5){

        setTarget(
          i,
          Math.cos(t)*rr,
          yy,
          Math.sin(t)*rr
        );

      }else{

        setTarget(
          i,
          -Math.cos(t)*rr,
          yy,
          -Math.sin(t)*rr
        );

      }

    }


    /* ATOM */

    else if(type==='atom'){

      if(i<activeParticles*.15){

        particleSphere(i,1.2);

      }else{

        const a=
          Math.random()*Math.PI*2;

        const r=6;

        const plane=
          Math.floor(Math.random()*3);

        if(plane===0){

          setTarget(
            i,
            Math.cos(a)*r,
            Math.sin(a)*r,
            0
          );

        }

        if(plane===1){

          setTarget(
            i,
            Math.cos(a)*r,
            0,
            Math.sin(a)*r
          );

        }

        if(plane===2){

          setTarget(
            i,
            0,
            Math.cos(a)*r,
            Math.sin(a)*r
          );

        }

      }

    }


    /* HEART */

    else if(type==='heart'){

      const t=
        Math.random()*Math.PI*2;

      const fill=
        Math.sqrt(Math.random());

      x=
        16*Math.pow(
          Math.sin(t),
          3
        );

      y=
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

      z=
        (Math.random()-.5)*3;

      setTarget(
        i,
        x*.34*fill,
        y*.34*fill,
        z
      );

    }


    /* BRAIN */

    else if(type==='brain'){

      const a=
        Math.random()*Math.PI*2;

      const r=
        Math.sqrt(Math.random())*5;

      setTarget(
        i,
        Math.cos(a)*r,
        (Math.random()-.5)*4+
        Math.sin(a*7)*.6,
        Math.sin(a)*r*.7
      );

    }


    /* EYE */

    else if(type==='eye'){

      const a=
        Math.random()*Math.PI*2;

      const r=
        Math.sqrt(Math.random())*6;

      x=Math.cos(a)*r;

      y=Math.sin(a)*r*.5;

      z=
        2+
        Math.sqrt(
          Math.max(
            0,
            36-x*x-y*y
          )
        )*.2;

      setTarget(
        i,x,y,z
      );

    }


    /* FLOWERS */

    else if(
      type==='flower' ||
      type==='flower5' ||
      type==='flower8'
    ){

      const petals=
        type==='flower5'
        ? 5
        : type==='flower8'
        ? 8
        : 7;

      const a=
        Math.random()*Math.PI*2;

      const r=
        Math.abs(
          Math.sin(
            a*petals/2
          )
        )*6;

      setTarget(
        i,
        Math.cos(a)*r,
        (Math.random()-.5)*1.2,
        Math.sin(a)*r
      );

    }


    /* BUTTERFLY */

    else if(type==='butterfly'){

      const side=
        Math.random()<.5
        ? -1
        : 1;

      const t=
        Math.random()*Math.PI*2;

      setTarget(
        i,
        side*Math.sin(t)*5,
        Math.cos(t)*3,
        (Math.random()-.5)*1.3
      );

    }


    /* ANIMAL */

    else if(
      type==='wolf' ||
      type==='eagle'
    ){

      if(i<activeParticles*.45){

        particleSphere(i,2.8);

        const k=i*3;

        targets[k]*=1.35;

        targets[k+1]*=.75;

      }else{

        setTarget(
          i,
          (Math.random()-.5)*9,
          (Math.random()-.5)*4,
          (Math.random()-.5)*2
        );

      }

    }


    /* WHALE */

    else if(type==='whale'){

      x=
        (Math.random()-.5)*12;

      const width=
        Math.sqrt(
          Math.max(
            0,
            1-x*x/36
          )
        );

      setTarget(
        i,
        x,
        (Math.random()-.5)*3*width,
        (Math.random()-.5)*2*width
      );

    }


    /* FISH */

    else if(type==='fish'){

      const a=
        Math.random()*Math.PI*2;

      const r=
        Math.random()*5;

      setTarget(
        i,
        Math.cos(a)*r,
        Math.sin(a)*2,
        (Math.random()-.5)*1.2
      );

    }


    /* ROBOT */

    else if(type==='robot'){

      if(i<activeParticles*.45){

        setTarget(
          i,
          (Math.random()-.5)*5,
          (Math.random()-.5)*3,
          (Math.random()-.5)*3
        );

      }else{

        setTarget(
          i,
          (Math.random()-.5)*4,
          2+Math.random()*3,
          (Math.random()-.5)*2
        );

      }

    }


    /* ROCKET */

    else if(type==='rocket'){

      y=
        Math.random()*8-4;

      const radius=
        y<2
        ? 2
        : Math.max(
            .2,
            2-(y-2)*.45
          );

      const a=
        Math.random()*Math.PI*2;

      setTarget(
        i,
        Math.cos(a)*radius,
        y,
        Math.sin(a)*radius
      );

    }


    /* STATION */

    else if(type==='station'){

      if(i<activeParticles*.55){

        particleRing(
          i,
          6,
          .5
        );

      }else{

        setTarget(
          i,
          (Math.random()-.5)*14,
          (Math.random()-.5),
          (Math.random()-.5)
        );

      }

    }


    /* CUBE */

    else if(
      type==='cube' ||
      type==='cube2'
    ){

      const edge=
        Math.floor(
          Math.random()*12
        );

      const a=
        (Math.random()-.5)*12;

      if(edge<4){

        setTarget(
          i,
          edge%2?6:-6,
          a,
          (Math.random()-.5)*12
        );

      }

      else if(edge<8){

        setTarget(
          i,
          (Math.random()-.5)*12,
          edge%2?6:-6,
          a
        );

      }

      else{

        setTarget(
          i,
          (Math.random()-.5)*12,
          a,
          edge%2?6:-6
        );

      }

    }


    /* CRYSTAL */

    else if(
      type==='crystal' ||
      type==='diamond'
    ){

      const a=
        Math.random()*Math.PI*2;

      const r=
        Math.random()*4;

      setTarget(
        i,
        Math.cos(a)*r,
        (Math.random()-.5)*10,
        Math.sin(a)*r
      );

    }


    /* PYRAMID */

    else if(type==='pyramid'){

      y=
        Math.random()*8-4;

      const r=
        Math.max(
          .2,
          4-y*.45
        );

      const a=
        Math.random()*Math.PI*2;

      setTarget(
        i,
        Math.cos(a)*r,
        y,
        Math.sin(a)*r
      );

    }


    /* TORUS */

    else if(
      type==='torus' ||
      type==='ring'
    ){

      const a=
        Math.random()*Math.PI*2;

      const b=
        Math.random()*Math.PI*2;

      const R=5;

      const r=1;

      setTarget(
        i,
        (R+r*Math.cos(b))*Math.cos(a),
        r*Math.sin(b),
        (R+r*Math.cos(b))*Math.sin(a)
      );

    }


    /* MOBIUS */

    else if(type==='mobius'){

      const a=
        Math.random()*Math.PI*2;

      const u=
        Math.random()*2-1;

      const r=
        5+u;

      setTarget(
        i,
        Math.cos(a)*r,
        u*2*Math.sin(a/2),
        Math.sin(a)*r
      );

    }


    /* WAVE */

    else if(type==='wave'){

      x=
        (Math.random()-.5)*16;

      z=
        (Math.random()-.5)*8;

      y=
        Math.sin(
          x*1.2+z
        )*2;

      setTarget(
        i,x,y,z
      );

    }


    /* LIGHTNING */

    else if(type==='lightning'){

      x=0;

      y=7;

      for(
        let j=0;
        j<7;
        j++
      ){

        x+=
          (Math.random()-.5)*3;

        y-=2;

      }

      setTarget(
        i,
        x+(Math.random()-.5)*.5,
        y+(Math.random()-.5)*.5,
        (Math.random()-.5)
      );

    }


    /* BURST */

    else if(
      type==='burst' ||
      type==='burst2'
    ){

      const a=
        Math.random()*Math.PI*2;

      const b=
        Math.acos(
          Math.random()*2-1
        );

      const r=
        Math.pow(
          Math.random(),
          .4
        )*8;

      setTarget(
        i,
        Math.sin(b)*Math.cos(a)*r,
        Math.cos(b)*r,
        Math.sin(b)*Math.sin(a)*r
      );

    }


    /* NEURONS */

    else if(type==='neurons'){

      if(i<activeParticles*.18){

        particleSphere(
          i,
          1.2+Math.random()
        );

      }else{

        const a=
          Math.random()*Math.PI*2;

        const r=
          2+Math.random()*7;

        setTarget(
          i,
          Math.cos(a)*r,
          (Math.random()-.5)*7,
          Math.sin(a)*r
        );

      }

    }


    /* VORTEX */

    else if(
      type==='vortex' ||
      type==='tornado'
    ){

      y=
        Math.random()*14-7;

      const r=
        type==='tornado'
        ? .5+Math.abs(y)*.45
        : 7-Math.abs(y)*.5;

      const a=
        y*2.5+
        Math.random()*.4;

      setTarget(
        i,
        Math.cos(a)*r,
        y,
        Math.sin(a)*r
      );

    }


    /* SHELL */

    else if(
      type==='shell' ||
      type==='shell2'
    ){

      const t=
        Math.random()*
        Math.PI*8;

      const r=
        .25+t*.12;

      setTarget(
        i,
        Math.cos(t)*r,
        Math.sin(t)*r,
        t*.18-7
      );

    }


    /* SPHERE GRID */

    else if(type==='spheregrid'){

      const lat=
        Math.floor(
          Math.random()*20
        );

      const lon=
        Math.floor(
          Math.random()*30
        );

      const a=
        lon/30*Math.PI*2;

      const b=
        lat/19*Math.PI-
        Math.PI/2;

      setTarget(
        i,
        Math.cos(b)*Math.cos(a)*6,
        Math.sin(b)*6,
        Math.cos(b)*Math.sin(a)*6
      );

    }


    /* CLOCK */

    else if(type==='clockshape'){

      const a=
        Math.random()*Math.PI*2;

      const r=
        Math.random()<.75
        ? 6
        : 3;

      setTarget(
        i,
        Math.cos(a)*r,
        Math.sin(a)*r,
        0
      );

    }


    /* QUASAR */

    else if(type==='quasar'){

      if(i<activeParticles*.15){

        particleSphere(i,1);

      }else{

        particleRing(
          i,
          2+Math.random()*6,
          .4
        );

      }

    }


    /* ORBIT */

    else if(type==='orbit'){

      const a=
        Math.random()*Math.PI*2;

      const r=7;

      setTarget(
        i,
        Math.cos(a)*r,
        (Math.random()-.5)*2,
        Math.sin(a)*r
      );

    }


    /* DIMENSION */

    else if(type==='dimension'){

      const t=
        Math.random()*Math.PI*2;

      const r=
        3+
        Math.sin(t*4)*2;

      setTarget(
        i,
        Math.cos(t)*r,
        Math.sin(t*2)*3,
        Math.sin(t)*r
      );

    }


    /* QUANTUM */

    else if(type==='quantum'){

      const a=
        Math.random()*Math.PI*2;

      const r=
        2+
        Math.sin(a*7)*3;

      setTarget(
        i,
        Math.cos(a)*r,
        Math.sin(a*5)*3,
        Math.sin(a)*r
      );

    }


    /* SINGULARITY */

    else if(type==='singularity'){

      const r=
        Math.pow(
          Math.random(),
          2
        )*8;

      const a=
        Math.random()*Math.PI*2;

      setTarget(
        i,
        Math.cos(a)*r,
        (Math.random()-.5)*r,
        Math.sin(a)*r
      );

    }


    else{

      particleSphere(i,5);

    }

  }


  for(let i=0;i<MAX_PARTICLES;i++){

    const k=i*3;

    if(i>=activeParticles){

      positions[k]=9999;
      positions[k+1]=9999;
      positions[k+2]=9999;

    }

    const brightness=
      .55+
      Math.random()*.45;

    particleColors[k]=brightness;
    particleColors[k+1]=brightness;
    particleColors[k+2]=brightness;

  }


  particleGeometry
    .attributes
    .position
    .needsUpdate=true;

  particleGeometry
    .attributes
    .color
    .needsUpdate=true;

}


/* =====================================================
   PARTICLE ANIMATION
===================================================== */

function updateParticles(){

  if(!particleSystem.visible)
    return;


  const p=
    particleGeometry
      .attributes
      .position
      .array;


  for(let i=0;i<activeParticles;i++){

    const k=i*3;

    p[k]+=
      (targets[k]-p[k])*.09;

    p[k+1]+=
      (targets[k+1]-p[k+1])*.09;

    p[k+2]+=
      (targets[k+2]-p[k+2])*.09;

  }


  particleGeometry
    .attributes
    .position
    .needsUpdate=true;


  particleSystem.rotation.y+=.0018;

  particleSystem.rotation.x=
    Math.sin(
      performance.now()*.00025
    )*.04;

}

/* =====================================================
   HAND TRACKING
===================================================== */

const video=
  $('video');

const cameraCanvas=
  $('cameraCanvas');

const cameraContext=
  cameraCanvas.getContext(
    '2d',
    {alpha:false}
  );


function distance2D(a,b){

  return Math.sqrt(
    Math.pow(a.x-b.x,2)+
    Math.pow(a.y-b.y,2)
  );

}


/* =====================================================
   MEDIAPIPE RESULT
===================================================== */

function onHands(results){

  const list=
    results.multiHandLandmarks || [];


  handVisible=
    list.length>0;


  $('hands')
    .textContent=
    list.length;


  if(!handVisible){

    $('handCursor')
      .style.display='none';

    $('pinch')
      .textContent='NO';

    isPinching=false;

    if(grabbedObject){

      grabbedObject
        .userData
        .grabbed=false;

      grabbedObject=null;

    }

    return;

  }


  const hand=
    list[0];


  const index=
    hand[8];

  const thumb=
    hand[4];


  /*
    MediaPipe:
    x = 0 left
    x = 1 right

    We mirror it because
    the camera preview is mirrored.
  */

  const rawX=
    1-index.x;

  const rawY=
    index.y;


  /*
    More responsive smoothing.
  */

  smoothX +=
    (rawX-smoothX)*
    Math.min(
      1,
      .28*sensitivity
    );

  smoothY +=
    (rawY-smoothY)*
    Math.min(
      1,
      .28*sensitivity
    );


  handX=
    smoothX;

  handY=
    smoothY;


  /* SCREEN CURSOR */

  const cursor=
    $('handCursor');


  cursor.style.display=
    'block';


  cursor.style.left=
    (handX*100)+'%';


  cursor.style.top=
    (handY*100)+'%';


  /* PINCH */

  const pinchDistance=
    distance2D(
      thumb,
      index
    );


  /*
    Hysteresis:
    easier to activate,
    harder to accidentally release.
  */

  if(!isPinching){

    isPinching=
      pinchDistance<
      .075;

  }else{

    isPinching=
      pinchDistance<
      .095;

  }


  $('pinch')
    .textContent=
    isPinching
    ? 'YES'
    : 'NO';


  cursor.classList.toggle(
    'pinch',
    isPinching
  );


  /* BUILDER HAND */

  if(mode==='builder'){

    if(
      isPinching &&
      !lastPinch
    ){

      grabbedObject=
        findHandObject();

      if(grabbedObject){

        grabbedObject
          .userData
          .grabbed=true;

        grabbedObject
          .userData
          .vy=0;

        toast(
          'OBJECT GRABBED'
        );

      }

    }


    if(
      !isPinching &&
      lastPinch
    ){

      if(grabbedObject){

        grabbedObject
          .userData
          .grabbed=false;

        grabbedObject
          .userData
          .vy=.03;

        grabbedObject=null;

        toast(
          'OBJECT RELEASED'
        );

      }

    }


    if(grabbedObject){

      /*
        Direct hand-to-world mapping.
        Much easier to control.
      */

      const targetX=
        (handX-.5)*16;

      const targetY=
        (1-handY)*10-4;


      grabbedObject.position.x +=
        (targetX-
         grabbedObject.position.x)*.32;


      grabbedObject.position.y +=
        (targetY-
         grabbedObject.position.y)*.32;


      grabbedObject.position.z +=
        (0-
         grabbedObject.position.z)*.18;

    }

  }


  lastPinch=
    isPinching;

}


/* =====================================================
   FIND OBJECT
===================================================== */

function findHandObject(){

  if(!objects.length)
    return null;


  const x=
    (handX-.5)*16;

  const y=
    (1-handY)*10-4;


  let nearest=null;

  let best=Infinity;


  for(const object of objects){

    const d=
      Math.sqrt(
        Math.pow(
          object.position.x-x,
          2
        )+
        Math.pow(
          object.position.y-y,
          2
        )
      );


    if(d<best){

      best=d;

      nearest=object;

    }

  }


  /*
    Large pickup radius so
    the interaction actually
    works instead of requiring
    pixel-perfect positioning.
  */

  return best<7
    ? nearest
    : null;

}


/* =====================================================
   CAMERA DRAW
===================================================== */

function drawCamera(results){

  if(!video.videoWidth)
    return;


  if(
    cameraCanvas.width !==
    video.videoWidth
  ){

    cameraCanvas.width=
      video.videoWidth;

    cameraCanvas.height=
      video.videoHeight;

  }


  cameraContext.drawImage(
    video,
    0,
    0,
    cameraCanvas.width,
    cameraCanvas.height
  );


  const hands=
    results.multiHandLandmarks || [];


  cameraContext.fillStyle=
    '#fff';


  hands.forEach(hand=>{

    hand.forEach(point=>{

      cameraContext.beginPath();

      cameraContext.arc(
        point.x*
          cameraCanvas.width,
        point.y*
          cameraCanvas.height,
        2.5,
        0,
        Math.PI*2
      );

      cameraContext.fill();

    });

  });

}

   MEDIAPIPE INITIALIZATION
===================================================== */

async function startHandTracking(){

  if(cameraStarted)
    return;


  $('cameraStatus')
    .textContent='LOADING';


  $('systemText')
    .textContent=
    'LOADING HAND SENSOR';


  try{

    if(
      typeof Hands==='undefined' ||
      typeof Camera==='undefined'
    ){

      throw new Error(
        'MediaPipe non caricato'
      );

    }


    handsInstance=
      new Hands({

        locateFile:file=>
          'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+file

      });


    handsInstance.setOptions({

      maxNumHands:2,

      modelComplexity:0,

      minDetectionConfidence:.42,

      minTrackingConfidence:.42

    });


    handsInstance.onResults(
      results=>{

        drawCamera(results);

        onHands(results);

      }
    );


    mpCamera=
      new Camera(
        video,
        {

          onFrame:
            async()=>{

              if(
                video.readyState>=2
              ){

                await handsInstance
                  .send({
                    image:video
                  });

              }

            },

          width:640,

          height:480

        }
      );


    await navigator.mediaDevices
      .getUserMedia({

        video:{
          width:{
            ideal:640
          },
          height:{
            ideal:480
          },
          facingMode:'user'
        },

        audio:false

      })
      .then(stream=>{

        video.srcObject=
          stream;

        return video.play();

      });


    mpCamera.start();


    cameraStarted=true;


    $('cameraStatus')
      .textContent='ONLINE';


    $('systemText')
      .textContent=
      'HAND SENSOR ONLINE';


    toast(
      'HAND TRACKING ONLINE'
    );

  }
  catch(error){

    console.error(
      'HAND SENSOR ERROR:',
      error
    );


    $('cameraStatus')
      .textContent='ERROR';


    $('systemText')
      .textContent=
      'CAMERA ERROR';


    toast(
      'PERMESSO CAMERA NECESSARIO'
    );

  }

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

  const d=
    new Date();


  const hh=
    String(
      d.getHours()
    ).padStart(2,'0');


  const mm=
    String(
      d.getMinutes()
    ).padStart(2,'0');


  const ss=
    String(
      d.getSeconds()
    ).padStart(2,'0');


  $('clock')
    .textContent=
    hh+':'+mm+':'+ss;


  $('date')
    .textContent=
    d.toLocaleDateString(
      'it-IT',
      {
        weekday:'short',
        day:'2-digit',
        month:'short',
        year:'numeric'
      }
    ).toUpperCase();

}


setInterval(
  updateClock,
  250
);

updateClock();


/* =====================================================
   COMMAND
===================================================== */

function toggleCommand(){

  const box=
    $('command');


  if(
    box.style.display===
    'block'
  ){

    box.style.display=
      'none';

  }else{

    box.style.display=
      'block';

    setTimeout(
      ()=>$('commandInput').focus(),
      50
    );

  }

}


$('commandForm')
.addEventListener(
  'submit',
  e=>{

    e.preventDefault();


    const input=
      $('commandInput');


    const cmd=
      input.value
        .trim()
        .toLowerCase();


    if(!cmd)
      return;


    if(
      cmd==='builder'
    ){

      setMode('builder');

    }

    else if(
      cmd==='hologram' ||
      cmd==='particles'
    ){

      setMode('hologram');

    }

    else if(
      cmd==='clear'
    ){

      clearWorld();

      toast(
        'WORLD CLEARED'
      );

    }

    else if(
      cmd==='neuroni' ||
      cmd==='neurons' ||
      cmd==='neural'
    ){

      setMode('hologram');

      const index=
        HOLOGRAMS.findIndex(
          x=>x[1]==='neurons'
        );

      if(index>=0){

        $('hologramSelect')
          .value=index;

        loadSelectedHologram();

      }

    }

    else if(
      cmd==='clock' ||
      cmd==='orologio'
    ){

      toast(
        $('clock').textContent
      );

    }

    else if(
      cmd==='spawn'
    ){

      createSelectedObject();

    }

    else{

      toast(
        'COMMAND RECEIVED'
      );

    }


    input.value='';

  }
);


/* =====================================================
   TOAST
===================================================== */

let toastTimeout=0;


function toast(text){

  const t=
    $('toast');


  t.textContent=
    text;


  t.classList.add(
    'show'
  );


  clearTimeout(
    toastTimeout
  );


  toastTimeout=
    setTimeout(
      ()=>{
        t.classList.remove(
          'show'
        );
      },
      1400
    );

}


/* =====================================================
   START
===================================================== */

$('startButton')
.addEventListener(
  'click',
  async()=>{

    $('start')
      .style.display='none';


    /*
      Start camera ONLY after
      user interaction.
      This avoids browser
      permission/autoplay problems.
    */

    await startHandTracking();


    /*
      Put something immediately
      in the Builder so the world
      is never empty.
    */

    $('builderSelect')
      .value=0;


    createSelectedObject();


    $('builderSelect')
      .value=4;


    createSelectedObject();


    $('builderSelect')
      .value=11;


    createSelectedObject();


    generateHologram(
      'neurons'
    );

  }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  'resize',
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =====================================================
   RENDER LOOP
===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );


  const now=
    performance.now();


  frameCounter++;


  if(
    now-startTime>1000
  ){

    fps=
      frameCounter;

    frameCounter=0;

    startTime=now;


    $('fps')
      .textContent=
      fps;

  }


  updatePhysics();

  updateParticles();


  /*
    Small world movement follows
    the hand even when no object
    is grabbed.
  */

  if(
    mode==='builder' &&
    handVisible &&
    !grabbedObject
  ){

    world.rotation.y +=
      (
        (handX-.5)*.12-
        world.rotation.y
      )*.02;

  }


  renderer.render(
    scene,
    camera
  );

}


/* =====================================================
   INITIAL STATE
===================================================== */

generateHologram(
  'neurons'
);

$('particleCount')
  .textContent=
  activeParticles;


animate();

</script>
