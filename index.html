<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARK KINETIC LAB // ULTRA ZERO-LAG CORE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background-color: #000000; font-family: 'Share Tech Mono', monospace; color: #ffffff; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    #video-input { display: none; }

    .stark-header {
      position: absolute; top: 0; left: 0; width: 100%; height: 60px;
      background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(0, 255, 255, 0.2); z-index: 10;
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
      pointer-events: none;
    }
    .stark-title {
      font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px;
      letter-spacing: 2px; color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
      display: flex; align-items: center; gap: 12px;
    }
    .security-badge {
      font-size: 9px; background: rgba(0, 255, 204, 0.1); border: 1px solid rgba(0, 255, 204, 0.4);
      color: #00ffcc; padding: 3px 8px; border-radius: 20px; letter-spacing: 1px;
    }

    .mode-dock {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 20; background: rgba(15, 15, 15, 0.7);
      padding: 10px 18px; border-radius: 35px; backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 255, 204, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 10px rgba(0,255,204,0.1);
      pointer-events: auto;
    }
    .tab-btn {
      background: rgba(0, 255, 204, 0.05); border: 1px solid rgba(0, 255, 204, 0.2);
      color: rgba(255, 255, 255, 0.7); font-family: 'Orbitron', sans-serif; font-size: 10px;
      padding: 10px 22px; cursor: pointer; transition: all 0.2s ease;
      border-radius: 25px;
    }
    .tab-btn:hover, .tab-btn.active {
      background: rgba(0, 255, 204, 0.25); border-color: #00ffcc; color: #ffffff;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.5); transform: translateY(-1px);
    }

    .ui-overlay {
      position: absolute; top: 75px; left: 20px; z-index: 10; width: 290px; padding: 18px;
      background: rgba(12, 12, 12, 0.75); backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 255, 204, 0.25); border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8);
      display: flex; flex-direction: column; gap: 14px;
      pointer-events: auto;
    }
    .panel-header {
      font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 1px;
      color: #00ffcc; border-bottom: 1px solid rgba(0, 255, 204, 0.2);
      padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 9px; color: rgba(0, 255, 204, 0.7); letter-spacing: 1px; }

    select, input[type="color"], .stark-btn {
      width: 100%; height: 38px; background: rgba(0, 255, 204, 0.05);
      border: 1px solid rgba(0, 255, 204, 0.3); color: #ffffff; padding: 0 12px;
      font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 10px;
      letter-spacing: 1px; outline: none; cursor: pointer; transition: all 0.15s ease;
      border-radius: 12px;
    }
    select:hover, .stark-btn:hover, .stark-btn.virtual-hover {
      background: rgba(0, 255, 204, 0.3) !important; border-color: #00ffcc !important;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.6); transform: scale(1.02);
    }
    select option { background: #111; color: #fff; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .telemetry-box {
      font-size: 10px; background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 255, 204, 0.2); padding: 10px; border-radius: 12px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .hand-card { border-left: 2px solid #00ffcc; padding-left: 8px; display: flex; flex-direction: column; gap: 2px; }
    .telemetry-row { display: flex; justify-content: space-between; color: rgba(255, 255, 255, 0.6); }
    .telemetry-val { color: #00ffcc; font-weight: bold; }

    .camera-preview-container {
      position: absolute; bottom: 25px; right: 20px; z-index: 10;
      width: 160px; height: 120px; background: rgba(12, 12, 12, 0.8);
      backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden;
      pointer-events: none;
    }
    #hand-preview-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.85; }
    .preview-hud-tag {
      position: absolute; top: 6px; left: 8px; font-size: 8px; font-weight: bold;
      letter-spacing: 1px; color: #00ffcc; background: rgba(0, 0, 0, 0.8);
      padding: 2px 6px; border: 1px solid rgba(0, 255, 204, 0.4); border-radius: 6px;
    }

    #virtual-cursor {
      position: absolute; width: 16px; height: 16px; border: 2px solid #00ffcc;
      border-radius: 50%; transform: translate(-50%, -50%); z-index: 9999;
      pointer-events: none; display: none; box-shadow: 0 0 12px #00ffcc;
      background: rgba(0, 255, 204, 0.3);
      transition: transform 0.05s linear;
    }
    #virtual-cursor.pinching {
      background: #00ffcc; transform: translate(-50%, -50%) scale(0.6);
      box-shadow: 0 0 20px #00ffcc;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <video id="video-input"></video>
  <div id="canvas-container"></div>
  <div id="virtual-cursor"></div>

  <div class="stark-header">
    <div class="stark-title">

  <div class="mode-dock">

  <div class="ui-overlay">
    <div class="panel-header">

      <span style="color: #00ffcc; font-weight: bold; font-size: 9px;">[SPEED: MAX]</span>
    </div>
    
    <div id="controls-builder" style="display: none;">
      <div class="control-group">
        <label>SPAWN OGGETTI 3D</label>
        <div class="btn-grid">
          <button class="stark-btn" onclick="spawnShape('cube')">+ CUBO</button>
          <button class="stark-btn" onclick="spawnShape('sphere')">+ SFERA</button>
          <button class="stark-btn" onclick="spawnShape('pyramid')">+ PIRAMIDE</button>
          <button class="stark-btn" onclick="spawnShape('torus')">+ TORUS</button>
          <button class="stark-btn" onclick="spawnShape('cylinder')">+ CILINDRO</button>
          <button class="stark-btn" onclick="spawnShape('icosahedron')">+ ICOSAEDRO</button>
        </div>
        <button class="stark-btn" style="margin-top: 8px; border-color: rgba(0,255,204,0.5);" onclick="clearBlocks()">RESET SCENA</button>
      </div>
    </div>

    <div id="controls-particles" style="display: block;">
      <div class="control-group">
        <label>HOLOGRAM TEMPLATE</label>
        <select id="shape-select">
          <option value="jupiter">JUPITER & RINGS</option>
          <option value="galaxy">GALAXY SPIRAL</option>
          <option value="hypercube">HYPERCUBE MATRIX</option>
          <option value="heart">HEART MATRIX</option>
          <option value="flower">NEURAL FLOWER</option>
          <option value="buddha">BUDDHA HOLOGRAM</option>

          <option value="DNA">DNA DOUBLE HELIX</option>
        </select>
      </div>
      <div class="control-group" style="margin-top: 8px;">
        <label>PLASMA COLOR</label>
        <input type="color" id="color-picker" value="#00ffcc">

    <button id="audio-toggle-btn" class="stark-btn" onclick="toggleAudio()">🔊 AUDIO: ATTIVO</button>

    <div class="telemetry-box">
      <div class="hand-card">
        <div class="telemetry-row">
          <span>MANO 1:</span>

        </div>
        <div class="telemetry-row">
          <span>STATO 1:</span>
          <span id="h1-grab" class="telemetry-val">LIBERA</span>
        </div>
      </div>
      <div class="hand-card" style="margin-top: 6px;">
        <div class="telemetry-row">
          <span>MANO 2:</span>
          <span id="h2-status" class="telemetry-val">CERCA...</span>
        </div>
        <div class="telemetry-row">
          <span>STATO 2:</span>
          <span id="h2-grab" class="telemetry-val">LIBERA</span>
        </div>
      </div>
    </div>
  </div>

  <div class="camera-preview-container">
    <span class="preview-hud-tag">OPTICAL FEED</span>
    <canvas id="hand-preview-canvas" width="160" height="120"></canvas>
  </div>

  <script>
    class SciFiSoundSystem {
      constructor() {
        this.ctx = null; this.humOsc = null; this.humGain = null;
        this.enabled = true; this.initialized = false;
      }
      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.humOsc = this.ctx.createOscillator();
        this.humGain = this.ctx.createGain();
        this.humOsc.type = 'sine';
        this.humOsc.frequency.setValueAtTime(45, this.ctx.currentTime);
        this.humGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
        this.humOsc.connect(this.humGain);
        this.humGain.connect(this.ctx.destination);
        this.humOsc.start();
        this.initialized = true;
      }
      playPinch() {
        if (!this.enabled || !this.initialized) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        const now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(1000, now + 0.05);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.05);
      }
    }

    const sounds = new SciFiSoundSystem();

    function toggleAudio() {
      sounds.enabled = !sounds.enabled;
      document.getElementById('audio-toggle-btn').innerText = sounds.enabled ? "🔊 AUDIO: ATTIVO" : "🔇 AUDIO: DISATTIVATO";
    }

    let currentMode = 'PARTICLES';
    const PARTICLE_COUNT = 5000; // Ridotto leggermente per performance di calcolo a 60fps solidi
    let scene, camera, renderer;
    let builderGroup;
    let blocks = [];

    const controllers = [
      {
        mesh: null, pointLight: null, rayLine: null,
        grabbedBlock: null, grabOffset: new THREE.Vector3(), pos: new THREE.Vector3(), lastPos: new THREE.Vector3(),
        velocity: new THREE.Vector3(), isPinching: false, statusEl: null, grabEl: null, active: false
      },
      {
        mesh: null, pointLight: null, rayLine: null,
        grabbedBlock: null, grabOffset: new THREE.Vector3(), pos: new THREE.Vector3(), lastPos: new THREE.Vector3(),
        velocity: new THREE.Vector3(), isPinching: false, statusEl: null, grabEl: null, active: false
      }
    ];

    let particleGroup, particleGeometry, particleMaterial;
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let handExpansionScale = 1.0, targetScale = 1.0;
    let targetCamZ = 32, targetRotX = 0, targetRotY = 0, targetRotZ = 0;
    let previewCanvas, previewCtx;
    let lastWasPinchingUI = false;

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 28);
      camera.lookAt(0, 0, 0);

      // WebGL Renderer ottimizzato per zero-lag (disattivato antialiasing pesante per boost hardware)
      renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.2));
      container.appendChild(renderer.domElement);

      builderGroup = new THREE.Group();
      builderGroup.visible = false;
      scene.add(builderGroup);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.6);
      dirLight.position.set(10, 25, 15);
      scene.add(dirLight);

      const planeGeo = new THREE.PlaneGeometry(60, 60);
      const planeMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9, metalness: 0.1 });
      const floor = new THREE.Mesh(planeGeo, planeMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -6;
      builderGroup.add(floor);

      const gridHelper = new THREE.GridHelper(60, 30, 0x00ffcc, 0x112222);
      gridHelper.position.y = -5.98;
      builderGroup.add(gridHelper);

      controllers.forEach((ctrl, idx) => {
        const dotGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const dotMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
        ctrl.mesh = new THREE.Mesh(dotGeo, dotMat);
        ctrl.mesh.visible = false;
        builderGroup.add(ctrl.mesh);

        ctrl.pointLight = new THREE.PointLight(0x00ffcc, 0.5, 8);
        builderGroup.add(ctrl.pointLight);

        const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.3 });
        ctrl.rayLine = new THREE.Line(lineGeo, lineMat);
        ctrl.rayLine.visible = false;
        builderGroup.add(ctrl.rayLine);

        ctrl.statusEl = document.getElementById(`h${idx + 1}-status`);
        ctrl.grabEl = document.getElementById(`h${idx + 1}-grab`);
      });

      spawnShape('cube', 0, 2, 0);

      particleGroup = new THREE.Group();
      particleGroup.visible = true;
      scene.add(particleGroup);

      particleGeometry = new THREE.BufferGeometry();
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        currentPositions[i] = (Math.random() - 0.5) * 40;
        targetPositions[i] = currentPositions[i];
      }
      particleGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

      const particleColors = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        const col = new THREE.Color('#00ffcc');
        particleColors[idx] = col.r;
        particleColors[idx + 1] = col.g;
        particleColors[idx + 2] = col.b;
      }
      particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 16; pCanvas.height = 16;
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = '#ffffff'; pCtx.beginPath(); pCtx.arc(8, 8, 7, 0, Math.PI * 2); pCtx.fill();

      particleMaterial = new THREE.PointsMaterial({
        size: 0.22, vertexColors: true, map: new THREE.CanvasTexture(pCanvas),
        transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
      });

      const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
      particleGroup.add(particleSystem);
      generateShape('jupiter');

      previewCanvas = document.getElementById('hand-preview-canvas');
      previewCtx = previewCanvas.getContext('2d');

      window.addEventListener('resize', onWindowResize);
    }

    function spawnShape(type, x, y, z) {
      sounds.init();
      let geo;
      const size = 3.0;

      if (type === 'sphere') geo = new THREE.SphereGeometry(size / 1.8, 12, 12);
      else if (type === 'pyramid') geo = new THREE.ConeGeometry(size / 1.4, size, 4);
      else if (type === 'torus') geo = new THREE.TorusGeometry(size / 2, size / 6, 8, 16);
      else if (type === 'cylinder') geo = new THREE.CylinderGeometry(size / 2, size / 2, size, 12);
      else if (type === 'icosahedron') geo = new THREE.IcosahedronGeometry(size / 1.6);
      else geo = new THREE.BoxGeometry(size, size, size);

      const mat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.2, metalness: 0.3 });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.x = x !== undefined ? x : (Math.random() - 0.5) * 8;
      mesh.position.y = y !== undefined ? y : 6; 
      mesh.position.z = z !== undefined ? z : (Math.random() - 0.5) * 4;

      mesh.userData = { originalColor: 0x00ffcc, velocity: new THREE.Vector3(0, 0, 0), isGrabbed: false, size: size };

      builderGroup.add(mesh);
      blocks.push(mesh);
    }

    function clearBlocks() {
      for (let b of blocks) builderGroup.remove(b);
      blocks = [];
      controllers.forEach(c => { c.grabbedBlock = null; });
    }

    function setBlockHighlight(block, mode) {
      if (!block) return;
      if (mode === 'grab') block.material.color.setHex(0xffffff);
      else block.material.color.setHex(block.userData.originalColor);
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-builder').classList.toggle('active', mode === 'BUILDER');
      document.getElementById('tab-particles').classList.toggle('active', mode === 'PARTICLES');
      document.getElementById('controls-builder').style.display = mode === 'BUILDER' ? 'block' : 'none';
      document.getElementById('controls-particles').style.display = mode === 'PARTICLES' ? 'block' : 'none';
      document.getElementById('panel-title-text').innerText = mode === 'BUILDER' ? '3D BUILDER MATRIX' : 'PARTICLE MATRIX';

      builderGroup.visible = (mode === 'BUILDER');
      particleGroup.visible = (mode === 'PARTICLES');
    }

    function generateShape(type) {
      const p = targetPositions;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        let x = 0, y = 0, z = 0;

        if (type === 'jupiter') {
          if (i < PARTICLE_COUNT * 0.75) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 7.0;
            x = r * Math.sin(phi) * Math.cos(theta);
            y = (r * Math.cos(phi)) * 0.85;
            z = r * Math.sin(phi) * Math.sin(theta);
          } else {
            const angle = Math.random() * Math.PI * 2, dist = 9.0 + Math.random() * 4.0;
            x = Math.cos(angle) * dist; z = Math.sin(angle) * dist; y = (Math.random() - 0.5) * 0.2;
          }
        } else if (type === 'galaxy') {
          const arms = 4, arm = i % arms, r = Math.pow(Math.random(), 1.5) * 15;
          const theta = r * 0.4 + (arm * (Math.PI * 2 / arms));
          x = Math.cos(theta) * r + (Math.random() - 0.5) * 0.7;
          z = Math.sin(theta) * r + (Math.random() - 0.5) * 0.7;
          y = (Math.random() - 0.5) * (1.8 - r * 0.1);
        } else if (type === 'saturn') {
          if (i < PARTICLE_COUNT * 0.5) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 5.0;
            x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.cos(phi); z = r * Math.sin(phi) * Math.sin(theta);
          } else {
            const angle = Math.random() * Math.PI * 2, dist = 7.0 + Math.random() * 6.0;
            x = Math.cos(angle) * dist; z = Math.sin(angle) * dist; y = (Math.random() - 0.5) * 0.15;
          }
        } else if (type === 'DNA') {
          const t = (i / PARTICLE_COUNT) * Math.PI * 12;
          const strand = (i % 2 === 0) ? 1 : -1;
          x = Math.sin(t) * 4 * strand;
          y = ((i / PARTICLE_COUNT) * 16) - 8;
          z = Math.cos(t) * 4 * strand;
        } else if (type === 'hypercube') {
          const size = 6, side = i % 12, t = Math.random() * size - size/2;
          if (side === 0) { x = size/2; y = t; z = size/2; }
          else if (side === 1) { x = -size/2; y = t; z = size/2; }
          else if (side === 2) { x = t; y = size/2; z = size/2; }
          else if (side === 3) { x = t; y = -size/2; z = size/2; }
          else if (side === 4) { x = size/2; y = t; z = -size/2; }
          else if (side === 5) { x = -size/2; y = t; z = -size/2; }
          else if (side === 6) { x = t; y = size/2; z = -size/2; }
          else if (side === 7) { x = t; y = -size/2; z = -size/2; }
          else if (side === 8) { x = size/2; y = size/2; z = t; }
          else if (side === 9) { x = -size/2; y = size/2; z = t; }
          else if (side === 10) { x = size/2; y = -size/2; z = t; }
          else { x = -size/2; y = -size/2; z = t; }
        } else if (type === 'heart') {
          const t = Math.random() * Math.PI * 2, u = (Math.random() - 0.5) * 3;
          x = 16 * Math.pow(Math.sin(t), 3);
          y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          z = u; x *= 0.55; y *= 0.55; z *= 0.55;
        } else if (type === 'flower') {
          const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI;
          const r = 9 * Math.sin(6 * u) * Math.sin(v);
          x = r * Math.sin(v) * Math.cos(u); y = r * Math.sin(v) * Math.sin(u); z = r * Math.cos(v);
        } else if (type === 'buddha') {
          const rand = Math.random();
          if (rand < 0.35) {
            const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 8;
            x = Math.cos(a) * r; z = Math.sin(a) * r; y = -7 + (Math.random() - 0.5) * 1.2;
          } else {
            const h = Math.random() * 9, width = (1 - h / 9) * 6.5, a = Math.random() * Math.PI * 2;
            x = Math.cos(a) * width * Math.random(); z = Math.sin(a) * width * Math.random(); y = -6 + h;
          }
        } else if (type === 'fireworks') {
          const theta = Math.random() * Math.PI * 2, phi = Math.acos((Math.random() * 2) - 1);
          const speed = 2 + Math.random() * 12;
          x = speed * Math.sin(phi) * Math.cos(theta); y = speed * Math.sin(phi) * Math.sin(theta); z = speed * Math.cos(phi);
        }

        p[idx] = x; p[idx + 1] = y; p[idx + 2] = z;
      }
    }

    function initHandTracking() {
      const videoElement = document.getElementById('video-input');
      const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });

      hands.setOptions({
        maxNumHands: 2, 
        modelComplexity: 0, // Ottimizzato al minimo per zero-lag e risposta istantanea
        minDetectionConfidence: 0.4, 
        minTrackingConfidence: 0.4
      });

      hands.onResults((results) => {
        sounds.init();
        previewCtx.save();
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

        const numHands = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;
        const cursorEl = document.getElementById('virtual-cursor');

        if (numHands > 0) {
          const landmarks1 = results.multiHandLandmarks[0];
          const indexTip = landmarks1[8];
          const thumbTip = landmarks1[4];
          const middleTip = landmarks1[12];
          
          const cursorX = (1 - indexTip.x) * window.innerWidth;
          const cursorY = indexTip.y * window.innerHeight;
          
          cursorEl.style.display = 'block';
          cursorEl.style.left = `${cursorX}px`;
          cursorEl.style.top = `${cursorY}px`;

          const pinchDistUI = Math.hypot(thumbTip.x - middleTip.x, thumbTip.y - middleTip.y);
          const isPinchingUI = (pinchDistUI < 0.08);

          if (isPinchingUI) cursorEl.classList.add('pinching');
          else cursorEl.classList.remove('pinching');

          const elementUnderCursor = document.elementFromPoint(cursorX, cursorY);
          document.querySelectorAll('.virtual-hover').forEach(el => el.classList.remove('virtual-hover'));

          if (elementUnderCursor && (elementUnderCursor.tagName === 'BUTTON' || elementUnderCursor.tagName === 'SELECT' || elementUnderCursor.tagName === 'INPUT')) {
            elementUnderCursor.classList.add('virtual-hover');
            
            if (isPinchingUI && !lastWasPinchingUI) {
              sounds.playPinch();
              if (elementUnderCursor.tagName === 'SELECT') {
                const sel = elementUnderCursor;
                sel.selectedIndex = (sel.selectedIndex + 1) % sel.options.length;
                sel.dispatchEvent(new Event('change'));
              } else if (elementUnderCursor.type === 'color') {
                const colors = ['#00ffcc', '#ff0055', '#00ccff', '#ffaa00', '#aa00ff', '#ffffff'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                elementUnderCursor.value = randomColor;
                elementUnderCursor.dispatchEvent(new Event('input'));
              } else {
                elementUnderCursor.click();
              }
            }
          }

          lastWasPinchingUI = isPinchingUI;
        } else {
          cursorEl.style.display = 'none';
          lastWasPinchingUI = false;
        }

        for (let i = 0; i < 2; i++) {
          const ctrl = controllers[i];
          if (i < numHands) {
            ctrl.active = true;
            const landmarks = results.multiHandLandmarks[i];

            const thumbTip = landmarks[4], indexTip = landmarks[8], wrist = landmarks[0];
            const pX = (thumbTip.x + indexTip.x) / 2, pY = (thumbTip.y + indexTip.y) / 2, pZ = (thumbTip.z + indexTip.z) / 2;
            const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);

            const ndcX = (1 - pX) * 2 - 1, ndcY = -(pY * 2 - 1);
            const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const targetZ = -pZ * 20;
            const distanceToPlane = (targetZ - camera.position.z) / dir.z;
            const targetPos = camera.position.clone().add(dir.multiplyScalar(distanceToPlane));

            ctrl.lastPos.copy(ctrl.pos);
            ctrl.pos.copy(targetPos);
            ctrl.velocity.copy(ctrl.pos).sub(ctrl.lastPos);

            ctrl.mesh.visible = true;
            ctrl.mesh.position.copy(ctrl.pos);
            ctrl.pointLight.position.copy(ctrl.pos);

            const wasPinching = ctrl.isPinching;
            ctrl.isPinching = (pinchDist < 0.07);
            if (!wasPinching && ctrl.isPinching) sounds.playPinch();

            ctrl.statusEl.innerText = "ATTIVA"; ctrl.statusEl.style.color = "#00ffcc";

            if (currentMode === 'BUILDER') {
              if (ctrl.isPinching) {
                if (ctrl.grabbedBlock) {
                  const blockTarget = ctrl.pos.clone().sub(ctrl.grabOffset);
                  ctrl.grabbedBlock.position.copy(blockTarget);
                  ctrl.grabbedBlock.userData.velocity.set(0, 0, 0);
                  ctrl.grabEl.innerText = "AGGANCIATO"; ctrl.grabEl.style.color = "#00ffcc";
                } else {
                  let closest = null, minDist = 4.0;
                  for (let block of blocks) {
                    const d = ctrl.pos.distanceTo(block.position);
                    if (d < minDist) { minDist = d; closest = block; }
                  }
                  if (closest) {
                    ctrl.grabbedBlock = closest;
                    closest.userData.isGrabbed = true;
                    ctrl.grabOffset.copy(ctrl.pos).sub(closest.position);
                    setBlockHighlight(closest, 'grab');
                  }
                }
              } else {
                if (ctrl.grabbedBlock) {
                  setBlockHighlight(ctrl.grabbedBlock, 'normal');
                  ctrl.grabbedBlock.userData.isGrabbed = false;
                  ctrl.grabbedBlock = null;
                }
                ctrl.grabEl.innerText = "LIBERA"; ctrl.grabEl.style.color = "#888888";
              }
            }
          } else {
            ctrl.active = false;
            ctrl.mesh.visible = false;
            ctrl.rayLine.visible = false;
            if (ctrl.grabbedBlock) {
              setBlockHighlight(ctrl.grabbedBlock, 'normal');
              ctrl.grabbedBlock.userData.isGrabbed = false;
              ctrl.grabbedBlock = null;
            }
            ctrl.statusEl.innerText = "CERCA..."; ctrl.statusEl.style.color = "#555555"; ctrl.grabEl.innerText = "N/A";
          }
        }

        if (currentMode === 'PARTICLES' && numHands > 0) {
          const landmarks1 = results.multiHandLandmarks[0];
          const h1Center = landmarks1[9], wrist1 = landmarks1[0];
          targetRotZ = -Math.atan2(h1Center.y - wrist1.y, h1Center.x - wrist1.x) - Math.PI / 2;
          targetRotX = (h1Center.y - 0.5) * Math.PI * 2.0;
          targetRotY = (h1Center.x - 0.5) * Math.PI * 3.0;

          if (numHands === 2) {
            const landmarks2 = results.multiHandLandmarks[1];
            const distBetweenHands = Math.hypot(landmarks1[9].x - landmarks2[9].x, landmarks1[9].y - landmarks2[9].y);
            targetScale = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(distBetweenHands, 0.1, 0.7, 0.5, 2.5), 0.4, 3.0);
          } else {
            const span = Math.hypot(wrist1.x - landmarks1[12].x, wrist1.y - landmarks1[12].y);
            targetScale = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(span, 0.2, 0.5, 0.5, 2.0), 0.4, 2.2);
          }
        }

        previewCtx.restore();
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 320, height: 240 // Risoriuzione ridotta per zero-lag assoluto
      });
      cameraUtils.start();
    }

    function animate() {
      requestAnimationFrame(animate);

      if (currentMode === 'BUILDER') {
        const gravity = -0.06;
        blocks.forEach(block => {
          if (!block.userData.isGrabbed) {
            block.userData.velocity.y += gravity;
            block.position.add(block.userData.velocity);

            const floorY = -6 + (block.userData.size / 2);
            if (block.position.y < floorY) {
              block.position.y = floorY;
              block.userData.velocity.set(0, 0, 0);
            }
          }
        });
      }

      if (currentMode === 'PARTICLES') {
        particleGroup.rotation.x += (targetRotX - particleGroup.rotation.x) * 0.2;
        particleGroup.rotation.y += (targetRotY + 0.003 - particleGroup.rotation.y) * 0.2;
        particleGroup.rotation.z += (targetRotZ - particleGroup.rotation.z) * 0.2;

        handExpansionScale += (targetScale - handExpansionScale) * 0.2;
        camera.position.z += (targetCamZ - camera.position.z) * 0.2;

        const isPinchingAny = (controllers[0].active && controllers[0].isPinching) || (controllers[1].active && controllers[1].isPinching);
        const positions = particleGeometry.attributes.position.array;

        for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
          let tx = targetPositions[i] * handExpansionScale;
          let ty = targetPositions[i+1] * handExpansionScale;
          let tz = targetPositions[i+2] * handExpansionScale;
          let lerpSpeed = 0.2;

          if (isPinchingAny && (i / 3) % 2 === 0) {
            tx *= 0.01; ty *= 0.01; tz *= 0.01;
            lerpSpeed = 0.6;
          }

          positions[i] += (tx - positions[i]) * lerpSpeed;
          positions[i+1] += (ty - positions[i+1]) * lerpSpeed;
          positions[i+2] += (tz - positions[i+2]) * lerpSpeed;
        }
        particleGeometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    document.getElementById('shape-select').addEventListener('change', (e) => generateShape(e.target.value));
    document.getElementById('color-picker').addEventListener('input', (e) => {
      particleMaterial.color.set(e.target.value);
    });

    initThree();
    initHandTracking();
    animate();
  </script>
</body>
</html>
