<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Vision - Holographic Interface</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Video Background from Camera -->
    <video id="cameraFeed" autoplay playsinline muted></video>

    <!-- Canvas per effetti WebGL -->
    <canvas id="hologramCanvas"></canvas>

    <!-- HUD Container -->
    <div class="hud-container">
        <!-- Top Left - System Status -->
        <div class="hud-panel top-left">
            <div class="panel-header">◆ SYSTEM STATUS</div>
            <div class="panel-content">
                <div class="status-item">
                    <span class="label">POWER CORE</span>
                    <div class="battery-bar">
                        <div class="battery-fill" id="batteryFill"></div>
                    </div>
                    <span class="value" id="batteryText">100%</span>
                </div>
                <div class="status-item">
                    <span class="label">TEMPORAL SYNC</span>
                    <span class="value" id="timeDisplay">00:00</span>
                </div>
                <div class="status-item">
                    <span class="label">THERMAL INDEX</span>
                    <span class="value" id="tempDisplay">--°C</span>
                </div>
            </div>
        </div>

        <!-- Top Right - Mode Indicator -->
        <div class="hud-panel top-right">
            <div class="panel-header">◆ OPERATIONAL MODE</div>
            <div class="panel-content">
                <div class="mode-display">
                    <span class="pulse-dot"></span>
                    <span id="modeText">VISION ACTIVE</span>
                </div>
                <div class="signal-strength">
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Left - Coordinates -->
        <div class="hud-panel bottom-left">
            <div class="panel-header">◆ SPATIAL DATA</div>
            <div class="panel-content">
                <div class="coordinate">
                    <span class="axis">X:</span>
                    <span class="value" id="coordX">0.00</span>
                </div>
                <div class="coordinate">
                    <span class="axis">Y:</span>
                    <span class="value" id="coordY">0.00</span>
                </div>
                <div class="coordinate">
                    <span class="axis">Z:</span>
                    <span class="value" id="coordZ">0.00</span>
                </div>
            </div>
        </div>

        <!-- Bottom Right - Scanline Info -->
        <div class="hud-panel bottom-right">
            <div class="panel-header">◆ SCAN MATRIX</div>
            <div class="panel-content">
                <div class="scan-info">
                    <span class="label">RESOLUTION</span>
                    <span class="value" id="resolutionDisplay">FULL HD</span>
                </div>
                <div class="scan-info">
                    <span class="label">RENDER</span>
                    <span class="value" id="fpsDisplay">60 FPS</span>
                </div>
            </div>
        </div>

        <!-- Center - Main Hologram -->
        <div class="center-hologram">
            <div class="arc-reactor">
                <div class="arc-inner"></div>
                <div class="arc-middle"></div>
                <div class="arc-outer"></div>
            </div>
        </div>

        <!-- Floating Particles -->
        <div id="particleContainer"></div>

        <!-- Scanning Lines -->
        <div class="scan-lines"></div>

        <!-- Vignette Effect -->
        <div class="vignette"></div>
    </div>

    <!-- Permission Request Overlay -->
    <div id="permissionOverlay" class="permission-overlay">
        <div class="permission-card">
            <h2>JARVIS VISION INITIALIZATION</h2>
            <p>Richiesta accesso fotocamera e sensori</p>
            <button id="permissionBtn" class="hologram-button">ATTIVA SISTEMA</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
