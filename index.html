<head>

<style>
:root{
  --white:#fff;
  --dim:rgba(255,255,255,.58);
  --line:rgba(255,255,255,.16);
  --panel:rgba(8,10,12,.76);
  --green:#00ffcc;
  --pink:#ff00aa;
  --yellow:#ffe66d;
  --red:#ff5577;
  --radius:18px;
}

*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{
  width:100%;height:100%;overflow:hidden;background:#000;
  font-family:'Share Tech Mono',monospace;color:#fff
}
body{position:fixed;inset:0}
button,select,input{font:inherit}
button{color:inherit}

#canvas-container{
  position:absolute;inset:0;width:100vw;height:100vh;z-index:1
}
#canvas-container canvas{display:block;width:100%;height:100%}
#video-input{display:none}

/* ================= HUD ================= */

.hud-scanline{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 3px,
    rgba(255,255,255,.018) 4px
  );
  mix-blend-mode:screen;
}

.stark-header{
  position:absolute;top:0;left:0;width:100%;height:60px;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  background:rgba(8,8,8,.72);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  contain:layout paint;
}

.stark-title{
  display:flex;align-items:center;gap:12px;
  font-family:Orbitron,sans-serif;font-size:13px;font-weight:900;
  letter-spacing:2px;text-shadow:0 0 12px rgba(255,255,255,.35)
}

.security-badge,.hud-status{
  padding:3px 8px;border:1px solid var(--line);
  border-radius:20px;background:rgba(255,255,255,.04);
  font-size:8px;letter-spacing:1px
}

.hud-status{color:var(--green);min-width:95px;text-align:center}

.mode-dock{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:20;padding:7px;
  background:rgba(10,10,10,.78);
  border:1px solid var(--line);border-radius:24px;
  box-shadow:0 10px 25px rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px)
}

.tab-btn,.stark-btn{
  position:relative;
  border:1px solid var(--line);
  background:rgba(255,255,255,.035);
  border-radius:14px;
  cursor:pointer;
  transition:.18s ease;
  touch-action:manipulation
}

.tab-btn{
  padding:9px 18px;
  font-family:Orbitron,sans-serif;font-size:9px;
  letter-spacing:1px;color:var(--dim)
}

.tab-btn:hover,.tab-btn.active{
  color:#fff;background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.65);
  box-shadow:0 0 14px rgba(255,255,255,.12)
}

.stark-btn{
  height:36px;padding:0 10px;
  font-family:Orbitron,sans-serif;font-size:9px;
  letter-spacing:.7px;font-weight:700
}

.stark-btn:hover{
  background:rgba(255,255,255,.13);
  border-color:rgba(255,255,255,.65)
}

.stark-btn:active,.tab-btn:active{transform:scale(.97)}

.stark-btn::before,.tab-btn::before{
  content:"";position:absolute;left:6px;top:5px;
  width:4px;height:4px;border-left:1px solid #fff;border-top:1px solid #fff;
  opacity:.35
}

/* ================= LEFT PANEL ================= */

.ui-overlay{
  position:absolute;top:74px;left:18px;width:292px;z-index:10;
  padding:16px;
  background:var(--panel);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:22px;
  box-shadow:0 15px 30px rgba(0,0,0,.65);
  display:flex;flex-direction:column;gap:11px;
  contain:layout paint;
  transition:transform .22s ease,opacity .22s ease
}

.ui-overlay.closed{
  transform:translateX(-105%);
  opacity:0;pointer-events:none
}

.panel-header{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:8px;border-bottom:1px solid var(--line);
  font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:1px
}

.panel-online{font-size:8px;color:var(--green)}

.control-group{display:flex;flex-direction:column;gap:6px}
label{font-size:8px;letter-spacing:1px;color:var(--dim)}

select,.stark-btn,input[type=color]{
  width:100%;outline:none
}

select{
  height:36px;padding:0 10px;
  color:#fff;background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:14px;
  font-family:Orbitron,sans-serif;font-size:9px;font-weight:700
}
select option{background:#111;color:#fff}

input[type=color]{
  height:34px;padding:3px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:14px
}

.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.panel-section{
  overflow:hidden;
  max-height:500px;
  opacity:1;
  transition:max-height .25s ease,opacity .2s ease
}
.panel-section.hidden{
  max-height:0;opacity:0;pointer-events:none
}

.telemetry-box{
  padding:9px;
  background:rgba(0,0,0,.42);
  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;
  display:flex;flex-direction:column;gap:8px
}

.telemetry-top{
  display:flex;justify-content:space-between;
  color:var(--dim);font-size:8px
}
.telemetry-top strong{color:#fff}

.hand-card{
  padding:6px 0 6px 8px;
  border-left:2px solid rgba(255,255,255,.25);
  font-size:8px
}
.hand-card.left{border-color:var(--green)}
.hand-card.right{border-color:var(--pink)}

.telemetry-row{
  display:flex;justify-content:space-between;
  padding:2px 0;color:var(--dim)
}
.telemetry-val{color:#fff}

.state-tracking{color:var(--green)!important}
.state-lost{color:var(--red)!important}
.state-searching{color:var(--yellow)!important}

.hand-indicator{
  display:inline-block;width:6px;height:6px;
  border-radius:50%;margin-right:4px;background:#444;
  box-shadow:0 0 0 transparent
}
.hand-indicator.on{
  background:var(--green);
  box-shadow:0 0 9px var(--green)
}
.hand-indicator.right.on{
  background:var(--pink);
  box-shadow:0 0 9px var(--pink)
}

#builder-selection{
  min-height:16px;color:var(--yellow);font-size:8px;
  letter-spacing:.7px
}

/* ================= CAMERA ================= */

.camera-preview-container{
  position:absolute;right:18px;bottom:20px;
  width:240px;height:180px;z-index:10;
  overflow:hidden;
  background:rgba(5,7,9,.82);
  border:1px solid var(--line);border-radius:18px;
  box-shadow:0 12px 25px rgba(0,0,0,.65);
  contain:strict
}

#hand-preview-canvas{
  width:100%;height:100%;display:block;
  transform:scaleX(-1);opacity:.9
}

.preview-hud-tag{
  position:absolute;top:6px;left:7px;z-index:2;
  padding:2px 6px;border:1px solid var(--line);
  border-radius:8px;background:rgba(0,0,0,.72);
  font-size:7px;letter-spacing:1px;pointer-events:none
}

.preview-status{
  position:absolute;right:7px;top:6px;
  padding:2px 5px;border-radius:8px;
  background:rgba(0,0,0,.72);
  font-size:7px;color:var(--yellow)
}

/* ================= BUILDER TARGET ================= */

#selection-ring{
  position:absolute;
  width:45px;height:45px;
  border:1px solid var(--yellow);
  border-radius:50%;
  z-index:8;pointer-events:none;
  display:none;
  box-shadow:0 0 12px rgba(255,230,109,.3)
}
#selection-ring::before,
#selection-ring::after{
  content:"";position:absolute;
  left:50%;top:-6px;width:1px;height:57px;
  background:rgba(255,230,109,.55);
}
#selection-ring::after{transform:rotate(90deg)}

/* ================= MOBILE ================= */

@media(max-width:700px){
  .stark-header{height:50px;padding:0 10px}
  .stark-title{font-size:9px;gap:6px}
  .security-badge{display:none}
  .hud-status{font-size:7px;min-width:75px}

  .ui-overlay{
    top:58px;left:8px;width:245px;
    padding:12px;border-radius:18px
  }

  .mode-dock{
    bottom:10px;width:calc(100% - 20px);
    justify-content:center
  }
  .tab-btn{flex:1;padding:9px 5px;font-size:7px}

  .camera-preview-container{
    width:150px;height:112px;
    right:8px;bottom:62px;border-radius:14px
  }

  .preview-hud-tag{font-size:5px}
  .preview-status{font-size:5px}
}

@media(max-width:430px){
  .ui-overlay{width:220px}
  .camera-preview-container{width:130px;height:98px}
  .stark-btn{font-size:8px}
}

@media(max-width:700px){
  .ui-overlay,.mode-dock,.stark-header{
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px)
  }
}
</style>

<script>
'use strict';

/* =========================================================
   CONFIGURAZIONE
   ========================================================= */

const CONFIG = {
  particles: 4000,
  handFPS: 24,
  cameraWidth: 320,
  cameraHeight: 240,

  /* SENSIBILITÀ MANI: 70% */
  handSmooth: 0.70,

  pinchOn: 0.075,
  pinchOff: 0.105,

  particleSmooth: 0.22,
  particleReaction: 0.08,
  maxBlocks: 28,

  builderGravity: 0.06,

  /* SPINTA MINIMA AL RILASCIO */
  throwPower: 0.10,

  snapSize: 1.5,

  colors: {
    white: 0xffffff,
    green: 0x00ffcc,
    pink: 0xff00aa,
    yellow: 0xffe66d
  }
};

const PARTICLE_COUNT = CONFIG.particles;

/* =========================================================
   AUDIO
   ========================================================= */

class SciFiSoundSystem {
  constructor(){
    this.ctx=null;
    this.humOsc=null;
    this.humGain=null;
    this.enabled=true;
    this.initialized=false;
  }

  init(){
    if(this.initialized) return;

    try{
      const AudioCtx=window.AudioContext||window.webkitAudioContext;
      if(!AudioCtx) return;

      this.ctx=new AudioCtx();
      this.humOsc=this.ctx.createOscillator();
      this.humGain=this.ctx.createGain();

      this.humOsc.type='sine';
      this.humOsc.frequency.value=50;
      this.humGain.gain.value=.008;

      this.humOsc.connect(this.humGain);
      this.humGain.connect(this.ctx.destination);
      this.humOsc.start();

      this.initialized=true;
    }catch(e){
      console.warn('Audio non disponibile',e);
    }
  }

  pinch(){
    if(!this.enabled) return;
    this.init();
    if(!this.initialized) return;

    const o=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    const t=this.ctx.currentTime;

    o.type='sine';
    o.frequency.setValueAtTime(220,t);
    o.frequency.exponentialRampToValueAtTime(700,t+.07);

    g.gain.setValueAtTime(.1,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.07);

    o.connect(g);
    g.connect(this.ctx.destination);
    o.start(t);
    o.stop(t+.07);
  }
}

const sounds=new SciFiSoundSystem();

/* =========================================================
   DOM
   ========================================================= */

const $=id=>document.getElementById(id);

const dom={
  container:$('canvas-container'),
  video:$('video-input'),
  panel:$('main-panel'),
  builder:$('controls-builder'),
  particles:$('controls-particles'),
  panelTitle:$('panel-title-text'),
  panelOnline:$('panel-online'),

  tabBuilder:$('tab-builder'),
  tabParticles:$('tab-particles'),

  shapeSelect:$('shape-select'),
  colorPicker:$('color-picker'),
  audio:$('audio-toggle-btn'),
  clear:$('clear-btn'),

  connection:$('connection-status'),
  mp:$('mp-status'),
  fps:$('fps-value'),
  particleValue:$('particle-value'),
  mode:$('telemetry-mode'),

  preview:$('hand-preview-canvas'),
  previewStatus:$('preview-status'),

  selection:$('builder-selection'),
  ring:$('selection-ring'),

  hands:[
    {
      status:$('h1-status'),
      grab:$('h1-grab'),
      dot:$('hand-dot-1')
    },
    {
      status:$('h2-status'),
      grab:$('h2-grab'),
      dot:$('hand-dot-2')
    }
  ]
};

/* =========================================================
   THREE
   ========================================================= */

let scene,camera,renderer;
let builderGroup,particleGroup;
let particleGeometry,particleMaterial;
let particleSystem;

const targetPositions=new Float32Array(PARTICLE_COUNT*3);
const currentPositions=new Float32Array(PARTICLE_COUNT*3);

let blocks=[];
let selectedBlock=null;
let currentMode='PARTICLES';

let targetScale=1;
let currentScale=1;
let targetRotX=0;
let targetRotY=0;
let targetRotZ=0;

let shapePulse=0;
let lastFrame=performance.now();
let fpsTime=performance.now();
let fpsFrames=0;

/* =========================================================
   CONTROLLERS
   ========================================================= */

function createController(index){
  return {
    side:index===0?'Left':'Right',

    mesh:null,
    pointLight:null,
    rayLine:null,

    trail:null,
    trailPoints:[],
    trailGeometry:null,

    pos:new THREE.Vector3(),
    target:new THREE.Vector3(),
    lastPos:new THREE.Vector3(),
    velocity:new THREE.Vector3(),

    active:false,
    isPinching:false,
    wasPinching:false,
    lastSeen:0,

    grabbedBlock:null,
    grabOffset:new THREE.Vector3(),

    statusEl:dom.hands[index].status,
    grabEl:dom.hands[index].grab,
    dotEl:dom.hands[index].dot
  };
}

const controllers=[
  createController(0),
  createController(1)
];

/* =========================================================
   HAND CONNECTIONS
   ========================================================= */

const HAND_CONNECTIONS=[
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

/* =========================================================
   INIT THREE
   ========================================================= */

function initThree(){

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x000000);

  camera=new THREE.PerspectiveCamera(
    55,
    innerWidth/innerHeight,
    .1,
    1000
  );

  /*
    VISUALE INIZIALE:
    perfettamente centrata ma con un
    leggero angolo dall'alto per dare profondità.
  */
  camera.position.set(0,2.2,28);
  camera.lookAt(0,0,0);

  renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:'high-performance'
  });

  renderer.setPixelRatio(1);
  renderer.setSize(innerWidth,innerHeight,false);
  dom.container.appendChild(renderer.domElement);

  initBuilder();
  initControllers();
  initParticles();
  initPreview();
}

/* =========================================================
   BUILDER
   ========================================================= */

function initBuilder(){

  builderGroup=new THREE.Group();
  builderGroup.visible=false;
  scene.add(builderGroup);

  const ambient=new THREE.AmbientLight(0xffffff,.8);
  scene.add(ambient);

  const light=new THREE.DirectionalLight(0xffffff,.7);
  light.position.set(10,20,15);
  scene.add(light);

  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(60,60),
    new THREE.MeshStandardMaterial({
      color:0x111111,
      roughness:.85,
      metalness:.1
    })
  );

  floor.rotation.x=-Math.PI/2;
  floor.position.y=-6;
  builderGroup.add(floor);

  const grid=new THREE.GridHelper(
    60,30,0xffffff,0x333333
  );

  grid.position.y=-5.98;
  builderGroup.add(grid);

  spawnShape('cube',0,2,0);
}

/* =========================================================
   HAND VISUALS
   ========================================================= */

function initControllers(){

  controllers.forEach((ctrl,index)=>{

    const color=index===0?CONFIG.colors.green:CONFIG.colors.pink;

    const dot=new THREE.Mesh(
      new THREE.SphereGeometry(.17,7,7),
      new THREE.MeshBasicMaterial({color})
    );

    dot.visible=false;
    ctrl.mesh=dot;
    builderGroup.add(dot);

    ctrl.pointLight=new THREE.PointLight(color,.5,7);
    ctrl.pointLight.visible=false;
    builderGroup.add(ctrl.pointLight);

    const lineGeo=new THREE.BufferGeometry();

    lineGeo.setAttribute(
      'position',
      new THREE.BufferAttribute(
        new Float32Array(6),3
      )
    );

    ctrl.rayLine=new THREE.Line(
      lineGeo,
      new THREE.LineBasicMaterial({
        color,
        transparent:true,
        opacity:.3
      })
    );

    ctrl.rayLine.visible=false;
    builderGroup.add(ctrl.rayLine);

    ctrl.trailPoints=Array.from(
      {length:12},
      ()=>new THREE.Vector3()
    );

    ctrl.trailGeometry=new THREE.BufferGeometry();

    ctrl.trailGeometry.setAttribute(
      'position',
      new THREE.BufferAttribute(
        new Float32Array(12*3),3
      )
    );

    ctrl.trail=new THREE.Line(
      ctrl.trailGeometry,
      new THREE.LineBasicMaterial({
        color,
        transparent:true,
        opacity:.28
      })
    );

    ctrl.trail.visible=false;
    scene.add(ctrl.trail);
  });
}

/* =========================================================
   PARTICLE SYSTEM
   ========================================================= */

function initParticles(){

  particleGroup=new THREE.Group();
  scene.add(particleGroup);

  particleGeometry=new THREE.BufferGeometry();

  for(let i=0;i<PARTICLE_COUNT*3;i++){
    const v=(Math.random()-.5)*20;
    targetPositions[i]=v;
    currentPositions[i]=v;
  }

  particleGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(currentPositions,3)
  );

  const colors=new Float32Array(PARTICLE_COUNT*3);

  for(let i=0;i<PARTICLE_COUNT;i++){

    const v=
      Math.random()<.7
      ?1
      :Math.random()<.66?.66:.33;

    const j=i*3;

    colors[j]=v;
    colors[j+1]=v;
    colors[j+2]=v;
  }

  particleGeometry.setAttribute(
    'color',
    new THREE.BufferAttribute(colors,3)
  );

  const texture=createGlowTexture();

  particleMaterial=new THREE.PointsMaterial({
    size:.30,
    vertexColors:true,
    map:texture,
    transparent:true,
    opacity:.9,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });

  particleSystem=new THREE.Points(
    particleGeometry,
    particleMaterial
  );

  particleGroup.add(particleSystem);

  generateShape('jupiter');

  dom.particleValue.textContent=PARTICLE_COUNT;
}

/* =========================================================
   GLOW TEXTURE
   ========================================================= */

function createGlowTexture(){

  const c=document.createElement('canvas');

  c.width=32;
  c.height=32;

  const ctx=c.getContext('2d');

  const g=ctx.createRadialGradient(
    16,16,1,
    16,16,16
  );

  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.25,'rgba(255,255,255,.9)');
  g.addColorStop(.6,'rgba(255,255,255,.25)');
  g.addColorStop(1,'rgba(255,255,255,0)');

  ctx.fillStyle=g;
  ctx.fillRect(0,0,32,32);

  const texture=new THREE.CanvasTexture(c);

  texture.generateMipmaps=false;
  texture.minFilter=THREE.LinearFilter;
  texture.magFilter=THREE.LinearFilter;

  return texture;
}

/* =========================================================
   SPAWN
   ========================================================= */

function spawnShape(type,x,y,z){

  let geo;
  const size=3;

  switch(type){

    case'sphere':
      geo=new THREE.SphereGeometry(1.65,12,12);
      break;

    case'pyramid':
      geo=new THREE.ConeGeometry(2.1,3,4);
      break;

    case'torus':
      geo=new THREE.TorusGeometry(1.5,.5,8,16);
      break;

    case'cylinder':
      geo=new THREE.CylinderGeometry(1.5,1.5,3,12);
      break;

    case'icosahedron':
      geo=new THREE.IcosahedronGeometry(1.9);
      break;

    default:
      geo=new THREE.BoxGeometry(size,size,size);
  }

  const color=Math.random()>.5?0xffffff:0x888888;

  const mesh=new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({
      color,
      roughness:.35,
      metalness:.2
    })
  );

  mesh.position.set(
    x??(Math.random()-.5)*8,
    y??6,
    z??(Math.random()-.5)*4
  );

  /*
    ROTAZIONE INIZIALE FISSA.
    Gli oggetti non verranno ruotati dalla mano.
  */
  mesh.rotation.set(0,0,0);

  mesh.userData={
    originalColor:color,
    velocity:new THREE.Vector3(),
    isGrabbed:false,
    size,
    type
  };

  builderGroup.add(mesh);
  blocks.push(mesh);

  if(blocks.length>CONFIG.maxBlocks){
    disposeBlock(blocks.shift());
  }
}

function disposeBlock(block){

  if(!block)return;

  builderGroup.remove(block);

  block.geometry?.dispose();
  block.material?.dispose();

  if(selectedBlock===block)
    selectedBlock=null;
}

/* =========================================================
   RESET
   ========================================================= */

function clearBlocks(){

  blocks.forEach(disposeBlock);
  blocks=[];

  controllers.forEach(c=>{
    c.grabbedBlock=null;
    c.isPinching=false;
  });

  selectedBlock=null;
  updateSelectionUI();
}

/* =========================================================
   HIGHLIGHT
   ========================================================= */

function highlightBlock(block,on){

  if(!block)return;

  block.material.color.setHex(
    on
    ?CONFIG.colors.yellow
    :block.userData.originalColor
  );
}

/* =========================================================
   SNAP
   ========================================================= */

function snapBlock(block){

  if(!block)return;

  const s=CONFIG.snapSize;

  block.position.x=
    Math.round(block.position.x/s)*s;

  block.position.y=
    Math.round(block.position.y/s)*s;

  block.position.z=
    Math.round(block.position.z/s)*s;
}

/* =========================================================
   SELECTION UI

function updateSelectionUI(){

  if(selectedBlock){

    dom.selection.textContent=
      'TARGET: '+
      selectedBlock.userData.type.toUpperCase();

    dom.ring.style.display='block';

  }else{

    dom.selection.textContent=
      'TARGET: NESSUN OGGETTO';

    dom.ring.style.display='none';
  }
}

/* =========================================================
   PARTICLE SHAPES
   ========================================================= */

function generateShape(type){

  const p=targetPositions;

  for(let i=0;i<PARTICLE_COUNT;i++){

    const j=i*3;

    let x=0;
    let y=0;
    let z=0;

    if(type==='jupiter'||type==='saturn'){

      const saturn=type==='saturn';
      const body=saturn?.5:.75;

      if(i<PARTICLE_COUNT*body){

        const a=Math.random()*Math.PI*2;
        const b=Math.acos(Math.random()*2-1);
        const r=saturn?5:7;

        x=r*Math.sin(b)*Math.cos(a);
        y=r*Math.cos(b)*(saturn?1:.85);
        z=r*Math.sin(b)*Math.sin(a);

      }else{

        const a=Math.random()*Math.PI*2;
        const r=
          (saturn?7:9)+
          Math.random()*(saturn?6:4);

        x=Math.cos(a)*r;
        z=Math.sin(a)*r;
        y=(Math.random()-.5)*.2;
      }

    }else if(type==='galaxy'){

      const arm=i%4;
      const r=Math.pow(Math.random(),1.5)*15;
      const a=r*.4+arm*Math.PI/2;

      x=Math.cos(a)*r+(Math.random()-.5)*.7;
      z=Math.sin(a)*r+(Math.random()-.5)*.7;

      y=
        (Math.random()-.5)*
        Math.max(.2,1.8-r*.1);

    }else if(type==='DNA'){

      const t=i/PARTICLE_COUNT*Math.PI*12;
      const strand=i%2?-1:1;

      x=Math.sin(t)*4*strand;
      y=i/PARTICLE_COUNT*16-8;
      z=Math.cos(t)*4*strand;

    }else if(type==='hypercube'){

      const s=6;
      const t=Math.random()*s-s/2;
      const side=i%12;

      if(side===0){
        x=s/2;y=t;z=s/2;
      }else if(side===1){
        x=-s/2;y=t;z=s/2;
      }else if(side===2){
        x=t;y=s/2;z=s/2;
      }else if(side===3){
        x=t;y=-s/2;z=s/2;
      }else if(side===4){
        x=s/2;y=t;z=-s/2;
      }else if(side===5){
        x=-s/2;y=t;z=-s/2;
      }else if(side===6){
        x=t;y=s/2;z=-s/2;
      }else if(side===7){
        x=t;y=-s/2;z=-s/2;
      }else if(side===8){
        x=s/2;y=s/2;z=t;
      }else if(side===9){
        x=-s/2;y=s/2;z=t;
      }else if(side===10){
        x=s/2;y=-s/2;z=t;
      }else{
        x=-s/2;y=-s/2;z=t;
      }

    }else if(type==='heart'){

      const t=Math.random()*Math.PI*2;

      x=16*Math.pow(Math.sin(t),3)*.55;

      y=
        (
          13*Math.cos(t)
          -5*Math.cos(2*t)
          -2*Math.cos(3*t)
          -Math.cos(4*t)
        )*.55;

      z=(Math.random()-.5)*3*.55;

    }else if(type==='flower'){

      const u=Math.random()*Math.PI*2;
      const v=Math.random()*Math.PI;
      const r=9*Math.sin(6*u)*Math.sin(v);

      x=r*Math.sin(v)*Math.cos(u);
      y=r*Math.sin(v)*Math.sin(u);
      z=r*Math.cos(v);

    }else if(type==='buddha'){

      if(Math.random()<.35){

        const a=Math.random()*Math.PI*2;
        const r=2+Math.random()*8;

        x=Math.cos(a)*r;
        z=Math.sin(a)*r;
        y=-7+(Math.random()-.5)*1.2;

      }else{

        const h=Math.random()*9;
        const w=(1-h/9)*6.5;
        const a=Math.random()*Math.PI*2;

        x=Math.cos(a)*w*Math.random();
        z=Math.sin(a)*w*Math.random();
        y=-6+h;
      }

    }else if(type==='fireworks'){

      const a=Math.random()*Math.PI*2;
      const b=Math.acos(Math.random()*2-1);
      const r=2+Math.random()*12;

      x=r*Math.sin(b)*Math.cos(a);
      y=r*Math.sin(b)*Math.sin(a);
      z=r*Math.cos(b);
    }

    p[j]=x;
    p[j+1]=y;
    p[j+2]=z;
  }

  shapePulse=1;
}

/* =========================================================
   HAND PREVIEW
   ========================================================= */

function drawPreview(hands){

  const ctx=previewCtx;
  const w=dom.preview.width;
  const h=dom.preview.height;

  ctx.clearRect(0,0,w,h);

  ctx.fillStyle='rgba(5,10,14,.92)';
  ctx.fillRect(0,0,w,h);

  if(!hands?.length){

    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.font='9px "Share Tech Mono"';
    ctx.textAlign='center';

    ctx.fillText(
      'SEARCHING HANDS...',
      w/2,
      h/2
    );

    return;
  }

  hands.forEach((landmarks,i)=>{

    ctx.strokeStyle=
      i===0
      ?'#00ffcc'
      :'#ff00aa';

    ctx.lineWidth=1.5;

    HAND_CONNECTIONS.forEach(pair=>{

      const a=landmarks[pair[0]];
      const b=landmarks[pair[1]];

      ctx.beginPath();

      ctx.moveTo(
        a.x*w,
        a.y*h
      );

      ctx.lineTo(
        b.x*w,
        b.y*h
      );

      ctx.stroke();
    });

    landmarks.forEach((p,index)=>{

      ctx.fillStyle=
        (index===4||index===8)
        ?'#ffe66d'
        :(i===0?'#00ffcc':'#ff00aa');

      ctx.beginPath();

      ctx.arc(
        p.x*w,
        p.y*h,
        index===4||index===8?3:1.7,
        0,
        Math.PI*2
      );

      ctx.fill();
    });
  });
}

/* =========================================================
   MEDIA PIPE
   ========================================================= */

async function initHandTracking(){

  setConnection(
    'CAM: CONNECTING',
    'yellow'
  );

  dom.mp.textContent='SEARCHING';

  const hands=new Hands({
    locateFile:file=>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands:2,
    modelComplexity:0,
    minDetectionConfidence:.45,
    minTrackingConfidence:.45
  });

  let processing=false;
  let lastProcess=0;

  const interval=1000/CONFIG.handFPS;

  hands.onResults(results=>{

    processing=false;

    const landmarks=
      results.multiHandLandmarks||[];

    const handed=
      results.multiHandedness||[];

    drawPreview(landmarks);

    dom.mp.textContent=
      landmarks.length
      ?'TRACKING'
      :'SEARCHING';

    const mapped={
      Left:null,
      Right:null
    };

    handed.forEach((item,i)=>{

      if(item?.label&&landmarks[i]){
        mapped[item.label]=landmarks[i];
      }
    });

    controllers.forEach(ctrl=>{

      const lm=mapped[ctrl.side];

      if(lm){
        updateController(ctrl,lm);
      }else{
        loseController(ctrl);
      }
    });

    updateParticleTargets(controllers);
  });

  const cameraUtils=new Camera(
    dom.video,
    {
      onFrame:async()=>{

        if(processing)return;

        const now=performance.now();

        if(now-lastProcess<interval)return;
        if(dom.video.readyState<2)return;

        lastProcess=now;
        processing=true;

        try{
          await hands.send({
            image:dom.video
          });
        }catch(e){

          processing=false;

          setConnection(
            'CAM: ERROR',
            'red'
          );

          dom.mp.textContent='ERROR';
        }
      },

      width:CONFIG.cameraWidth,
      height:CONFIG.cameraHeight
    }
  );

  try{

    cameraUtils.start();

    setConnection(
      'CAM: STARTING',
      'yellow'
    );

  }catch(e){

    setConnection(
      'CAM: FAILED',
      'red'
    );

    console.warn(
      'Camera error',
      e
    );
  }

  dom.video.addEventListener(
    'loadeddata',
    ()=>{
      setConnection(
        'CAM: ONLINE',
        'green'
      );

      dom.previewStatus.textContent='ONLINE';
    }
  );

  dom.video.addEventListener(
    'error',
    ()=>{
      setConnection(
        'CAM: ERROR',
        'red'
      );

      dom.previewStatus.textContent='ERROR';
    }
  );
}

/* =========================================================
   HAND UPDATE
   ========================================================= */

function updateController(ctrl,landmarks){

  const now=performance.now();

  ctrl.active=true;
  ctrl.lastSeen=now;

  const thumb=landmarks[4];
  const index=landmarks[8];

  const centerX=(thumb.x+index.x)*.5;
  const centerY=(thumb.y+index.y)*.5;
  const centerZ=(thumb.z+index.z)*.5;

  const ndcX=(1-centerX)*2-1;
  const ndcY=-(centerY*2-1);

  const v=new THREE.Vector3(
    ndcX,
    ndcY,
    .5
  );

  v.unproject(camera);

  const dir=
    v.sub(camera.position).normalize();

  const targetZ=
    -centerZ*20;

  if(Math.abs(dir.z)>.0001){

    const dist=
      (targetZ-camera.position.z)/dir.z;

    ctrl.target.copy(camera.position)
      .add(dir.multiplyScalar(dist));

    ctrl.lastPos.copy(ctrl.pos);

    /*
      SENSIBILITÀ 70%:
      la mano segue molto più direttamente
      il movimento reale.
    */
    ctrl.pos.lerp(
      ctrl.target,
      CONFIG.handSmooth
    );

    ctrl.velocity.copy(ctrl.pos)
      .sub(ctrl.lastPos);

    ctrl.mesh.position.copy(ctrl.pos);
    ctrl.pointLight.position.copy(ctrl.pos);

    ctrl.mesh.visible=true;
    ctrl.pointLight.visible=true;

    updateRay(
      ctrl,
      landmarks[0],
      targetZ
    );

    updateTrail(ctrl);
  }

  updatePinch(
    ctrl,
    thumb,
    index
  );

  updateHandHUD(ctrl);

  updateBuilderHand(ctrl);
}

function updatePinch(ctrl,thumb,index){

  const distance=Math.hypot(
    thumb.x-index.x,
    thumb.y-index.y
  );

  ctrl.wasPinching=ctrl.isPinching;

  if(ctrl.isPinching){

    if(distance>CONFIG.pinchOff)
      ctrl.isPinching=false;

  }else{

    if(distance<CONFIG.pinchOn)
      ctrl.isPinching=true;
  }

  if(
    !ctrl.wasPinching&&
    ctrl.isPinching
  ){
    sounds.pinch();
  }
}

function loseController(ctrl){

  const elapsed=
    performance.now()-ctrl.lastSeen;

  ctrl.active=false;

  ctrl.mesh.visible=false;
  ctrl.pointLight.visible=false;
  ctrl.rayLine.visible=false;

  if(elapsed>350){

    ctrl.isPinching=false;

    releaseBlock(ctrl);

    setHandState(
      ctrl,
      'LOST'
    );

  }else{

    setHandState(
      ctrl,
      'LOST'
    );
  }

  ctrl.trail.visible=false;
}

function setHandState(ctrl,state){

  ctrl.statusEl.textContent=state;

  ctrl.statusEl.className=
    'telemetry-val';

  if(state==='TRACKING')
    ctrl.statusEl.classList.add(
      'state-tracking'
    );
  else if(state==='LOST')
    ctrl.statusEl.classList.add(
      'state-lost'
    );
  else
    ctrl.statusEl.classList.add(
      'state-searching'
    );

  ctrl.dotEl.classList.toggle(
    'on',
    state==='TRACKING'
  );

  if(state==='TRACKING'){
    dom.previewStatus.textContent=
      'TRACKING';
  }
}

/* =========================================================
   HAND HUD
   ========================================================= */

function updateHandHUD(ctrl){

  setHandState(
    ctrl,
    'TRACKING'
  );

  ctrl.grabEl.textContent=
    ctrl.isPinching
    ?'PINCH'
    :'OPEN';

  ctrl.grabEl.style.color=

    ?'#ffe66d'
    :'#fff';

/* =========================================================
   RAY
   ========================================================= */

function updateRay(ctrl,wrist,targetZ){

  const x=(1-wrist.x)*2-1;
  const y=-(wrist.y*2-1);

  const v=new THREE.Vector3(
    x,
    y,
    .5
  );

  v.unproject(camera);

  const dir=
    v.sub(camera.position).normalize();

  if(Math.abs(dir.z)<.0001)return;

  const dist=
    (targetZ-camera.position.z)/dir.z;

  const p=
    camera.position.clone()
      .add(dir.multiplyScalar(dist));

  const attr=
    ctrl.rayLine.geometry.attributes.position;

  attr.setXYZ(
    0,
    p.x,
    p.y,
    p.z
  );

  attr.setXYZ(
    1,
    ctrl.pos.x,
    ctrl.pos.y,
    ctrl.pos.z
  );

  attr.needsUpdate=true;

  ctrl.rayLine.visible=
    currentMode==='BUILDER';
}

/* =========================================================
   TRAIL
   ========================================================= */

function updateTrail(ctrl){

  if(currentMode!=='PARTICLES'){

    ctrl.trail.visible=false;
    return;
  }

  ctrl.trailPoints.unshift(
    ctrl.pos.clone()
  );

  ctrl.trailPoints.length=12;

  const attr=
    ctrl.trailGeometry.attributes.position;

  for(let i=0;i<12;i++){

    const p=
      ctrl.trailPoints[i]||
      ctrl.pos;

    attr.setXYZ(
      i,
      p.x,
      p.y,
      p.z
    );
  }

  attr.needsUpdate=true;

  ctrl.trail.visible=true;
}

/* =========================================================
   PARTICLE REACTION
   ========================================================= */

function updateParticleTargets(){

  if(currentMode!=='PARTICLES')
    return;

  let activeHand=null;

  if(controllers[0].active)
    activeHand=controllers[0];
  else if(controllers[1].active)
    activeHand=controllers[1];

  if(!activeHand)return;

  const p=activeHand.pos;

  targetRotY=
    THREE.MathUtils.clamp(
      p.x*.035,
      -1.2,
      1.2
    );

  targetRotX=
    THREE.MathUtils.clamp(
      -p.y*.025,
      -1.0,
      1.0
    );

  if(
    controllers[0].active&&
    controllers[1].active
  ){

    const a=controllers[0].pos;
    const b=controllers[1].pos;

    const d=a.distanceTo(b);

    targetScale=
      THREE.MathUtils.clamp(
        .65+d*.075,
        .65,
        2.4
      );

  }else{

    targetScale=
      THREE.MathUtils.clamp(
        1+Math.abs(p.x)*.025,
        .75,
        1.5
      );
  }
}

/* =========================================================
   BUILDER HAND CONTROL
   ========================================================= */

function updateBuilderHand(ctrl){

  if(currentMode!=='BUILDER')
    return;

  if(ctrl.isPinching){

    if(!ctrl.grabbedBlock){
      selectNearestBlock(ctrl);
    }

    if(ctrl.grabbedBlock){

      const block=
        ctrl.grabbedBlock;

      block.position.copy(
        ctrl.pos.clone()
          .sub(ctrl.grabOffset)
      );

      /*
        NESSUNA ROTAZIONE.
        L'oggetto resta dritto e
        mantiene il proprio orientamento.
      */
      block.userData.velocity.set(
        0,
        0,
        0
      );

      selectedBlock=block;

      highlightBlock(
        block,
        true
      );

      updateSelectionUI();
    }

  }else if(ctrl.wasPinching){

    releaseBlock(ctrl);
  }
}

function selectNearestBlock(ctrl){

  let nearest=null;
  let best=4;

  for(const block of blocks){

    const d=
      ctrl.pos.distanceTo(
        block.position
      );

    if(d<best){

      best=d;
      nearest=block;
    }
  }

  if(!nearest)return;

  ctrl.grabbedBlock=nearest;

  ctrl.grabOffset.copy(
    ctrl.pos
  ).sub(
    nearest.position
  );

  nearest.userData.isGrabbed=true;

  selectedBlock=nearest;

  highlightBlock(
    nearest,
    true
  );

  updateSelectionUI();
}

function releaseBlock(ctrl){

  const block=
    ctrl.grabbedBlock;

  if(!block)return;

  block.userData.isGrabbed=false;

  /*
    SPINTA QUASI NULLA:
    niente lancio dall'altra parte della mappa.
    Riceve solo una piccolissima inerzia.
  */
  block.userData.velocity.copy(
    ctrl.velocity
  ).multiplyScalar(
    CONFIG.throwPower
  );

  snapBlock(block);

  highlightBlock(
    block,
    false
  );

  ctrl.grabbedBlock=null;

  selectedBlock=null;

  updateSelectionUI();
}

/* =========================================================
   PARTICLE ANIMATION
   ========================================================= */

function updateParticles(delta){

  if(currentMode!=='PARTICLES')
    return;

  const lerp=Math.min(
    CONFIG.particleSmooth*delta,
    .45
  );

  particleGroup.rotation.x+=
    (
      targetRotX-
      particleGroup.rotation.x
    )*lerp;

  particleGroup.rotation.y+=
    (
      targetRotY+.002-
      particleGroup.rotation.y
    )*lerp;

  particleGroup.rotation.z+=
    (
      targetRotZ-
      particleGroup.rotation.z
    )*lerp;

  currentScale+=
    (
      targetScale-
      currentScale
    )*lerp;

  particleGroup.scale.setScalar(
    currentScale
  );

  shapePulse=Math.max(
    0,
    shapePulse-.025*delta
  );

  const positions=
    particleGeometry
      .attributes
      .position
      .array;

  const pinch=
    controllers[0].isPinching||
    controllers[1].isPinching;

  for(
    let i=0,j=0;
    i<PARTICLE_COUNT;
    i++,j+=3
  ){

    let tx=
      targetPositions[j]*
      currentScale;

    let ty=
      targetPositions[j+1]*
      currentScale;

    let tz=
      targetPositions[j+2]*
      currentScale;

    if(
      pinch&&
      (i&1)===0
    ){

      tx*=.012;
      ty*=.012;
      tz*=.012;
    }

    const speed=
      pinch&&(i&1)===0
      ?.55
      :.18+shapePulse*.08;

    positions[j]+=
      (tx-positions[j])*
      speed;

    positions[j+1]+=
      (ty-positions[j+1])*
      speed;

    positions[j+2]+=
      (tz-positions[j+2])*
      speed;
  }

  particleGeometry
    .attributes
    .position
    .needsUpdate=true;
}

/* =========================================================
   BUILDER PHYSICS
   ========================================================= */

function updateBuilder(delta){

  if(currentMode!=='BUILDER')
    return;

  const gravity=
    CONFIG.builderGravity*
    delta;

  for(const block of blocks){

    if(block.userData.isGrabbed)
      continue;

    const velocity=
      block.userData.velocity;

    /*
      Gravità sempre attiva.
      Dopo la piccolissima spinta
      l'oggetto cade naturalmente.
    */
    velocity.y-=gravity;

    block.position.addScaledVector(
      velocity,
      delta
    );

    const floorY=
      -6+
      block.userData.size*.5;

    if(block.position.y<floorY){

      block.position.y=floorY;

      velocity.y=0;

      /*
        Piccolo attrito sul terreno.
      */
      velocity.x*=.92;
      velocity.z*=.92;

      /*
        Elimina rapidamente anche
        la piccola spinta residua.
      */
      if(Math.abs(velocity.x)<.003)
        velocity.x=0;

      if(Math.abs(velocity.z)<.003)
        velocity.z=0;
    }
  }

  resolveCollisions();

  updateSelectionRing();
}

/* =========================================================
   COLLISIONI OTTIMIZZATE
   ========================================================= */

function resolveCollisions(){

  const cell=3.5;
  const grid=new Map();

  for(const block of blocks){

    if(block.userData.isGrabbed)
      continue;

    const x=
      Math.floor(
        block.position.x/cell
      );

    const z=
      Math.floor(
        block.position.z/cell
      );

    const key=
      x+','+z;

    let list=grid.get(key);

    if(!list){

      list=[];
      grid.set(key,list);
    }

    list.push(block);
  }

  for(const [key,list] of grid){

    const parts=key.split(',');

    const cx=+parts[0];
    const cz=+parts[1];

    for(let ox=-1;ox<=1;ox++){

      for(let oz=-1;oz<=1;oz++){

        const otherList=
          grid.get(
            (cx+ox)+','+(cz+oz)
          );

        if(!otherList)
          continue;

        for(const a of list){

          for(const b of otherList){

            if(a===b)
              continue;

            const dx=
              a.position.x-
              b.position.x;

            const dz=
              a.position.z-
              b.position.z;

            if(
              dx*dx+
              dz*dz>8.5
            )
              continue;

            const top=
              b.position.y+
              b.userData.size*.5+
              a.userData.size*.5;

            if(
              a.position.y<=top&&
              a.position.y>b.position.y
            ){

              a.position.y=top;

              a.userData.velocity.y=0;
            }
          }
        }
      }
    }
  }
}

/* =========================================================
   SELECTION RING
   ========================================================= */

function updateSelectionRing(){

  if(
    !selectedBlock||
    currentMode!=='BUILDER'
  ){

    dom.ring.style.display='none';

    return;
  }

  const v=
    selectedBlock.position.clone();

  v.project(camera);

  const x=
    (v.x*.5+.5)*
    innerWidth;

  const y=
    (-v.y*.5+.5)*
    innerHeight;

  dom.ring.style.display='block';

  dom.ring.style.left=
    (x-22)+'px';

  dom.ring.style.top=
    (y-22)+'px';
}

/* =========================================================
   MODE
   ========================================================= */

function switchMode(mode){

  if(currentMode===mode)
    return;

  currentMode=mode;

  const builder=
    mode==='BUILDER';

  dom.tabBuilder.classList.toggle(
    'active',
    builder
  );

  dom.tabParticles.classList.toggle(
    'active',
    !builder
  );

  dom.builder.classList.toggle(
    'hidden',
    !builder
  );

  dom.particles.classList.toggle(
    'hidden',
    builder
  );

  dom.panelTitle.textContent=
    builder
    ?'3D BUILDER MATRIX'
    :'PARTICLE MATRIX';

  dom.mode.textContent=mode;

  builderGroup.visible=builder;
  particleGroup.visible=!builder;

  controllers.forEach(c=>{

    c.rayLine.visible=
      builder&&c.active;

    c.trail.visible=
      !builder&&c.active;
  });

  if(!builder){

    selectedBlock=null;

    controllers.forEach(c=>{
      releaseBlock(c);
    });

    updateSelectionUI();
  }
}

/* =========================================================
   UI EVENTS
   ========================================================= */

function bindEvents(){

  dom.tabBuilder.addEventListener(
    'click',
    ()=>switchMode('BUILDER')
  );

  dom.tabParticles.addEventListener(
    'click',
    ()=>switchMode('PARTICLES')
  );

  document
    .querySelectorAll('.spawn-btn')
    .forEach(btn=>{

      btn.addEventListener(
        'click',
        ()=>{
          spawnShape(
            btn.dataset.shape
          );
        }
      );
    });

  dom.clear.addEventListener(
    'click',
    clearBlocks
  );

  dom.shapeSelect.addEventListener(
    'change',
    e=>{
      generateShape(
        e.target.value
      );
    }
  );

  dom.colorPicker.addEventListener(
    'input',
    e=>{
      particleMaterial?.color.set(
        e.target.value
      );
    }
  );

  dom.audio.addEventListener(
    'click',
    ()=>{

      sounds.enabled=
        !sounds.enabled;

      dom.audio.textContent=
        sounds.enabled
        ?'🔊 AUDIO: ATTIVO'
        :'🔇 AUDIO: DISATTIVATO';

      if(sounds.enabled)
        sounds.init();
    }
  );

  window.addEventListener(
    'resize',
    onResize,
    {passive:true}
  );
}

/* =========================================================
   CONNECTION HUD
   ========================================================= */

function setConnection(text,type){

  dom.connection.textContent=text;

  if(type==='green')
    dom.connection.style.color='#00ffcc';
  else if(type==='red')
    dom.connection.style.color='#ff5577';
  else
    dom.connection.style.color='#ffe66d';
}

/* =========================================================
   FPS
   ========================================================= */

function updateFPS(now){

  fpsFrames++;

  if(now-fpsTime>=500){

    const fps=Math.round(
      fpsFrames*1000/
      (now-fpsTime)
    );

    dom.fps.textContent=fps;

    fpsFrames=0;
    fpsTime=now;
  }
}

/* =========================================================
   MAIN LOOP
   ========================================================= */

function animate(){

  requestAnimationFrame(animate);

  const now=performance.now();

  const delta=Math.min(
    (now-lastFrame)/16.67,
    2
  );

  lastFrame=now;

  updateFPS(now);

  if(currentMode==='BUILDER'){

    updateBuilder(delta);

  }else{

    updateParticles(delta);
  }

  renderer.render(
    scene,
    camera
  );
}

/* =========================================================
   RESIZE
   ========================================================= */

function onResize(){

  if(!camera||!renderer)
    return;

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setPixelRatio(1);

  renderer.setSize(
    innerWidth,
    innerHeight,
    false
  );
}

/* =========================================================
   START
   ========================================================= */

window.addEventListener(
  'load',
  async()=>{

    initThree();

    bindEvents();

    switchMode(
      'PARTICLES'
    );

    setConnection(
      'CAM: INIT',
      'yellow'
    );

    try{

      await initHandTracking();

    }catch(e){

      console.error(
        'MediaPipe init error:',
        e
      );

      setConnection(
        'CAM: FAILED',
        'red'
      );
    }

    animate();
  }
);
</script>
