/* =========================================================
AUDIO
========================================================= */

class SciFiSoundSystem{

constructor(){

this.ctx=null;      
this.humOsc=null;      
this.humGain=null;      
  
this.enabled=true;      
this.initialized=false;

}

init(){

if(this.initialized)return;      
  
try{      
  
  const AudioCtx=      
    window.AudioContext||      
    window.webkitAudioContext;      
  
  if(!AudioCtx)return;      
  
  this.ctx=new AudioCtx();      
  
  this.humOsc=      
    this.ctx.createOscillator();      
  
  this.humGain=      
    this.ctx.createGain();      
  
  this.humOsc.type='sine';      
  
  this.humOsc.frequency.value=50;      
  
  this.humGain.gain.value=.008;      
  
  this.humOsc.connect(      
    this.humGain      
  );      
  
  this.humGain.connect(      
    this.ctx.destination      
  );      
  
  this.humOsc.start();      
  
  this.initialized=true;      
  
}catch(e){      
  
  console.warn(      
    'Audio non disponibile',      
    e      
  );      
}

}

pinch(){

if(!this.enabled)return;      
  
this.init();      
  
if(!this.initialized)return;      
  
const o=      
  this.ctx.createOscillator();      
  
const g=      
  this.ctx.createGain();      
  
const t=      
  this.ctx.currentTime;      
  
o.type='sine';      
  
o.frequency.setValueAtTime(      
  220,      
  t      
);      
  
o.frequency.exponentialRampToValueAtTime(      
  700,      
  t+.07      
);      
  
g.gain.setValueAtTime(      
  .1,      
  t      
);      
  
g.gain.exponentialRampToValueAtTime(      
  .001,      
  t+.07      
);      
  
o.connect(g);      
g.connect(this.ctx.destination);      
  
o.start(t);      
o.stop(t+.07);

}
}

/* =========================================================
GLOW TEXTURE
========================================================= */

function createGlowTexture(){

/*
TEXTURE 64x64
per maggiore nitidezza.
*/

const c=
document.createElement(
'canvas'
);

c.width=64;
c.height=64;

const ctx=
c.getContext('2d');

const g=
ctx.createRadialGradient(
32,32,1,
32,32,32
);

g.addColorStop(
0,
'rgba(255,255,255,1)'
);

g.addColorStop(
.18,
'rgba(255,255,255,.98)'
);

g.addColorStop(
.42,
'rgba(255,255,255,.65)'
);

g.addColorStop(
.7,
'rgba(255,255,255,.18)'
);

g.addColorStop(
1,
'rgba(255,255,255,0)'
);

ctx.fillStyle=g;

ctx.fillRect(
0,
0,
64,
64
);

const texture=
new THREE.CanvasTexture(c);

texture.generateMipmaps=false;

texture.minFilter=
THREE.LinearFilter;

texture.magFilter=
THREE.LinearFilter;

return texture;
}

function spawnShape(
type,
x,
y,
z
){

let geo;

const size=3;

switch(type){

case'sphere':      
  
  geo=      
    new THREE.SphereGeometry(      
      1.65,      
      12,      
      12      
    );      
  
  break;      
  
case'pyramid':      
  
  geo=      
    new THREE.ConeGeometry(      
      2.1,      
      3,      
      4      
    );      
  
  break;      
  
case'torus':      
  
  geo=      
    new THREE.TorusGeometry(      
      1.5,      
      .5,      
      8,      
      16      
    );      
  
  break;      
  
case'cylinder':      
  
  geo=      
    new THREE.CylinderGeometry(      
      1.5,      
      1.5,      
      3,      
      12      
    );      
  
  break;      
  
case'icosahedron':      
  
  geo=      
    new THREE.IcosahedronGeometry(      
      1.9      
    );      
  
  break;      
  
default:      
  
  geo=      
    new THREE.BoxGeometry(      
      size,      
      size,      
      size      
    );

}

const color=
Math.random()>.5
?0xffffff
:0x888888;

const mesh=
new THREE.Mesh(

geo,      
  
  new THREE.MeshStandardMaterial({      
  
    color,      
  
    roughness:.35,      
  
    metalness:.2      
  })      
);

mesh.position.set(

x??(Math.random()-.5)*8,      
  
y??6,      
  
z??(Math.random()-.5)*4

);

mesh.rotation.set(
0,
0,
0
);

mesh.userData={

originalColor:color,      
  
velocity:      
  new THREE.Vector3(),      
  
isGrabbed:false,      
  
size,      
  
type

};

builderGroup.add(mesh);

blocks.push(mesh);

if(
blocks.length>
CONFIG.maxBlocks
){

disposeBlock(      
  blocks.shift()      
);

}
}

function disposeBlock(block){

if(!block)return;

builderGroup.remove(
block
);

block.geometry?.dispose();

block.material?.dispose();

if(selectedBlock===block)
selectedBlock=null;
}

/* =========================================================
SNAP
========================================================= */

function snapBlock(block){

if(!block)return;

const s=
CONFIG.snapSize;

block.position.x=
Math.round(
block.position.x/s
)*s;

block.position.y=
Math.round(
block.position.y/s
)*s;

block.position.z=
Math.round(
block.position.z/s
)*s;
}

/* =========================================================
JARVIS CPU / 3D MOTHERBOARD
========================================================= */

function generateCPU(i){

/*
Struttura 3D composta da:

- PCB principale      
- strati interni      
- CPU centrale      
- socket      
- RAM      
- chip secondari      
- piste      
- connettori      
- anelli energetici      
  
NON è un'immagine piatta:      
la geometria occupa realmente X/Y/Z.

*/

const layer=i%10;

/* PCB */

if(i<900){

const x=      
  (Math.random()-.5)*18;      
  
const z=      
  (Math.random()-.5)*11;      
  
const edge=      
  Math.min(      
    Math.abs(x),      
    Math.abs(z)      
  );      
  
return{      
  
  x,      
  y:      
    (Math.random()-.5)*.22      
    +(edge<1?.08:0),      
  
  z      
};

}

/* TRACCE CIRCUITO */

if(i<1550){

const line=      
  i%8;      
  
const t=      
  Math.random()*2-1;      
  
let x=0;      
let z=0;      
  
if(line<2){      
  
  x=t*8;      
  z=(line===0?2.2:-2.2);      
  
}else if(line<4){      
  
  z=t*5;      
  x=(line===2?4.4:-4.4);      
  
}else{      
  
  const a=      
    Math.random()*Math.PI*2;      
  
  const r=      
    3+      
    Math.random()*5;      
  
  x=      
    Math.cos(a)*r;      
  
  z=      
    Math.sin(a)*r;      
}      
  
return{      
  
  x,      
  y:      
    .15+      
    Math.sin(t*8)*.08,      
  
  z      
};

}

/* CPU CENTRALE */

if(i<2300){

const x=      
  (Math.random()-.5)*4.5;      
  
const y=      
  (Math.random()-.5)*1.1;      
  
const z=      
  (Math.random()-.5)*4.5;      
  
const edge=      
  Math.max(      
    Math.abs(x),      
    Math.abs(z)      
  );      
  
if(      
  edge<1.9||      
  Math.random()<.35      
){      
  
  return{      
    x,      
    y:.65+y,      
    z      
  };      
}

}

/* CPU SOCKET */

if(i<2700){

const a=      
  Math.random()*Math.PI*2;      
  
const r=      
  2.5+      
  Math.random()*.5;      
  
return{      
  
  x:      
    Math.cos(a)*r,      
  
  y:      
    .35+      
    (Math.random()-.5)*.12,      
  
  z:      
    Math.sin(a)*r      
};

}

/* RAM */

if(i<3200){

const bank=      
  i%4;      
  
const x=      
  -7+      
  bank*2.1;      
  
return{      
  
  x:      
    x+      
    (Math.random()-.5)*.9,      
  
  y:      
    .45+      
    Math.random()*2.5,      
  
  z:      
    (Math.random()-.5)*1.4      
};

}

/* CHIP SECONDARI */

if(i<3600){

const chip=      
  i%8;      
  
const x=      
  (chip%4-1.5)*3.8;      
  
const z=      
  (Math.floor(chip/4)-.5)*6.2;      
  
return{      
  
  x:      
    x+      
    (Math.random()-.5)*1.4,      
  
  y:      
    .35+      
    Math.random()*1.4,      
  
  z:      
    z+      
    (Math.random()-.5)*1.5      
};

}

/* COMPONENTI VERTICALI */

if(i<3850){

const a=      
  Math.random()*Math.PI*2;      
  
const r=      
  4+      
  Math.random()*5;      
  
return{      
  
  x:      
    Math.cos(a)*r,      
  
  y:      
    .2+      
    Math.random()*3,      
  
  z:      
    Math.sin(a)*r      
};

}

/* PUNTI ENERGETICI */

const p=
randomShell(
8+
Math.random()*3

return{

/* =========================================================
PARTICLE SHAPES
========================================================= */

function generateShape(type){

const p=
targetPositions;

for(
let i=0;
i<PARTICLE_COUNT;
i++
){

const j=i*3;      
  
let x=0;      
let y=0;      
let z=0;      
  
/* =====================================================      
   FORME ORIGINALI      
   ===================================================== */      
  
if(      
  type==='jupiter'||      
  type==='saturn'      
){      
  
  const saturn=      
    type==='saturn';      
  
  const body=      
    saturn?.5:.75;      
  
  if(      
    i<      
    PARTICLE_COUNT*body      
  ){      
  
    const a=      
      Math.random()*Math.PI*2;      
  
    const b=      
      Math.acos(      
        Math.random()*2-1      
      );      
  
    const r=      
      saturn?5:7;      
  
    x=      
      r*      
      Math.sin(b)*      
      Math.cos(a);      
  
    y=      
      r*      
      Math.cos(b)*      
      (saturn?1:.85);      
  
    z=      
      r*      
      Math.sin(b)*      
      Math.sin(a);      
  
  }else{      
  
    const a=      
      Math.random()*Math.PI*2;      
  
    const r=      
      (saturn?7:9)+      
      Math.random()*      
      (saturn?6:4);      
  
    x=      
      Math.cos(a)*r;      
  
    z=      
      Math.sin(a)*r;      
  
    y=      
      (Math.random()-.5)*.2;      
  }      
  
}else if(type==='galaxy'){      
  
  const arm=i%4;      
  
  const r=      
    Math.pow(      
      Math.random(),      
      1.5      
    )*15;      
  
  const a=      
    r*.4+      
    arm*Math.PI/2;      
  
  x=      
    Math.cos(a)*r+      
    (Math.random()-.5)*.7;      
  
  z=      
    Math.sin(a)*r+      
    (Math.random()-.5)*.7;      
  
  y=      
    (Math.random()-.5)*      
    Math.max(      
      .2,      
      1.8-r*.1      
    );      
  
}else if(type==='DNA'){      
  
  const t=      
    i/PARTICLE_COUNT*      
    Math.PI*12;      
  
  const strand=      
    i%2?-1:1;      
  
  x=      
    Math.sin(t)*      
    4*      
    strand;      
  
  y=      
    i/PARTICLE_COUNT*      
    16-8;      
  
  z=      
    Math.cos(t)*      
    4*      
    strand;      
  
}else if(type==='hypercube'){      
  
  const s=6;      
  
  const t=      
    Math.random()*s-s/2;      
  
  const side=i%12;      
  
  if(side===0){      
  
    x=s/2;      
    y=t;      
    z=s/2;      
  
  }else if(side===1){      
  
    x=-s/2;      
    y=t;      
    z=s/2;      
  
  }else if(side===2){      
  
    x=t;      
    y=s/2;      
    z=s/2;      
  
  }else if(side===3){      
  
    x=t;      
    y=-s/2;      
    z=s/2;      
  
  }else if(side===4){      
  
    x=s/2;      
    y=t;      
    z=-s/2;      
  
  }else if(side===5){      
  
    x=-s/2;      
    y=t;      
    z=-s/2;      
  
  }else if(side===6){      
  
    x=t;      
    y=s/2;      
    z=-s/2;      
  
  }else if(side===7){      
  
    x=t;      
    y=-s/2;      
    z=-s/2;      
  
  }else if(side===8){      
  
    x=s/2;      
    y=s/2;      
    z=t;      
  
  }else if(side===9){      
  
    x=-s/2;      
    y=s/2;      
    z=t;      
  
  }else if(side===10){      
  
    x=s/2;      
    y=-s/2;      
    z=t;      
  
  }else{      
  
    x=-s/2;      
    y=-s/2;      
    z=t;      
  }      
  
}else if(type==='heart'){      
  
  const t=      
    Math.random()*Math.PI*2;      
  
  x=      
    16*      
    Math.pow(      
      Math.sin(t),      
      3      
    )*.55;      
  
  y=      
    (      
      13*Math.cos(t)      
      -5*Math.cos(2*t)      
      -2*Math.cos(3*t)      
      -Math.cos(4*t)      
    )*.55;      
  
  z=      
    (Math.random()-.5)*      
    3*      
    .55;      
  
}else if(type==='flower'){      
  
  const u=      
    Math.random()*Math.PI*2;      
  
  const v=      
    Math.random()*Math.PI;      
  
  const r=      
    9*

p[j]=x;      
p[j+1]=y;      
p[j+2]=z;

}

shapePulse=1;
}

/* =========================================================
HAND PREVIEW
========================================================= */

function drawPreview(hands){

const ctx=
previewCtx;

const w=
dom.preview.width;

const h=
dom.preview.height;

ctx.clearRect(
0,
0,
w,
h
);

ctx.fillStyle=
'rgba(5,10,14,.92)';

ctx.fillRect(
0,
0,
w,
h
);

if(!hands?.length){

ctx.fillStyle=      
  'rgba(255,255,255,.35)';      
  
ctx.font=      
  '9px "Share Tech Mono"';      
  
ctx.textAlign=      
  'center';      
  
ctx.fillText(      
  'SEARCHING HANDS...',      
  w/2,      
  h/2      
);      
  
return;

}

hands.forEach(
(landmarks,i)=>{

ctx.strokeStyle=      
    i===0      
    ?'#00ffcc'      
    :'#ff00aa';      
  
  ctx.lineWidth=1.5;      
  
  HAND_CONNECTIONS.forEach(      
    pair=>{      
  
      const a=      
        landmarks[pair[0]];      
  
      const b=      
        landmarks[pair[1]];      
  
      ctx.beginPath();      
  
      ctx.moveTo(      
        a.x*w,      
        a.y*h      
      );      
  
      ctx.lineTo(      
        b.x*w,      
        b.y*h      
      );      
  
      ctx.stroke();      
    }      
  );      
  
  landmarks.forEach(      
    (p,index)=>{      
  
      ctx.fillStyle=      
  
        (      
          index===4||      
          index===8      
        )      
  
        ?'#ffe66d'      
  
        :(i===0      
          ?'#00ffcc'      
          :'#ff00aa');      
  
      ctx.beginPath();      
  
      ctx.arc(      
  
        p.x*w,      
        p.y*h,      
  
        index===4||      
        index===8      
        ?3      
        :1.7,      
  
        0,      
        Math.PI*2      
      );      
  
      ctx.fill();      
    }      
  );      
}

);
}

/* =========================================================
MEDIA PIPE
========================================================= */

async function initHandTracking(){

setConnection(
'CAM: CONNECTING',
'yellow'
);

dom.mp.textContent=
'SEARCHING';

const hands=
new Hands({

locateFile:file=>      
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`      
});

hands.setOptions({

maxNumHands:2,      
  
modelComplexity:0,      
  
minDetectionConfidence:.45,      
  
minTrackingConfidence:.45

});

let processing=false;
let lastProcess=0;

const interval=
1000/CONFIG.handFPS;

hands.onResults(
results=>{

processing=false;      
  
  const landmarks=      
    results.multiHandLandmarks||[];      
  
  const handed=      
    results.multiHandedness||[];      
  
  drawPreview(      
    landmarks      
  );      
  
  dom.mp.textContent=      
    landmarks.length      
    ?'TRACKING'      
    :'SEARCHING';      
  
  const mapped={      
    Left:null,      
    Right:null      
  };      
  
  handed.forEach(      
    (item,i)=>{      
  
      if(      
        item?.label&&      
        landmarks[i]      
      ){      
  
        mapped[item.label]=      
          landmarks[i];      
      }      
    }      
  );      
  
  controllers.forEach(      
    ctrl=>{      
  
      const lm=      
        mapped[ctrl.side];      
  
      if(lm){      
  
        updateController(      
          ctrl,      
          lm      
        );      
  
      }else{      
  
        loseController(      
          ctrl      
        );      
      }      
    }      
  );      
  
  updateParticleTargets();      
}

);

const cameraUtils=
new Camera(

dom.video,      
  
  {      
  
    onFrame:async()=>{      
  
      if(processing)return;      
  
      const now=      
        performance.now();      
  
      if(      
        now-lastProcess<      
        interval      
      )return;      
  
      if(      
        dom.video.readyState<2      
      )return;      
  
      lastProcess=now;      
  
      processing=true;      
  
      try{      
  
        await hands.send({      
          image:dom.video      
        });      
  
      }catch(e){      
  
        processing=false;      
  
        setConnection(      
          'CAM: ERROR',      
          'red'      
        );      
  
        dom.mp.textContent=      
          'ERROR';      
      }      
    },      
  
    width:      
      CONFIG.cameraWidth,      
  
    height:      
      CONFIG.cameraHeight      
  }      
);

try{

cameraUtils.start();      
  
setConnection(      
  'CAM: STARTING',      
  'yellow'      
);

}catch(e){

setConnection(      
  'CAM: FAILED',      
  'red'      
);      
  
console.warn(      
  'Camera error',      
  e      
);

}

dom.video.addEventListener(
'loadeddata',
()=>{

setConnection(      
    'CAM: ONLINE',      
    'green'      
  );      
  
  dom.previewStatus.textContent=      
    'ONLINE';      
}

);

dom.video.addEventListener(
'error',
()=>{

setConnection(      
    'CAM: ERROR',      
    'red'      
  );      
  
  dom.previewStatus.textContent=      
    'ERROR';      
}

);
}

/* =========================================================
HAND UPDATE
========================================================= */

function updateController(
ctrl,
landmarks
){

const now=
performance.now();

ctrl.active=true;

ctrl.lastSeen=now;

const thumb=
landmarks[4];

const index=
landmarks[8];

const centerX=
(thumb.x+index.x)*.5;

const centerY=
(thumb.y+index.y)*.5;

const centerZ=
(thumb.z+index.z)*.5;

const ndcX=
(1-centerX)*2-1;

const ndcY=
-(centerY*2-1);

const v=
new THREE.Vector3(
ndcX,
ndcY,
.5
);

v.unproject(
camera
);

const dir=
v.sub(
camera.position
).normalize();

const targetZ=
-centerZ*20;

if(
Math.abs(dir.z)>.0001
){

const dist=      
  (      
    targetZ-      
    camera.position.z      
  )/dir.z;      
  
ctrl.target.copy(      
  camera.position      
).add(      
  dir.multiplyScalar(      
    dist      
  )      
);      
  
ctrl.lastPos.copy(      
  ctrl.pos      
);      
  
ctrl.pos.lerp(      
  ctrl.target,      
  CONFIG.handSmooth      
);      
  
ctrl.velocity.copy(      
  ctrl.pos      
).sub(      
  ctrl.lastPos      
);      
  
ctrl.mesh.position.copy(      
  ctrl.pos      
);      
  
ctrl.pointLight.position.copy(      
  ctrl.pos      
);      
  
ctrl.mesh.visible=true;      
  
ctrl.pointLight.visible=true;      
  
updateRay(      
  ctrl,      
  landmarks[0],      
  targetZ      
);      
  
updateTrail(      
  ctrl      
);

}

updatePinch(
ctrl,
thumb,
index
);

updateHandHUD(
ctrl
);

updateBuilderHand(
ctrl
);
}

/* =========================================================
PINCH
========================================================= */

function updatePinch(
ctrl,
thumb,
index
){

const distance=
Math.hypot(
thumb.x-index.x,
thumb.y-index.y
);

ctrl.wasPinching=
ctrl.isPinching;

if(ctrl.isPinching){

if(      
  distance>      
  CONFIG.pinchOff      
){      
  
  ctrl.isPinching=false;      
}

}else{

if(      
  distance<      
  CONFIG.pinchOn      
){      
  
  ctrl.isPinching=true;      
}

}

if(
!ctrl.wasPinching&&
ctrl.isPinching
){

sounds.pinch();

}
}

/* =========================================================
RAY
========================================================= */

function updateRay(
ctrl,
wrist,
targetZ
){

const x=
(1-wrist.x)*2-1;

const y=
-(wrist.y*2-1);

const v=
new THREE.Vector3(
x,
y,
.5
);

v.unproject(
camera
);

const dir=
v.sub(
camera.position
).normalize();

if(
Math.abs(dir.z)<.0001
)return;

const dist=
(
targetZ-
camera.position.z
)/dir.z;

const p=
camera.position.clone()
.add(
dir.multiplyScalar(
dist
)
);

const attr=
ctrl.rayLine
.geometry
.attributes
.position;

attr.setXYZ(
0,
p.x,
p.y,
p.z
);

attr.setXYZ(
1,
ctrl.pos.x,
ctrl.pos.y,
ctrl.pos.z
);

attr.needsUpdate=true;

ctrl.rayLine.visible=
currentMode==='BUILDER';
}

TRAIL
========================================================= */

function updateTrail(ctrl){

currentMode!=='PARTICLES'
){

ctrl.trail.visible=false;      
  
return;

}

ctrl.trailPoints.unshift(
ctrl.pos.clone()
);

ctrl.trailPoints.length=12;

const attr=
ctrl.trailGeometry
.attributes
.position;

for(
let i=0;
i<12;
i++
){

const p=      
  ctrl.trailPoints[i]||

/* =========================================================
PARTICLE REACTION
========================================================= */

function updateParticleTargets(){

if(
currentMode!=='PARTICLES'
)return;

const left=
controllers[0];

const right=
controllers[1];

/*
=======================================================
DUE MANI
=======================================================

IMPORTANTISSIMO:      
  
La distanza tra le mani serve SOLO per lo ZOOM.      
  
NON viene più usata per la rotazione.      
  
La rotazione segue il CENTRO delle due mani.

*/

if(
left.active&&
right.active
){

const a=      
  left.pos;      
  
const b=      
  right.pos;      
  
/*      
  CENTRO REALE DELLE DUE MANI      
*/      
  
const center=      
  new THREE.Vector3()      
  .addVectors(a,b)      
  .multiplyScalar(.5);      
  
/*      
  MOVIMENTO X -> ROTAZIONE Y      
  MOVIMENTO Y -> ROTAZIONE X      
  
  La distanza non entra qui.      
*/      
  
targetRotY=      
  THREE.MathUtils.clamp(      
  
    center.x*      
    CONFIG.axisSensitivity,      
  
    -2.5,      
    2.5      
  );      
  
targetRotX=      
  THREE.MathUtils.clamp(      
  
    -center.y*      
    CONFIG.axisSensitivity,      
  
    -2.5,      
    2.5      
  );      
  
/*      
  SOLO DISTANZA -> ZOOM      
*/      
  
const distance=      
  a.distanceTo(b);      
  
targetScale=      
  THREE.MathUtils.clamp(      
  
    .65+      
    distance*.075,      
  
    .65,      
    2.4      
  );      
  
return;

}

/*
UNA SOLA MANO
*/

const activeHand=
left.active
?left
:right.active
?right
:null;

if(!activeHand)return;

const p=
activeHand.pos;

targetRotY=
THREE.MathUtils.clamp(

p.x*      
  CONFIG.axisSensitivity,      
  
  -2.5,      
  2.5      
);

targetRotX=
THREE.MathUtils.clamp(

-p.y*      
  CONFIG.axisSensitivity,      
  
  -2.5,      
  2.5      
);

targetScale=
THREE.MathUtils.clamp(

1+      
  Math.abs(p.x)*.025,      
  
  .75,      
  1.5      
);

}

/* =========================================================
BUILDER HAND CONTROL
========================================================= */

function updateBuilderHand(ctrl){

if(
currentMode!=='BUILDER'
)return;

if(ctrl.isPinching){

if(!ctrl.grabbedBlock){      
  
  selectNearestBlock(      
    ctrl      
  );      
}      
  
if(ctrl.grabbedBlock){      
  
  const block=      
    ctrl.grabbedBlock;      
  
  const builderGain=      
    1+      
    CONFIG.axisSensitivity;      
  
  const dx=      
    (      
      ctrl.pos.x-      
      ctrl.grabStartHand.x      
    )*      
    builderGain;      
  
  const dy=      
    (      
      ctrl.pos.y-      
      ctrl.grabStartHand.y      
    )*      
    builderGain;      
  
  const dz=      
    (      
      ctrl.pos.z-      
      ctrl.grabStartHand.z      
    )*      
    builderGain;      
  
  block.position.set(      
  
    ctrl.grabStartBlock.x+      
    dx,      
  
    ctrl.grabStartBlock.y+      
    dy,      
  
    ctrl.grabStartBlock.z+      
    dz      
  );      
  
  block.userData.velocity.set(      
    0,      
    0,      
    0      
  );      
  
  selectedBlock=      
    block;      
  
  highlightBlock(      
    block,      
    true      
  );      
  
  updateSelectionUI();      
}

}else if(
ctrl.wasPinching
){

releaseBlock(      
  ctrl      
);

}
}

/* =========================================================
SELECT NEAREST
========================================================= */

function selectNearestBlock(ctrl){

let nearest=null;

let best=4;

for(
const block of blocks
){

const d=      
  ctrl.pos.distanceTo(      
    block.position      
  );      
  
if(d<best){      
  
  best=d;      
  
  nearest=block;      
}

}

if(!nearest)return;

ctrl.grabbedBlock=
nearest;

ctrl.grabOffset.copy(
ctrl.pos
).sub(
nearest.position
);

ctrl.grabStartHand.copy(
ctrl.pos
);

ctrl.grabStartBlock.copy(
nearest.position
);

nearest.userData.isGrabbed=
true;

nearest.userData.velocity.set(
0,
0,
0
);

selectedBlock=
nearest;

highlightBlock(
nearest,
true
);

updateSelectionUI();
}

RELEASE

function releaseBlock(ctrl){

ctrl.grabbedBlock;

if(!block)return;

block.userData.isGrabbed=
false;

block.userData.velocity.set(
0,
0,
0
);

snapBlock(
block

);

/* =========================================================
PARTICLE ANIMATION
========================================================= */

function updateParticles(delta){

if(
currentMode!=='PARTICLES'
)return;

const lerp=
Math.min(
CONFIG.particleSmooth*
delta,
.45
);

/*
ROTAZIONE SEGUE SOLO
targetRotX / targetRotY.

Lo zoom non modifica mai questi valori.

*/

particleGroup.rotation.x+=
(
targetRotX-
particleGroup.rotation.x
)*
lerp;

particleGroup.rotation.y+=
(
targetRotY+.002-
particleGroup.rotation.y
)*
lerp;

particleGroup.rotation.z+=
(
targetRotZ-
particleGroup.rotation.z
)*
lerp;

currentScale+=
(
targetScale-
currentScale
)*
lerp;

particleGroup.scale.setScalar(
currentScale
);

shapePulse=
Math.max(
0,
shapePulse-
.025*delta
);

const positions=
particleGeometry
.attributes
.position
.array;

const pinch=
controllers[0].isPinching||
controllers[1].isPinching;

for(
let i=0,j=0;
i<PARTICLE_COUNT;
i++,j+=3
){

let tx=      
  targetPositions[j]*      
  currentScale;      
  
let ty=      
  targetPositions[j+1]*      
  currentScale;      
  
let tz=      
  targetPositions[j+2]*      
  currentScale;      
  
if(      
  pinch&&      
  (i&1)===0      
){      
  
  tx*=.012;      
  ty*=.012;      
  tz*=.012;      
}      
  
const speed=      
  pinch&&(i&1)===0      
  ?.55      
  :.18+      
  shapePulse*.08;      
  
positions[j]+=      
  (      
    tx-      
    positions[j]      
  )*      
  speed;      
  
positions[j+1]+=      
  (      
    ty-      
    positions[j+1]      
  )*      
  speed;      
  
positions[j+2]+=      
  (      
    tz-      
    positions[j+2]      
  )*      
  speed;

}

particleGeometry
.attributes
.position
.needsUpdate=true;
}

/* =========================================================
BUILDER PHYSICS
========================================================= */

function updateBuilder(delta){

if(
currentMode!=='BUILDER'
)return;

const gravity=
CONFIG.builderGravity*
delta;

for(
const block of blocks
){

if(      
  block.userData.isGrabbed      
)continue;      
  
const velocity=      
  block.userData.velocity;      
  
velocity.y-=gravity;      
  
velocity.x=0;      
velocity.z=0;      
  
block.position.addScaledVector(      
  velocity,      
  delta      
);      
  
const floorY=      
  -6+      
  block.userData.size*.5;      
  
if(      
  block.position.y<      
  floorY      
){      
  
  block.position.y=      
    floorY;      
  
  velocity.y=0;      
  velocity.x=0;      
  velocity.z=0;      
}

}

resolveCollisions();

updateSelectionRing();
}

/* =========================================================
COLLISIONI
========================================================= */

function resolveCollisions(){

const cell=3.5;

const grid=
new Map();

for(
const block of blocks
){

if(      
  block.userData.isGrabbed      
)continue;      
  
const x=      
  Math.floor(      
    block.position.x/cell      
  );      
  
const z=      
  Math.floor(      
    block.position.z/cell      
  );      
  
const key=      
  x+','+z;      
  
let list=      
  grid.get(key);      
  
if(!list){      
  
  list=[];      
  
  grid.set(      
    key,      
    list      
  );      
}      
  
list.push(      
  block      
);

}

for(
const [key,list]
of grid
){

const parts=      
  key.split(',');      
  
const cx=+parts[0];      
const cz=+parts[1];      
  
for(      
  let ox=-1;      
  ox<=1;      
  ox++      
){      
  
  for(      
    let oz=-1;      
    oz<=1;      
    oz++      
  ){      
  
    const otherList=      
      grid.get(      
        (cx+ox)+','+      
        (cz+oz)      
      );      
  
    if(!otherList)      
      continue;      
  
    for(      
      const a of list      
    ){      
  
      for(      
        const b of otherList      
      ){      
  
        if(a===b)      
          continue;      
  
        const dx=      
          a.position.x-      
          b.position.x;      
  
        const dz=      
          a.position.z-      
          b.position.z;      
  
        if(      
          dx*dx+      
          dz*dz>      
          8.5      
        )continue;      
  
        const top=      
          b.position.y+      
          b.userData.size*.5+      
          a.userData.size*.5;      
  
        if(      
          a.position.y<=top&&      
          a.position.y>b.position.y      
        ){      
  
          a.position.y=      
            top;      
  
          a.userData.velocity.set(      
            0,      
            0,      
            0      
          );      
  
          b.userData.velocity.set(      
            0,      
            0,      
            0      
          );      
        }      
      }      
    }      
  }      
}

}
}

)return;

currentMode=mode;

const builder=
mode==='BUILDER';

'active',
builder
);

'active',
!builder
);

'hidden',
!builder
);

dom.particles.classList.toggle(
'hidden',
builder
);

dom.panelTitle.textContent=
builder
?'3D BUILDER MATRIX'
:'PARTICLE MATRIX';

dom.mode.textContent=
mode;

builder;

!builder;

c=>{

    builder&&c.active;

    !builder&&c.active;

);

controllers.forEach(      
  c=>{      
    releaseBlock(c);      
  }      
);      
  
updateSelectionUI();

}
}

    );      
  }      
);

dom.clear.addEventListener(
'click',
clearBlocks
);

dom.shapeSelect.addEventListener(
'change',
e=>{

generateShape(      
    e.target.value      
  );      
}

);

dom.colorPicker.addEventListener(
'input',
e=>{

if(      
    particleMaterial      
  ){      
  
    particleMaterial.color.set(      
      e.target.value      
    );      
  }      
}

);

dom.audio.addEventListener(
'click',
()=>{

sounds.enabled=      
    !sounds.enabled;      
  
  dom.audio.textContent=      
    sounds.enabled      
    ?'🔊 AUDIO: ATTIVO'      
    :'🔇 AUDIO: DISATTIVATO';      
  
  if(      
    sounds.enabled      
  ){      
  
    sounds.init();      
  }      
}

);

window.addEventListener(
'resize',
onResize,
{passive:true}
);
}

/* =========================================================
CONNECTION HUD
========================================================= */

function setConnection(
text,
type
){

dom.connection.textContent=
text;

if(type==='green'){

dom.connection.style.color=      
  '#00ffcc';

}else if(type==='red'){

dom.connection.style.color=      
  '#ff5577';

}else{

dom.connection.style.color=      
  '#ffe66d';

}
}

/* =========================================================
FPS
========================================================= */

function updateFPS(now){

fpsFrames++;

if(
now-fpsTime>=500
){

const fps=      
  Math.round(      
  
    fpsFrames*      
    1000/      
    (now-fpsTime)      
  );      
  
dom.fps.textContent=      
  fps;      
  
fpsFrames=0;      
  
fpsTime=now;

}
}

/* =========================================================
MAIN LOOP
========================================================= */

function animate(){

requestAnimationFrame(
animate
);

const now=
performance.now();

const delta=
Math.min(
(now-lastFrame)/
16.67,
2
);

lastFrame=now;

updateFPS(
now
);

if(
currentMode==='BUILDER'
){

updateBuilder(      
  delta      
);

}else{

updateParticles(      
  delta      
);

}

renderer.render(
scene,
camera
);
}

/* =========================================================
RESIZE
========================================================= */

function onResize(){

if(
!camera||
!renderer
)return;

camera.aspect=
innerWidth/
innerHeight;

camera.updateProjectionMatrix();

/*
SEMPRE 200%
*/

renderer.setPixelRatio(
CONFIG.renderScale
);

renderer.setSize(
innerWidth,
innerHeight,
false
);
}

/* =========================================================
START
========================================================= */

window.addEventListener(
'load',
async()=>{

initThree();      
  
bindEvents();      
  
/*      
  Partiamo direttamente      
  dalla modalità particelle.      
*/      
  
currentMode='BUILDER';      
  
switchMode(      
  'PARTICLES'      
);      
  
setConnection(      
  'CAM: INIT',      
  'yellow'      
);      
  
try{      
  
  await initHandTracking();      
  
}catch(e){      
  
  console.error(      
    'MediaPipe init error:',      
    e      
  );      
  
  setConnection(      
    'CAM: FAILED',      
    'red'      
  );      
}      
  
animate();

}
);
</script>    </body>
