<style>
:root {
  --white: #ffffff;
  --silver: #bcbcbc;
  --gray: #777777;
  --dark: #0b0b0b;
  --glass: rgba(18,18,18,.58);
  --glass-light: rgba(255,255,255,.07);
  --border: rgba(255,255,255,.16);
  --border-bright: rgba(255,255,255,.38);
  --shadow: rgba(0,0,0,.72);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: var(--white);
  font-family: "Share Tech Mono", monospace;
}

body {
  position: fixed;
  inset: 0;
}

/* =========================================================
   CANVAS
========================================================= */

#canvas-container {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;
}

#canvas-container canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#video-input {
  display: none;
}

/* =========================================================
   BACKGROUND HUD
========================================================= */

.hud-grid {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: .16;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 70px 70px;
  mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
}

.scanline {
  position: fixed;
  left: 0;
  right: 0;
  height: 1px;
  top: 0;
  z-index: 3;
  pointer-events: none;
  background: rgba(255,255,255,.06);
  animation: scan 7s linear infinite;
}

@keyframes scan {
  from { transform: translateY(-5vh); }
  to { transform: translateY(105vh); }
}

/* =========================================================
   HEADER
========================================================= */

.stark-header {
  position: fixed;
  top: 16px;
  left: 18px;
  right: 18px;
  height: 58px;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 18px;

  background: rgba(15,15,15,.52);
  backdrop-filter: blur(30px) saturate(120%);
  -webkit-backdrop-filter: blur(30px) saturate(120%);

  border: 1px solid var(--border);
  border-radius: 20px;

  box-shadow:
    0 18px 45px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.14);
}

.stark-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 50%;
  position: relative;
  box-shadow: 0 0 20px rgba(255,255,255,.12);
}

.brand-mark::before,
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(255,255,255,.6);
  border-radius: 50%;
}

.brand-mark::after {
  inset: 12px;
  background: white;
  border: none;
  box-shadow: 0 0 12px white;
}

.stark-title {
  font-family: Orbitron, sans-serif;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 2px;
}

.stark-subtitle {
  color: #777;
  font-size: 8px;
  letter-spacing: 1.5px;
  margin-top: 3px;
}

.system-status {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 9px;
  color: #aaa;
  letter-spacing: 1px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 12px rgba(255,255,255,.8);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%,100% { opacity: .35; }
  50% { opacity: 1; }
}

/* =========================================================
   LEFT CONTROL PANEL
========================================================= */

.ui-overlay {

}

.ui-overlay::-webkit-scrollbar {

}

.panel-header {

label {

select,

/* =========================================================

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

  particles: 6000,

  /*
    Non impostiamo un limite FPS artificiale.
    requestAnimationFrame usa il refresh rate dello schermo.
  */

  hand: {
    width: 480,
    height: 360,

    /*
      Sensibilità aumentata rispetto alla versione precedente.
    */
    sensitivity: 1.52,

    pinchThreshold: 0.085,

    smoothing: 0.42
  },

  particle: {
    lerp: 0.28,
    pinchLerp: 0.65,
    maxPixelRatio: 1.35
  },

  builder: {
    gravity: -0.045
  }

};


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentMode = "PARTICLES";

let scene;
let camera;
let renderer;

let builderGroup;
let particleGroup;

let particleGeometry;
let particleMaterial;
let particleSystem;

let previewCanvas;
let previewCtx;

let lastFrameTime = performance.now();
let fpsFrames = 0;
let fpsLastUpdate = performance.now();
let currentFPS = 0;

let lastHandUpdate = performance.now();

const targetPositions =
  new Float32Array(CONFIG.particles * 3);

const currentPositions =
  new Float32Array(CONFIG.particles * 3);

let targetScale = 1;
let handExpansionScale = 1;

let targetRotX = 0;
let targetRotY = 0;
let targetRotZ = 0;

const blocks = [];


/* =========================================================
   HAND CONTROLLERS
========================================================= */

const controllers = [

  createController(1),

  createController(2)

];


function createController(id) {

  return {

    id,

    mesh: null,

    pointLight: null,

    rayLine: null,

    grabbedBlock: null,

    grabOffset: new THREE.Vector3(),

    pos: new THREE.Vector3(),

    lastPos: new THREE.Vector3(),

    velocity: new THREE.Vector3(),

    isPinching: false,

    active: false,

    statusEl: null,

    grabEl: null

  };

}


/* =========================================================
   HAND CONNECTIONS
========================================================= */

const HAND_CONNECTIONS = [

  [0,1],[1,2],[2,3],[3,4],

  [0,5],[5,6],[6,7],[7,8],

  [5,9],[9,10],[10,11],[11,12],

  [9,13],[13,14],[14,15],[15,16],

  [13,17],[17,18],[18,19],[19,20],

  [0,17]

];


/* =========================================================
   AUDIO
========================================================= */

class SciFiSoundSystem {

  constructor() {

    this.ctx = null;

    this.humOsc = null;

    this.humGain = null;

    this.enabled = true;

    this.initialized = false;

  }


  init() {

    if (this.initialized) {

      if (this.ctx &&
          this.ctx.state === "suspended") {

        this.ctx.resume();

      }

      return;

    }

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioCtx) return;

    this.ctx = new AudioCtx();

    this.humOsc =
      this.ctx.createOscillator();

    this.humGain =
      this.ctx.createGain();

    this.humOsc.type = "sine";

    this.humOsc.frequency.value = 50;

    this.humGain.gain.value = 0.008;

    this.humOsc.connect(this.humGain);

    this.humGain.connect(this.ctx.destination);

    this.humOsc.start();

    this.initialized = true;

  }


  playPinch() {

    if (!this.enabled ||
        !this.initialized ||
        !this.ctx) return;

    const osc =
      this.ctx.createOscillator();

    const gain =
      this.ctx.createGain();

    const now =
      this.ctx.currentTime;

    osc.type = "sine";

    osc.frequency.setValueAtTime(
      240,
      now
    );

    osc.frequency.exponentialRampToValueAtTime(
      900,
      now + 0.07
    );

    gain.gain.setValueAtTime(
      0.10,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.07
    );

    osc.connect(gain);

    gain.connect(this.ctx.destination);

    osc.start(now);

    osc.stop(now + 0.07);

  }

}


const sounds =
  new SciFiSoundSystem();


/* =========================================================
   THREE.JS INITIALIZATION
========================================================= */

function initThree() {

  const container =
    document.getElementById(
      "canvas-container"
    );


  scene =
    new THREE.Scene();


  scene.background =
    new THREE.Color(0x000000);


  camera =
    new THREE.PerspectiveCamera(

      55,

      window.innerWidth /
      window.innerHeight,

      0.1,

      1000

    );


  camera.position.set(
    0,
    3.5,
    28
  );


  camera.lookAt(
    0,
    0,
    0
  );


  renderer =
    new THREE.WebGLRenderer({

      antialias: false,

      powerPreference:
        "high-performance",

      alpha: false

    });


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio || 1,
      CONFIG.particle.maxPixelRatio
    )
  );


  renderer.setSize(
    window.innerWidth,
    window.innerHeight,
    false
  );


  renderer.outputEncoding =
    THREE.sRGBEncoding;


  container.appendChild(
    renderer.domElement
  );


  /* =======================================================
     BUILDER
  ======================================================= */

  builderGroup =
    new THREE.Group();

  builderGroup.visible = false;

  scene.add(builderGroup);


  const ambient =
    new THREE.AmbientLight(
      0xffffff,
      0.85
    );

  scene.add(ambient);


  const directional =
    new THREE.DirectionalLight(
      0xffffff,
      1
    );

  directional.position.set(
    10,
    20,
    15
  );

  scene.add(directional);


  const floorGeo =
    new THREE.PlaneGeometry(
      70,
      70
    );


  const floorMat =
    new THREE.MeshStandardMaterial({

      color: 0x101010,

      roughness: 0.85,

      metalness: 0.15

    });


  const floor =
    new THREE.Mesh(
      floorGeo,
      floorMat
    );


  floor.rotation.x =
    -Math.PI / 2;

  floor.position.y =
    -6;

  builderGroup.add(floor);


  const grid =
    new THREE.GridHelper(
      70,
      35,
      0xffffff,
      0x333333
    );


  grid.position.y =
    -5.98;

  builderGroup.add(grid);


  /* =======================================================
     HAND CURSORS
  ======================================================= */

  controllers.forEach(
    (ctrl, index) => {

      const dotGeo =
        new THREE.SphereGeometry(
          0.20,
          8,
          8
        );


      const dotMat =
        new THREE.MeshBasicMaterial({
          color: 0xffffff
        });


      ctrl.mesh =
        new THREE.Mesh(
          dotGeo,
          dotMat
        );


      ctrl.mesh.visible =
        false;


      builderGroup.add(
        ctrl.mesh
      );


      ctrl.pointLight =
        new THREE.PointLight(
          0xffffff,
          0.7,
          9
        );


      builderGroup.add(
        ctrl.pointLight
      );


      const lineGeo =
        new THREE.BufferGeometry()
          .setFromPoints([

            new THREE.Vector3(),
            new THREE.Vector3()

          ]);


      const lineMat =
        new THREE.LineBasicMaterial({

          color: 0xffffff,

          transparent: true,

          opacity: 0.32

        });


      ctrl.rayLine =
        new THREE.Line(
          lineGeo,
          lineMat
        );


      ctrl.rayLine.visible =
        false;


      builderGroup.add(
        ctrl.rayLine
      );


      ctrl.statusEl =
        document.getElementById(
          `h${index + 1}-status`
        );


      ctrl.grabEl =
        document.getElementById(
          `h${index + 1}-grab`
        );

    }
  );


  /* =======================================================
     PARTICLES
  ======================================================= */

  particleGroup =
    new THREE.Group();


  scene.add(
    particleGroup
  );


  particleGeometry =
    new THREE.BufferGeometry();


  for (
    let i = 0;
    i < CONFIG.particles * 3;
    i++
  ) {

    const value =
      (Math.random() - 0.5) * 40;

    currentPositions[i] =
      value;

    targetPositions[i] =
      value;

  }


  particleGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(
      currentPositions,
      3
    )

  );


  /* =======================================================
     PARTICLE COLORS
  ======================================================= */

  const colors =
    new Float32Array(
      CONFIG.particles * 3
    );


  for (
    let i = 0;
    i < CONFIG.particles;
    i++
  ) {

    const idx =
      i * 3;

    const random =
      Math.random();

    let value;

    if (random < 0.68)
      value = 1;

    else if (random < 0.90)
      value = 0.65;

    else
      value = 0.32;


    colors[idx] =
      value;

    colors[idx + 1] =
      value;

    colors[idx + 2] =
      value;

  }


  particleGeometry.setAttribute(

    "color",

    new THREE.BufferAttribute(
      colors,
      3
    )

  );


  /* =======================================================
     PARTICLE TEXTURE
  ======================================================= */

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width = 16;
  canvas.height = 16;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.fillStyle =
    "#ffffff";


  ctx.beginPath();


  ctx.arc(
    8,
    8,
    7,
    0,
    Math.PI * 2
  );


  ctx.fill();


  const texture =
    new THREE.CanvasTexture(
      canvas
    );


  texture.generateMipmaps =
    false;


  particleMaterial =
    new THREE.PointsMaterial({

      size: 0.22,

      vertexColors: true,

      map: texture,

      transparent: true,

      opacity: 0.92,

      blending:
        THREE.AdditiveBlending,

      depthWrite: false

    });


  particleSystem =
    new THREE.Points(
      particleGeometry,
      particleMaterial
    );


  particleGroup.add(
    particleSystem
  );


  generateShape(
    "jupiter"
  );


  previewCanvas =
    document.getElementById(
      "hand-preview-canvas"
    );


  previewCtx =
    previewCanvas.getContext(
      "2d",
      {
        alpha: false
      }
    );


  window.addEventListener(
    "resize",
    onWindowResize,
    {
      passive: true
    }
  );

}


/* =========================================================
   BUILDER SHAPES
========================================================= */

function spawnShape(
  type,
  x,
  y,
  z
) {

  let geometry;

  const size = 2.8;


  switch (type) {

    case "sphere":

      geometry =
        new THREE.SphereGeometry(
          size / 1.7,
          16,
          16
        );

      break;


    case "pyramid":

      geometry =
        new THREE.ConeGeometry(
          size / 1.4,
          size,
          4
        );

      break;


    case "cone":

      geometry =
        new THREE.ConeGeometry(
          size / 1.7,
          size,
          20
        );

      break;


    case "cylinder":

      geometry =
        new THREE.CylinderGeometry(
          size / 2,
          size / 2,
          size,
          16
        );

      break;


    case "torus":

      geometry =
        new THREE.TorusGeometry(
          size / 2,
          size / 6,
          12,
          24
        );

      break;


    case "torusknot":

      geometry =
        new THREE.TorusKnotGeometry(
          1.25,
          .34,
          48,
          8
        );

      break;


    case "icosahedron":

      geometry =
        new THREE.IcosahedronGeometry(
          size / 1.6
        );

      break;


    case "octahedron":

      geometry =
        new THREE.OctahedronGeometry(
          size / 1.7
        );

      break;


    case "dodecahedron":

      geometry =
        new THREE.DodecahedronGeometry(
          size / 1.65
        );

      break;


    case "tetrahedron":

      geometry =
        new THREE.TetrahedronGeometry(
          size / 1.5
        );

      break;


    case "ring":

      geometry =
        new THREE.RingGeometry(
          1,
          1.8,
          32
        );

      break;


    default:

      geometry =
        new THREE.BoxGeometry(
          size,
          size,
          size
        );

  }


  const material =
    new THREE.MeshStandardMaterial({

      color:
        Math.random() > .5
          ? 0xffffff
          : 0x888888,

      roughness: .28,

      metalness: .35

    });


  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );


  mesh.position.set(

    x !== undefined
      ? x
      : (Math.random() - .5) * 9,

    y !== undefined
      ? y
      : 6,

    z !== undefined
      ? z
      : (Math.random() - .5) * 5

  );


  mesh.userData = {

    originalColor:
      material.color.getHex(),

    velocity:
      new THREE.Vector3(),

    isGrabbed:
      false,

    size

  };


  builderGroup.add(
    mesh
  );


  blocks.push(
    mesh
  );

}


function clearBlocks() {

  for (
    const block of blocks
  ) {

    builderGroup.remove(
      block
    );

    if (block.geometry)
      block.geometry.dispose();

    if (block.material)
      block.material.dispose();

  }


  blocks.length = 0;


  controllers.forEach(
    ctrl => {

      ctrl.grabbedBlock =
        null;

    }
  );

}


function setBlockHighlight(
  block,
  grabbed
) {

  if (!block) return;


  block.material.color.setHex(

    grabbed
      ? 0xffffff
      : block.userData.originalColor

  );

}


/* =========================================================
   MODE SWITCH
========================================================= */

function switchMode(
  mode
) {

  currentMode =
    mode;


  const builder =
    mode === "BUILDER";


  document
    .getElementById(
      "tab-builder"
    )
    .classList.toggle(
      "active",
      builder
    );


  document
    .getElementById(
      "tab-particles"
    )
    .classList.toggle(
      "active",
      !builder
    );


  document
    .getElementById(
      "controls-builder"
    )
    .style.display =
      builder
        ? "block"
        : "none";


  document
    .getElementById(
      "controls-particles"
    )
    .style.display =
      builder
        ? "none"
        : "block";


  document
    .getElementById(
      "panel-title-text"
    )
    .textContent =
      builder
        ? "3D BUILDER MATRIX"
        : "PARTICLE MATRIX";


  builderGroup.visible =
    builder;


  particleGroup.visible =
    !builder;

}


/* =========================================================
   PARTICLE SHAPE ENGINE
========================================================= */

function generateShape(
  type
) {

  const p =
    targetPositions;


  const count =
    CONFIG.particles;


  for (
    let i = 0;
    i < count;
    i++
  ) {

    const idx =
      i * 3;


    let x = 0;
    let y = 0;
    let z = 0;


    /* -----------------------------------------------------
       JUPITER
    ----------------------------------------------------- */

    if (type === "jupiter") {

      if (
        i < count * .73
      ) {

        const u =
          Math.random();

        const v =
          Math.random();

        const theta =
          u * Math.PI * 2;

        const phi =
          Math.acos(
            2 * v - 1
          );

        const r = 7;

        x =
          r *
          Math.sin(phi) *
          Math.cos(theta);

        y =
          r *
          Math.cos(phi) *
          .85;

        z =
          r *
          Math.sin(phi) *
          Math.sin(theta);

      } else {

        const angle =
          Math.random() *
          Math.PI * 2;

        const dist =
          9 +
          Math.random() * 4;

        x =
          Math.cos(angle) *
          dist;

        z =
          Math.sin(angle) *
          dist;

        y =
          (Math.random() - .5) *
          .2;

      }

    }


    /* -----------------------------------------------------
       SATURN
    ----------------------------------------------------- */

    else if (type === "saturn") {

      if (i < count * .52) {

        const u =
          Math.random();

        const v =
          Math.random();

        const theta =
          u * Math.PI * 2;

        const phi =
          Math.acos(
            2 * v - 1
          );

        const r = 5;

        x =
          r *
          Math.sin(phi) *
          Math.cos(theta);

        y =
          r *
          Math.cos(phi);

        z =
          r *
          Math.sin(phi) *
          Math.sin(theta);

      } else {

        const angle =
          Math.random() *
          Math.PI * 2;

        const dist =
          7 +
          Math.random() * 6;

        x =
          Math.cos(angle) *
          dist;

        z =
          Math.sin(angle) *
          dist;

        y =
          (Math.random() - .5) *
          .18;

      }

    }


    /* -----------------------------------------------------
       GALAXY
    ----------------------------------------------------- */

    else if (type === "galaxy") {

      const arms = 5;

      const arm =
        i % arms;

      const r =
        Math.pow(
          Math.random(),
          1.5
        ) * 16;

      const theta =
        r * .42 +
        arm *
        (Math.PI * 2 / arms);

      x =
        Math.cos(theta) *
        r +
        (Math.random() - .5) *
        .7;

      z =
        Math.sin(theta) *
        r +
        (Math.random() - .5) *
        .7;

      y =
        (Math.random() - .5) *
        (2 - r * .09);

    }


    /* -----------------------------------------------------
       BLACK HOLE
    ----------------------------------------------------- */

    else if (type === "blackhole") {

      const angle =
        Math.random() *
        Math.PI * 2;

      const radius =
        2.2 +
        Math.random() * 10;

      x =
        Math.cos(angle) *
        radius;

      z =
        Math.sin(angle) *
        radius;

      y =
        (Math.random() - .5) *
        .5 *
        (radius / 10);

    }


    /* -----------------------------------------------------
       ATOM
    ----------------------------------------------------- */

    else if (type === "atom") {

      const orbit =
        i % 3;

      const angle =
        Math.random() *
        Math.PI * 2;

      const radius =
        7 +
        Math.random() * .4;

      if (orbit === 0) {

        x =
          Math.cos(angle) *
          radius;

        y =
          Math.sin(angle) *
          radius;

        z =
          (Math.random() - .5) *
          .15;

      }

      else if (orbit === 1) {

        x =
          Math.cos(angle) *
          radius;

        z =
          Math.sin(angle) *
          radius;

        y =
          (Math.random() - .5) *
          .15;

      }

      else {

        y =
          Math.cos(angle) *
          radius;

        z =
          Math.sin(angle) *
          radius;

        x =
          (Math.random() - .5) *
          .15;

      }

    }


    /* -----------------------------------------------------
       DNA
    ----------------------------------------------------- */

    else if (type === "dna") {

      const t =
        (i / count) *
        Math.PI *
        14;

      const strand =
        i % 2 === 0
          ? 1
          : -1;

      x =
        Math.sin(t) *
        4 *
        strand;

      y =
        (i / count) *
        17 -
        8.5;

      z =
        Math.cos(t) *
        4 *
        strand;

    }


    /* -----------------------------------------------------
       HYPERCUBE
    ----------------------------------------------------- */

    else if (type === "hypercube") {

      const s = 7;

      const edge =
        i % 12;

      const t =
        Math.random() *
        s -
        s / 2;


      if (edge === 0) {

        x=s/2; y=t; z=s/2;

      } else if (edge === 1) {

        x=-s/2; y=t; z=s/2;

      } else if (edge === 2) {

        x=t; y=s/2; z=s/2;

      } else if (edge === 3) {

        x=t; y=-s/2; z=s/2;

      } else if (edge === 4) {

        x=s/2; y=t; z=-s/2;

      } else if (edge === 5) {

        x=-s/2; y=t; z=-s/2;

      } else if (edge === 6) {

        x=t; y=s/2; z=-s/2;

      } else if (edge === 7) {

        x=t; y=-s/2; z=-s/2;

      } else if (edge === 8) {

        x=s/2; y=s/2; z=t;

      } else if (edge === 9) {

        x=-s/2; y=s/2; z=t;

      } else if (edge === 10) {

        x=s/2; y=-s/2; z=t;

      } else {

        x=-s/2; y=-s/2; z=t;

      }

    }


    /* -----------------------------------------------------
       HEART
    ----------------------------------------------------- */

    else if (type === "heart") {

      const t =
        Math.random() *
        Math.PI *
        2;

      const depth =
        (Math.random() - .5) *
        3;

      x =
        16 *
        Math.pow(
          Math.sin(t),
          3
        );

      y =
        13 * Math.cos(t) -
        5 * Math.cos(2*t) -
        2 * Math.cos(3*t) -
        Math.cos(4*t);

      z =
        depth;

      x *= .55;
      y *= .55;
      z *= .55;

    }


    /* -----------------------------------------------------
       FLOWER
    ----------------------------------------------------- */

    else if (type === "flower") {

      const u =
        Math.random() *
        Math.PI *
        2;

      const v =
        Math.random() *
        Math.PI;

      const r =
        9 *
        Math.sin(6*u) *
        Math.sin(v);

      x =
        r *
        Math.sin(v) *
        Math.cos(u);

      y =
        r *
        Math.sin(v) *
        Math.sin(u);

      z =
        r *
        Math.cos(v);

    }


    /* -----------------------------------------------------
       NEURAL NETWORK
    ----------------------------------------------------- */

    else if (type === "neural") {

      /*
        Nodi + collegamenti simulati.
      */

      const nodes = 28;

      const layer =
        i % nodes;

      const angle =
        layer *
        (Math.PI * 2 / nodes);

      const radius =
        5 +
        Math.random() *
        5;

      const pulse =
        Math.sin(
          i * .07
        ) * .8;

      x =
        Math.cos(angle) *
        radius +
        (Math.random() - .5) *
        .7;

      y =
        pulse +
        (Math.random() - .5) *
        8;

      z =
        Math.sin(angle) *
        radius +
        (Math.random() - .5) *
        .7;

    }


    /* -----------------------------------------------------
       BUDDHA
    ----------------------------------------------------- */

    else if (type === "buddha") {

      const r =
        Math.random();

      if (r < .35) {

        const a =
          Math.random() *
          Math.PI *
          2;

        const radius =
          2 +
          Math.random() *
          8;

        x =
          Math.cos(a) *
          radius;

        z =
          Math.sin(a) *
          radius;

        y =
          -7 +
          (Math.random() - .5) *
          1.2;

      } else {

        const h =
          Math.random() *
          9;

        const width =
          (1 - h / 9) *
          6.5;

        const a =
          Math.random() *
          Math.PI *
          2;

        x =
          Math.cos(a) *
          width *
          Math.random();

        z =
          Math.sin(a) *
          width *
          Math.random();

        y =
          -6 +
          h;

      }

    }


    /* -----------------------------------------------------
       FIREWORKS
    ----------------------------------------------------- */

    else if (type === "fireworks") {

      const theta =
        Math.random() *
        Math.PI *
        2;

      const phi =
        Math.acos(
          Math.random() * 2 - 1
        );

      const speed =
        2 +
        Math.random() *
        13;

      x =
        speed *
        Math.sin(phi) *
        Math.cos(theta);

      y =
        speed *
        Math.sin(phi) *
        Math.sin(theta);

      z =
        speed *
        Math.cos(phi);

    }


    /* -----------------------------------------------------
       VORTEX
    ----------------------------------------------------- */

    else if (type === "vortex") {

      const t =
        Math.random() *
        Math.PI *
        14;

      const radius =
        Math.random() *
        12;

      x =
        Math.cos(t) *
        radius;

      z =
        Math.sin(t) *
        radius;

      y =
        (t - Math.PI * 7) *
        .28;

    }


    /* -----------------------------------------------------
       QUANTUM SPHERE
    ----------------------------------------------------- */

    else if (type === "sphere") {

      const u =
        Math.random();

      const v =
        Math.random();

      const theta =
        u *
        Math.PI *
        2;

      const phi =
        Math.acos(
          2*v - 1
        );

      const r =
        7 +
        (Math.random() - .5) *
        .4;

      x =
        r *
        Math.sin(phi) *
        Math.cos(theta);

      y =
        r *
        Math.cos(phi);

      z =
        r *
        Math.sin(phi) *
        Math.sin(theta);

    }


    /* -----------------------------------------------------
       WAVE
    ----------------------------------------------------- */

    else if (type === "wave") {

      x =
        (Math.random() - .5) *
        25;

      z =
        (Math.random() - .5) *
        15;

      y =
        Math.sin(
          x * .8
        ) *
        2.2 +
        Math.cos(
          z * .7
        ) *
        1.5;

    }


    /* -----------------------------------------------------
       TORNADO
    ----------------------------------------------------- */

    else if (type === "tornado") {

      const h =
        Math.random() *
        16 -
        8;

      const radius =
        1.2 +
        ((h + 8) / 16) *
        7;

      const angle =
        Math.random() *
        Math.PI *
        2 +
        h * 1.7;

      x =
        Math.cos(angle) *
        radius;

      z =
        Math.sin(angle) *
        radius;

      y =
        h;

    }


    p[idx] =
      x;

    p[idx + 1] =
      y;

    p[idx + 2] =
      z;

  }

}


/* =========================================================
   HAND PREVIEW
========================================================= */

function drawHandSkeletonPreview(
  ctx,
  hands,
  width,
  height
) {

  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  ctx.fillStyle =
    "#090909";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  if (
    !hands ||
    !hands.length
  ) {

    ctx.fillStyle =
      "rgba(255,255,255,.35)";

    ctx.font =
      '9px "Share Tech Mono"';

    ctx.textAlign =
      "center";

    ctx.fillText(
      "SEARCHING OPTICAL HAND...",
      width / 2,
      height / 2
    );

    return;

  }


  for (
    const landmarks of hands
  ) {

    ctx.lineWidth = 2;

    ctx.strokeStyle =
      "#ffffff";


    for (
      const connection
      of HAND_CONNECTIONS
    ) {

      const p1 =
        landmarks[
          connection[0]
        ];

      const p2 =
        landmarks[
          connection[1]
        ];


      ctx.beginPath();

      ctx.moveTo(
        p1.x * width,
        p1.y * height
      );

      ctx.lineTo(
        p2.x * width,
        p2.y * height
      );

      ctx.stroke();

    }


    for (
      let i = 0;
      i < landmarks.length;
      i++
    ) {

      const pt =
        landmarks[i];


      ctx.fillStyle =
        (
          i === 4 ||
          i === 8
        )
          ? "#ffffff"
          : "#888888";


      ctx.beginPath();

      ctx.arc(
        pt.x * width,
        pt.y * height,
        (
          i === 4 ||
          i === 8
        )
          ? 3
          : 1.7,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }

  }

}


/* =========================================================
   LANDMARK → 3D
========================================================= */

function handToWorld(
  landmarks,
  ctrl
) {

  const thumb =
    landmarks[4];

  const index =
    landmarks[8];


  const px =
    (thumb.x + index.x) *
    .5;

  const py =
    (thumb.y + index.y) *
    .5;

  const pz =
    (thumb.z + index.z) *
    .5;


  const sensitivity =
    CONFIG.hand.sensitivity;


  const ndcX =
    ((1 - px) * 2 - 1) *
    sensitivity;


  const ndcY =
    (-(py * 2 - 1)) *
    sensitivity;


  const vector =
    new THREE.Vector3(
      ndcX,
      ndcY,
      .5
    );


  vector.unproject(
    camera
  );


  const dir =
    vector
      .sub(camera.position)
      .normalize();


  const targetZ =
    -pz * 22;


  const distance =
    (targetZ -
      camera.position.z) /
    dir.z;


  const target =
    camera.position
      .clone()
      .add(
        dir.multiplyScalar(
          distance
        )
      );


  /*
    Smoothing moderato:
    abbastanza basso da essere immediato,
    abbastanza alto da eliminare il tremolio.
  */

  ctrl.lastPos.copy(
    ctrl.pos
  );


  ctrl.pos.lerp(
    target,
    CONFIG.hand.smoothing
  );


  ctrl.velocity
    .copy(ctrl.pos)
    .sub(ctrl.lastPos);


  return ctrl.pos;

}


/* =========================================================
   BUILDER HAND INTERACTION
========================================================= */

function updateBuilderGrab(
  ctrl
) {

  if (
    !ctrl.active
  ) return;


  if (
    ctrl.isPinching
  ) {

    if (
      ctrl.grabbedBlock
    ) {

      const target =
        ctrl.pos
          .clone()
          .sub(
            ctrl.grabOffset
          );


      ctrl.grabbedBlock.position.copy(
        target
      );


      ctrl.grabbedBlock.userData.velocity.set(
        0,
        0,
        0
      );


      ctrl.grabEl.textContent =
        "AGGANCIATO";


      return;

    }


    let closest =
      null;

    let minDistance =
      4.2;


    for (
      const block of blocks
    ) {

      const distance =
        ctrl.pos.distanceTo(
          block.position
        );


      if (
        distance <
        minDistance
      ) {

        minDistance =
          distance;

        closest =
          block;

      }

    }


    if (
      closest
    ) {

      ctrl.grabbedBlock =
        closest;

      closest.userData.isGrabbed =
        true;

      ctrl.grabOffset
        .copy(ctrl.pos)
        .sub(
          closest.position
        );

      setBlockHighlight(
        closest,
        true
      );

    }

  }

  else {

    if (
      ctrl.grabbedBlock
    ) {

      setBlockHighlight(
        ctrl.grabbedBlock,
        false
      );

      ctrl.grabbedBlock.userData.isGrabbed =
        false;

      /*
        Piccola "inerzia" quando si lascia
        l'oggetto.
      */

      ctrl.grabbedBlock.userData.velocity
        .copy(ctrl.velocity)
        .multiplyScalar(.65);

      ctrl.grabbedBlock =
        null;

    }


    ctrl.grabEl.textContent =
      "LIBERA";

  }

}


/* =========================================================
   HAND TRACKING
========================================================= */

function initHandTracking() {

  const video =
    document.getElementById(
      "video-input"
    );


  const hands =
    new Hands({

      locateFile:
        file =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

    });


  hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 0,

    minDetectionConfidence: .38,

    minTrackingConfidence: .38

  });


  hands.onResults(
    results => {

      lastHandUpdate =
        performance.now();


      if (
        !previewCtx
      ) return;


      drawHandSkeletonPreview(

        previewCtx,

        results.multiHandLandmarks,

        previewCanvas.width,

        previewCanvas.height

      );


      const detected =
        results.multiHandLandmarks
          ? results.multiHandLandmarks.length
          : 0;


      for (
        let i = 0;
        i < 2;
        i++
      ) {

        const ctrl =
          controllers[i];


        if (
          i < detected
        ) {

          const landmarks =
            results.multiHandLandmarks[i];


          ctrl.active =
            true;


          handToWorld(
            landmarks,
            ctrl
          );


          ctrl.mesh.visible =
            currentMode === "BUILDER";


          ctrl.mesh.position.copy(
            ctrl.pos
          );


          ctrl.pointLight.position.copy(
            ctrl.pos
          );


          const thumb =
            landmarks[4];

          const index =
            landmarks[8];


          const pinchDistance =
            Math.hypot(

              thumb.x -
              index.x,

              thumb.y -
              index.y

            );


          const previousPinch =
            ctrl.isPinching;


          ctrl.isPinching =
            pinchDistance <
            CONFIG.hand.pinchThreshold;


          if (
            !previousPinch &&
            ctrl.isPinching
          ) {

            sounds.playPinch();

          }


          ctrl.statusEl.textContent =
            "ATTIVA";

          ctrl.statusEl.style.color =
            "#fff";


          ctrl.grabEl.textContent =
            ctrl.isPinching
              ? "PINCH"
              : "LIBERA";


          if (
            currentMode === "BUILDER"
          ) {

            updateBuilderGrab(
              ctrl
            );

          }


        }

        else {

          ctrl.active =
            false;


          ctrl.isPinching =
            false;


          ctrl.mesh.visible =
            false;


          ctrl.rayLine.visible =
            false;


          if (
            ctrl.grabbedBlock
          ) {

            setBlockHighlight(
              ctrl.grabbedBlock,
              false
            );

            ctrl.grabbedBlock.userData.isGrabbed =
              false;

            ctrl.grabbedBlock =
              null;

          }


          ctrl.statusEl.textContent =
            "CERCA...";

          ctrl.statusEl.style.color =
            "#666";


          ctrl.grabEl.textContent =
            "N/A";

        }

      }


      /* ===================================================
         PARTICLE HAND CONTROL
      =================================================== */

      if (
        currentMode === "PARTICLES" &&
        detected > 0
      ) {

        const hand1 =
          results.multiHandLandmarks[0];


        const center =
          hand1[9];

        const wrist =
          hand1[0];


        targetRotZ =
          -Math.atan2(

            center.y -
            wrist.y,

            center.x -
            wrist.x

          ) -
          Math.PI / 2;


        targetRotX =
          (center.y - .5) *
          Math.PI *
          3.8;


        targetRotY =
          (center.x - .5) *
          Math.PI *
          5.0;


        if (
          detected === 2
        ) {

          const hand2 =
            results.multiHandLandmarks[1];


          const distance =
            Math.hypot(

              hand1[9].x -
              hand2[9].x,

              hand1[9].y -
              hand2[9].y

            );


          targetScale =
            THREE.MathUtils.clamp(

              THREE.MathUtils.mapLinear(

                distance,

                .18,
                .78,

                .65,
                2.8

              ),

              .55,
              3.2

            );

        }

        else {

          const span =
            Math.hypot(

              wrist.x -
              hand1[12].x,

              wrist.y -
              hand1[12].y

            );


          targetScale =
            THREE.MathUtils.clamp(

              THREE.MathUtils.mapLinear(

                span,

                .13,
                .45,

                .65,
                2.5

              ),

              .55,
              2.7

            );

        }

      }

    }
  );


  /* =======================================================
     CAMERA
  ======================================================= */

  const cameraUtils =
    new Camera(
      video,
      {

        onFrame:
          async () => {

            if (
              video.readyState >= 2
            ) {

              await hands.send({
                image: video
              });

            }

          },

        width:
          CONFIG.hand.width,

        height:
          CONFIG.hand.height

      }
    );


  cameraUtils.start()
    .catch(
      error => {

        console.warn(
          "Camera startup retry...",
          error
        );


        setTimeout(
          () =>
            cameraUtils.start(),
          1500
        );

      }
    );

}


/* =========================================================
   BUILDER PHYSICS
========================================================= */

function updateBuilderPhysics() {

  const gravity =
    CONFIG.builder.gravity;


  for (
    let i = 0;
    i < blocks.length;
    i++
  ) {

    const block =
      blocks[i];


    if (
      block.userData.isGrabbed
    ) continue;


    const velocity =
      block.userData.velocity;


    velocity.y += gravity;


    block.position.add(
      velocity
    );


    const floorY =
      -6 +
      block.userData.size / 2;


    if (
      block.position.y <
      floorY
    ) {

      block.position.y =
        floorY;

      velocity.y =
        0;

    }

  }


  /*
    Collisioni semplificate.
    Non facciamo il doppio controllo completo
    per ogni coppia.
  */

  for (
    let i = 0;
    i < blocks.length;
    i++
  ) {

    const a =
      blocks[i];


    if (
      a.userData.isGrabbed
    ) continue;


    for (
      let j = i + 1;
      j < blocks.length;
      j++
    ) {

      const b =
        blocks[j];


      if (
        b.userData.isGrabbed
      ) continue;


      const dx =
        a.position.x -
        b.position.x;


      const dz =
        a.position.z -
        b.position.z;


      const distanceSq =
        dx * dx +
        dz * dz;


      const limit =
        a.userData.size *
        .72;


      if (
        distanceSq <
        limit * limit
      ) {

        if (
          a.position.y >
          b.position.y
        ) {

          const targetY =
            b.position.y +
            b.userData.size;

          if (
            a.position.y <
            targetY
          ) {

            a.position.y =
              targetY;

            a.userData.velocity.y =
              0;

          }

        }

      }

    }

  }

}


/* =========================================================
   PARTICLE UPDATE
========================================================= */

function updateParticles() {

  particleGroup.rotation.x +=
    (
      targetRotX -
      particleGroup.rotation.x
    ) * .18;


  particleGroup.rotation.y +=
    (
      targetRotY +
      .002 -
      particleGroup.rotation.y
    ) * .18;


  particleGroup.rotation.z +=
    (
      targetRotZ -
      particleGroup.rotation.z
    ) * .18;


  handExpansionScale +=
    (
      targetScale -
      handExpansionScale
    ) * .22;


  const positions =
    particleGeometry
      .attributes
      .position
      .array;


  const pinch =
    (
      controllers[0].active &&
      controllers[0].isPinching
    ) ||
    (
      controllers[1].active &&
      controllers[1].isPinching
    );


  /*
    Ottimizzazione:
    niente Math.round, niente oggetti temporanei,
    nessun Vector3 creato dentro il loop.
  */

  const normalLerp =
    CONFIG.particle.lerp;


  const pinchLerp =
    CONFIG.particle.pinchLerp;


  for (
    let i = 0;
    i < CONFIG.particles * 3;
    i += 3
  ) {

    let tx =
      targetPositions[i] *
      handExpansionScale;


    let ty =
      targetPositions[i + 1] *
      handExpansionScale;


    let tz =
      targetPositions[i + 2] *
      handExpansionScale;


    let speed =
      normalLerp;


    if (
      pinch &&
      ((i / 3) & 1) === 0
    ) {

      tx *= .025;
      ty *= .025;
      tz *= .025;

      speed =
        pinchLerp;

    }


    positions[i] +=
      (tx - positions[i]) *
      speed;


    positions[i + 1] +=
      (ty - positions[i + 1]) *
      speed;


    positions[i + 2] +=
      (tz - positions[i + 2]) *
      speed;

  }


  particleGeometry
    .attributes
    .position
    .needsUpdate = true;

}


/* =========================================================
   FPS
========================================================= */

function updatePerformance(
  now
) {

  fpsFrames++;


  if (
    now -
    fpsLastUpdate >=
    500
  ) {

    currentFPS =
      Math.round(

        fpsFrames *
        1000 /
        (now -
          fpsLastUpdate)

      );


    fpsFrames =
      0;


    fpsLastUpdate =
      now;


    document
      .getElementById(
        "fps-value"
      )
      .textContent =
      currentFPS;


    document
      .getElementById(
        "latency-value"
      )
      .textContent =
      Math.round(
        now -
        lastHandUpdate
      );

  }

}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(
  now
) {

  requestAnimationFrame(
    animate
  );


  updatePerformance(
    now
  );


  if (
    currentMode ===
    "BUILDER"
  ) {

    updateBuilderPhysics();

  }

  else {

    updateParticles();

  }


  renderer.render(
    scene,
    camera
  );

}


/* =========================================================
   RESIZE
========================================================= */

function onWindowResize() {

  camera.aspect =
    window.innerWidth /
    window.innerHeight;


  camera.updateProjectionMatrix();


  renderer.setPixelRatio(

    Math.min(

      window.devicePixelRatio || 1,

      CONFIG.particle.maxPixelRatio

    )

  );


  renderer.setSize(

    window.innerWidth,

    window.innerHeight,

    false

  );

}


/* =========================================================
   UI EVENTS
========================================================= */

function initUI() {

  document
    .getElementById(
      "tab-builder"
    )
    .addEventListener(
      "click",
      () => {

        switchMode(
          "BUILDER"
        );

      }
    );


  document
    .getElementById(
      "tab-particles"
    )
    .addEventListener(
      "click",
      () => {

        switchMode(
          "PARTICLES"
        );

      }
    );


  document
    .querySelectorAll(
      "[data-shape]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            sounds.init();

            spawnShape(
              button.dataset.shape
            );

          }
        );

      }
    );


  document
    .getElementById(
      "clear-scene"
    )
    .addEventListener(
      "click",
      () => {

        sounds.init();

        clearBlocks();

      }
    );


  document
    .getElementById(
      "shape-select"
    )
    .addEventListener(
      "change",
      event => {

        generateShape(
          event.target.value
        );

      }
    );


  document
    .getElementById(
      "color-picker"
    )
    .addEventListener(
      "input",
      event => {

        if (
          particleMaterial
        ) {

          particleMaterial.color.set(
            event.target.value
          );

        }

      }
    );


  document
    .getElementById(
      "audio-toggle-btn"
    )
    .addEventListener(
      "click",
      () => {

        sounds.init();

        sounds.enabled =
          !sounds.enabled;


        document
          .getElementById(
            "audio-toggle-btn"
          )
          .textContent =
          sounds.enabled
            ? "🔊 AUDIO: ATTIVO"
            : "🔇 AUDIO: DISATTIVATO";

      }
    );

}


/* =========================================================
   SAFE START
========================================================= */

window.addEventListener(
  "load",
  () => {

    try {

      initThree();

      initUI();

      initHandTracking();

      animate(
        performance.now()
      );

      /*
        Cubo iniziale.
      */

      spawnShape(
        "cube",
        0,
        2,
        0
      );


      document
        .getElementById(
          "system-status-text"
        )
        .textContent =
        "SYSTEM ONLINE";


    }

    catch (error) {

      console.error(
        "STARK LAB BOOT ERROR:",
        error
      );


      document
        .getElementById(
          "system-status-text"
        )
        .textContent =
        "SYSTEM ERROR";

    }

  }
);

</script>
