  <script>

    /* =========================================================
       AUDIO SYSTEM
       ========================================================= */

    class SciFiSoundSystem {

      constructor() {

        this.ctx = null;
        this.humOsc = null;
        this.humGain = null;

        this.enabled = true;
        this.initialized = false;

      }

      init() {

        if (this.initialized) return;

        try {

          const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

          if (!AudioCtx) return;

          this.ctx = new AudioCtx();

          this.humOsc =
            this.ctx.createOscillator();

          this.humGain =
            this.ctx.createGain();

          this.humOsc.type = 'sine';

          this.humOsc.frequency.setValueAtTime(
            50,
            this.ctx.currentTime
          );

          this.humGain.gain.setValueAtTime(
            0.01,
            this.ctx.currentTime
          );

          this.humOsc.connect(this.humGain);

          this.humGain.connect(
            this.ctx.destination
          );

          this.humOsc.start();

          this.initialized = true;

        } catch (error) {

          console.warn(
            "Audio non disponibile:",
            error
          );

        }

      }

      playPinch() {

        if (
          !this.enabled ||
          !this.initialized ||
          !this.ctx
        ) {
          return;
        }

        const osc =
          this.ctx.createOscillator();

        const gain =
          this.ctx.createGain();

        osc.type = 'sine';

        const now =
          this.ctx.currentTime;

        osc.frequency.setValueAtTime(
          200,
          now
        );

        osc.frequency.exponentialRampToValueAtTime(
          800,
          now + 0.08
        );

        gain.gain.setValueAtTime(
          0.15,
          now
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          now + 0.08
        );

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.08);

      }

    }

    const sounds =

    /* =========================================================
       THREE.JS INITIALIZATION
       ========================================================= */

    function initThree() {

      const container =
        document.getElementById(
          'canvas-container'
        );

      scene =
        new THREE.Scene();

      scene.background =
        new THREE.Color(0x000000);


      camera =
        new THREE.PerspectiveCamera(
          55,
          window.innerWidth /
            window.innerHeight,
          0.1,
          1000
        );

      camera.position.set(
        0,
        4,
        28
      );

      camera.lookAt(
        0,
        0,
        0
      );


      /*
        Ottimizzazione GPU:
        pixelRatio massimo 1 invece di 1.5.
      */

      renderer =
        new THREE.WebGLRenderer({

          antialias: false,

          powerPreference:
            "high-performance"

        });

      renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
      );

      renderer.setPixelRatio(1);

      container.appendChild(
        renderer.domElement
      );


      /* =====================================================
         BUILDER
         ===================================================== */

      builderGroup =
        new THREE.Group();

      builderGroup.visible =
        false;

      scene.add(
        builderGroup
      );


      const ambientLight =
        new THREE.AmbientLight(
          0xffffff,
          0.9
        );

      scene.add(
        ambientLight
      );


      const dirLight =
        new THREE.DirectionalLight(
          0xffffff,
          0.8
        );

      dirLight.position.set(
        10,
        25,
        15
      );

      scene.add(
        dirLight
      );


      const planeGeo =
        new THREE.PlaneGeometry(
          60,
          60
        );

      const planeMat =
        new THREE.MeshStandardMaterial({

          color: 0x111111,

          roughness: 0.8,

          metalness: 0.2

        });


      const floor =
        new THREE.Mesh(
          planeGeo,
          planeMat
        );

      floor.rotation.x =
        -Math.PI / 2;

      floor.position.y =
        -6;

      builderGroup.add(
        floor
      );


      const gridHelper =
        new THREE.GridHelper(
          60,
          30,
          0xffffff,
          0x333333
        );

      gridHelper.position.y =
        -5.98;

      builderGroup.add(
        gridHelper
      );


      /* =====================================================
         HAND CONTROLLERS
         ===================================================== */

      controllers.forEach(
        (ctrl, idx) => {

          const dotGeo =
            new THREE.SphereGeometry(
              0.18,
              8,
              8
            );

          const dotMat =
            new THREE.MeshBasicMaterial({
              color: 0xffffff
            });

          ctrl.mesh =
            new THREE.Mesh(
              dotGeo,
              dotMat
            );

          ctrl.mesh.visible =
            false;

          builderGroup.add(
            ctrl.mesh
          );


          ctrl.pointLight =
            new THREE.PointLight(
              0xffffff,
              0.8,
              10
            );

          builderGroup.add(
            ctrl.pointLight
          );


          const lineGeo =
            new THREE.BufferGeometry()
              .setFromPoints([

                new THREE.Vector3(
                  0,
                  0,
                  0
                ),

                new THREE.Vector3(
                  0,
                  0,
                  0
                )

              ]);


          const lineMat =
            new THREE.LineBasicMaterial({

              color: 0xffffff,

              transparent: true,

              opacity: 0.4

            });


          ctrl.rayLine =
            new THREE.Line(
              lineGeo,
              lineMat
            );

          ctrl.rayLine.visible =
            false;

          builderGroup.add(
            ctrl.rayLine
          );


          ctrl.statusEl =
            document.getElementById(
              `h${idx + 1}-status`
            );

          ctrl.grabEl =
            document.getElementById(
              `h${idx + 1}-grab`
            );

        }
      );


      spawnShape(
        'cube',
        0,
        2,
        0
      );


      /* =====================================================
         PARTICLE SYSTEM
         ===================================================== */

      particleGroup =
        new THREE.Group();

      particleGroup.visible =
        true;

      scene.add(
        particleGroup
      );


      particleGeometry =
        new THREE.BufferGeometry();


      for (
        let i = 0;
        i < PARTICLE_COUNT * 3;
        i++
      ) {

        const value =
          (Math.random() - 0.5) *
          40;

        currentPositions[i] =
          value;

        targetPositions[i] =
          value;

      }


      particleGeometry.setAttribute(
        'position',
        new THREE.BufferAttribute(
          currentPositions,
          3
        )
      );


      /* =====================================================
         PARTICLE COLORS
         ===================================================== */

      const particleColors =
        new Float32Array(
          PARTICLE_COUNT * 3
        );


      for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
      ) {

        const idx =
          i * 3;

        const rand =
          Math.random();

        let value;

        if (rand < 0.7) {

          value = 1;

        } else if (rand < 0.9) {

          value = 0.666;

        } else {

          value = 0.333;

        }

        particleColors[idx] =
          value;

        particleColors[idx + 1] =
          value;

        particleColors[idx + 2] =
          value;

      }


      particleGeometry.setAttribute(
        'color',
        new THREE.BufferAttribute(
          particleColors,
          3
        )
      );


      /* =====================================================
         PARTICLE TEXTURE
         ===================================================== */

      const pCanvas =
        document.createElement(
          'canvas'
        );

      pCanvas.width = 16;
      pCanvas.height = 16;

      const pCtx =
        pCanvas.getContext(
          '2d'
        );

      pCtx.fillStyle =
        '#ffffff';

      pCtx.beginPath();

      pCtx.arc(
        8,
        8,
        7,
        0,
        Math.PI * 2
      );

      pCtx.fill();


      const particleTexture =
        new THREE.CanvasTexture(
          pCanvas
        );

      particleTexture.generateMipmaps =
        false;

      particleTexture.minFilter =
        THREE.LinearFilter;

      particleTexture.magFilter =
        THREE.LinearFilter;


      particleMaterial =
        new THREE.PointsMaterial({

          size: 0.25,

          vertexColors: true,

          map: particleTexture,

          transparent: true,

          opacity: 0.95,

          blending:
            THREE.AdditiveBlending,

          depthWrite: false

        });


      const particleSystem =
        new THREE.Points(
          particleGeometry,
          particleMaterial
        );

      particleGroup.add(
        particleSystem
      );


      generateShape(
        'jupiter'
      );


      /* =====================================================
         CAMERA PREVIEW
         ===================================================== */

      previewCanvas =
        document.getElementById(
          'hand-preview-canvas'
        );

      previewCtx =
        previewCanvas.getContext(
          '2d'
        );


      window.addEventListener(
        'resize',
        onWindowResize,
        {
          passive: true
        }
      );

    }


    /* =========================================================
       SPAWN 3D OBJECT
       ========================================================= */

    function spawnShape(
      type,
      x,
      y,
      z
    ) {

      let geo;

      const size = 3.0;


      if (
        type === 'sphere'
      ) {

        geo =
          new THREE.SphereGeometry(
            size / 1.8,
            12,
            12
          );

      }

      else if (
        type === 'pyramid'
      ) {

        geo =
          new THREE.ConeGeometry(
            size / 1.4,
            size,
            4
          );

      }

      else if (
        type === 'torus'
      ) {

        geo =
          new THREE.TorusGeometry(
            size / 2,
            size / 6,
            8,
            16
          );

      }

      else if (
        type === 'cylinder'
      ) {

        geo =
          new THREE.CylinderGeometry(
            size / 2,
            size / 2,
            size,
            12
          );

      }

      else if (
        type === 'icosahedron'
      ) {

        geo =
          new THREE.IcosahedronGeometry(
            size / 1.6
          );

      }

      else {

        geo =
          new THREE.BoxGeometry(
            size,
            size,
            size
          );

      }


      const randomColorHex =
        Math.random() > 0.5
          ? 0xffffff
          : 0x888888;


      const mat =
        new THREE.MeshStandardMaterial({

          color:
            randomColorHex,

          roughness:
            0.3,

          metalness:
            0.2

        });


      const mesh =
        new THREE.Mesh(
          geo,
          mat
        );


      mesh.position.x =
        x !== undefined
          ? x
          : (Math.random() - 0.5) * 8;

      mesh.position.y =
        y !== undefined
          ? y
          : 6;

      mesh.position.z =
        z !== undefined
          ? z
          : (Math.random() - 0.5) * 4;


      mesh.userData = {

        originalColor:
          randomColorHex,

        velocity:
          new THREE.Vector3(
            0,
            0,
            0
          ),

        isGrabbed:
          false,

        size:
          size

      };


      builderGroup.add(
        mesh
      );

      blocks.push(
        mesh
      );

    }


    /* =========================================================
       CLEAR BUILDER
       ========================================================= */

    function clearBlocks() {

      for (
        const b of blocks
      ) {

        if (b.geometry) {
          b.geometry.dispose();
        }

        if (b.material) {
          b.material.dispose();
        }

        builderGroup.remove(
          b
        );

      }

      blocks = [];


      controllers.forEach(
        c => {

          c.grabbedBlock =
            null;

        }
      );

    }


    /* =========================================================
       BLOCK HIGHLIGHT
       ========================================================= */

    function setBlockHighlight(
      block,
      mode
    ) {

      if (!block) return;

      if (
        mode === 'grab'
      ) {

        block.material.color.setHex(
          0xffffff
        );

      }

      else {

        block.material.color.setHex(
          block.userData.originalColor
        );

      }

    }


    /* =========================================================
       SWITCH MODE
       ========================================================= */

    function switchMode(

    ) {

      currentMode =

      document
        .getElementById(
          'tab-builder'
        )
        .classList.toggle(

        );


      document
        .getElementById(

        )

    /* =========================================================
       GENERATE PARTICLE SHAPE
       ========================================================= */

    function generateShape(
      type
    ) {

      const p =
        targetPositions;


      for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
      ) {

        const idx =
          i * 3;

        let x = 0;
        let y = 0;
        let z = 0;


        /* =====================================================
           JUPITER
           ===================================================== */

        if (
          type === 'jupiter'
        ) {

          if (
            i <
            PARTICLE_COUNT * 0.75
          ) {

            const u =
              Math.random();

            const v =
              Math.random();

            const theta =
              u *
              2 *
              Math.PI;

            const phi =
              Math.acos(
                2 * v - 1
              );

            const r = 7;

            x =
              r *
              Math.sin(phi) *
              Math.cos(theta);

            y =
              r *
              Math.cos(phi) *
              0.85;

            z =
              r *
              Math.sin(phi) *
              Math.sin(theta);

          }

          else {

            const angle =
              Math.random() *
              Math.PI *
              2;

            const dist =
              9 +
              Math.random() *
              4;

            x =
              Math.cos(angle) *
              dist;

            z =
              Math.sin(angle) *
              dist;

            y =
              (Math.random() - 0.5) *
              0.2;

          }

        }


        /* =====================================================
           GALAXY
           ===================================================== */

        else if (
          type === 'galaxy'
        ) {

          const arms = 4;

          const arm =
            i % arms;

          const r =
            Math.pow(
              Math.random(),
              1.5
            ) * 15;

          const theta =
            r * 0.4 +
            arm *
            (Math.PI * 2 / arms);

          x =
            Math.cos(theta) *
            r +
            (Math.random() - 0.5) *
            0.7;

          z =
            Math.sin(theta) *
            r +
            (Math.random() - 0.5) *
            0.7;

          y =
            (Math.random() - 0.5) *
            Math.max(
              0.2,
              1.8 - r * 0.1
            );

        }


        /* =====================================================
           SATURN
           ===================================================== */

        else if (
          type === 'saturn'
        ) {

          if (
            i <
            PARTICLE_COUNT * 0.5
          ) {

            const u =
              Math.random();

            const v =
              Math.random();

            const theta =
              u *
              2 *
              Math.PI;

            const phi =
              Math.acos(
                2 * v - 1
              );

            const r = 5;

            x =
              r *
              Math.sin(phi) *
              Math.cos(theta);

            y =
              r *
              Math.cos(phi);

            z =
              r *
              Math.sin(phi) *
              Math.sin(theta);

          }

          else {

            const angle =
              Math.random() *
              Math.PI *
              2;

            const dist =
              7 +
              Math.random() *
              6;

            x =
              Math.cos(angle) *
              dist;

            z =
              Math.sin(angle) *
              dist;

            y =
              (Math.random() - 0.5) *
              0.15;

          }

        }


        /* =====================================================
           DNA
           ===================================================== */

        else if (
          type === 'DNA'
        ) {

          const t =
            (i / PARTICLE_COUNT) *
            Math.PI *
            12;

          const strand =
            i % 2 === 0
              ? 1
              : -1;

          x =
            Math.sin(t) *
            4 *
            strand;

          y =
            (i / PARTICLE_COUNT) *
            16 -
            8;

          z =
            Math.cos(t) *
            4 *
            strand;

        }


        /* =====================================================
           HYPERCUBE
           ===================================================== */

        else if (
          type === 'hypercube'
        ) {

          const size = 6;

          const side =
            i % 12;

          const t =
            Math.random() *
            size -
            size / 2;


          if (side === 0) {

            x = size / 2;
            y = t;
            z = size / 2;

          }

          else if (side === 1) {

            x = -size / 2;
            y = t;
            z = size / 2;

          }

          else if (side === 2) {

            x = t;
            y = size / 2;
            z = size / 2;

          }

          else if (side === 3) {

            x = t;
            y = -size / 2;
            z = size / 2;

          }

          else if (side === 4) {

            x = size / 2;
            y = t;
            z = -size / 2;

          }

          else if (side === 5) {

            x = -size / 2;
            y = t;
            z = -size / 2;

          }

          else if (side === 6) {

            x = t;
            y = size / 2;
            z = -size / 2;

          }

          else if (side === 7) {

            x = t;
            y = -size / 2;
            z = -size / 2;

          }

          else if (side === 8) {

            x = size / 2;
            y = size / 2;
            z = t;

          }

          else if (side === 9) {

            x = -size / 2;
            y = size / 2;
            z = t;

          }

          else if (side === 10) {

            x = size / 2;
            y = -size / 2;
            z = t;

          }

          else {

            x = -size / 2;
            y = -size / 2;
            z = t;

          }

        }


        /* =====================================================
           HEART
           ===================================================== */

        else if (
          type === 'heart'
        ) {

          const t =
            Math.random() *
            Math.PI *
            2;

          const u =
            (Math.random() - 0.5) *
            3;

          x =
            16 *
            Math.pow(
              Math.sin(t),
              3
            );

          y =
            13 *
              Math.cos(t) -
            5 *
              Math.cos(2 * t) -
            2 *
              Math.cos(3 * t) -
            Math.cos(4 * t);

          z = u;

          x *= 0.55;
          y *= 0.55;
          z *= 0.55;

        }


        /* =====================================================
           FLOWER
           ===================================================== */

        else if (
          type === 'flower'
        ) {

          const u =
            Math.random() *
            Math.PI *
            2;

          const v =
            Math.random() *
            Math.PI;

          const r =
            9 *
            Math.sin(6 * u) *
            Math.sin(v);

          x =
            r *
            Math.sin(v) *
            Math.cos(u);

          y =
            r *
            Math.sin(v) *
            Math.sin(u);

          z =
            r *
            Math.cos(v);

        }


        /* =====================================================
           BUDDHA
           ===================================================== */

        else if (
          type === 'buddha'
        ) {

          const rand =
            Math.random();


          if (
            rand < 0.35
          ) {

            const a =
              Math.random() *
              Math.PI *
              2;

            const r =
              2 +
              Math.random() *
              8;

            x =
              Math.cos(a) *
              r;

            z =
              Math.sin(a) *
              r;

            y =
              -7 +
              (Math.random() - 0.5) *
              1.2;

          }

          else {

            const h =
              Math.random() *
              9;

            const width =
              (1 - h / 9) *
              6.5;

            const a =
              Math.random() *
              Math.PI *
              2;

            x =
              Math.cos(a) *
              width *
              Math.random();

            z =
              Math.sin(a) *
              width *
              Math.random();

            y =
              -6 +
              h;

          }

        }


        /* =====================================================
           FIREWORKS
           ===================================================== */

        else if (
          type === 'fireworks'
        ) {

          const theta =
            Math.random() *
            Math.PI *
            2;

          const phi =
            Math.acos(
              Math.random() * 2 - 1
            );

          const speed =
            2 +
            Math.random() *
            12;

          x =
            speed *
            Math.sin(phi) *
            Math.cos(theta);

          y =
            speed *
            Math.sin(phi) *
            Math.sin(theta);

          z =
            speed *
            Math.cos(phi);

        }


        p[idx] =
          x;

        p[idx + 1] =
          y;

        p[idx + 2] =
          z;

      }

    }


    /* =========================================================
       HAND SKELETON PREVIEW
       ========================================================= */

    function drawHandSkeletonPreview(
      ctx,
      multiHandLandmarks,
      w,
      h
    ) {

      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      ctx.fillStyle =
        'rgba(10,15,20,0.85)';

      ctx.fillRect(
        0,
        0,
        w,
        h
      );


      if (
        multiHandLandmarks &&
        multiHandLandmarks.length > 0
      ) {

        multiHandLandmarks.forEach(
          landmarks => {

            ctx.lineWidth = 2;

            ctx.strokeStyle =
              '#00ffcc';


            for (
              const [
                startIdx,
                endIdx
              ] of HAND_CONNECTIONS
            ) {

              const p1 =
                landmarks[startIdx];

              const p2 =
                landmarks[endIdx];


              ctx.beginPath();

              ctx.moveTo(
                p1.x * w,
                p1.y * h
              );

              ctx.lineTo(
                p2.x * w,
                p2.y * h
              );

              ctx.stroke();

            }


            landmarks.forEach(
              (pt, index) => {

                ctx.fillStyle =
                  (
                    index === 4 ||
                    index === 8
                  )
                    ? '#ff00aa'
                    : '#ffffff';


                ctx.beginPath();

                ctx.arc(
                  pt.x * w,
                  pt.y * h,
                  (
                    index === 4 ||
                    index === 8
                  )
                    ? 3.5
                    : 2,
                  0,
                  2 * Math.PI
                );

                ctx.fill();

              }
            );

          }
        );

      }

      else {

        ctx.fillStyle =
          'rgba(255,255,255,0.3)';

        ctx.font =
          '9px "Share Tech Mono"';

        ctx.textAlign =
          'center';

        ctx.fillText(
          "CERCA MANO...",
          w / 2,
          h / 2
        );

      }

    }


    /* =========================================================
       HAND TRACKING
       ========================================================= */

    async function initHandTracking() {

      const videoElement =
        document.getElementById(
          'video-input'
        );


      const hands =
        new Hands({

          locateFile:
            file =>
              `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

        });


      /*
        MODEL COMPLEXITY 0:
        molto più leggero della versione originale.
      */

      hands.setOptions({

        maxNumHands: 2,

        modelComplexity: 0,

        minDetectionConfidence: 0.45,

        minTrackingConfidence: 0.45

      });


      /* =====================================================
         THROTTLE MEDIA PIPE
         ===================================================== */

      let lastHandProcess =
        0;

      const HAND_INTERVAL =
        1000 / 24;


      let processingHands =
        false;


      hands.onResults(
        results => {

          processingHands =
            false;


          if (!previewCtx) {
            return;
          }


          drawHandSkeletonPreview(
            previewCtx,
            results.multiHandLandmarks,
            previewCanvas.width,
            previewCanvas.height
          );


          const numHands =
            results.multiHandLandmarks
              ? results.multiHandLandmarks.length
              : 0;


          for (
            let i = 0;
            i < 2;
            i++
          ) {

            const ctrl =
              controllers[i];


            if (
              i < numHands
            ) {

              ctrl.active =
                true;


              const landmarks =
                results.multiHandLandmarks[i];


              const thumbTip =
                landmarks[4];

              const indexTip =
                landmarks[8];

              const wrist =
                landmarks[0];


              const pX =
                (
                  thumbTip.x +
                  indexTip.x
                ) / 2;


              const pY =
                (
                  thumbTip.y +
                  indexTip.y
                ) / 2;


              const pZ =
                (
                  thumbTip.z +
                  indexTip.z
                ) / 2;


              const pinchDist =
                Math.hypot(
                  thumbTip.x -
                    indexTip.x,

                  thumbTip.y -
                    indexTip.y
                );


              const sensitivityMultiplier =
                1.35;


              const ndcX =
                (
                  (1 - pX) *
                  2 -
                  1
                ) *
                sensitivityMultiplier;


              const ndcY =
                -(
                  pY *
                  2 -
                  1
                ) *
                sensitivityMultiplier;


              const vector =
                new THREE.Vector3(
                  ndcX,
                  ndcY,
                  0.5
                );


              vector.unproject(
                camera
              );


              const dir =
                vector
                  .sub(
                    camera.position
                  )
                  .normalize();


              const targetZ =
                -pZ * 20;


              if (
                Math.abs(dir.z) >
                0.0001
              ) {

                const distanceToPlane =
                  (
                    targetZ -
                    camera.position.z
                  ) /
                  dir.z;


                const targetPos =
                  camera.position
                    .clone()
                    .add(
                      dir.multiplyScalar(
                        distanceToPlane
                      )
                    );


                ctrl.lastPos.copy(
                  ctrl.pos
                );

                ctrl.pos.copy(
                  targetPos
                );

                ctrl.velocity
                  .copy(ctrl.pos)
                  .sub(ctrl.lastPos);


                ctrl.mesh.visible =
                  true;

                ctrl.mesh.position.copy(
                  ctrl.pos
                );

                ctrl.pointLight.position.copy(
                  ctrl.pos
                );


                /* =================================================
                   WRIST RAY
                   ================================================= */

                const wristNdcX =
                  (1 - wrist.x) *
                  2 -
                  1;

                const wristNdcY =
                  -(
                    wrist.y *
                    2 -
                    1
                  );


                const wVector =
                  new THREE.Vector3(
                    wristNdcX,
                    wristNdcY,
                    0.5
                  );


                wVector.unproject(
                  camera
                );


                const wDir =
                  wVector
                    .sub(
                      camera.position
                    )
                    .normalize();


                if (
                  Math.abs(wDir.z) >
                  0.0001
                ) {

                  const wDist =
                    (
                      targetZ -
                      camera.position.z
                    ) /
                    wDir.z;


                  const wristPos3D =
                    camera.position
                      .clone()
                      .add(
                        wDir.multiplyScalar(
                          wDist
                        )
                      );


                  const posAttr =
                    ctrl.rayLine
                      .geometry
                      .attributes
                      .position;


                  posAttr.setXYZ(
                    0,
                    wristPos3D.x,
                    wristPos3D.y,
                    wristPos3D.z
                  );


                  posAttr.setXYZ(
                    1,
                    ctrl.pos.x,
                    ctrl.pos.y,
                    ctrl.pos.z
                  );


                  posAttr.needsUpdate =
                    true;


                  ctrl.rayLine.visible =
                    true;

                }

              }


              /* =================================================
                 PINCH
                 ================================================= */

              const wasPinching =
                ctrl.isPinching;


              ctrl.isPinching =
                pinchDist <
                0.085;


              if (
                !wasPinching &&
                ctrl.isPinching
              ) {

                sounds.playPinch();

              }


              ctrl.statusEl.innerText =
                "ATTIVA";

              ctrl.statusEl.style.color =
                "#ffffff";


              /* =================================================
                 BUILDER GRAB
                 ================================================= */

              if (
                currentMode ===
                'BUILDER'
              ) {

                if (
                  ctrl.isPinching
                ) {

                  if (
                    ctrl.grabbedBlock
                  ) {

                    const blockTarget =
                      ctrl.pos
                        .clone()
                        .sub(
                          ctrl.grabOffset
                        );


                    ctrl.grabbedBlock.position.copy(
                      blockTarget
                    );


                    ctrl.grabbedBlock
                      .userData
                      .velocity
                      .set(
                        0,
                        0,
                        0
                      );


                    ctrl.grabEl.innerText =
                      "AGGANCIATO";

                    ctrl.grabEl.style.color =
                      "#ffffff";

                  }

                  else {

                    let closest =
                      null;

                    let minDist =
                      4.0;


                    for (
                      const block
                      of blocks
                    ) {

                      const d =
                        ctrl.pos.distanceTo(
                          block.position
                        );


                      if (
                        d <
                        minDist
                      ) {

                        minDist = d;
                        closest = block;

                      }

                    }


                    if (
                      closest
                    ) {

                      ctrl.grabbedBlock =
                        closest;

                      closest.userData
                        .isGrabbed =
                        true;


                      ctrl.grabOffset
                        .copy(
                          ctrl.pos
                        )
                        .sub(
                          closest.position
                        );


                      setBlockHighlight(
                        closest,
                        'grab'
                      );

                    }

                  }

                }

                else {

                  if (
                    ctrl.grabbedBlock
                  ) {

                    setBlockHighlight(
                      ctrl.grabbedBlock,
                      'normal'
                    );


                    ctrl.grabbedBlock
                      .userData
                      .isGrabbed =
                      false;


                    ctrl.grabbedBlock =
                      null;

                  }


                  ctrl.grabEl.innerText =
                    "LIBERA";

                  ctrl.grabEl.style.color =
                    "#aaaaaa";

                }

              }

            }

            else {

              ctrl.active =
                false;

              ctrl.mesh.visible =
                false;

              ctrl.rayLine.visible =
                false;


              if (
                ctrl.grabbedBlock
              ) {

                setBlockHighlight(
                  ctrl.grabbedBlock,
                  'normal'
                );


                ctrl.grabbedBlock
                  .userData
                  .isGrabbed =
                  false;


                ctrl.grabbedBlock =
                  null;

              }


              ctrl.statusEl.innerText =
                "CERCA...";

              ctrl.statusEl.style.color =
                "#666666";

              ctrl.grabEl.innerText =
                "N/A";

            }

          }


          /* =====================================================
             PARTICLE ROTATION
             ===================================================== */

          if (
            currentMode ===
            'PARTICLES' &&
            numHands > 0
          ) {

            const landmarks1 =
              results
                .multiHandLandmarks[0];


            const h1Center =
              landmarks1[9];

            const wrist1 =
              landmarks1[0];


            targetRotZ =
              -Math.atan2(
                h1Center.y -
                  wrist1.y,

                h1Center.x -
                  wrist1.x
              ) -
              Math.PI / 2;


            targetRotX =
              (
                h1Center.y -
                0.5
              ) *
              Math.PI *
              3.5;


            targetRotY =
              (
                h1Center.x -
                0.5
              ) *
              Math.PI *
              4.5;


            if (
              numHands === 2
            ) {

              const landmarks2 =
                results
                  .multiHandLandmarks[1];


              const distBetweenHands =
                Math.hypot(

                  landmarks1[9].x -
                    landmarks2[9].x,

                  landmarks1[9].y -
                    landmarks2[9].y

                );


              targetScale =
                THREE.MathUtils.clamp(

                  THREE.MathUtils.mapLinear(
                    distBetweenHands,
                    0.2,
                    0.8,
                    0.8,
                    2.5
                  ),

                  0.6,
                  3.0

                );

            }

            else {

              const span =
                Math.hypot(

                  wrist1.x -
                    landmarks1[12].x,

                  wrist1.y -
                    landmarks1[12].y

                );


              targetScale =
                THREE.MathUtils.clamp(

                  THREE.MathUtils.mapLinear(
                    span,
                    0.15,
                    0.45,
                    0.8,
                    2.2
                  ),

                  0.6,
                  2.5

                );

            }

          }

        }
      );


      /* =====================================================
         CAMERA
         ===================================================== */

      const cameraUtils =
        new Camera(
          videoElement,
          {

            onFrame:
              async () => {

                const now =
                  performance.now();


                /*
                  Non mandiamo un frame a MediaPipe
                  se ne sta già elaborando uno.
                */

                if (
                  processingHands
                ) {
                  return;
                }


                /*
                  Massimo circa 24 elaborazioni/sec.
                */

                if (
                  now -
                  lastHandProcess <
                  HAND_INTERVAL
                ) {

                  return;

                }


                if (
                  videoElement.readyState <
                  2
                ) {

                  return;

                }


                lastHandProcess =
                  now;

                processingHands =
                  true;


                try {

                  await hands.send({
                    image:
                      videoElement
                  });

                }

                catch (error) {

                  processingHands =
                    false;

                  console.warn(
                    "MediaPipe frame error:",
                    error
                  );

                }

              },

            /*
              Risoluzione camera ridotta.
            */

            width: 320,
            height: 240

          }
        );


      try {

        cameraUtils.start();

      }

      catch (err) {

        console.warn(
          "Riflusso di avvio automatico camera...",
          err
        );


        setTimeout(
          () => {

            try {
              cameraUtils.start();
            }

            catch (e) {
              console.warn(
                "Camera non avviata:",
                e
              );
            }

          },
          1500
        );

      }

    }


    /* =========================================================
       ANIMATION
       ========================================================= */

    let lastAnimationTime =
      performance.now();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const now =
        performance.now();


      /*
        Delta time protetto.
      */

      const delta =
        Math.min(
          (now -
            lastAnimationTime) /
            16.67,
          2
        );


      lastAnimationTime =
        now;


      /* =====================================================
         BUILDER PHYSICS
         ===================================================== */

      if (
        currentMode ===
        'BUILDER'
      ) {

        const gravity =
          -0.06 *
          delta;


        blocks.forEach(
          block => {

            if (
              !block.userData
                .isGrabbed
            ) {

              block.userData
                .velocity
                .y += gravity;


              block.position.add(
                block.userData
                  .velocity
              );


              const floorY =
                -6 +
                (
                  block.userData
                    .size /
                  2
                );


              if (
                block.position.y <
                floorY
              ) {

                block.position.y =
                  floorY;

                block.userData
                  .velocity
                  .set(
                    0,
                    0,
                    0
                  );

              }

            }

          }
        );


        /*
          Collision builder.
          Funzione invariata, ma eseguita
          solamente in modalità BUILDER.
        */

        for (
          let i = 0;
          i < blocks.length;
          i++
        ) {

          const block =
            blocks[i];


          if (
            block.userData
              .isGrabbed
          ) {
            continue;
          }


          for (
            let j = i + 1;
            j < blocks.length;
            j++
          ) {

            const other =
              blocks[j];


            if (
              other.userData
                .isGrabbed
            ) {
              continue;
            }


            const dx =
              block.position.x -
              other.position.x;


            const dz =
              block.position.z -
              other.position.z;


            const distXZ =
              Math.sqrt(
                dx * dx +
                dz * dz
              );


            const limitDist =
              block.userData.size *
              0.8;


            if (
              distXZ <
              limitDist
            ) {

              const topOfOther =
                other.position.y +
                (
                  other.userData
                    .size /
                  2
                ) +
                (
                  block.userData
                    .size /
                  2
                );


              if (
                block.position.y <=
                topOfOther &&
                block.position.y >
                other.position.y
              ) {

                block.position.y =
                  topOfOther;

                block.userData
                  .velocity
                  .set(
                    0,
                    0,
                    0
                  );

              }

            }

          }

        }

      }


      /* =====================================================
         PARTICLES
         ===================================================== */

      if (
        currentMode ===
        'PARTICLES'
      ) {

        /*
          Interpolazione leggermente più morbida
          ma meno aggressiva sulla CPU.
        */

        const rotationLerp =
          0.22 *
          delta;

        const scaleLerp =
          0.22 *
          delta;


        particleGroup.rotation.x +=
          (
            targetRotX -
            particleGroup.rotation.x
          ) *
          rotationLerp;


        particleGroup.rotation.y +=
          (
            targetRotY +
            0.003 -
            particleGroup.rotation.y
          ) *
          rotationLerp;


        particleGroup.rotation.z +=
          (
            targetRotZ -
            particleGroup.rotation.z
          ) *
          rotationLerp;


        handExpansionScale +=
          (
            targetScale -
            handExpansionScale
          ) *
          scaleLerp;


        camera.position.z +=
          (
            targetCamZ -
            camera.position.z
          ) *
          scaleLerp;


        const isPinchingAny =
          (
            controllers[0].active &&
            controllers[0].isPinching
          ) ||
          (
            controllers[1].active &&
            controllers[1].isPinching
          );


        const positions =
          particleGeometry
            .attributes
            .position
            .array;


        /*
          Ottimizzazione:
          calcoliamo direttamente il limite.
        */

        const total =
          PARTICLE_COUNT * 3;


        for (
          let i = 0;
          i < total;
          i += 3
        ) {

          let tx =
            targetPositions[i] *
            handExpansionScale;


          let ty =
            targetPositions[i + 1] *
            handExpansionScale;


          let tz =
            targetPositions[i + 2] *
            handExpansionScale;


          let lerpSpeed =
            0.24;


          /*
            Pinch: solo metà particelle
            come nel comportamento originale.
          */

          if (
            isPinchingAny &&
            (
              (i / 3) % 2 === 0
            )
          ) {

            tx *= 0.01;
            ty *= 0.01;
            tz *= 0.01;

            lerpSpeed =
              0.65;

          }


          positions[i] +=
            (
              tx -
              positions[i]
            ) *
            lerpSpeed;


          positions[i + 1] +=
            (
              ty -
              positions[i + 1]
            ) *
            lerpSpeed;


          positions[i + 2] +=
            (
              tz -
              positions[i + 2]
            ) *
            lerpSpeed;

        }


        particleGeometry
          .attributes
          .position
          .needsUpdate =
          true;

      }


      renderer.render(
        scene,
        camera
      );

    }


    /* =========================================================
       RESIZE
       ========================================================= */

    function onWindowResize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;


      camera.updateProjectionMatrix();


      renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
      );


      /*
        Pixel ratio volutamente mantenuto a 1.
      */

      renderer.setPixelRatio(
        1
      );

    }


    /* =========================================================
       UI EVENTS
       ========================================================= */

    document
      .getElementById(
        'shape-select'
      )
      .addEventListener(
        'change',
        e => {

          generateShape(
            e.target.value
          );

        }
      );


    document
      .getElementById(
        'color-picker'
      )
      .addEventListener(
        'input',
        e => {

          if (
            particleMaterial
          ) {

            particleMaterial.color.set(
              e.target.value
            );

          }

        }
      );


    /* =========================================================
       START
       ========================================================= */

    window.addEventListener(
      'load',
      () => {

        initThree();

        initHandTracking();

        animate();

      }
    );

  </script>

</body>
</html>
