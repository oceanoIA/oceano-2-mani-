<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STARK KINETIC LAB v15</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root{
  --green:#00ffcc;
  --pink:#ff00aa;
  --yellow:#ffe66d;
  --cyan:#00e8ff;
  --dim:rgba(255,255,255,0.45);
  --line:rgba(255,255,255,0.12);
  --panel:rgba(8,11,15,0.78);
}

* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
body {
  font-family:'Share Tech Mono', monospace;
  background:#000; color:#fff; overflow:hidden;
  position:fixed; inset:0;
}

#canvas-container { position:absolute; inset:0; z-index:1; }

.hud-scanline {
  position:fixed; inset:0; z-index:5; pointer-events:none;
  background:repeating-linear-gradient(to bottom, transparent 0px, transparent 4px, rgba(0,255,204,0.035) 5px);
  mix-blend-mode:screen;
}

.stark-header {
  position:absolute; top:0; left:0; right:0; height:58px;
  background:rgba(5,8,12,0.85); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; z-index:20; font-family:Orbitron, sans-serif;
}

.stark-title {
  font-size:14px; font-weight:900; letter-spacing:3.5px;
  text-shadow:0 0 20px var(--green);
}

.status {
  font-size:9px; padding:4px 14px; border:1px solid var(--green);
  border-radius:30px; color:var(--green); letter-spacing:1px;
}

.mode-dock {
  position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
  background:rgba(8,11,15,0.9); border:1px solid var(--line);
  border-radius:40px; padding:6px; display:flex; gap:6px; z-index:30;
  backdrop-filter:blur(16px);
}

.tab-btn {
  padding:10px 26px; font-size:10px; font-weight:500; letter-spacing:2px;
  border-radius:30px; cursor:pointer; transition:all 0.3s;
  border:1px solid transparent;
}

.tab-btn.active {
  background:rgba(0,255,204,0.12); color:var(--green);
  border:1px solid var(--green); box-shadow:0 0 25px rgba(0,255,204,0.3);
}

.ui-overlay {
  position:absolute; top:78px; left:24px; width:280px;
  background:var(--panel); border:1px solid var(--line);
  border-radius:20px; padding:20px 18px; z-index:20;
  backdrop-filter:blur(16px); box-shadow:0 20px 40px rgba(0,0,0,0.7);
}

label {
  font-size:8.5px; letter-spacing:1.5px; color:var(--dim);
  margin-bottom:6px; display:block;
}

select, input[type="color"] {
  width:100%; height:38px; background:rgba(255,255,255,0.04);
  border:1px solid var(--line); border-radius:12px; color:white;
  font-family:inherit; padding:0 12px;
}

.telemetry {
  margin-top:24px; font-size:9px; line-height:1.8;
  border-top:1px solid var(--line); padding-top:14px;
}

.telemetry-item {
  display:flex; justify-content:space-between; margin:4px 0;
  color:var(--dim);
}

.telemetry-item strong { color:#fff; font-weight:normal; }

.camera-preview {
  position:absolute; right:24px; bottom:32px; width:220px; height:165px;
  border:1px solid var(--line); border-radius:18px; overflow:hidden;
  background:#05080c; box-shadow:0 15px 35px rgba(0,0,0,0.8);
}

#hand-preview-canvas { width:100%; height:100%; transform:scaleX(-1); }

.preview-tag {
  position:absolute; top:10px; left:10px; font-size:7.5px;
  background:rgba(0,0,0,0.7); padding:3px 9px; border-radius:20px;
  border:1px solid var(--line); color:var(--dim);
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

</head>
<body>

<video id="video-input" autoplay playsinline muted></video>
<div id="canvas-container"></div>
<div class="hud-scanline"></div>

<header class="stark-header">
  <div class="stark-title">STARK KINETIC LAB <span style="color:#00ffcc; font-size:11px;">v15</span></div>
  <div class="status" id="connection-status">LINK ESTABLISHED</div>
</header>

<nav class="mode-dock">
  <button id="tab-particles" class="tab-btn active">PLASMA MATRIX</button>
  <button id="tab-builder" class="tab-btn">NEURAL BUILDER</button>
</nav>

<section class="ui-overlay">
  <div id="panel-title" style="font-family:Orbitron; font-size:11px; letter-spacing:2px; color:var(--green); margin-bottom:16px;">
    PLASMA MATRIX v15
  </div>

  <div id="particles-controls">
    <label>HOLOGRAPHIC TEMPLATE</label>
    <select id="shape-select"></select>
    <label style="margin-top:16px;">CORE EMISSION</label>
    <input type="color" id="color-picker" value="#00ffcc">
  </div>

  <div id="builder-controls" class="hidden">
    <label>SPATIAL OBJECT</label>
    <select id="builder-select">
      <option value="cube">CUBE</option>
      <option value="sphere">SPHERE</option>
      <option value="torus">TORUS</option>
      <option value="icosahedron">ICOSAHEDRON</option>
    </select>
    <button id="clear-btn" style="margin-top:18px; width:100%; height:38px; background:transparent; border:1px solid var(--line); color:var(--yellow);">
      RESET FIELD
    </button>
  </div>

  <div class="telemetry">
    <div class="telemetry-item"><span>SYSTEM</span><strong id="telemetry-mode">PARTICLES</strong></div>
    <div class="telemetry-item"><span>FPS</span><strong id="fps-value">00</strong></div>
    <div class="telemetry-item"><span>GESTURE</span><strong id="gesture" style="color:var(--yellow)">OPEN</strong></div>
    <div class="telemetry-item"><span>TRACKING</span><strong id="mp-status" style="color:var(--green)">ACTIVE</strong></div>
  </div>
</section>

<div class="camera-preview">
  <div class="preview-tag">OPTICAL FEED</div>
  <canvas id="hand-preview-canvas" width="220" height="165"></canvas>
</div>

<script>
// ====================== STARK KINETIC LAB v15 ======================
const IS_MOBILE = innerWidth < 820;

const CONFIG = {
  particles: IS_MOBILE ? 3400 : 5200,
  bloomStrength: 1.65,
  bloomRadius: 0.55,
  bloomThreshold: 0.12,
  handSmooth: 0.68,
  pinchThreshold: 0.09,
  sensitivity: 0.75
};

let scene, camera, renderer, composer, bloomPass;
let particleSystem, particleMaterial;
let currentMode = "PARTICLES";
let targetRotX = 0, targetRotY = 0, targetRotZ = 0;
let targetScale = 1, currentScale = 1;
let lastCenter = new THREE.Vector3();
let lastAngle = 0;
let hasLast = false;

const targetPos = new Float32Array(CONFIG.particles * 3);
const $ = id => document.getElementById(id);

const dom = {
  shapeSelect: $('shape-select'),
  colorPicker: $('color-picker'),
  builderSelect: $('builder-select'),
  clearBtn: $('clear-btn'),
  tabParticles: $('tab-particles'),
  tabBuilder: $('tab-builder'),
  particlesControls: $('particles-controls'),
  builderControls: $('builder-controls'),
  panelTitle: $('panel-title'),
  fps: $('fps-value'),
  gesture: $('gesture'),
  mpStatus: $('mp-status'),
  connection: $('connection-status')
};

const sounds = { enabled: true, ctx: null };
function initAudio() {
  if (!sounds.ctx) sounds.ctx = new (window.AudioContext || window.webkitAudioContext)();
}

// ====================== SHAPES ======================
const shapes = {
  reactor: i => ({ x: Math.cos(i*0.1)* (4 + Math.sin(i*0.3)*2), y: Math.sin(i*0.15)*5, z: Math.sin(i*0.1)*6 }),
  galaxy: i => {
    const a = i * 0.08; const r = Math.sqrt(i) * 0.35;
    return { x: Math.cos(a)*r, y: (Math.random()-0.5)*4, z: Math.sin(a)*r };
  },
  vortex: i => ({ x: Math.cos(i*0.12)*(5+i*0.008), y: i*0.025-8, z: Math.sin(i*0.12)*(5+i*0.008) }),
  heart: i => {
    const t = i * 0.025;
    return { x: Math.sin(t)*6, y: (Math.cos(t)-0.5*Math.cos(2*t))*4-2, z: Math.random()*4-2 };
  },
  nebula: i => ({ x: (Math.random()-0.5)*18, y: (Math.random()-0.5)*14, z: (Math.random()-0.5)*12 })
};

// ====================== THREE.JS ======================
function initThree() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0, 3, 28);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));

  bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), CONFIG.bloomStrength, CONFIG.bloomRadius, CONFIG.bloomThreshold);
  composer.addPass(bloomPass);

  initParticles();
  scene.add(new THREE.AmbientLight(0x112233, 0.7));
}

function initParticles() {
  const geo = new THREE.BufferGeometry();
  for (let i = 0; i < CONFIG.particles*3; i++) targetPos[i] = (Math.random()-0.5)*24;
  geo.setAttribute('position', new THREE.BufferAttribute(targetPos, 3));

  particleMaterial = new THREE.PointsMaterial({
    size: IS_MOBILE ? 0.18 : 0.23,
    transparent: true,
    opacity: 0.92,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexColors: true
  });

  particleSystem = new THREE.Points(geo, particleMaterial);
  scene.add(particleSystem);
  generateShape('reactor');
}

function generateShape(name) {
  const pos = particleSystem.geometry.attributes.position.array;
  const fn = shapes[name] || shapes.reactor;
  for (let i = 0; i < CONFIG.particles; i++) {
    const p = fn(i);
    const idx = i*3;
    pos[idx] = p.x; pos[idx+1] = p.y; pos[idx+2] = p.z;
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;
}

// ====================== HAND TRACKING ======================
async function initHands() {
  const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
  hands.setOptions({ maxNumHands: 2, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

  const ctx = $('hand-preview-canvas').getContext('2d');

  hands.onResults(res => {
    ctx.clearRect(0,0,220,165);
    ctx.fillStyle = 'rgba(5,8,12,0.95)';
    ctx.fillRect(0,0,220,165);

    const gesture = (res.multiHandLandmarks?.[0] && 
      Math.hypot(res.multiHandLandmarks[0][4].x - res.multiHandLandmarks[0][8].x,
                 res.multiHandLandmarks[0][4].y - res.multiHandLandmarks[0][8].y) < CONFIG.pinchThreshold) 
      ? "PINCH" : "OPEN";

    dom.gesture.textContent = gesture;
    dom.gesture.style.color = gesture === "PINCH" ? "var(--yellow)" : "var(--green)";

    // Simple hand drawing
    if (res.multiHandLandmarks) {
      res.multiHandLandmarks.forEach(landmarks => {
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        for (let i = 0; i < landmarks.length-1; i++) {
          ctx.beginPath();
          ctx.moveTo(landmarks[i].x*220, landmarks[i].y*165);
          ctx.lineTo(landmarks[i+1].x*220, landmarks[i+1].y*165);
          ctx.stroke();
        }
      });
    }
  });

  const camera = new Camera($('video-input'), {
    onFrame: async () => await hands.send({image: $('video-input')}),
    width: 320, height: 240
  });
  await camera.start();
}

// ====================== ANIMATION ======================
let last = performance.now(), fpsTime = performance.now(), fpsFrames = 0;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const delta = (now - last)/16;
  last = now;

  particleSystem.rotation.x = THREE.MathUtils.lerp(particleSystem.rotation.x, targetRotX, 0.12);
  particleSystem.rotation.y = THREE.MathUtils.lerp(particleSystem.rotation.y, targetRotY, 0.12);
  particleSystem.rotation.z = THREE.MathUtils.lerp(particleSystem.rotation.z, targetRotZ, 0.12);
  
  currentScale = THREE.MathUtils.lerp(currentScale, targetScale, 0.08);
  particleSystem.scale.setScalar(currentScale);

  composer.render();

  fpsFrames++;
  if (now - fpsTime > 800) {
    dom.fps.textContent = (fpsFrames * 1000 / (now - fpsTime)).toFixed(0);
    fpsFrames = 0; fpsTime = now;
  }
}

// ====================== UI ======================
function switchMode(mode) {
  currentMode = mode;
  dom.panelTitle.textContent = mode === "PARTICLES" ? "PLASMA MATRIX v15" : "NEURAL BUILDER v15";
  dom.particlesControls.classList.toggle("hidden", mode !== "PARTICLES");
  dom.builderControls.classList.toggle("hidden", mode !== "BUILDER");
  dom.tabParticles.classList.toggle("active", mode === "PARTICLES");
  dom.tabBuilder.classList.toggle("active", mode === "BUILDER");
}

function initUI() {
  Object.keys(shapes).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = key.toUpperCase();
    dom.shapeSelect.appendChild(opt);
  });

  dom.shapeSelect.onchange = e => generateShape(e.target.value);
  dom.colorPicker.oninput = e => particleMaterial.color.set(e.target.value);
  dom.clearBtn.onclick = () => console.log('%cField Reset', 'color:#ffe66d');

  dom.tabParticles.onclick = () => switchMode("PARTICLES");
  dom.tabBuilder.onclick = () => switchMode("BUILDER");

  initAudio();
}

// ====================== START ======================
window.addEventListener('load', async () => {
  initThree();
  initUI();
  await initHands();
  animate();

  dom.connection.textContent = "NEURAL LINK ACTIVE";
  console.log('%cSTARK KINETIC LAB v15 — Minimal Future Mode', 'color:#00ffcc; font-size:14px');
});
</script>
</body>
</html>
