<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STARK KINETIC LAB v16 • NEURAL CORE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --green:#00ffcc;
  --pink:#ff00aa;
  --yellow:#ffe66d;
  --bg:#05080c;
}

* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
body {
  font-family:'Inter', system-ui;
  background:var(--bg); color:#fff; overflow:hidden;
  position:fixed; inset:0;
}

#canvas-container { position:absolute; inset:0; z-index:1; }

.header {
  position:absolute; top:0; left:0; right:0; height:52px;
  background:rgba(5,8,12,0.75); backdrop-filter:blur(24px);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; z-index:100; border-bottom:1px solid rgba(0,255,204,0.1);
  font-family:'Orbitron', sans-serif; font-size:13px; letter-spacing:2px;
}

.status {
  font-size:9px; padding:5px 16px; border:1px solid var(--green);
  border-radius:30px; color:var(--green); background:rgba(0,255,204,0.08);
}

.dock {
  position:absolute; bottom:32px; left:50%; transform:translateX(-50%);
  background:rgba(8,12,18,0.85); border:1px solid rgba(0,255,204,0.2);
  border-radius:50px; padding:5px; display:flex; gap:4px; z-index:100;
  backdrop-filter:blur(20px);
}

.tab {
  padding:10px 28px; font-size:10px; font-weight:500; letter-spacing:1.5px;
  border-radius:50px; cursor:pointer; transition:0.4s;
}

.tab.active {
  background:rgba(0,255,204,0.15); color:var(--green); box-shadow:0 0 25px rgba(0,255,204,0.4);
}

.panel {
  position:absolute; top:78px; left:28px; width:260px; padding:20px;
  background:rgba(8,12,18,0.65); border:1px solid rgba(0,255,204,0.15);
  border-radius:18px; backdrop-filter:blur(20px); z-index:90;
  font-size:9.5px; letter-spacing:0.8px;
}

.label { color:#00ffcc88; margin:18px 0 6px; font-size:8px; letter-spacing:1.8px; }

select, input[type=color] {
  width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(0,255,204,0.3);
  border-radius:10px; color:white; height:42px; padding:0 14px;
}

.preview {
  position:absolute; right:28px; bottom:32px; width:200px; height:150px;
  border:1px solid rgba(0,255,204,0.25); border-radius:16px; overflow:hidden;
  background:#00000088; backdrop-filter:blur(10px);
}

.preview-tag {
  position:absolute; top:8px; left:8px; font-size:7px; padding:2px 8px;
  background:rgba(0,0,0,0.6); border:1px solid var(--green); border-radius:20px;
  color:var(--green);
}

.telemetry {
  margin-top:24px; font-size:8.5px; line-height:1.9; opacity:0.85;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>

</head>
<body>

<video id="video-input" autoplay playsinline muted></video>
<div id="canvas-container"></div>

<header class="header">
  <div>STARK NEURAL CORE <span style="color:#00ffcc;font-size:11px;">v16</span></div>
  <div class="status" id="status">NEURAL LINK • LIVE</div>
</header>

<nav class="dock">
  <button id="tab-particles" class="tab active">NEURAL FIELD</button>
  <button id="tab-builder" class="tab">SPATIAL FORGE</button>
</nav>

<section class="panel">
  <div id="title" style="color:#00ffcc; font-family:Orbitron; font-size:12px; letter-spacing:3px;">NEURAL FIELD v16</div>
  
  <div id="particles-ui">
    <div class="label">NEURAL ARCHITECTURE</div>
    <select id="shape-select"></select>
    <div class="label" style="margin-top:14px;">EMISSION SPECTRUM</div>
    <input type="color" id="color-picker" value="#00ffcc">
  </div>

  <div id="builder-ui" class="hidden">
    <div class="label">FORGE PROTOCOL</div>
    <select id="builder-select">
      <option value="cube">CUBE NODE</option>
      <option value="sphere">SPHERE NODE</option>
      <option value="torus">TORUS NODE</option>
    </select>
  </div>

  <div class="telemetry">
    <div>GESTURE <span id="gesture" style="color:#ffe66d;float:right;">OPEN</span></div>
    <div>FPS <span id="fps" style="float:right;">—</span></div>
    <div>CONNECTION <span id="tracking" style="color:#00ffcc;float:right;">STABLE</span></div>
  </div>
</section>

<div class="preview">
  <div class="preview-tag">NEURAL OPTICS</div>
  <canvas id="hand-preview-canvas" width="200" height="150"></canvas>
</div>

<script>
// ====================== STARK v16 - NEURAL FUTURE ======================
const CONFIG = {
  particles: 4800,
  connections: 1200,
  bloom: 1.85,
  sensitivity: 0.82
};

let scene, camera, renderer, composer, bloom;
let particles, lines;
let positions, colors;
let currentMode = "PARTICLES";

const $ = id => document.getElementById(id);
const dom = {
  shapeSelect: $('shape-select'),
  colorPicker: $('color-picker'),
  gesture: $('gesture'),
  fps: $('fps'),
  tracking: $('tracking'),
  status: $('status'),
  title: $('title'),
  particlesUI: $('particles-ui'),
  builderUI: $('builder-ui'),
  tabP: $('tab-particles'),
  tabB: $('tab-builder')
};

let targetRX = 0, targetRY = 0, targetRZ = 0;
let scaleTarget = 1, scaleCurrent = 1;
let lastHandPos = new THREE.Vector3();
let hasHandData = false;

// ====================== NEURAL PARTICLES ======================
function createNeuralField() {
  const geo = new THREE.BufferGeometry();
  positions = new Float32Array(CONFIG.particles * 3);
  colors = new Float32Array(CONFIG.particles * 3);

  for (let i = 0; i < CONFIG.particles; i++) {
    const i3 = i * 3;
    positions[i3]   = (Math.random()-0.5) * 28;
    positions[i3+1] = (Math.random()-0.5) * 28;
    positions[i3+2] = (Math.random()-0.5) * 28;

    colors[i3] = 0.2; colors[i3+1] = 1.0; colors[i3+2] = 0.8;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.085,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  particles = new THREE.Points(geo, mat);
  scene.add(particles);

  // Neural Connections
  const lineGeo = new THREE.BufferGeometry();
  const linePos = new Float32Array(CONFIG.connections * 6);
  lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
  
  const lineMat = new THREE.LineBasicMaterial({
    color: 0x00ffcc,
    transparent: true,
    opacity: 0.1,
    blending: THREE.AdditiveBlending
  });

  lines = new THREE.LineSegments(lineGeo, lineMat);
  scene.add(lines);
}

function updateNeuralConnections() {
  const pos = particles.geometry.attributes.position.array;
  const linePos = lines.geometry.attributes.position.array;
  let count = 0;

  for (let i = 0; i < CONFIG.particles && count < CONFIG.connections*6; i += 8) {
    for (let j = i+1; j < i+25 && count < CONFIG.connections*6; j++) {
      const dx = pos[i*3] - pos[j*3];
      const dy = pos[i*3+1] - pos[j*3+1];
      const dz = pos[i*3+2] - pos[j*3+2];
      
      if (dx*dx + dy*dy + dz*dz < 35) {
        linePos[count++] = pos[i*3];
        linePos[count++] = pos[i*3+1];
        linePos[count++] = pos[i*3+2];
        linePos[count++] = pos[j*3];
        linePos[count++] = pos[j*3+1];
        linePos[count++] = pos[j*3+2];
      }
    }
  }
  lines.geometry.attributes.position.needsUpdate = true;
  lines.geometry.setDrawRange(0, count/3);
}

// ====================== INIT ======================
function initThree() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0, 2, 32);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));

  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), CONFIG.bloom, 0.6, 0.1);
  composer.addPass(bloom);

  createNeuralField();
  scene.add(new THREE.AmbientLight(0x112233, 0.6));
}

async function initHands() {
  const hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  hands.setOptions({ maxNumHands: 2, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

  const ctx = $('hand-preview-canvas').getContext('2d');

  hands.onResults(r => {
    ctx.clearRect(0,0,200,150);
    ctx.fillStyle = '#05080c';
    ctx.fillRect(0,0,200,150);

    if (r.multiHandLandmarks?.length) {
      dom.tracking.textContent = "LOCKED";
      dom.tracking.style.color = "#00ffcc";

      const lm = r.multiHandLandmarks[0];
      const pinchDist = Math.hypot(lm[4].x-lm[8].x, lm[4].y-lm[8].y);
      
      dom.gesture.textContent = pinchDist < 0.09 ? "PINCH" : "OPEN";
      dom.gesture.style.color = pinchDist < 0.09 ? "#ffe66d" : "#00ffcc";

      updateFromHand(lm);
    } else {
      dom.tracking.textContent = "SEARCHING";
      dom.tracking.style.color = "#ff00aa";
    }
  });

  const cam = new Camera($('video-input'), {
    onFrame: async () => await hands.send({image: $('video-input')}),
    width: 320, height: 240
  });
  await cam.start();
}

function updateFromHand(landmarks) {
  const centerX = (landmarks[0].x + landmarks[9].x) * 0.5;
  const centerY = (landmarks[0].y + landmarks[9].y) * 0.5;

  const ndcX = (1 - centerX) * 2 - 1;
  const ndcY = -(centerY * 2 - 1);

  const vec = new THREE.Vector3(ndcX, ndcY, 0.6);
  vec.unproject(camera);

  if (hasHandData) {
    targetRY += (vec.x - lastHandPos.x) * CONFIG.sensitivity;
    targetRX += (vec.y - lastHandPos.y) * CONFIG.sensitivity * -1;
    scaleTarget = THREE.MathUtils.clamp(scaleTarget + (landmarks[4].z - landmarks[8].z) * 8, 0.6, 2.2);
  }

  lastHandPos.set(vec.x, vec.y, 0);
  hasHandData = true;
}

// ====================== ANIMATION ======================
let lastTime = performance.now(), frames = 0, fpsTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();

  particles.rotation.x = THREE.MathUtils.lerp(particles.rotation.x, targetRX, 0.1);
  particles.rotation.y = THREE.MathUtils.lerp(particles.rotation.y, targetRY, 0.1);
  particles.rotation.z = THREE.MathUtils.lerp(particles.rotation.z, targetRZ, 0.08);

  scaleCurrent = THREE.MathUtils.lerp(scaleCurrent, scaleTarget, 0.12);
  particles.scale.setScalar(scaleCurrent);
  lines.scale.setScalar(scaleCurrent);

  updateNeuralConnections();

  composer.render();

  frames++;
  if (now - fpsTime > 700) {
    dom.fps.textContent = Math.round(frames * 1000 / (now - fpsTime));
    frames = 0; fpsTime = now;
  }
}

// ====================== UI ======================
function initUI() {
  const architectures = ["reactor","galaxy","vortex","heart","nebula"];
  architectures.forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name.toUpperCase();
    dom.shapeSelect.appendChild(o);
  });

  dom.shapeSelect.onchange = e => {
    // Placeholder - puoi espandere la funzione generateShape se vuoi
    console.log("%cNeural architecture changed → " + e.target.value, "color:#00ffcc");
  };

  dom.colorPicker.oninput = e => {
    particles.material.color.set(e.target.value);
  };

  dom.tabP.onclick = () => {
    currentMode = "PARTICLES";
    dom.title.textContent = "NEURAL FIELD v16";
    dom.particlesUI.classList.remove("hidden");
    dom.builderUI.classList.add("hidden");
    dom.tabP.classList.add("active");
    dom.tabB.classList.remove("active");
  };

  dom.tabB.onclick = () => {
    currentMode = "BUILDER";
    dom.title.textContent = "SPATIAL FORGE v16";
    dom.particlesUI.classList.add("hidden");
    dom.builderUI.classList.remove("hidden");
    dom.tabP.classList.remove("active");
    dom.tabB.classList.add("active");
  };
}

// ====================== START ======================
window.addEventListener('load', async () => {
  initThree();
  initUI();
  await initHands();
  animate();

  console.log("%cSTARK KINETIC LAB v16 — Neural Future Initialized", "color:#00ffcc; font-size:15px");
});
</script>
</body>
</html>
