<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STARK KINETIC LAB v14 // VISION PRO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root{
  --green:#00ffcc;
  --pink:#ff00aa;
  --yellow:#ffe66d;
  --cyan:#00e8ff;
  --line:rgba(255,255,255,.18);
  --panel:rgba(6,9,12,.82);
}

*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
body{
  font-family:'Share Tech Mono',monospace;
  background:#000;color:#fff;overflow:hidden;
  position:fixed;inset:0;
}

#canvas-container{position:absolute;inset:0;z-index:1;}

.hud-scanline{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 4px,rgba(0,255,220,.025) 5px);
  mix-blend-mode:screen;
}

.stark-header{
  position:absolute;top:0;left:0;right:0;height:64px;
  background:rgba(5,8,12,.85);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  z-index:10;font-family:Orbitron,sans-serif;
}

.stark-title{font-size:15px;font-weight:900;letter-spacing:3px;text-shadow:0 0 20px var(--green);}
.security-badge{font-size:9px;padding:4px 12px;border:1px solid var(--green);border-radius:20px;color:var(--green);}

.mode-dock{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(8,10,14,.9);border:1px solid var(--line);border-radius:30px;
  padding:8px;display:flex;gap:10px;z-index:20;backdrop-filter:blur(12px);
}

.tab-btn{
  padding:11px 22px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  border-radius:16px;font-size:10px;letter-spacing:1.5px;cursor:pointer;transition:.25s;
}

.tab-btn.active,.tab-btn:hover{
  background:rgba(0,255,200,.12);border-color:var(--green);color:var(--green);box-shadow:0 0 20px rgba(0,255,200,.4);
}

.ui-overlay{
  position:absolute;top:82px;left:20px;width:310px;max-height:calc(100vh - 180px);
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:18px;overflow-y:auto;backdrop-filter:blur(14px);z-index:10;
}

label{display:block;font-size:9px;letter-spacing:1px;color:#888;margin:14px 0 6px;}
select,input[type=color],.stark-btn{
  width:100%;height:42px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:12px;color:white;font:inherit;padding:0 12px;
}

.stark-btn{cursor:pointer;}
.stark-btn:hover{border-color:var(--green);background:rgba(0,255,200,.1);}

.telemetry-box{margin-top:20px;padding:14px;background:rgba(0,0,0,.6);border-radius:16px;border:1px solid #222;}
.telemetry-row{display:flex;justify-content:space-between;margin:6px 0;font-size:9px;}

.camera-preview-container{
  position:absolute;right:20px;bottom:90px;width:260px;height:195px;
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.8);background:#05070a;
}

#hand-preview-canvas{width:100%;height:100%;transform:scaleX(-1);}
.preview-hud-tag{
  position:absolute;top:8px;left:8px;background:rgba(0,0,0,.8);
  padding:4px 10px;border:1px solid var(--line);border-radius:8px;font-size:8px;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

</head>
<body>

<video id="video-input" autoplay playsinline muted></video>
<div id="canvas-container"></div>
<div class="hud-scanline"></div>

<header class="stark-header">
  <div class="stark-title">
    STARK KINETIC LAB <span class="security-badge">v14</span>
  </div>
  <span id="connection-status" style="color:#00ffcc">CAM: ONLINE</span>
</header>

<nav class="mode-dock">
  <button id="tab-builder" class="tab-btn">SYS 01 • BUILDER</button>
  <button id="tab-particles" class="tab-btn active">SYS 02 • PLASMA MATRIX</button>
</nav>

<section class="ui-overlay" id="main-panel">
  <div style="font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:2px;margin-bottom:12px;">
    <span id="panel-title-text">PLASMA MATRIX v14</span>
  </div>

  <div id="controls-particles">
    <label>HOLOGRAM TEMPLATE</label>
    <select id="shape-select"></select>
    <label>PLASMA COLOR</label>
    <input type="color" id="color-picker" value="#00ffcc">
  </div>

  <div id="controls-builder" class="hidden">
    <label>SPAWN OBJECT</label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
      <button class="stark-btn spawn-btn" data-shape="cube">CUBE</button>
      <button class="stark-btn spawn-btn" data-shape="sphere">SPHERE</button>
      <button class="stark-btn spawn-btn" data-shape="torus">TORUS</button>
      <button class="stark-btn spawn-btn" data-shape="icosahedron">ICOSAHEDRON</button>
    </div>
    <button id="clear-btn" class="stark-btn" style="margin-top:16px;">RESET SCENE</button>
  </div>

  <button id="audio-toggle-btn" class="stark-btn" style="margin-top:20px;width:100%;">🔊 AUDIO REACTOR: ACTIVE</button>

  <div class="telemetry-box">
    <div class="telemetry-row"><span>MODE</span><strong id="telemetry-mode">PARTICLES</strong></div>
    <div class="telemetry-row"><span>FPS</span><strong id="fps-value">—</strong></div>
    <div class="telemetry-row"><span>GESTURE</span><strong id="gesture-status" style="color:#ffe66d">OPEN</strong></div>
    <div class="telemetry-row"><span>HAND STATUS</span><strong id="mp-status">TRACKING</strong></div>
  </div>
</section>

<div class="camera-preview-container">
  <span class="preview-hud-tag">OPTICAL HAND FEED v14</span>
  <canvas id="hand-preview-canvas" width="260" height="195"></canvas>
</div>

<script>
// ====================== STARK KINETIC LAB v14 ======================
'use strict';

const IS_MOBILE = innerWidth < 800 || /Mobi|Android/i.test(navigator.userAgent);

const CONFIG = {
  particles: IS_MOBILE ? 3200 : 4800,
  bloomStrength: 2.4,
  bloomRadius: 0.8,
  bloomThreshold: 0.15,
  handSmooth: 0.65,
  pinchThreshold: 0.085,
  axisSensitivity: 0.72,
  rollSensitivity: 0.48,
};

let scene, camera, renderer, composer, bloomPass;
let particleSystem, particleMaterial;
let currentMode = 'PARTICLES';
let targetRotX = 0, targetRotY = 0, targetRotZ = 0;
let targetScale = 1, currentScale = 1;
let lastCenter = new THREE.Vector3();
let lastAngle = 0;
let hasLastData = false;

const targetPositions = new Float32Array(CONFIG.particles * 3);
const $ = id => document.getElementById(id);

const dom = {
  connection: $('connection-status'),
  panelTitle: $('panel-title-text'),
  shapeSelect: $('shape-select'),
  colorPicker: $('color-picker'),
  audioBtn: $('audio-toggle-btn'),
  tabBuilder: $('tab-builder'),
  tabParticles: $('tab-particles'),
  builderPanel: $('controls-builder'),
  particlesPanel: $('controls-particles'),
  fps: $('fps-value'),
  gesture: $('gesture-status'),
  mpStatus: $('mp-status'),
  previewCanvas: $('hand-preview-canvas'),
  clearBtn: $('clear-btn')
};

const sounds = {
  ctx: null,
  enabled: true,
  init(){ if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); },
  play(freq = 420, duration = 0.06, type = 'sine'){
    if(!this.enabled || !this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = 0.2; g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
    o.connect(g).connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + duration);
  }
};

// ====================== SHAPE GENERATORS ======================
const shapeGenerators = {
  jupiter: i => {
    const a = Math.random()*Math.PI*2, r = i < CONFIG.particles*0.65 ? 7 : 11;
    return {x: Math.cos(a)*r, y: (Math.random()-0.5)*4, z: Math.sin(a)*r};
  },
  galaxy: i => {
    const arm = i%5, r = Math.pow(Math.random(),1.6)*16;
    const a = r*0.4 + arm*Math.PI*0.72;
    return {x: Math.cos(a)*r, y: (Math.random()-0.5)*5, z: Math.sin(a)*r*0.6};
  },
  heart: i => {
    const t = Math.random()*Math.PI*2;
    return {
      x: 5.5 * Math.pow(Math.sin(t),3),
      y: (13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*0.6,
      z: (Math.random()-0.5)*5
    };
  },
  reactor: i => {
    const a = i/CONFIG.particles * Math.PI*12;
    const r = 4 + Math.sin(a*3)*2;
    return {x: Math.cos(a)*r, y: Math.sin(a*2)*3, z: Math.sin(a)*r};
  },
  vortex: i => {
    const t = i/CONFIG.particles * 18;
    return {x: Math.cos(t)* (3+t*0.3), y: t-9, z: Math.sin(t)*(3+t*0.3)};
  },
  dna: i => {
    const t = i/CONFIG.particles * Math.PI*14;
    const side = i%2 ? 1 : -1;
    return {x: Math.sin(t)*4.5*side, y: t*1.1-10, z: Math.cos(t)*4.5*side};
  }
};

// ====================== INIT THREE.JS ======================
function initThree() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0, 4, 26);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));

  bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(innerWidth, innerHeight),
    CONFIG.bloomStrength, CONFIG.bloomRadius, CONFIG.bloomThreshold
  );
  composer.addPass(bloomPass);

  initParticles();
  scene.add(new THREE.AmbientLight(0x112233, 0.6));
}

// ====================== PARTICLES ======================
function initParticles() {
  const geometry = new THREE.BufferGeometry();
  for (let i = 0; i < CONFIG.particles*3; i++) {
    targetPositions[i] = (Math.random()-0.5)*22;
  }
  geometry.setAttribute('position', new THREE.BufferAttribute(targetPositions, 3));

  particleMaterial = new THREE.PointsMaterial({
    size: IS_MOBILE ? 0.19 : 0.24,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexColors: true
  });

  particleSystem = new THREE.Points(geometry, particleMaterial);
  scene.add(particleSystem);

  generateShape('reactor');
}

// ====================== GENERATE SHAPE ======================
function generateShape(type) {
  const pos = particleSystem.geometry.attributes.position.array;
  const gen = shapeGenerators[type] || shapeGenerators.reactor;

  for (let i = 0; i < CONFIG.particles; i++) {
    const p = gen(i);
    const idx = i * 3;
    pos[idx]   = p.x || 0;
    pos[idx+1] = p.y || 0;
    pos[idx+2] = p.z || 0;
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;
}

// ====================== HAND TRACKING + GESTURE RECOGNITION ======================
let handsDetector;

async function initHandTracking() {
  handsDetector = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });

  handsDetector.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  const previewCtx = dom.previewCanvas.getContext('2d');

  handsDetector.onResults(results => {
    const landmarks = results.multiHandLandmarks || [];
    const handedness = results.multiHandedness || [];

    // Draw preview
    previewCtx.clearRect(0,0,260,195);
    previewCtx.fillStyle = 'rgba(5,8,12,0.95)';
    previewCtx.fillRect(0,0,260,195);

    let currentGesture = "OPEN";

    landmarks.forEach((landmark, i) => {
      const isRight = handedness[i]?.label === "Right";

      // Gesture detection
      const thumbTip = landmark[4];
      const indexTip = landmark[8];
      const distance = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);

      if (distance < CONFIG.pinchThreshold) {
        currentGesture = "PINCH";
        sounds.play(880, 0.04);
      } else if (landmark[8].y < landmark[5].y && landmark[12].y < landmark[9].y) {
        currentGesture = "VICTORY";
      }

      // Draw hand
      const color = isRight ? '#ff00aa' : '#00ffcc';
      previewCtx.strokeStyle = color;
      previewCtx.lineWidth = 2.5;
      // (simplified drawing)
    });

    dom.gesture.textContent = currentGesture;
    dom.gesture.style.color = currentGesture === "PINCH" ? "#ffe66d" : "#00ffcc";
  });

  const cameraUtils = new Camera(dom.video, {
    onFrame: async () => await handsDetector.send({image: dom.video}),
    width: IS_MOBILE ? 320 : 480,
    height: IS_MOBILE ? 240 : 360
  });

  await cameraUtils.start();
}

// ====================== ANIMATION ======================
let lastTime = performance.now();
let fpsCount = 0, fpsLast = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const delta = (now - lastTime)/16;
  lastTime = now;

  // Smooth rotation & scale
  particleSystem.rotation.x = THREE.MathUtils.lerp(particleSystem.rotation.x, targetRotX, 0.14);
  particleSystem.rotation.y = THREE.MathUtils.lerp(particleSystem.rotation.y, targetRotY, 0.14);
  particleSystem.rotation.z = THREE.MathUtils.lerp(particleSystem.rotation.z, targetRotZ, 0.14);
  currentScale = THREE.MathUtils.lerp(currentScale, targetScale, 0.1);
  particleSystem.scale.setScalar(currentScale);

  composer.render();

  // FPS
  fpsCount++;
  if (now - fpsLast > 900) {
    dom.fps.textContent = Math.round(fpsCount * 1000 / (now - fpsLast));
    fpsCount = 0; fpsLast = now;
  }
}

// ====================== UI & EVENTS ======================
function switchMode(mode) {
  currentMode = mode;
  dom.panelTitle.textContent = mode === 'BUILDER' ? 'BUILDER MATRIX v14' : 'PLASMA MATRIX v14';
  dom.builderPanel.classList.toggle('hidden', mode !== 'BUILDER');
  dom.particlesPanel.classList.toggle('hidden', mode === 'BUILDER');
  dom.tabBuilder.classList.toggle('active', mode === 'BUILDER');
  dom.tabParticles.classList.toggle('active', mode === 'PARTICLES');
}

function bindEvents() {
  dom.tabBuilder.onclick = () => switchMode('BUILDER');
  dom.tabParticles.onclick = () => switchMode('PARTICLES');

  dom.shapeSelect.onchange = e => generateShape(e.target.value);
  dom.colorPicker.oninput = e => particleMaterial.color.set(e.target.value);

  dom.audioBtn.onclick = () => {
    sounds.enabled = !sounds.enabled;
    dom.audioBtn.textContent = sounds.enabled ? "🔊 AUDIO REACTOR: ACTIVE" : "🔇 AUDIO REACTOR: MUTED";
    if (sounds.enabled) sounds.init();
  };

  dom.clearBtn.onclick = () => console.log("%cScene cleared (v14)", "color:#ffe66d");

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  });
}

// ====================== START ======================
window.addEventListener('load', async () => {
  initThree();
  bindEvents();

  // Populate shapes
  Object.keys(shapeGenerators).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = key.toUpperCase();
    dom.shapeSelect.appendChild(opt);
  });

  await initHandTracking();
  animate();

  sounds.init();
  console.log("%cSTARK KINETIC LAB v14 initialized successfully", "color:#00ffcc;font-size:13px");
});
</script>
</body>
</html>
