  <script>
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],[0,17]
    ];

    class SciFiSoundSystem {
      constructor() {
        this.ctx = null;
        this.humOsc = null;
        this.humGain = null;
        this.enabled = true;
        this.initialized = false;
      }
      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.humOsc = this.ctx.createOscillator();
        this.humGain = this.ctx.createGain();
        this.humOsc.type = 'sine';
        this.humOsc.frequency.setValueAtTime(50, this.ctx.currentTime);
        this.humGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
        this.humOsc.connect(this.humGain);
        this.humGain.connect(this.ctx.destination);
        this.humOsc.start();
        this.initialized = true;
      }
      playPinch() {
        if (!this.enabled || !this.initialized) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        const now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.08);
      }
      updateHum(speed) {
        if (!this.enabled || !this.initialized) return;
        const targetGain = Math.min(0.01 + speed * 0.05, 0.1);
        const targetFreq = 50 + speed * 100;
        this.humGain.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.05);
        this.humOsc.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.05);
      }
    }

    const sounds = new SciFiSoundSystem();

    function toggleAudio() {
      sounds.enabled = !sounds.enabled;
      document.getElementById('audio-toggle-btn').innerText = sounds.enabled ? "🔊 AUDIO: ATTIVO" : "🔇 AUDIO: DISATTIVATO";
    }

    let currentMode = 'PARTICLES';
    const PARTICLE_COUNT = 14000;
    let scene, camera, renderer;
    let quantumCoreGroup;
    let quantumRings = [];
    let corePulsing = true;

    const controller = {
      mesh: null, pointLight: null, pos: new THREE.Vector3(), lastPos: new THREE.Vector3(),
      velocity: new THREE.Vector3(), isPinching: false, statusEl: null, grabEl: null, active: false
    };

    let particleGroup, particleGeometry, particleMaterial;
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let handExpansionScale = 1.0, targetScale = 1.0;
    let targetCamZ = 32, targetRotX = 0, targetRotY = 0, targetRotZ = 0;
    let previewCanvas, previewCtx;

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030508);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 28);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      quantumCoreGroup = new THREE.Group();
      quantumCoreGroup.visible = false;
      scene.add(quantumCoreGroup);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 25, 15);
      scene.add(dirLight);

      const coreGeo = new THREE.IcosahedronGeometry(2.0, 2);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      coreMesh.name = "coreMesh";
      quantumCoreGroup.add(coreMesh);

      for (let i = 0; i < 3; i++) {
        const ringGeo = new THREE.TorusGeometry(3.5 + i * 1.5, 0.04, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.random() * Math.PI;
        ring.rotation.y = Math.random() * Math.PI;
        quantumCoreGroup.add(ring);
        quantumRings.push(ring);
      }

      const dotGeo = new THREE.SphereGeometry(0.15, 16, 16);
      const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      controller.mesh = new THREE.Mesh(dotGeo, dotMat);
      controller.mesh.visible = false;
      quantumCoreGroup.add(controller.mesh);

      controller.pointLight = new THREE.PointLight(0xffffff, 1.0, 10);
      quantumCoreGroup.add(controller.pointLight);

      controller.statusEl = document.getElementById('h1-status');
      controller.grabEl = document.getElementById('h1-grab');

      particleGroup = new THREE.Group();
      particleGroup.visible = true;
      scene.add(particleGroup);

      particleGeometry = new THREE.BufferGeometry();
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        currentPositions[i] = (Math.random() - 0.5) * 40;
        targetPositions[i] = currentPositions[i];
      }
      particleGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

      // Colore iniziale bianco puro per le particelle
      updateParticleColors('#ffffff');

      const pCanvas = document.createElement('canvas');
      pCanvas.width = 64; pCanvas.height = 64;
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = '#ffffff'; pCtx.beginPath(); pCtx.arc(32, 32, 28, 0, Math.PI * 2); pCtx.fill();

      particleMaterial = new THREE.PointsMaterial({
        size: 0.2,
        vertexColors: true,
        map: new THREE.CanvasTexture(pCanvas), transparent: true,
        opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false
      });

      const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
      particleGroup.add(particleSystem);
      
      // Partenza fissa sull'oggetto 8 (Saturno)
      generateShape('f8');

      previewCanvas = document.getElementById('hand-preview-canvas');
      previewCtx = previewCanvas.getContext('2d');

      window.addEventListener('resize', onWindowResize);
    }

    function updateParticleColors(hexColor) {
      const baseCol = new THREE.Color(hexColor);
      const particleColors = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        // Variazione di luminosità naturale legata al colore scelto
        const factor = 0.6 + Math.random() * 0.4;
        particleColors[idx] = baseCol.r * factor;
        particleColors[idx + 1] = baseCol.g * factor;
        particleColors[idx + 2] = baseCol.b * factor;
      }
      particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
      if (particleGeometry.attributes.color) particleGeometry.attributes.color.needsUpdate = true;
    }

    // Palette di colori predefinita per ciascuna delle 100 forme/oggetti
    const shapeColors = {
      1: '#ff00aa', 2: '#00ffff', 3: '#ffaa00', 4: '#ffffff', 5: '#ff3333',
      6: '#33ffaa', 7: '#9900ff', 8: '#ffffff', 9: '#ffcc00', 10: '#00ffaa',
      11: '#ff3366', 12: '#33ffff', 13: '#ffff33', 14: '#ff9900', 15: '#ffffff',
      16: '#00aaff', 17: '#cc9966', 18: '#ffbb00', 19: '#ff2255', 20: '#22ffaa',
      21: '#00f3ff', 22: '#ff3300', 23: '#ffffff', 24: '#888888', 25: '#00ffcc',
      26: '#0055ff', 27: '#aaaaaa', 28: '#ffaa33', 29: '#33ccff', 30: '#00ffff'
    };

    function toggleCorePulse() {
      corePulsing = !corePulsing;
      sounds.playPinch();
    }

    function resetQuantumCore() {
      quantumCoreGroup.rotation.set(0, 0, 0);
      sounds.playPinch();
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-builder').classList.toggle('active', mode === 'BUILDER');
      document.getElementById('tab-particles').classList.toggle('active', mode === 'PARTICLES');
      document.getElementById('controls-builder').style.display = mode === 'BUILDER' ? 'block' : 'none';
      document.getElementById('controls-particles').style.display = mode === 'PARTICLES' ? 'block' : 'none';
      document.getElementById('panel-title-text').innerText = mode === 'BUILDER' ? 'QUANTUM CORE MATRIX' : '100+ OBJECTS MATRIX';

      quantumCoreGroup.visible = (mode === 'BUILDER');
      particleGroup.visible = (mode === 'PARTICLES');
      sounds.playPinch();
    }

    // Generatore matematico per le 100 forme e oggetti unici
    function generateShape(id) {
      const p = targetPositions;
      const seedVal = parseInt(id.replace('f', '')) || 8;

      // Aggiorna automaticamente il colore in base all'oggetto selezionato se presente nella mappa, altrimenti usa una tonalità coerente
      const autoColor = shapeColors[seedVal] || '#' + Math.floor(Math.abs(Math.sin(seedVal) * 16777215)).toString(16).padStart(6, '0');
      document.getElementById('color-picker').value = autoColor.length === 7 ? autoColor : '#ffffff';
      updateParticleColors(autoColor);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        let x = 0, y = 0, z = 0;

        switch(seedVal) {
          case 8: // Saturno (Oggetto di default iniziale)
            { 
              if (i < PARTICLE_COUNT * 0.65) {
                const u = Math.random(), v = Math.random();
                const th = u * 2.0 * Math.PI, ph = Math.acos(2.0 * v - 1.0);
                const r = 5.0;
                x = r * Math.sin(ph) * Math.cos(th);
                y = r * Math.cos(ph);
                z = r * Math.sin(ph) * Math.sin(th);
              } else {
                const a = Math.random() * Math.PI * 2, d = 7.0 + Math.random() * 6.0;
                x = Math.cos(a) * d; z = Math.sin(a) * d; y = (Math.random() - 0.5) * 0.2;
              }
            }
            break;
          case 17: // Tazza da caffè 3D (Oggetto quotidiano)
            {
              const h = (i / PARTICLE_COUNT) * 6 - 3;
              if (i < PARTICLE_COUNT * 0.7) {
                const a = Math.random() * Math.PI * 2, r = 3 + (h > 0 ? 0.5 : 0);
                x = Math.cos(a) * r; z = Math.sin(a) * r; y = h;
              } else {
                const a = Math.random() * Math.PI * 2, r = 1.5;
                x = 3 + Math.cos(a) * r; y = (Math.random() - 0.5) * 2; z = Math.sin(a) * r;
              }
            }
            break;
          case 18: // Lampadina
            {
              if (i < PARTICLE_COUNT * 0.7) {
                const u = Math.random(), v = Math.random();
                const th = u * 2 * Math.PI, ph = Math.acos(2 * v - 1);
                x = 4 * Math.sin(ph) * Math.cos(th);
                y = 4 * Math.cos(ph) + 2;
                z = 4 * Math.sin(ph) * Math.sin(th);
              } else {
                const t = (i / PARTICLE_COUNT) * Math.PI * 2;
                x = Math.sin(t) * 1; y = -((i / PARTICLE_COUNT) * 4); z = Math.cos(t) * 1;
              }
            }
            break;
          case 11: // Cubo Rubik 3D
            {
              const size = 6;
              x = (Math.random() - 0.5) * size;
              y = (Math.random() - 0.5) * size;
              z = (Math.random() - 0.5) * size;
            }
            break;
          case 21: // DNA Doppia Elica
            {
              const st = (i / PARTICLE_COUNT) * Math.PI * 14, dir = (i % 2 === 0) ? 1 : -1;
              x = Math.sin(st) * 4 * dir; y = ((i / PARTICLE_COUNT) * 18) - 9; z = Math.cos(st) * 4 * dir;
            }
            break;
          case 31: // Spada Laser
            {
              const h = ((i / PARTICLE_COUNT) * 16) - 8;
              const a = Math.random() * Math.PI * 2, r = (i < PARTICLE_COUNT * 0.8) ? 0.4 : 2;
              x = Math.cos(a) * r; y = h; z = Math.sin(a) * r;
            }
            break;
          default: // Forme geometriche e galassie uniche generate proceduralmente
            {
              const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI;
              const r = (4 + Math.sin(seedVal + u * 3) * 3);
              x = r * Math.sin(v) * Math.cos(u) * (seedVal % 3 + 1);
              y = r * Math.sin(v) * Math.sin(u) * 1.5;
              z = r * Math.cos(v) * (seedVal % 2 + 1);
            }
            break;
        }

        p[idx] = x; p[idx + 1] = y; p[idx + 2] = z;
      }
    }

    function initHandTracking() {
      const videoElement = document.getElementById('video-input');
      const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });

      hands.setOptions({
        maxNumHands: 1, modelComplexity: 1,
        minDetectionConfidence: 0.65, minTrackingConfidence: 0.65
      });

      hands.onResults((results) => {
        sounds.init();
        previewCtx.save();
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

        const detected = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
        const ctrl = controller;

        if (detected) {
          ctrl.active = true;
          const landmarks = results.multiHandLandmarks[0];

          drawConnectors(previewCtx, landmarks, HAND_CONNECTIONS, { color: '#ffffff', lineWidth: 1 });
          drawLandmarks(previewCtx, landmarks, { color: '#ffffff', lineWidth: 1, radius: 1.5 });

          const thumbTip = landmarks[4], indexTip = landmarks[8];
          const pX = (thumbTip.x + indexTip.x) / 2, pY = (thumbTip.y + indexTip.y) / 2, pZ = (thumbTip.z + indexTip.z) / 2;
          const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);

          const ndcX = (1 - pX) * 2 - 1, ndcY = -(pY * 2 - 1);
          const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
          vector.unproject(camera);
          const dir = vector.sub(camera.position).normalize();
          const targetZ = -pZ * 20;
          const distanceToPlane = (targetZ - camera.position.z) / dir.z;
          const targetPos = camera.position.clone().add(dir.multiplyScalar(distanceToPlane));

          ctrl.lastPos.copy(ctrl.pos);
          ctrl.pos.copy(targetPos);

          ctrl.velocity.copy(ctrl.pos).sub(ctrl.lastPos);
          sounds.updateHum(ctrl.velocity.length());

          ctrl.mesh.visible = true;
          ctrl.mesh.position.copy(ctrl.pos);
          ctrl.pointLight.position.copy(ctrl.pos);

          const wasPinching = ctrl.isPinching;
          ctrl.isPinching = (pinchDist < 0.07);
          if (!wasPinching && ctrl.isPinching) sounds.playPinch();

          ctrl.statusEl.innerText = "ATTIVA"; ctrl.statusEl.style.color = "#ffffff";
          ctrl.grabEl.innerText = ctrl.isPinching ? "CHIUSO (PINCH)" : "APERTO";
          ctrl.grabEl.style.color = ctrl.isPinching ? "#ff3366" : "#ffffff";

          if (currentMode === 'BUILDER') {
            const h1Center = landmarks[9], wrist = landmarks[0];
            quantumCoreGroup.rotation.z = -Math.atan2(h1Center.y - wrist.y, h1Center.x - wrist.x) - Math.PI / 2;
            quantumCoreGroup.rotation.x = (h1Center.y - 0.5) * Math.PI * 1.5;
            quantumCoreGroup.rotation.y = (h1Center.x - 0.5) * Math.PI * 1.5;
          }

          if (currentMode === 'PARTICLES') {
            const h1Center = landmarks[9], wrist = landmarks[0];
            targetRotZ = -Math.atan2(h1Center.y - wrist.y, h1Center.x - wrist.x) - Math.PI / 2;
            targetRotX = (h1Center.y - 0.5) * Math.PI * 2.0;
            targetRotY = (h1Center.x - 0.5) * Math.PI * 3.0;
            const span = Math.hypot(wrist.x - landmarks[12].x, wrist.y - landmarks[12].y);
            targetScale = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(span, 0.2, 0.5, 0.5, 2.0), 0.4, 2.2);
          }

        } else {
          ctrl.active = false;
          ctrl.mesh.visible = false;
          ctrl.statusEl.innerText = "CERCA..."; ctrl.statusEl.style.color = "#ff3366"; ctrl.grabEl.innerText = "N/A";
        }

        previewCtx.restore();
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640, height: 480
      });
      cameraUtils.start();
    }

    function animate() {
      requestAnimationFrame(animate);

      if (quantumCoreGroup.visible) {
        quantumRings.forEach((ring, idx) => {
          ring.rotation.z += (idx + 1) * 0.01;
        });
        if (corePulsing) {
          const scale = 1 + Math.sin(Date.now() * 0.005) * 0.15;
          const coreMesh = quantumCoreGroup.getObjectByName("coreMesh");
          if (coreMesh) coreMesh.scale.set(scale, scale, scale);
        }
      }

      if (currentMode === 'PARTICLES') {
        particleGroup.rotation.x += (targetRotX - particleGroup.rotation.x) * 0.15;
        particleGroup.rotation.y += (targetRotY + 0.003 - particleGroup.rotation.y) * 0.15;
        particleGroup.rotation.z += (targetRotZ - particleGroup.rotation.z) * 0.15;

        handExpansionScale += (targetScale - handExpansionScale) * 0.15;
        camera.position.z += (targetCamZ - camera.position.z) * 0.15;

        const isPinching = controller.active && controller.isPinching;
        const positions = particleGeometry.attributes.position.array;

        for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
          let tx = targetPositions[i] * handExpansionScale;
          let ty = targetPositions[i+1] * handExpansionScale;
          let tz = targetPositions[i+2] * handExpansionScale;
          let lerpSpeed = 0.15;

          if (isPinching && (i / 3) % 2 === 0) {
            tx *= 0.01; ty *= 0.01; tz *= 0.01;
            lerpSpeed = 0.5;
          }

          positions[i] += (tx - positions[i]) * lerpSpeed;
          positions[i+1] += (ty - positions[i+1]) * lerpSpeed;
          positions[i+2] += (tz - positions[i+2]) * lerpSpeed;
        }
        particleGeometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    document.getElementById('shape-select').addEventListener('change', (e) => generateShape(e.target.value));
    document.getElementById('color-picker').addEventListener('input', (e) => {
      updateParticleColors(e.target.value);
    });

    initThree();
    initHandTracking();
    animate();
  </script>
</body>
