<style>

*{

body{

   HUD

.logo{

.line{

}

.data{
    display:flex;

    gap:25px;

    font-family:monospace;

}

.data span:first-child{

}

#topRight{

#status{

#bottom{

#crosshair::after{

#crosshair::before{

    top:12px;
    width:26px;

.corner{

    width:35px;
    height:35px;
    border-color:rgba(0,240,255,.3);

.c1{
    top:10px;
    left:10px;
    border-top:1px solid;
    border-left:1px solid;
}

.c2{
    top:10px;
    right:10px;
    border-top:1px solid;
    border-right:1px solid;
}

.c3{
    bottom:10px;
    left:10px;
    border-bottom:1px solid;
    border-left:1px solid;
}

.c4{
    bottom:10px;
    right:10px;
    border-bottom:1px solid;
    border-right:1px solid;
}

/* Mobile */

@media(max-width:600px){

    #topLeft{
        left:10px;
        top:10px;
        min-width:205px;
        padding:10px 12px;
    }

    .logo{
        font-size:13px;
    }

    .sub{
        font-size:7px;
    }

    .data{
        font-size:9px;
    }

    #topRight{
        right:10px;
        top:10px;
        padding:9px;
    }

    #bottom{
        bottom:8px;
        font-size:8px;
    }

}

</style>

<body>

<video id="webcam" playsinline></video>

<canvas id="stage"></canvas>

<div id="hud">

    <div class="corner c1"></div>
    <div class="corner c2"></div>
    <div class="corner c3"></div>
    <div class="corner c4"></div>

    <div id="crosshair"></div>

    <div id="topLeft" class="panel">

        <div class="logo">
            STARK
        </div>

        <div class="sub">
            KINETIC HOLOGRAPHIC LAB
        </div>

        <div class="data">
            <span>SYSTEM</span>

        </div>

        </div>

        </div>

        </div>

    <div id="bottom" class="panel">
        1 HAND: MOVE &nbsp; // &nbsp;
        2 HANDS: ZOOM ONLY &nbsp; // &nbsp;
        PINCH: INTERACT
    </div>

</div>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let scene;
let camera;
let renderer;

let hologram;
let motherboard;
let cpu;
let particles;

let targetPosition = new THREE.Vector3();
let currentPosition = new THREE.Vector3();

let targetZoom = 1;
let currentZoom = 1;

let handCount = 0;

let previousHandCenter = null;
let previousHandDistance = null;

let fpsFrames = 0;
let fpsLast = performance.now();


/* =========================================================
   AUDIO
========================================================= */

class AudioEngine{

    constructor(){

        this.ctx = null;
        this.master = null;
        this.initialized = false;

    }

    init(){

        if(this.initialized)
            return;

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext)
            return;

        this.ctx = new AudioContext();

        this.master =
            this.ctx.createGain();

        this.master.gain.value = 0;

        this.master.connect(
            this.ctx.destination
        );

        this.initialized = true;

    }

    pulse(){

        if(!this.initialized)
            return;

        const osc =
            this.ctx.createOscillator();

        const gain =
            this.ctx.createGain();

        osc.type = "sine";

        osc.frequency.value =
            300 + Math.random()*500;

        gain.gain.setValueAtTime(
            .0001,
            this.ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .035,
            this.ctx.currentTime + .02
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            this.ctx.currentTime + .15
        );

        osc.connect(gain);
        gain.connect(this.master);

        osc.start();

        osc.stop(
            this.ctx.currentTime + .16
        );

    }

}

const audio =
    new AudioEngine();


/* =========================================================
   MATERIALS
========================================================= */

function holographicMaterial(opacity=.8){

    return new THREE.MeshBasicMaterial({

        color:0x00eaff,

        transparent:true,

        opacity:opacity,

        wireframe:true,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false

    });

}


/* =========================================================
   MOTHERBOARD
========================================================= */

class Motherboard{

    constructor(){

        this.group =
            new THREE.Group();

        scene.add(this.group);

        this.buildBoard();

        this.buildCPU();

        this.buildRAM();

        this.buildCoolers();

        this.buildCapacitors();

        this.buildCircuits();

        this.buildEnergyCore();

        this.buildFloatingLabels();

    }


    buildBoard(){

        const geometry =
            new THREE.BoxGeometry(
                7.8,
                .18,
                5.5
            );

        const material =
            new THREE.MeshBasicMaterial({

                color:0x008fa8,

                transparent:true,

                opacity:.13,

                blending:
                    THREE.AdditiveBlending

            });

        this.board =
            new THREE.Mesh(
                geometry,
                material
            );

        this.group.add(
            this.board
        );


        const frame =
            new THREE.LineSegments(

                new THREE.EdgesGeometry(
                    geometry
                ),

                new THREE.LineBasicMaterial({

                    color:0x00eaff,

                    transparent:true,

                    opacity:.65,

                    blending:
                        THREE.AdditiveBlending

                })

            );

        this.group.add(frame);


        /* BOARD GRID */

        const gridMaterial =
            new THREE.LineBasicMaterial({

                color:0x006f80,

                transparent:true,

                opacity:.25

            });

        for(
            let x=-3.5;
            x<=3.5;
            x+=.5
        ){

            const points=[
                new THREE.Vector3(
                    x,
                    .105,
                    -2.6
                ),
                new THREE.Vector3(
                    x,
                    .105,
                    2.6
                )
            ];

            const geo =
                new THREE.BufferGeometry()
                .setFromPoints(points);

            this.group.add(
                new THREE.Line(
                    geo,
                    gridMaterial
                )
            );

        }

        for(
            let z=-2.5;
            z<=2.5;
            z+=.5
        ){

            const points=[
                new THREE.Vector3(
                    -3.7,
                    .106,
                    z
                ),
                new THREE.Vector3(
                    3.7,
                    .106,
                    z
                )
            ];

            const geo =
                new THREE.BufferGeometry()
                .setFromPoints(points);

            this.group.add(
                new THREE.Line(
                    geo,
                    gridMaterial
                )
            );

        }

    }


    buildCPU(){

        this.cpuGroup =
            new THREE.Group();

        this.cpuGroup.position.set(
            0,
            .45,
            0
        );

        this.group.add(
            this.cpuGroup
        );


        /* SOCKET */

        const socketGeometry =
            new THREE.BoxGeometry(
                2.25,
                .12,
                2.25
            );

        const socket =
            new THREE.Mesh(
                socketGeometry,
                holographicMaterial(.38)
            );

        this.cpuGroup.add(
            socket
        );


        /* CPU BODY */

        const cpuGeometry =
            new THREE.BoxGeometry(
                1.55,
                .48,
                1.55
            );

        const cpuMaterial =
            new THREE.MeshBasicMaterial({

                color:0x6effff,

                transparent:true,

                opacity:.28,

                blending:
                    THREE.AdditiveBlending

            });

        cpu =
            new THREE.Mesh(
                cpuGeometry,
                cpuMaterial
            );

        this.cpuGroup.add(
            cpu
        );


        const cpuEdges =
            new THREE.LineSegments(

                new THREE.EdgesGeometry(
                    cpuGeometry
                ),

                new THREE.LineBasicMaterial({

                    color:0x8cffff,

                    transparent:true,

                    opacity:.95

                })

            );

        this.cpuGroup.add(
            cpuEdges
        );


        /* CPU CORE */

        const coreGeometry =
            new THREE.BoxGeometry(
                .75,
                .52,
                .75
            );

        const core =
            new THREE.Mesh(

                coreGeometry,

                new THREE.MeshBasicMaterial({

                    color:0x00ffff,

                    transparent:true,

                    opacity:.25,

                    blending:
                        THREE.AdditiveBlending

                })

            );

        this.cpuGroup.add(
            core
        );


        /* CPU CORE LINES */

        for(
            let i=-.3;
            i<=.3;
            i+=.15
        ){

            const points=[
                new THREE.Vector3(
                    i,
                    .28,
                    -.35
                ),

                new THREE.Vector3(
                    i,
                    .28,
                    .35
                )
            ];

            const geo =
                new THREE.BufferGeometry()
                .setFromPoints(points);

            this.cpuGroup.add(

                new THREE.Line(

                    geo,

                    new THREE.LineBasicMaterial({

                        color:0x00ffff,

                        transparent:true,

                        opacity:.55

                    })

                )

            );

        }

    }


    buildRAM(){

        for(
            let side=0;
            side<2;
            side++
        ){

            for(
                let i=0;
                i<4;
                i++
            ){

                const x =
                    -2.9 +
                    i*.55;

                const z =
                    side===0
                    ? -1.9
                    : 1.9;

                const geo =
                    new THREE.BoxGeometry(
                        .38,
                        .32,
                        1.45
                    );

                const mesh =
                    new THREE.Mesh(
                        geo,
                        new THREE.MeshBasicMaterial({

                            color:
                                0x00dff5,

                            transparent:true,

                            opacity:.28,

                            blending:
                                THREE.AdditiveBlending

                        })
                    );

                mesh.position.set(
                    x,
                    .3,
                    z
                );

                this.group.add(
                    mesh
                );


                const edges =
                    new THREE.LineSegments(

                        new THREE.EdgesGeometry(
                            geo
                        ),

                        new THREE.LineBasicMaterial({

                            color:
                                0x00eaff,

                            transparent:true,

                            opacity:.7

                        })

                    );

                edges.position.copy(
                    mesh.position
                );

                this.group.add(
                    edges
                );

            }

        }

    }


    buildCoolers(){

        const positions=[
            [-2.7,.3,-.3],
            [2.7,.3,-.3],
            [-2.7,.3,.7],
            [2.7,.3,.7]
        ];

        positions.forEach(
            p=>{

                const geo =
                    new THREE.BoxGeometry(
                        .75,
                        .6,
                        .75
                    );

                const cooler =
                    new THREE.Mesh(
                        geo,
                        holographicMaterial(.38)
                    );

                cooler.position.set(
                    p[0],
                    p[1],
                    p[2]
                );

                this.group.add(
                    cooler
                );

            }
        );

    }


    buildCapacitors(){

        for(
            let i=0;
            i<32;
            i++
        ){

            const angle =
                Math.random()*
                Math.PI*2;

            const radius =
                2.7 +
                Math.random()*.6;

            const x =
                Math.cos(angle)*
                radius;

            const z =
                Math.sin(angle)*
                radius*.7;

            const geo =
                new THREE.CylinderGeometry(
                    .045,
                    .045,
                    .35,
                    8
                );

            const cap =
                new THREE.Mesh(

                    geo,

                    new THREE.MeshBasicMaterial({

                        color:0x00eaff,

                        transparent:true,

                        opacity:.55,

                        blending:
                            THREE.AdditiveBlending

                    })

                );

            cap.position.set(
                x,
                .3,
                z
            );

            this.group.add(
                cap
            );

        }

    }


    buildCircuits(){

        this.circuitLines=[];

        for(
            let i=0;
            i<75;
            i++
        ){

            const startX =
                (Math.random()-.5)*7;

            const startZ =
                (Math.random()-.5)*4.5;

            const endX =
                startX +
                (Math.random()-.5)*2;

            const endZ =
                startZ +
                (Math.random()-.5)*2;

            const points=[

                new THREE.Vector3(
                    startX,
                    .16,
                    startZ
                ),

                new THREE.Vector3(
                    endX,
                    .16,
                    startZ
                ),

                new THREE.Vector3(
                    endX,
                    .16,
                    endZ
                )

            ];

            const geo =
                new THREE.BufferGeometry()
                .setFromPoints(points);

            const line =
                new THREE.Line(

                    geo,

                    new THREE.LineBasicMaterial({

                        color:0x00eaff,

                        transparent:true,

                        opacity:.3,

                        blending:
                            THREE.AdditiveBlending

                    })

                );

            this.group.add(
                line
            );

            this.circuitLines.push(
                line
            );

        }

    }


    buildEnergyCore(){

        const ringGroup =
            new THREE.Group();

        ringGroup.position.y =
            .75;

        this.group.add(
            ringGroup
        );

        for(
            let i=0;
            i<3;
            i++
        ){

            const ring =
                new THREE.Mesh(

                    new THREE.TorusGeometry(
                        1.35+i*.22,
                        .012,
                        8,
                        64
                    ),

                    new THREE.MeshBasicMaterial({

                        color:0x00eaff,

                        transparent:true,

                        opacity:.35,

                        blending:
                            THREE.AdditiveBlending

                    })

                );

            ring.rotation.x =
                Math.PI/2;

            ringGroup.add(
                ring
            );

        }

        this.energyRing =
            ringGroup;

    }


    buildFloatingLabels(){

        /* piccoli marker 3D */

        const markerGeometry =
            new THREE.BoxGeometry(
                .15,
                .15,
                .15
            );

        for(
            let i=0;
            i<12;
            i++
        ){

            const marker =
                new THREE.Mesh(

                    markerGeometry,

                    new THREE.MeshBasicMaterial({

                        color:0x00ffff,

                        transparent:true,

                        opacity:.6

                    })

                );

            marker.position.set(

                (Math.random()-.5)*7,

                .5+
                Math.random()*1.5,

                (Math.random()-.5)*4

            );

            this.group.add(
                marker
            );

        }

    }


    update(time){

        /* CPU glow */

        const pulse =
            .35 +
            Math.sin(time*.004)*.12;

        cpu.material.opacity =
            pulse;


        /* Energy rings */

        if(this.energyRing){

            this.energyRing.rotation.z =
                time*.0005;

            this.energyRing.rotation.y =
                time*.00035;

        }


        /* Circuit animation */

        this.circuitLines.forEach(
            (line,i)=>{

                line.material.opacity =
                    .2 +
                    .18*
                    Math.sin(
                        time*.003+i
                    );

            }
        );

    }

}


/* =========================================================
   PARTICLES
========================================================= */

class ParticleField{

    constructor(){

        const count=4500;

        const positions =
            new Float32Array(
                count*3
            );

        for(
            let i=0;
            i<count*3;
            i+=3
        ){

            positions[i] =
                (Math.random()-.5)*25;

            positions[i+1] =
                (Math.random()-.5)*16;

            positions[i+2] =
                (Math.random()-.5)*20;

        }

        const geometry =
            new THREE.BufferGeometry();

        geometry.setAttribute(

            "position",

            new THREE.BufferAttribute(
                positions,
                3
            )

        );

        const material =
            new THREE.PointsMaterial({

                color:0x00dff5,

                size:.025,

                transparent:true,

                opacity:.5,

                blending:
                    THREE.AdditiveBlending,

                depthWrite:false

            });

        this.points =
            new THREE.Points(
                geometry,
                material
            );

        scene.add(
            this.points
        );

    }


    update(time){

        this.points.rotation.y =
            time*.000015;

    }

}


/* =========================================================
   HOLOGRAM RINGS
========================================================= */

function createHologram(){

    hologram =
        new THREE.Group();

    scene.add(
        hologram
    );

    for(
        let i=0;
        i<6;
        i++
    ){

        const radius =
            4.7+i*.22;

        const ring =
            new THREE.Mesh(

                new THREE.TorusGeometry(
                    radius,
                    .008,
                    6,
                    128
                ),

                new THREE.MeshBasicMaterial({

                    color:0x00eaff,

                    transparent:true,

                    opacity:.18,

                    blending:
                        THREE.AdditiveBlending

                })

            );

        ring.rotation.x =
            Math.PI/2;

        ring.position.y =
            -1.1;

        hologram.add(
            ring
        );

    }

    /* vertical holographic beams */

    for(
        let i=0;
        i<20;
        i++
    ){

        const angle =
            i/20*Math.PI*2;

        const line =
            new THREE.Line(

                new THREE.BufferGeometry()
                .setFromPoints([

                    new THREE.Vector3(
                        Math.cos(angle)*4.7,
                        -1,
                        Math.sin(angle)*4.7
                    ),

                    new THREE.Vector3(
                        Math.cos(angle)*4.7,
                        2,
                        Math.sin(angle)*4.7
                    )

                ]),

                new THREE.LineBasicMaterial({

                    color:0x00eaff,

                    transparent:true,

                    opacity:.08

                })

            );

        hologram.add(
            line
        );

    }

}


/* =========================================================
   FLOOR GRID
========================================================= */

function createFloor(){

    const grid =
        new THREE.GridHelper(
            30,
            40,
            0x00bcd4,
            0x00333d
        );

    grid.position.y =
        -2;

    grid.material.transparent =
        true;

    grid.material.opacity =
        .22;

    scene.add(
        grid
    );

}


/* =========================================================
   CAMERA / GRAPHICS
========================================================= */

function initGraphics(){

    scene =
        new THREE.Scene();

    scene.fog =
        new THREE.FogExp2(
            0x010309,
            .035
        );


    camera =
        new THREE.PerspectiveCamera(
            55,
            innerWidth/innerHeight,
            .1,
            100
        );

    camera.position.set(
        0,
        2.5,
        10
    );


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                document.getElementById(
                    "stage"
                ),

            antialias:true,

            alpha:false

        });


    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio,
            2
        )
    );


    createFloor();

    createHologram();

    motherboard =
        new Motherboard();

    particles =
        new ParticleField();

}


/* =========================================================
   HAND TRACKING
========================================================= */

const video =
    document.getElementById(
        "webcam"
    );


const hands =
    new Hands({

        locateFile:
            file =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

    });


hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:.65,

    minTrackingConfidence:.65

});


hands.onResults(
    onHands
);


function distance(a,b){

    const dx =
        a.x-b.x;

    const dy =
        a.y-b.y;

    return Math.sqrt(
        dx*dx+dy*dy
    );

}


function onHands(results){

    const landmarks =
        results.multiHandLandmarks || [];

    handCount =
        landmarks.length;


    document.getElementById(
        "trackingValue"
    ).textContent =
        handCount+"/2";


    /* =========================================
       NESSUNA MANO
    ========================================= */

    if(handCount===0){

        document.getElementById(
            "status"
        ).textContent =
            "WAITING FOR HANDS";

        document.getElementById(
            "gesture"
        ).textContent =
            "HAND SYSTEM STANDBY";

        previousHandCenter =
            null;

        previousHandDistance =
            null;

        return;

    }


    /* =========================================
       UNA MANO
       SOLO MOVIMENTO
    ========================================= */

    if(handCount===1){

        const hand =
            landmarks[0];

        const palm =
            hand[9];

        const x =
            (palm.x-.5)*7;

        const y =
            (.5-palm.y)*4.5;

        /*
          La posizione target viene aggiornata
          direttamente dalla mano.

          NON viene applicata rotazione.
        */

        targetPosition.x =
            THREE.MathUtils.clamp(
                x,
                -3.5,
                3.5
            );

        targetPosition.y =
            THREE.MathUtils.clamp(
                y,
                -2,
                2
            );


        document.getElementById(
            "status"
        ).textContent =
            "1 HAND // POSITION";


        document.getElementById(
            "gesture"
        ).textContent =
            "MOVE OBJECT";


        previousHandDistance =
            null;


        return;

    }


    /* =========================================
       DUE MANI
       SOLO ZOOM
    ========================================= */

    const hand1 =
        landmarks[0][9];

    const hand2 =
        landmarks[1][9];


    const centerX =
        (hand1.x+hand2.x)/2;

    const centerY =
        (hand1.y+hand2.y)/2;


    /*
       Il centro delle due mani continua a
       controllare la posizione.

       La distanza controlla SOLO lo zoom.
    */

    targetPosition.x =
        THREE.MathUtils.clamp(
            (centerX-.5)*7,
            -3.5,
            3.5
        );

    targetPosition.y =
        THREE.MathUtils.clamp(
            (.5-centerY)*4.5,
            -2,
            2
        );


    const handDistance =
        distance(
            hand1,
            hand2
        );


    if(previousHandDistance!==null){

        const delta =
            handDistance -
            previousHandDistance;

        /*
          Piccoli cambiamenti = piccoli zoom.

          NESSUNA rotazione.
        */

        targetZoom +=
            delta*2.2;

        targetZoom =
            THREE.MathUtils.clamp(
                targetZoom,
                .65,
                2.2
            );

    }


    previousHandDistance =
        handDistance;


    document.getElementById(
        "status"
    ).textContent =
        "2 HANDS // ZOOM";


    document.getElementById(
        "gesture"
    ).textContent =
        "DISTANCE = ZOOM // ROTATION LOCKED";


    document.getElementById(
        "zoomValue"
    ).textContent =
        targetZoom.toFixed(2)+"x";


    audio.pulse();

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    facingMode:"user"

                },

                audio:false

            });


        video.srcObject =
            stream;

        await video.play();


        async function process(){

            if(
                video.readyState>=2
            ){

                await hands.send({
                    image:video
                });

            }

            requestAnimationFrame(
                process
            );

        }

        process();


        document.getElementById(
            "status"
        ).textContent =
            "CAMERA ONLINE";


    }catch(error){

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
            "CAMERA ERROR";

        document.getElementById(
            "gesture"
        ).textContent =
            "ALLOW CAMERA ACCESS";

    }

}


/* =========================================================
   SMOOTH MOVEMENT
========================================================= */

function updateInteraction(){

    /*
      Movimento morbido ma preciso.
    */

    currentPosition.lerp(
        targetPosition,
        .18
    );


    motherboard.group.position.x =
        currentPosition.x;

    motherboard.group.position.y =
        currentPosition.y;


    /*
      ZOOM separato dal movimento.

      Nessuna rotazione.
    */

    currentZoom +=
        (targetZoom-currentZoom)*.15;


    motherboard.group.scale.setScalar(
        currentZoom
    );


    hologram.scale.setScalar(
        .85+
        currentZoom*.12
    );

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        performance.now();


    updateInteraction();


    motherboard.update(
        time
    );


    particles.update(
        time
    );


    /*
      IMPORTANTE:

      La motherboard NON ruota
      automaticamente.

      Questo è intenzionale:
      le mani controllano la posizione
      e le due mani controllano lo zoom.
    */


    renderer.render(
        scene,
        camera
    );


    /* FPS */

    fpsFrames++;


    if(
        time-fpsLast>=1000
    ){

        document.getElementById(
            "fpsValue"
        ).textContent =
            fpsFrames;

        fpsFrames=0;

        fpsLast=time;

    }

}


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    ()=>{

        initGraphics();

        animate();

        document.body.addEventListener(
            "pointerdown",
            ()=>{
                audio.init();

                if(
                    audio.ctx &&
                    audio.ctx.state==="suspended"
                ){
                    audio.ctx.resume();
                }

            },
            {
                once:true
            }
        );

        startCamera();

    }
);

</script>
